  handle.addEventListener('pointerup',finish);handle.addEventListener('pointercancel',finish);\n  }\n  function keepComposerOnScreen(){\n    if(!composer.classList.contains('open'))return;\n    const rect=composer.getBoundingClientRect();\n    if(!composer.style.top&&!composer.style.left)return;\n    composer.style.left=`${clamp(rect.left,8,Math.max(8,window.innerWidth-rect.width-8))}px`;\n    composer.style.top=`${clamp(rect.top,8,Math.max(8,window.innerHeight-rect.height-8))}px`;\n  }\n  function enableComposerDrag(){\n    const handle=composer.querySelector('.enzo-note-form-title');let drag=null;\n    handle.addEventListener('pointerdown',event=>{\n      if(event.target.closest('button'))return;\n      event.preventDefault();\n      const rect=composer.getBoundingClientRect();\n      composer.style.left=`${rect.left}px`;composer.style.top=`${rect.top}px`;composer.style.right='auto';composer.style.bottom='auto';\n      handle.setPointerCapture?.(event.pointerId);\n      drag={id:event.pointerId,x:event.clientX,y:event.clientY,left:rect.left,top:rect.top};\n    });\n    handle.addEventListener('pointermove',event=>{\n      if(!drag||event.pointerId!==drag.id)return;\n      event.preventDefault();\n      const left=clamp(drag.left+event.clientX-drag.x,8,Math.max(8,window.innerWidth-composer.offsetWidth-8));\n      const top=clamp(drag.top+event.clientY-drag.y,8,Math.max(8,window.innerHeight-composer.offsetHeight-8));\n      composer.style.left=`${left}px`;composer.style.top=`${top}px`;\n    });\n    const finish=event=>{\n      if(!drag||event.pointerId!==drag.id)return;\n      handle.releasePointerCapture?.(event.pointerId);drag=null;\n    };\n    handle.addEventListener('pointerup',finish);handle.addEventListener('pointercancel',finish);\n  }\n  function openComposer(note=null){\n    editingId=note?.id||null;titleText.textContent=note?'Editar anotação':'Nova anotação';\n    labelField.value=note?.label||'nota';textField.value=note?.content||'';\n    setStatus(user?'':'Conectando ao seu perfil…');composer.classList.add('open');toggle.classList.add('active');\n    setTimeout(()=>textField.focus(),40);\n  }\n  function closeComposer(){composer.classList.remove('open');toggle.classList.remove('active');editingId=null;setStatus('');textField.value=''}\n  async function saveNote(event){\n    event.preventDefault();\n    if(!client||!user){setStatus('Não foi possível identificar o aluno conectado.',true);return}\n    const content=textField.value.trim(),label=labelField.value;\n    if(!content){setStatus('Digite sua anotação.',true);return}\n    saveButton.disabled=true;setStatus('Salvando no seu perfil…');\n    if(editingId){\n      const {data,error}=await client.from(TABLE).update({label,content,updated_at:new Date().toISOString()})\n        .eq('id',editingId).eq('user_id',user.id).select().single();\n      saveButton.disabled=false;\n      if(error){setStatus(`Erro: ${error.message}`,true);return}\n      const index=notes.findIndex(n=>n.id===editingId);if(index>=0)notes[index]=normalizeNote(data);\n      renderNotes();closeComposer();return;\n    }\n    const placement=composerPlacement();\n    if(!placement){saveButton.disabled=false;setStatus('Abra uma aba do resumo para posicionar a anotação.',true);return}\n    const {width_px,height_px,...dbPlacement}=placement;\n    dbPlacement.anchor_excerpt=packExcerpt(dbPlacement.anchor_excerpt,width_px,height_px);\n    const payload={user_id:user.id,resumo_key:PAGE,label,content,...dbPlacement};\n    const {data,error}=await client.from(TABLE).insert(payload).select().single();\n    saveButton.disabled=false;\n    if(error){setStatus(`Erro: ${error.message}`,true);return}\n    notes.push(normalizeNote(data));renderNotes();closeComposer();\n  }\n  async function deleteNote(note){\n    if(!confirm('Excluir esta anotação?'))return;\n    const el=noteElement(note.id);setSync(el,'excluindo…');\n    const {error}=await client.from(TABLE).delete().eq('id',note.id).eq('user_id',user.id);\n    if(error){setSync(el,'erro ao excluir',true);alert(`Não foi possível excluir: ${error.message}`);return}\n    notes=notes.filter(item=>item.id!==note.id);el?.remove();updateCount();\n  }\n  async function initialize(){\n    if(initialized)return;\n    client=getClient();if(!client){setStatus('Aguardando conexão com o perfil…');return}\n    user=window.authSession?.user||null;\n    if(!user){\n      const {data,error}=await client.auth.getUser();\n      if(error||!data?.user){setStatus('Entre na sua conta para usar anotações.',true);return}\n      user=data.user;\n    }\n    initialized=true;assignAnchors(document);\n    const {data,error}=await client.from(TABLE)\n      .select('id,user_id,resumo_key,section_id,anchor_key,anchor_excerpt,x_pct,y_offset,label,content,created_at,updated_at')\n      .eq('user_id',user.id).eq('resumo_key',PAGE).order('created_at',{ascending:true});\n    if(error){setStatus(`Anotações indisponíveis: ${error.message}`,true);console.error(error);return}\n    notes=(data||[]).map(normalizeNote);renderNotes();setStatus('');\n  }\n\n  toggle.addEventListener('click',()=>composer.classList.contains('open')?closeComposer():openComposer());\n  enableComposerDrag();\n  composer.querySelector('.enzo-note-close').addEventListener('click',closeComposer);\n  composer.querySelector('.enzo-note-cancel').addEventListener('click',closeComposer);\n  composer.addEventListener('submit',saveNote);\n  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&composer.classList.contains('open'))closeComposer()});\n  window.addEventListener('resize',()=>requestAnimationFrame(()=>{layoutNotes();keepComposerOnScreen()}));\n  const sectionObserver=new MutationObserver(mutations=>{\n    if(mutations.some(m=>m.target.classList?.contains('active')))requestAnimationFrame(layoutNotes);\n  });\n  document.querySelectorAll('.section').forEach(section=>sectionObserver.observe(section,{attributes:true,attributeFilter:['class']}));\n  document.addEventListener('authReady',initialize,{once:true});\n  if(window.authSession?.user)setTimeout(initialize,0);else setTimeout(initialize,1200);\n})();\n\u003c/script>\n\u003cscript>\n/* Central de anotações — índice navegável de post-its e grifos. */\n(()=>{\n  'use strict';\n  const PAGE=\"bioquimica_2_final_p1\";\n  const STORAGE_KEY=`enzo-highlights:v1:${PAGE}`;\n  let filter='all',refreshTimer=null;\n\n  const toggle=document.createElement('button');\n  toggle.id='enzo-annotations-index-toggle';toggle.type='button';toggle.title='Abrir minhas anotações';\n  toggle.innerHTML='\u003cspan aria-hidden=\"true\">📚\u003c/span>\u003cspan>Minhas anotações\u003c/span>\u003cspan class=\"enzo-index-count\">0\u003c/span>';\n  const panel=document.createElement('aside');panel.id='enzo-annotations-index';panel.setAttribute('aria-label','Minhas anotações');\n  panel.innerHTML=`\n    \u003cdiv class=\"enzo-index-head\">\u003cdiv>\u003cdiv class=\"enzo-index-title\">📚 Minhas anotações\u003c/div>\u003cdiv class=\"enzo-index-sub\">Clique em um item para voltar ao ponto salvo\u003c/div>\u003c/div>\u003cbutton class=\"enzo-index-close\" type=\"button\" aria-label=\"Fechar\">×\u003c/button>\u003c/div>\n    \u003cdiv class=\"enzo-index-tabs\">\u003cbutton class=\"enzo-index-filter active\" type=\"button\" data-filter=\"all\">Tudo\u003c/button>\u003cbutton class=\"enzo-index-filter\" type=\"button\" data-filter=\"note\">Post-its\u003c/button>\u003cbutton class=\"enzo-index-filter\" type=\"button\" data-filter=\"highlight\">Grifos\u003c/button>\u003c/div>\n    \u003cdiv class=\"enzo-index-list\">\u003c/div>`;\n  document.body.append(toggle,panel);\n  const count=toggle.querySelector('.enzo-index-count'),list=panel.querySelector('.enzo-index-list');\n\n  function sectionName(id){\n    const btn=document.querySelector(`nav.tabs button[data-section=\"${CSS.escape(id||'')}\"]`);\n    return (btn?.textContent||id||'Página').replace(/\\s+/g,' ').trim();\n  }\n  function loadHighlightRecords(){\n    try{const r=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');return Array.isArray(r)?r:[]}catch(_){return[]}\n  }\n  function groupedHighlights(){\n    const records=loadHighlightRecords().filter(r=>r&&r.id&&r.key&&Number.isFinite(r.start)&&Number.isFinite(r.end));\n    records.sort((a,b)=>String(a.key).localeCompare(String(b.key))||a.start-b.start||a.end-b.end);\n    const groups=[];\n    for(const rec of records){\n      const section=(String(rec.key).split(':')[0]||'page');\n      const prev=groups[groups.length-1];\n      if(prev&&prev.key===rec.key&&prev.color===rec.color&&rec.start\u003c=prev.end+1){\n        prev.ids.push(rec.id);prev.end=Math.max(prev.end,rec.end);prev.text=(prev.text+(rec.text||'')).replace(/\\s+/g,' ').trim();\n      }else groups.push({kind:'highlight',key:rec.key,section,color:rec.color||'yellow',ids:[rec.id],start:rec.start,end:rec.end,text:String(rec.text||'').replace(/\\s+/g,' ').trim()});\n    }\n    return groups;\n  }\n  function noteItems(){\n    return [...document.querySelectorAll('.enzo-study-note')].map(el=>({\n      kind:'note',id:el.dataset.noteId,section:el.closest('.section')?.id||'page',label:el.dataset.label||'nota',text:(el.querySelector('.enzo-note-body')?.textContent||'').trim(),el\n    }));\n  }\n  function items(){return [...noteItems(),...groupedHighlights()]}\n  function refresh(){\n    const all=items(),shown=filter==='all'?all:all.filter(x=>x.kind===filter);\n    count.textContent=all.length;count.classList.toggle('visible',all.length>0);\n    list.innerHTML='';\n    if(!shown.length){list.innerHTML='\u003cdiv class=\"enzo-index-empty\">Nenhuma anotação nesta categoria ainda.\u003cbr>Crie um post-it ou grife um trecho do resumo.\u003c/div>';return}\n    shown.forEach(item=>{\n      const b=document.createElement('button');b.type='button';b.className='enzo-index-item';b.dataset.kind=item.kind;\n      if(item.color)b.dataset.color=item.color;\n      const label=item.kind==='note'?({nota:'📝 Nota',importante:'⭐ Importante',prova:'🎯 Prova',atencao:'⚠️ Atenção'}[item.label]||'📝 Nota'):`🖍️ Grifo ${item.color==='green'?'verde':item.color==='red'?'vermelho':'amarelo'}`;\n      b.innerHTML=`\u003cdiv class=\"enzo-index-meta\">\u003cspan>${label}\u003c/span>\u003cspan>${sectionName(item.section)}\u003c/span>\u003c/div>\u003cdiv class=\"enzo-index-text\">\u003c/div>`;\n      b.querySelector('.enzo-index-text').textContent=item.text||'(sem texto)';\n      b.addEventListener('click',()=>goTo(item));list.appendChild(b);\n    });\n  }\n  function activateSection(section){\n    if(!section||section==='page')return;\n    const btn=document.querySelector(`nav.tabs button[data-section=\"${CSS.escape(section)}\"]`);\n    if(typeof window.showSectionByName==='function')window.showSectionByName(section);\n    else if(typeof window.showSection==='function')window.showSection(section,btn);\n    else{\n      document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===section));\n      document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.section===section));\n    }\n  }\n  function flash(el){if(!el)return;el.classList.remove('enzo-index-flash');void el.offsetWidth;el.classList.add('enzo-index-flash');setTimeout(()=>el.classList.remove('enzo-index-flash'),1400)}\n  function goTo(item){\n    activateSection(item.section);panel.classList.remove('open');toggle.classList.remove('active');\n    setTimeout(()=>{\n      let target=null;\n      if(item.kind==='note')target=document.querySelector(`.enzo-study-note[data-note-id=\"${CSS.escape(String(item.id))}\"]`);\n      else{\n        for(const id of item.ids||[]){target=document.querySelector(`mark.enzo-highlight[data-highlight-id=\"${CSS.escape(String(id))}\"]`);if(target)break}\n        if(!target&&item.key)target=document.querySelector(`[data-enzo-hl-key=\"${CSS.escape(String(item.key))}\"]`);\n      }\n      if(!target)return;\n      target.scrollIntoView({behavior:'smooth',block:'center',inline:'nearest'});flash(target);\n    },180);\n  }\n  function scheduleRefresh(){clearTimeout(refreshTimer);refreshTimer=setTimeout(refresh,80)}\n  toggle.addEventListener('click',()=>{const open=!panel.classList.contains('open');panel.classList.toggle('open',open);toggle.classList.toggle('active',open);if(open)refresh()});\n  panel.querySelector('.enzo-index-close').addEventListener('click',()=>{panel.classList.remove('open');toggle.classList.remove('active')});\n  panel.querySelectorAll('.enzo-index-filter').forEach(btn=>btn.addEventListener('click',()=>{filter=btn.dataset.filter;panel.querySelectorAll('.enzo-index-filter').forEach(x=>x.classList.toggle('active',x===btn));refresh()}));\n  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&panel.classList.contains('open')){panel.classList.remove('open');toggle.classList.remove('active')}});\n  window.addEventListener('storage',e=>{if(e.key===STORAGE_KEY)scheduleRefresh()});\n  new MutationObserver(m=>{if(m.some(x=>[...x.addedNodes,...x.removedNodes].some(n=>n.nodeType===1&&(n.matches?.('.enzo-study-note,mark.enzo-highlight')||n.querySelector?.('.enzo-study-note,mark.enzo-highlight')))))scheduleRefresh()}).observe(document.body,{childList:true,subtree:true});\n  setTimeout(refresh,1200);\n})();\n\u003c/script>\n\u003cscript>\n/* Controle mestre: recolhe as utilidades para liberar a área de leitura. */\n(()=>{\n  'use strict';\n  const PAGE=\"bioquimica_2_final_p1\";\n  const KEY=`enzo-tools-collapsed:v1:${PAGE}`;\n  const btn=document.createElement('button');\n  btn.id='enzo-tools-retractor';\n  btn.type='button';\n  btn.innerHTML='\u003cspan class=\"enzo-tools-arrow\" aria-hidden=\"true\">‹\u003c/span>';\n  document.body.appendChild(btn);\n\n  function closeChildren(){\n    const highlighter=document.getElementById('enzo-highlighter');\n    if(highlighter){\n      highlighter.classList.remove('open');\n      highlighter.querySelector('.enzo-hl-toggle')?.setAttribute('aria-expanded','false');\n    }\n    document.body.classList.remove('enzo-highlight-mode','enzo-eraser-mode');\n    document.querySelector('.enzo-hl-eraser')?.classList.remove('active');\n    document.querySelectorAll('.enzo-hl-color.active').forEach(el=>el.classList.remove('active'));\n\n    const noteComposer=document.getElementById('enzo-note-composer');\n    noteComposer?.classList.remove('open');\n    document.getElementById('enzo-notes-toggle')?.classList.remove('active');\n\n    const index=document.getElementById('enzo-annotations-index');\n    index?.classList.remove('open');\n    document.getElementById('enzo-annotations-index-toggle')?.classList.remove('active');\n  }\n  function apply(collapsed,persist=true){\n    if(collapsed)closeChildren();\n    document.body.classList.toggle('enzo-tools-collapsed',collapsed);\n    btn.setAttribute('aria-expanded',String(!collapsed));\n    btn.setAttribute('aria-label',collapsed?'Abrir painel de utilidades':'Recolher painel de utilidades');\n    btn.title=collapsed?'Abrir utilidades de estudo':'Recolher utilidades de estudo';\n    if(persist){try{localStorage.setItem(KEY,collapsed?'1':'0')}catch(_){}}\n  }\n  let initial=false;\n  try{initial=localStorage.getItem(KEY)==='1'}catch(_){}\n  apply(initial,false);\n  btn.addEventListener('click',()=>apply(!document.body.classList.contains('enzo-tools-collapsed')));\n  window.addEventListener('storage',e=>{if(e.key===KEY)apply(e.newValue==='1',false)});\n})();\n\u003c/script>\n\n\u003c/body>\u003c/html>\n","p2":"\u003c!DOCTYPE html>\u003chtml lang=\"pt-BR\">\u003chead>\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1.0\">\n\u003ctitle>Bioquímica II — Revisão completa para a Final\u003c/title>\n\u003cscript>window.PAGE_KEY = \"bioquimica_2_final\";\u003c/script>\u003cscript>document.documentElement.style.visibility=\"hidden\";\u003c/script>\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2\">\u003c/script>\u003cscript src=\"auth-guard.js\">\u003c/script>\u003cscript>document.addEventListener(\"authReady\",function(){document.documentElement.style.visibility=\"visible\";});\u003c/script>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n\n\n:root {\n  --bg: #0a0d14;\n  --bg2: #111520;\n  --bg3: #161c2e;\n  --card: #1a2138;\n  --card2: #1f2845;\n  --accent: #4f9cf9;\n  --accent2: #38e8c0;\n  --accent3: #f9784f;\n  --accent4: #b84ff9;\n  --gold: #f9c94f;\n  --red: #f95f5f;\n  --green: #4ff984;\n  --text: #e8eaf6;\n  --muted: #8892b0;\n  --border: rgba(79,156,249,0.15);\n  --shadow: 0 8px 40px rgba(0,0,0,0.5);\n  --radius: 16px;\n  --font-body: 'DM Sans', sans-serif;\n  --font-display: 'Syne', sans-serif;\n  --font-mono: 'JetBrains Mono', monospace;\n}\n\n* { margin:0; padding:0; box-sizing:border-box; }\n\nbody {\n  background: var(--bg);\n  color: var(--text);\n  font-family: var(--font-body);\n  font-size: 14px;\n  line-height: 1.6;\n  min-height: 100vh;\n  overflow-x: hidden;\n}\n\n#particles { position:fixed; inset:0; z-index:0; pointer-events:none; }\n\n/* ── HEADER ── */\nheader {\n  position: relative; z-index:10;\n  text-align: center;\n  padding: 48px 24px 32px;\n  background: linear-gradient(180deg, rgba(79,156,249,0.08) 0%, transparent 100%);\n  border-bottom: 1px solid var(--border);\n}\nheader .badge {\n  display:inline-block;\n  background: linear-gradient(135deg, var(--accent), var(--accent2));\n  color: var(--bg);\n  font-family: var(--font-mono);\n  font-size: 11px; font-weight:600;\n  letter-spacing:2px; text-transform:uppercase;\n  padding: 4px 14px; border-radius:20px; margin-bottom:16px;\n}\nheader h1 {\n  font-family: var(--font-display);\n  font-size: clamp(24px, 4vw, 44px);\n  font-weight: 800; letter-spacing:-1px;\n  background: linear-gradient(135deg, #fff 0%, var(--accent) 50%, var(--accent2) 100%);\n  -webkit-background-clip:text; -webkit-text-fill-color:transparent;\n  background-clip: text; margin-bottom:8px;\n}\nheader .sub { color: var(--muted); font-size:13px; letter-spacing:1px; }\nheader .by { margin-top:12px; color: var(--accent2); font-family:var(--font-mono); font-size:12px; }\nheader .psalm { margin-top:8px; color:var(--gold); font-size:12px; font-style:italic; opacity:0.8; }\n\n/* ── TABS ── */\nnav.tabs {\n  position:sticky; top:0; z-index:100;\n  display:flex; gap:4px; flex-wrap:wrap;\n  background: rgba(10,13,20,0.97);\n  backdrop-filter: blur(20px);\n  border-bottom: 1px solid var(--border);\n  padding: 10px 16px;\n  justify-content: center;\n}\nnav.tabs button {\n  background: var(--card);\n  border: 1px solid var(--border);\n  color: var(--muted);\n  font-family: var(--font-body); font-size:12px; font-weight:600;\n  padding: 6px 14px; border-radius: 8px; cursor:pointer;\n  transition: all 0.2s; letter-spacing: 0.3px;\n}\nnav.tabs button:hover { color: var(--accent); border-color: var(--accent); }\nnav.tabs button.active {\n  background: var(--accent); color: var(--bg);\n  border-color: var(--accent);\n  box-shadow: 0 0 20px rgba(79,156,249,0.4);\n}\nnav.tabs button.fc-tab.active { background: var(--gold); color: var(--bg); border-color: var(--gold); box-shadow: 0 0 20px rgba(249,201,79,0.4); }\nnav.tabs button.qz-tab.active { background: var(--accent4); color: #fff; border-color: var(--accent4); box-shadow: 0 0 20px rgba(184,79,249,0.4); }\n\n/* ── SECTIONS ── */\n.section { display:none; animation: fadeIn 0.4s ease; }\n.section.active { display:block; }\n@keyframes fadeIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }\n\n.container { max-width:1100px; margin:0 auto; padding: 32px 20px; position:relative; z-index:1; }\n\n/* ── CHAPTER TITLE ── */\n.chapter-title {\n  font-family: var(--font-display); font-size:22px; font-weight:700;\n  color: var(--accent); margin-bottom:24px;\n  display:flex; align-items:center; gap:12px;\n}\n.chapter-title::after {\n  content:''; flex:1; height:1px;\n  background: linear-gradient(90deg, var(--border), transparent);\n}\n.chap-icon { font-size:24px; }\n\n/* ── GLOSSARY GRID ── */\n.glossary-grid {\n  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));\n  gap: 14px; margin-bottom:32px;\n}\n.gloss-card {\n  background: var(--card); border:1px solid var(--border);\n  border-radius:var(--radius); padding:18px 20px;\n  cursor:pointer; transition: all 0.25s;\n  position:relative; overflow:hidden;\n}\n.gloss-card::before {\n  content:''; position:absolute; top:0; left:0; right:0; height:3px;\n  background: linear-gradient(90deg, var(--accent), var(--accent2));\n  border-radius:3px 3px 0 0;\n}\n.gloss-card:hover {\n  transform:translateY(-2px); border-color: var(--accent);\n  box-shadow: 0 8px 30px rgba(79,156,249,0.2);\n}\n.gloss-card .term {\n  font-family:var(--font-mono); font-size:13px; color:var(--accent2);\n  font-weight:600; margin-bottom:6px;\n}\n.gloss-card .def { color:var(--text); font-size:13px; line-height:1.6; }\n\n/* ── INFO BLOCKS ── */\n.info-block {\n  background: var(--card2); border-left: 3px solid var(--accent);\n  border-radius: 0 12px 12px 0;\n  padding: 16px 20px; margin-bottom:20px;\n}\n.info-block.warn { border-color: var(--gold); }\n.info-block.danger { border-color: var(--red); }\n.info-block.success { border-color: var(--green); }\n.info-block.purple { border-color: var(--accent4); }\n.info-block .label {\n  font-family:var(--font-mono); font-size:10px; letter-spacing:2px;\n  text-transform:uppercase; color:var(--muted); margin-bottom:8px;\n}\n.info-block h4 { font-family:var(--font-display); font-weight:700; margin-bottom:8px; font-size:15px; color:#fff; }\n.info-block p { color: var(--text); }\n.info-block ul, .info-block ol { padding-left:20px; margin-top:8px; color:var(--text); }\n.info-block li { margin:4px 0; }\n\n/* ── COMPARE TABLE ── */\n.compare-table {\n  width:100%; border-collapse:separate; border-spacing:0;\n  border-radius:var(--radius); overflow:hidden; margin-bottom:28px;\n}\n.compare-table th {\n  background: var(--card2); color:var(--accent);\n  font-family:var(--font-display); font-size:13px; font-weight:700;\n  padding:12px 16px; text-align:left;\n  border-bottom:1px solid var(--border);\n}\n.compare-table td {\n  background: var(--card); padding:10px 16px; font-size:13px;\n  border-bottom:1px solid rgba(255,255,255,0.04); color:var(--text);\n}\n.compare-table tr:last-child td { border-bottom:none; }\n.compare-table tr:hover td { background: var(--card2); }\n\n/* ── SECTION DIVIDER ── */\n.sec-divider {\n  display:flex; align-items:center; gap:12px;\n  margin: 32px 0 20px;\n}\n.sec-divider h3 {\n  font-family:var(--font-display); font-weight:700; font-size:17px;\n  color:var(--accent3); white-space:nowrap;\n}\n.sec-divider::before, .sec-divider::after {\n  content:''; flex:1; height:1px;\n  background: linear-gradient(90deg, transparent, var(--border), transparent);\n}\n\n/* ── FORMULA BOX ── */\n.formula-box {\n  background: rgba(56,232,192,0.06);\n  border: 1px solid rgba(56,232,192,0.25);\n  border-left: 4px solid var(--accent2);\n  border-radius: 0 12px 12px 0;\n  padding:14px 20px; margin-bottom:20px;\n  font-family: var(--font-mono); font-size:15px;\n  color: var(--accent2); font-weight:700;\n}\n.formula-box .formula-label {\n  font-size:10px; letter-spacing:2px; text-transform:uppercase;\n  color:var(--muted); margin-bottom:6px; font-family:var(--font-body);\n}\n\n/* ── EXAMPLE BOX ── */\n.example-box {\n  background:rgba(249,120,79,0.06);\n  border:1px solid rgba(249,120,79,0.2);\n  border-left:4px solid var(--accent3);\n  border-radius:0 12px 12px 0;\n  padding:12px 18px; margin:12px 0 20px;\n}\n.example-box .ex-label {\n  font-size:10px; letter-spacing:2px; text-transform:uppercase;\n  color:var(--accent3); font-weight:700; margin-bottom:6px;\n}\n.example-box p { color:var(--text); font-size:13px; }\n\n/* ── FLASHCARD GRID ── */\n.flashcard-grid {\n  display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));\n  gap:20px; margin-bottom:32px;\n}\n.flashcard { perspective:1000px; height:235px; cursor:pointer; }\n.flashcard-inner {\n  position:relative; width:100%; height:100%;\n  transition: transform 0.6s cubic-bezier(0.4,0,0.2,1);\n  transform-style: preserve-3d;\n}\n.flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }\n.flashcard-front, .flashcard-back {\n  position:absolute; inset:0; border-radius:var(--radius);\n  backface-visibility:hidden; padding:22px;\n  display:flex; flex-direction:column; justify-content:space-between;\n}\n.flashcard-front {\n  background: linear-gradient(135deg, var(--card) 0%, var(--card2) 100%);\n  border: 1px solid var(--border);\n}\n.flashcard-back {\n  transform: rotateY(180deg);\n  background: linear-gradient(135deg, #1a1a3a 0%, #1a2a3e 100%);\n  border: 1px solid rgba(79,156,249,0.3);\n  overflow-y:auto; font-size:12.5px; line-height:1.7;\n}\n.fc-tag {\n  font-family:var(--font-mono); font-size:11px;\n  color:var(--accent2); letter-spacing:1px; text-transform:uppercase;\n}\n.fc-q {\n  font-family:var(--font-display); font-size:16px; font-weight:700;\n  color:#fff; line-height:1.3; margin:8px 0;\n}\n.fc-hint { font-size:11px; color:var(--accent); text-align:right; opacity:0.7; }\n.fc-back-text { color:var(--text); white-space:pre-line; }\n\n/* ── QUIZ ── */\n.q-stats { display:flex; gap:1rem; justify-content:center; margin-bottom:2rem; flex-wrap:wrap; }\n.sbox { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:.65rem 1.1rem; text-align:center; min-width:80px; }\n.sbox .sv { font-size:1.5rem; font-weight:900; font-family:var(--font-display); }\n.sbox .sl { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }\n.sbox.c .sv { color:var(--green); } .sbox.w .sv { color:var(--red); } .sbox.p .sv { color:var(--accent); }\n\n.q-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:1.8rem; margin-bottom:1.5rem; transition:border-color .3s; }\n.q-card.ans.cq { border-color:var(--green); } .q-card.ans.wq { border-color:var(--red); }\n.q-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:.9rem; gap:.5rem; flex-wrap:wrap; }\n.q-num { font-size:11px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:2px; }\n.q-tbadge { font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:1px; padding:.2rem .55rem; border-radius:20px; }\n.tmc { background:rgba(79,156,249,0.15); color:var(--accent); } .ttf { background:rgba(184,79,249,0.15); color:var(--accent4); } .tab { background:rgba(249,201,79,0.15); color:var(--gold); }\n.ctag { font-size:10px; font-weight:700; background:rgba(255,255,255,.06); color:var(--muted); padding:.2rem .55rem; border-radius:20px; }\n.q-text { font-size:15px; font-weight:700; color:#fff; margin-bottom:1.1rem; line-height:1.6; }\n.opts { display:flex; flex-direction:column; gap:.5rem; margin-bottom:.9rem; }\n.opt-btn { background:var(--card2); border:1px solid var(--border); color:var(--text); padding:.7rem 1rem; border-radius:10px; cursor:pointer; font-family:var(--font-body); font-size:14px; text-align:left; transition:all .2s; display:flex; gap:.7rem; align-items:flex-start; width:100%; }\n.opt-btn:hover:not(:disabled) { border-color:var(--accent); color:#fff; }\n.opt-btn:disabled { cursor:default; }\n.opt-btn.ca { background:rgba(79,249,132,0.12); border-color:var(--green); color:var(--green); }\n.opt-btn.wa { background:rgba(249,95,95,0.1); border-color:var(--red); color:var(--red); }\n.ol { font-weight:900; font-size:12px; flex-shrink:0; width:18px; text-align:center; margin-top:1px; }\n.tf-opts { display:flex; gap:1rem; margin-bottom:.9rem; }\n.tf-btn { flex:1; background:var(--card2); border:1px solid var(--border); color:var(--text); padding:.8rem; border-radius:10px; cursor:pointer; font-family:var(--font-body); font-size:15px; font-weight:800; text-align:center; transition:all .2s; }\n.tf-btn:hover:not(:disabled) { border-color:var(--accent4); }\n.tf-btn:disabled { cursor:default; }\n.tf-btn.ca { background:rgba(79,249,132,0.12); border-color:var(--green); color:var(--green); }\n.tf-btn.wa { background:rgba(249,95,95,0.1); border-color:var(--red); color:var(--red); }\n.open-btn { background:var(--card2); border:1px dashed var(--gold); color:var(--gold); padding:.65rem 1.4rem; border-radius:10px; cursor:pointer; font-family:var(--font-body); font-size:14px; font-weight:700; transition:all .2s; margin-bottom:.9rem; }\n.open-btn:hover { background:rgba(249,201,79,0.1); }\n.exp-box { display:none; background:rgba(0,0,0,.2); border:1px solid rgba(255,255,255,.08); border-radius:10px; padding:.9rem 1.1rem; margin-top:.6rem; }\n.exp-box.vis { display:block; }\n.exp-box .et { font-size:11px; font-weight:800; color:var(--accent2); text-transform:uppercase; letter-spacing:1px; margin-bottom:.4rem; }\n.exp-box p { font-size:13px; color:var(--text); line-height:1.7; }\n.res-ind { display:none; align-items:center; gap:.5rem; font-size:14px; font-weight:700; margin-bottom:.6rem; }\n.res-ind.vis { display:flex; }\n.res-ind.c { color:var(--green); } .res-ind.w { color:var(--red); }\n.reset-btn { background:var(--card); border:1px solid var(--border); color:var(--muted); padding:.6rem 1.5rem; border-radius:50px; cursor:pointer; font-family:var(--font-body); font-size:14px; font-weight:700; display:block; margin:2rem auto; transition:all .2s; }\n.reset-btn:hover { border-color:var(--red); color:var(--red); }\n\n/* ── SCROLL TOP ── */\n#scrolltop {\n  position:fixed; bottom:24px; right:24px; z-index:200;\n  background:var(--accent); color:var(--bg);\n  width:40px; height:40px; border-radius:50%;\n  border:none; cursor:pointer; font-size:18px;\n  box-shadow:0 4px 20px rgba(79,156,249,0.4);\n  transition:all 0.2s; display:none;\n}\n#scrolltop:hover { tr p:30px;border-top:1px solid var(--border)}\n.enzo-deep-intro>span,.enzo-path-title{font:700 11px var(--font-mono);color:var(--accent2);letter-spacing:.06em}\n.enzo-deep-intro h2{font:800 clamp(19px,3vw,27px) var(--font-display);color:var(--text);margin:12px 0}\n.enzo-deep-intro p{color:var(--muted);font-size:14px;line-height:1.7}\n.enzo-pathway{border:1px solid var(--border);border-radius:18px;background:linear-gradient(125deg,var(--card),var(--bg2));padding:22px 18px;margin:14px 0 28px;overflow:hidden}\n.enzo-path-title{margin-bottom:18px}\n.enzo-path-flow{display:flex;flex-wrap:wrap;align-items:stretch;justify-content:center;gap:8px}\n.enzo-path-step{min-width:115px;max-width:148px;flex:1 1 100px;padding:12px 9px;text-align:center;border-radius:12px;border:1px solid rgba(56,232,192,.3);background:rgba(56,232,192,.06);display:flex;flex-direction:column;gap:8px;justify-content:center}\n.enzo-path-step b{font:700 12px var(--font-body);color:var(--text);line-height:1.25}\n.enzo-path-index{font:700 10px var(--font-mono);color:var(--accent2)}\n.enzo-path-arrow{align-self:center;font-size:20px;color:var(--gold)}\n.enzo-concept-list{counter-reset:enzo;list-style:none;margin:8px 0;padding:0}\n.enzo-concept-list li{display:grid;grid-template-columns:24px 1fr;gap:0 10px;margin:0;padding:13px 4px;border-bottom:1px solid rgba(79,156,249,.13)}\n.enzo-concept-list li:before{counter-increment:enzo;content:counter(enzo,decimal-leading-zero);grid-row:span 2;font:700 11px var(--font-mono);color:var(--accent2);padding-top:6px}\n.enzo-concept-list li p{grid-column:2;font-size:14px;line-height:1.7;margin:0 0 5px}\n.enzo-concept-list li span{grid-column:2;color:var(--muted);font-size:13px;line-height:1.6}\n.enzo-term{color:var(--gold);font-weight:800}\n.enzo-membrane-wrap{border-radius:13px;border:1px solid rgba(79,156,249,.2);background:#0b1221;margin:15px 0 20px;overflow:hidden}\n.enzo-h-space{color:var(--accent2);font:600 11px var(--font-mono);padding:13px;text-align:center;letter-spacing:.02em}\n.enzo-h-space strong{color:var(--gold)}\n.enzo-membrane{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:repeating-linear-gradient(90deg,#37507b 0,#37507b 13px,#25395c 13px,#25395c 25px);padding:12px}\n.enzo-complex{border:2px solid var(--accent2);border-radius:12px;background:#18283e;padding:16px 8px;text-align:center;font:800 22px var(--font-display);color:var(--text)}\n.enzo-complex small{display:block;color:var(--gold);font:600 11px var(--font-mono)}\n.enzo-atp{border-color:var(--gold)}\n.enzo-matrix{padding:15px;color:var(--muted);font-size:12px;line-height:1.8;text-align:center}\n.enzo-krebs-integracao{padding:20px;border:1px solid rgba(249,201,79,.3);background:rgba(249,201,79,.06);border-radius:14px;margin:20px 0}\n.enzo-krebs-integracao strong{color:var(--gold)}\n.enzo-krebs-integracao div{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}\n.enzo-krebs-integracao div span{background:#1f2845;border:1px solid rgba(249,201,79,.3);border-radius:10px;padding:10px;font:700 13px var(--font-mono)}\n.enzo-krebs-integracao p{font-size:13px;line-height:1.7}\n@media(max-width:650px){.enzo-path-step{min-width:80px;flex-basis:85px}.enzo-path-arrow{font-size:14px}.enzo-complex{font-size:14px;padding:9px 2px}.enzo-deep-intro{padding:16px 4px 8px}}\n\nnav.tabs button .enzo-vector-icon{width:17px;height:17px;display:inline-block;vertical-align:-4px;margin-right:6px;flex:0 0 auto;color:currentColor}\n#topicCards .intro-card .ic-icon{display:flex;justify-content:flex-start;align-items:center;height:34px;margin-bottom:12px}\n#topicCards .intro-card .enzo-vector-icon{width:31px;height:31px;color:var(--accent2);filter:drop-shadow(0 0 6px rgba(56,232,192,.18))}\nnav.tabs button:hover .enzo-vector-icon,nav.tabs button.active .enzo-vector-icon{color:inherit}\n\n.enzo-gap-choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}\n.enzo-gap-choices .opt-btn{border:1px solid rgba(56,232,192,.22);background:rgba(56,232,192,.055);text-align:center;justify-content:center;border-radius:12px;font-weight:700}\n.enzo-gap-filled{display:inline-block;padding:3px 9px;border-radius:8px;font-weight:800}\n.enzo-gap-filled.correct{background:rgba(74,222,128,.16);color:var(--green);border:1px solid rgba(74,222,128,.4)}\n.enzo-gap-filled.incorrect{background:rgba(249,95,95,.15);color:var(--red);border:1px solid rgba(249,95,95,.4)}\n\n\u003c/style>\u003cstyle>/* Diagrama do ciclo de Krebs (SVG) — usa os tokens da página */\n.enzo-krebs-figure.kx{padding:14px 14px 10px;overflow-x:auto}\n.kx-svg{display:block;width:100%;height:auto;max-width:980px;margin:0 auto;overflow:visible;user-select:none;-webkit-tap-highlight-color:transparent}\n.kx-svg text{font-family:var(--font-body)}\n.kx-matrix-label{font:700 15px var(--font-mono);letter-spacing:.28em;fill:#4f86d6;opacity:.7}\n.kx-link{stroke:#4f6ea3;stroke-width:1.5;stroke-dasharray:2 5;opacity:.7}\n/* setas */\n.kx-arc{cursor:pointer}\n.kx-hit{fill:none;stroke:transparent;stroke-width:34}\n.kx-arc-line{fill:none;stroke:#6a8fd0;stroke-width:6;stroke-linecap:butt;opacity:.8;transition:stroke .2s,stroke-width .2s}\n.kx-flow{fill:none;stroke:#fff;stroke-width:3;stroke-dasharray:2 16;opacity:0;stroke-linecap:round}\n.kx-arc.active .kx-arc-line{stroke:var(--accent2);stroke-width:9;opacity:1;filter:drop-shadow(0 0 7px rgba(56,232,192,.55))}\n.kx-arc.active .kx-flow{opacity:.85;animation:kxflow 1s linear infinite}\n@keyframes kxflow{to{stroke-dashoffset:-18}}\n.kx-arc:hover .kx-arc-line{stroke:#9ec0ff}\n/* enzimas */\n.kx-enz{cursor:pointer;outline:none}\n.kx-enz rect:first-child{fill:#111c33;stroke:rgba(79,156,249,.4);stroke-width:1.5;transition:all .18s}\n.kx-enz text{fill:#dfe9ff;font-size:14.5px;font-weight:600}\n.kx-enz:hover rect:first-child,.kx-enz:focus-visible rect:first-child{stroke:#9ec0ff}\n.kx-enz.sel rect:first-child{fill:#123a46;stroke:var(--accent2);stroke-width:2.5;filter:drop-shadow(0 0 8px rgba(56,232,192,.4))}\n.kx-enz .kx-rn{fill:#0a1121;stroke:var(--accent);stroke-width:1.5}\n.kx-enz.sel .kx-rn{stroke:var(--accent2);fill:var(--accent2)}\n.kx-enz .kx-rnt{fill:var(--accent);font:800 12px var(--font-mono)}\n.kx-enz.sel .kx-rnt{fill:#06121a}\n.kx-enz .kx-star,.kx-star{fill:var(--gold);color:var(--gold);font-size:15px;font-weight:400}\n.kx-enz .kx-cx{fill:#2a1a45;stroke:#c47bff;stroke-width:1}\n.kx-enz .kx-cxt{fill:#d9b6ff;font:700 10px var(--font-mono)}\n/* chips */\n.kx-chip rect{fill:#0b1427;stroke:rgba(159,176,214,.28);stroke-width:1.2}\n.kx-chip text{font:700 13px var(--font-mono)}\n/* núcleo */\n.kx-hub-k{fill:var(--muted);font:700 12.5px var(--font-mono);letter-spacing:.1em}\n.kx-hub-n{font:700 16px var(--font-mono)}\n.kx-hub-atp{fill:var(--gold);font:800 26px var(--font-display)}\n/* metabólitos */\n.kx-node{cursor:pointer;outline:none}\n.kx-node .kx-ring{fill:#0d172b;stroke-width:3;transition:all .18s}\n.kx-node .kx-halo{fill:var(--c);opacity:0;transition:opacity .2s}\n.kx-node .kx-c{font:800 20px var(--font-display)}\n.kx-node:hover .kx-ring,.kx-node:focus-visible .kx-ring{fill:#18284a}\n.kx-node.sel .kx-halo{opacity:.3}\n.kx-node.sel .kx-ring{fill:#17314a;stroke-width:5.5}\n.kx-node.sub .kx-halo{opacity:.14}\n.kx-name{fill:#eaf1ff;font:700 19px var(--font-display);cursor:pointer;transition:fill .2s}\n.kx-svg .kx-name.sel{fill:var(--accent2)}\n.kx-svg .kx-name.sub{fill:#c9d7f5}\n/* legenda */\n.kx-legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;align-items:center;margin:6px 8px 4px;font:700 11.5px var(--font-mono);color:var(--muted)}\n.kx-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}\n.kx-legend .kx-sep{width:1px;height:14px;background:var(--border)}\n.kx-guide{margin:10px 8px 4px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:rgba(79,156,249,.06)}.kx-guide-main{font-size:13px;line-height:1.6;color:var(--text);margin:0 0 8px}.kx-guide-main b{color:var(--accent2)}.kx-guide-grid{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--muted)}.kx-guide-grid i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.kx-guide-grid b{color:var(--text);font-family:var(--font-mono)}\n.kx-now{margin:8px 8px 4px;padding:12px 16px;border-left:3px solid var(--accent2);background:rgba(56,232,192,.07);border-radius:0 10px 10px 0;font-size:14px;line-height:1.6;color:var(--text)}.kx-now b{color:var(--accent2);margin-right:4px}\n.kx-tablewrap{margin:12px 8px 4px;overflow-x:auto}.kx-table{width:100%;border-collapse:collapse;font-size:13px;line-height:1.45}.kx-table th{font:700 10.5px var(--font-mono);color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);letter-spacing:.05em}.kx-table td{padding:9px 10px;border-bottom:1px solid rgba(79,156,249,.1);vertical-align:top;color:var(--text)}.kx-table td small{display:block;color:var(--muted);font-size:11.5px}.kx-row{cursor:pointer;transition:background .15s;outline:none}.kx-row:hover,.kx-row:focus-visible{background:rgba(79,156,249,.1)}.kx-row.sel{background:rgba(56,232,192,.13)}.kx-row.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent2)}\n.kx-gloss{margin:12px 8px 6px;border:1px solid var(--border);border-radius:12px;background:rgba(0,0,0,.14);padding:4px 14px}.kx-gloss summary{cursor:pointer;padding:10px 0;font:700 12px var(--font-mono);color:var(--gold);letter-spacing:.04em}.kx-gloss dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:4px 22px;margin:0 0 10px}.kx-gloss dt{font-weight:700;color:var(--accent2);font-size:13px}.kx-gloss dd{margin:0 0 8px;font-size:13px;line-height:1.55;color:var(--muted)}\n.kx-lead{font-size:16px!important;line-height:1.65!important;color:var(--text);margin:0 0 16px;padding:12px 14px;background:rgba(56,232,192,.07);border-radius:10px}\n.kx-fstrip{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;margin:0 0 14px;padding:14px 10px;background:rgba(0,0,0,.2);border:1px solid var(--border);border-radius:14px}\n.kx-mol{min-width:118px;text-align:center;padding:10px 12px;border:2px solid var(--c);border-radius:14px;background:#0d172b;display:flex;flex-direction:column;gap:4px;align-items:center}.kx-mol b{font:700 13.5px var(--font-display);color:var(--text)}.kx-cn{font:800 17px var(--font-display)}.kx-dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}.kx-dots i{display:block;width:7px;height:7px;border-radius:50%}.kx-plus{font:700 20px var(--font-mono);color:var(--muted)}\n.kx-fmid{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;min-width:150px;max-width:230px}.kx-fenz{font:700 12px var(--font-body);color:var(--accent)}.kx-farrow{font-size:30px;line-height:1;color:var(--accent2)}.kx-ftype{font:700 10.5px var(--font-mono);color:var(--gold)}.kx-fchips{display:flex;flex-wrap:wrap;gap:3px 10px;justify-content:center;font:700 12px var(--font-mono);margin-top:2px}\n.kx-track{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin:0 0 18px;padding:10px 14px;border:1px dashed rgba(159,176,214,.35);border-radius:12px}.kx-trk-t{flex:1 0 100%;font:700 10.5px var(--font-mono);color:var(--muted);letter-spacing:.04em}.kx-trk{display:inline-flex;align-items:center;gap:5px;font:700 12.5px var(--font-mono)}.kx-trk i{width:13px;height:13px;border-radius:50%;border:2px solid var(--c);opacity:.45}.kx-trk i.on{background:var(--c);opacity:1}.kx-trk i.new{box-shadow:0 0 0 4px rgba(255,255,255,.14),0 0 12px var(--c)}.kx-trk em{font-style:normal;color:var(--muted);font-size:11px}\n@media(max-width:650px){.kx-fstrip{flex-direction:column}.kx-farrow{transform:rotate(90deg)}.kx-table th:nth-child(3),.kx-table td:nth-child(3){display:none}}\n/* painel lateral fixo no computador: o aluno clica no ciclo e lê/avança sem rolar */\n.kx-extra{margin-top:18px}\n.kx-extra .kx-table,.kx-extra .kx-guide,.kx-extra .kx-gloss{max-width:1100px}\n.enzo-krebs-control{position:sticky;bottom:10px;z-index:5}\n@media(min-width:1100px){\n #krebs .container{max-width:min(1600px,97vw)}\n #krebs .container>.chapter-title,#krebs .container>.info-block,#krebs .container>.unit-banner{max-width:1060px;margin-left:auto;margin-right:auto}\n .kx-layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(400px,.85fr);gap:20px;align-items:start}\n .enzo-krebs-figure.kx{margin:0;padding:10px 14px 8px}\n .kx-svg{max-height:calc(100vh - 205px)}\n .kx-side{position:sticky;top:70px;max-height:calc(100vh - 86px);display:flex;flex-direction:column;gap:10px}\n .kx-side .enzo-krebs-control{position:static;margin:0;flex:0 0 auto}\n .kx-side .enzo-krebs-panel{margin:0;min-height:0;flex:1 1 auto;overflow-y:auto;padding:18px!important}\n .kx-side .kx-fstrip{flex-direction:column;gap:6px}.kx-side .kx-farrow{transform:rotate(90deg);font-size:24px}\n .kx-side .kx-fmid{max-width:none}\n .kx-now{display:none}\n .kx-caption{display:none}\n}\n@media(max-width:1099px){\n .enzo-krebs-control{background:rgba(10,13,20,.92);backdrop-filter:blur(8px);padding:8px;border-radius:12px;border:1px solid var(--border)}\n}\n.kx-caption{margin:8px auto 4px;text-align:center}\n.enzo-krebs-control{flex-wrap:wrap}\n@media(max-width:650px){.kx-svg{min-width:760px}.enzo-krebs-figure.kx{padding:8px}}\n@media(prefers-reduced-motion:reduce){.kx-arc.active .kx-flow{animation:none}}\n\u003c/style>\u003cstyle>.periodos-bio{position:relative;display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin:1.2rem auto;max-width:58rem}.periodos-bio a{flex:1 1 12rem;padding:.55rem .75rem;color:#e8eaf6;background:#151e34;border:1px solid #506389;border-radius:.65rem;text-decoration:none}.periodos-bio b,.periodos-bio span{display:block}.periodos-bio span{font-size:.82rem}.periodos-bio [aria-current]{border:2px solid #38e8c0}.periodos-bio [aria-current] b{text-decoration:underline}\u003c/style>\u003c/head>\u003cbody>\u003ccanvas id=\"particles\">\u003c/canvas>\n\u003cheader>\u003cdiv class=\"badge\">🧪 Bioquímica II · P2 · 2026\u003c/div>\u003ch1>Bioquímica II — Revisão para a Final\u003c/h1>\u003cdiv class=\"periodos-bio\" role=\"navigation\" aria-label=\"Conteúdo do semestre\">\u003ca href=\"?etapa=p1\">\u003cb>P1\u003c/b>\u003cspan>Carboidratos, hormônios e antibióticos\u003c/span>\u003c/a>\u003ca href=\"?etapa=p2\" aria-current=\"page\">\u003cb>P2\u003c/b>\u003cspan>Lipídios, aminoácidos e bioenergética\u003c/span>\u003c/a>\u003ca href=\"?etapa=final\">\u003cb>Final\u003c/b>\u003cspan>Proteassoma, nucleotídeos e heme\u003c/span>\u003c/a>\u003c/div>\u003cp class=\"sub\">Lipídios · Aminoácidos · Ciclo de Krebs · Fosforilação oxidativa\u003c/p>\u003cp class=\"by\">⚡ Elaborado por Enzo Salmazo · Explicações funcionais, exemplos e revisão ativa\u003c/p>\u003c/header>\n\u003cdiv class=\"enzo-langbar\">\u003cbutton type=\"button\" class=\"active\" onclick=\"enzoLang(false)\">🇧🇷 Português\u003c/button>\u003cbutton type=\"button\" onclick=\"enzoLang(true)\">🇵🇾 Español Paraguay\u003c/button>\u003c/div>\u003cnav class=\"tabs\">\u003cbutton class=\"active\" data-section=\"intro\" onclick=\"showSection('intro',this)\">\u003cspan class=\"emoji-icon\">📖\u003c/span> Início\u003c/button>\u003cbutton data-section=\"lip\" onclick=\"showSection('lip',this)\">\u003cspan class=\"emoji-icon\">🧬\u003c/span> Lipídios\u003c/button>\u003cbutton data-section=\"aa\" onclick=\"showSection('aa',this)\">\u003cspan class=\"emoji-icon\">🔬\u003c/span> Metabolismo dos aminoácidos\u003c/button>\u003cbutton data-section=\"krebs\" onclick=\"showSection('krebs',this)\">\u003cspan class=\"emoji-icon\">🔄\u003c/span> Ciclo de Krebs\u003c/button>\u003cbutton data-section=\"ox\" onclick=\"showSection('ox',this)\">\u003cspan class=\"emoji-icon\">⚡\u003c/span> Fosforilação oxidativa\u003c/button>\u003cbutton class=\"fc-tab\" data-section=\"flashcards\" onclick=\"showSection('flashcards',this)\">\u003cspan class=\"emoji-icon\">🃏\u003c/span> Flashcards\u003c/button>\u003cbutton class=\"qz-tab\" data-section=\"quiz\" onclick=\"showSection('quiz',this)\">\u003cspan class=\"emoji-icon\">📝\u003c/span> Questões\u003c/button>\u003c/nav>\u003csection id=\"intro\" class=\"section active\">\u003cdiv class=\"container\">\u003cdiv class=\"sequence-badge\">BIOQUÍMICA II · P2\u003c/div>\u003cdiv class=\"chapter-title\">🧪 \u003cspan class=\"pttext\">Bioquímica II — P2\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Bioquímica II — P2\u003c/span>\u003c/div>\u003cp class=\"section-lead\">\u003cspan class=\"pttext\">Lipídios, metabolismo dos aminoácidos, ciclo de Krebs e fosforilação oxidativa. Referências: Harper, Lehninger e slides da disciplina.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Lípidos, metabolismo de aminoácidos, ciclo de Krebs y fosforilación oxidativa. Referencias: Harper, Lehninger y diapositivas de clase.\u003c/span>\u003c/p>\u003cdiv id=\"topicCards\" class=\"intro-grid\">\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"section\" id=\"lip\">\u003cdiv class=\"container\">\u003cdiv class=\"chapter-title\">🫒 \u003cspan class=\"pttext\">Lipídios\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Lípidos\u003c/span>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Visão geral\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Panorama general\u003c/span>\u003c/div>\u003cp>\u003cspan class=\"pttext\">Lipídios fornecem cerca de 9 kcal/g, formam membranas e participam da sinalização hormonal. O caminho pós-refeição é: emulsificação → hidrólise → micelas → enterócitos → quilomícrons → tecidos.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Los lípidos aportan aproximadamente 9 kcal/g, forman membranas y participan en señales hormonales. Ruta posprandial: emulsificación → hidrólisis → micelas → enterocitos → quilomicrones → tejidos.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">1. Digestão no duodeno\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">1. Digestión en duodeno\u003c/span>\u003c/div>\u003cp>\u003cspan class=\"pttext\">Os sais biliares EMULSIFICAM a gordura, aumentando a superfície de contato; a lipase pancreática, com auxílio da colipase, quebra triacilgliceróis sobretudo em 2-monoacilglicerol e dois ácidos graxos. Fosfolipase A₂ e colesterol esterase atuam em outros lipídios.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Las sales biliares EMULSIONAN las grasas; la lipasa pancreática, ayudada por la colipasa, rompe triacilglicéridos principalmente en 2-monoacilglicerol y dos ácidos grasos. Fosfolipasa A₂ y colesterol esterasa actúan sobre otros lípidos.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">2. Micelas e absorção\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">2. Micelas y absorción\u003c/span>\u003c/div>\u003cp>\u003cspan class=\"pttext\">Micelas mistas carregam produtos lipídicos até a borda em escova. Os lipídios entram no enterócito; os sais biliares permanecem no lúmen e são reabsorvidos principalmente no íleo terminal (circulação entero-hepática). A absorção do colesterol envolve NPC1L1.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Las micelas mixtas acercan lípidos al borde en cepillo. Los lípidos ingresan al enterocito; las sales biliares quedan en la luz y se reabsorben sobre todo en íleon terminal (circulación enterohepática). NPC1L1 participa en la absorción del colesterol.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">3. Transporte de lipídios\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">3. Transporte de lípidos\u003c/span>\u003c/div>\u003cp>\u003cspan class=\"pttext\">No enterócito, ácidos graxos de cadeia longa são reesterificados em TAG e montados em quilomícrons contendo apoB-48; seguem pela linfa até o sangue. LPL, ativada por apoC-II, libera ácidos graxos nos capilares; remanescentes ricos em colesterol são captados pelo fígado. Ácidos graxos livres circulam associados à albumina.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">En el enterocito, los ácidos grasos de cadena larga forman TAG y quilomicrones con apoB-48; pasan por linfa a sangre. La LPL, activada por apoC-II, libera ácidos grasos; los remanentes son captados por el hígado. Los ácidos grasos no esterificados viajan con albúmina.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">4. Lipólise × lipogênese\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">4. Lipólisis × lipogénesis\u003c/span>\u003c/div>\u003cp>\u003cspan class=\"pttext\">Lipólise é quebra de TAG armazenados por ATGL, HSL e MGL, favorecida pelas catecolaminas no jejum/exercício; a insulina a reduz. Lipogênese sintetiza ácidos graxos a partir de acetil-CoA: ACC gera malonil-CoA e ácido graxo sintase alonga a cadeia usando NADPH; insulina a favorece. Malonil-CoA inibe CPT-I.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">La lipólisis degrada TAG almacenados mediante ATGL, HSL y MGL; catecolaminas la favorecen e insulina la inhibe. La lipogénesis forma ácidos grasos: ACC genera malonil-CoA y ácido graso sintasa alarga cadenas utilizando NADPH. Malonil-CoA inhibe CPT-I.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">5. Beta-oxidação em quatro passos\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">5. Beta-oxidación en cuatro pasos\u003c/span>\u003c/div>\u003cp>\u003cspan class=\"pttext\">1) Ativação: ácido graxo + CoA + ATP → acil-CoA + AMP + PPi (custo 2 equivalentes ATP). 2) Cadeias longas entram na matriz mitocondrial pela naveta de carnitina (CPT-I, translocase, CPT-II). Cada volta: oxidação com FAD → hidratação → oxidação com NAD⁺ → tiólise; gera FADH₂, NADH e acetil-CoA, removendo 2 carbonos.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">1) Activación: ácido graso + CoA + ATP → acil-CoA + AMP + PPi (costo de 2 equivalentes de ATP). 2) Ácidos grasos largos ingresan a matriz mediante carnitina. Cada vuelta: oxidación con FAD → hidratación → oxidación con NAD⁺ → tiólisis. Forma FADH₂, NADH y acetil-CoA, acortando 2 carbonos.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Exemplo: palmitato (C16:0)\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Ejemplo: palmitato (C16:0)\u003c/span>\u003c/div>\u003cp>\u003cspan class=\"pttext\">7 voltas → 8 acetil-CoA + 7 NADH + 7 FADH₂. Com rendimento moderno de 2,5 ATP/NADH e 1,5 ATP/FADH₂: 80 + 17,5 + 10,5 − 2 = 106 ATP líquidos.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">7 vueltas → 8 acetil-CoA + 7 NADH + 7 FADH₂. Con 2,5 ATP/NADH y 1,5 ATP/FADH₂: 80 + 17,5 + 10,5 − 2 = 106 ATP netos.\u003c/span>\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"section\" id=\"aa\">\u003cdiv class=\"container\">\u003cdiv class=\"chapter-title\">🧬 \u003cspan class=\"pttext\">Metabolismo dos aminoácidos\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Metabolismo de aminoácidos\u003c/span>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Ideia central\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Idea central\u003c/span>\u003c/div>\u003cp>\u003cspan class=\"pttext\">Aminoácidos não têm reserva especializada. Seu grupo amino deve ser processado com segurança; o esqueleto carbônico entra em vias energéticas, gliconeogênese ou cetogênese.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Los aminoácidos no tienen reserva especializada. El grupo amino debe procesarse de forma segura; el esqueleto carbonado va a energía, gluconeogénesis o cetogénesis.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">1. Transaminação\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">1. Transaminación\u003c/span>\u003c/div>\u003cp>\u003cspan class=\"pttext\">Aminotransferases ALT e AST transferem o grupo amino para α-cetoglutarato, formando glutamato. Requerem piridoxal-fosfato (vitamina B6). Na maioria dos casos, não liberam amônia livre nesta etapa.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">ALT y AST transfieren el grupo amino al α-cetoglutarato y forman glutamato. Requieren fosfato de piridoxal (vitamina B6). Generalmente no liberan amoníaco libre aquí.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">2. Desaminação oxidativa\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">2. Desaminación oxidativa\u003c/span>\u003c/div>\u003cp>\u003cspan class=\"pttext\">No fígado, glutamato desidrogenase mitocondrial converte glutamato em α-cetoglutarato e NH₄⁺, usando NAD⁺ ou NADP⁺. O amônio é tóxico, especialmente ao SNC, e precisa ser eliminado.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">En hígado, glutamato deshidrogenasa mitocondrial convierte glutamato en α-cetoglutarato y NH₄⁺ usando NAD⁺ o NADP⁺. El amonio es neurotóxico y debe eliminarse.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">3. Transporte de nitrogênio\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">3. Transporte de nitrógeno\u003c/span>\u003c/div>\u003cp>\u003cspan class=\"pttext\">Glutamina transporta nitrogênio de muitos tecidos ao fígado/rins. No músculo, a alanina transporta nitrogênio ao fígado pelo ciclo glicose-alanina. Glutaminase libera NH₄⁺ a partir de glutamina.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Glutamina transporta nitrógeno de tejidos a hígado/riñón. En músculo, alanina transporta nitrógeno al hígado por el ciclo glucosa-alanina. Glutaminasa libera NH₄⁺.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">4. Ciclo da ureia\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">4. Ciclo de la urea\u003c/span>\u003c/div>\u003cp>\u003cspan class=\"pttext\">No fígado: (mitocôndria) NH₄⁺ + HCO₃⁻ —CPS-I→ carbamoil-fosfato; este + ornitina —OTC→ citrulina. (Citosol) citrulina + aspartato —argininossuccinato sintetase→ argininossuccinato → arginina + fumarato → ureia + ornitina (arginase). CPS-I necessita N-acetilglutamato. Consome 3 ATP, equivalentes a 4 ligações de alta energia.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">En hígado: (mitocondria) NH₄⁺ + HCO₃⁻ —CPS-I→ carbamoil-fosfato; con ornitina —OTC→ citrulina. (Citosol) citrulina + aspartato → argininosuccinato → arginina + fumarato → urea + ornitina. CPS-I necesita N-acetilglutamato. Consume 3 ATP equivalentes a 4 enlaces de alta energía.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">5. Destino do carbono\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">5. Destino del carbono\u003c/span>\u003c/div>\u003cp>\u003cspan class=\"pttext\">Glicogênicos produzem piruvato/intermediários do Krebs e podem gerar glicose. Cetogênicos originam acetil-CoA/acetoacetato. Leucina e lisina são exclusivamente cetogênicas; isoleucina, fenilalanina, tirosina, triptofano e treonina são mistas.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Glucogénicos generan piruvato/intermediarios del Krebs y pueden formar glucosa. Cetogénicos originan acetil-CoA/acetoacetato. Leucina y lisina son exclusivamente cetogénicos; isoleucina, fenilalanina, tirosina, triptófano y treonina son mixtos.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Relação clínica\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Relación clínica\u003c/span>\u003c/div>\u003cp>\u003cspan class=\"pttext\">Defeitos do ciclo da ureia causam hiperamonemia, com vômitos, alteração neurológica e encefalopatia. ALT/AST elevadas indicam lesão hepatocelular em muitos contextos, mas não medem isoladamente a função hepática.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Defectos del ciclo de urea causan hiperamonemia, vómitos y encefalopatía. ALT/AST elevadas sugieren daño hepatocelular, pero por sí solas no miden función hepática.\u003c/span>\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"section\" id=\"krebs\">\u003cdiv class=\"container\">\u003cdiv class=\"chapter-title\">🔄 \u003cspan class=\"pttext\">Ciclo de Krebs\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Ciclo de Krebs\u003c/span>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">O que entra e o que sai\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Qué entra y qué sale\u003c/span>\u003c/div>\u003cp>\u003cspan class=\"pttext\">Na matriz mitocondrial (exceto succinato desidrogenase, na membrana interna), acetil-CoA de 2 carbonos se condensa ao oxaloacetato de 4 carbonos. Uma volta regenera oxaloacetato e produz 3 NADH, 1 FADH₂, 1 GTP e 2 CO₂.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">En matriz mitocondrial (salvo succinato deshidrogenasa en membrana interna), acetil-CoA de 2 carbonos se une a oxaloacetato de 4. Cada vuelta regenera oxaloacetato y produce 3 NADH, 1 FADH₂, 1 GTP y 2 CO₂.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Regulação\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Regulación\u003c/span>\u003c/div>\u003cp>\u003cspan class=\"pttext\">As principais etapas regulatórias são citrato sintase, isocitrato desidrogenase e α-cetoglutarato desidrogenase. ATP e NADH elevados tendem a reduzir o fluxo; ADP e Ca²⁺ o estimulam em tecidos relevantes.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Las etapas reguladoras principales son citrato sintasa, isocitrato deshidrogenasa y α-cetoglutarato deshidrogenasa. ATP y NADH altos reducen flujo; ADP y Ca²⁺ lo aumentan en tejidos relevantes.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"unit-banner\">\u003cstrong>\u003cspan class=\"pttext\">Clique em cada reação do ciclo\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Pulse en cada reacción del ciclo\u003c/span>\u003c/strong>\u003c/div>\u003cdiv class=\"krebs-steps\">\u003cbutton class=\"tool-btn\" onclick=\"enzoKrebs(0)\">1. Oxaloacetato + acetil-CoA → Citrato\u003c/button>\u003cbutton class=\"tool-btn\" onclick=\"enzoKrebs(1)\">2. Citrato → Isocitrato\u003c/button>\u003cbutton class=\"tool-btn\" onclick=\"enzoKrebs(2)\">3. Isocitrato → α-Cetoglutarato\u003c/button>\u003cbutton class=\"tool-btn\" onclick=\"enzoKrebs(3)\">4. α-Cetoglutarato → Succinil-CoA\u003c/button>\u003cbutton class=\"tool-btn\" onclick=\"enzoKrebs(4)\">5. Succinil-CoA → Succinato\u003c/button>\u003cbutton class=\"tool-btn\" onclick=\"enzoKrebs(5)\">6. Succinato → Fumarato\u003c/button>\u003cbutton class=\"tool-btn\" onclick=\"enzoKrebs(6)\">7. Fumarato → Malato\u003c/button>\u003cbutton class=\"tool-btn\" onclick=\"enzoKrebs(7)\">8. Malato → Oxaloacetato\u003c/button>\u003c/div>\u003cdiv class=\"info-block success\" id=\"enzoKrebsInfo\">\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"section\" id=\"ox\">\u003cdiv class=\"container\">\u003cdiv class=\"chapter-title\">⚡ \u003cspan class=\"pttext\">Fosforilação oxidativa\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Fosforilación oxidativa\u003c/span>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Conceito e localização\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Concepto y localización\u003c/span>\u003c/div>\u003cp>\u003cspan class=\"pttext\">Na membrana mitocondrial interna, NADH e FADH₂ doam elétrons à cadeia respiratória. O fluxo de elétrons até O₂ bombeia prótons ao espaço intermembrana; o retorno de H⁺ pela ATP sintase sintetiza ATP.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">En membrana mitocondrial interna, NADH y FADH₂ ceden electrones a la cadena respiratoria. El flujo hasta O₂ bombea protones al espacio intermembrana; el retorno de H⁺ por ATP sintasa produce ATP.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Complexos e transportadores\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Complejos y transportadores\u003c/span>\u003c/div>\u003cp>\u003cspan class=\"pttext\">Complexo I recebe NADH e bombeia 4 H⁺; complexo II (succinato desidrogenase) recebe elétrons de FADH₂, mas não bombeia H⁺. Coenzima Q leva elétrons a III (4 H⁺), citocromo c leva a IV (2 H⁺ por par de elétrons), que reduz O₂ a H₂O.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Complejo I recibe NADH y bombea 4 H⁺; complejo II recibe electrones de FADH₂ pero no bombea H⁺. Coenzima Q lleva electrones a III (4 H⁺); citocromo c a IV (2 H⁺ por par), donde O₂ se reduce a H₂O.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Quimiosmose e ATP\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Quimiosmosis y ATP\u003c/span>\u003c/div>\u003cp>\u003cspan class=\"pttext\">A energia da força próton-motriz atravessa o complexo V (ATP sintase). Estimativa integrada: cerca de 2,5 ATP por NADH e 1,5 por FADH₂, dependendo das condições e do transporte de metabólitos. Não se forma ATP diretamente nos complexos I–IV.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">La fuerza protón-motriz impulsa el complejo V (ATP sintasa). Rendimiento aproximado: 2,5 ATP/NADH y 1,5 ATP/FADH₂, según condiciones y transporte. Los complejos I–IV no forman ATP directamente.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Inibidores e desacopladores\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Inhibidores y desacoplantes\u003c/span>\u003c/div>\u003cp>\u003cspan class=\"pttext\">Rotenona inibe I; antimicina A inibe III; cianeto e monóxido de carbono inibem IV; oligomicina bloqueia ATP sintase. Desacopladores dissipam gradiente de H⁺, aumentam produção de calor e reduzem síntese de ATP.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Rotenona inhibe I; antimicina A inhibe III; cianuro y monóxido de carbono inhiben IV; oligomicina bloquea ATP sintasa. Desacoplantes disipan gradiente de H⁺, aumentan calor y reducen ATP.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Integração com o Krebs\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Integración con Krebs\u003c/span>\u003c/div>\u003cp>\u003cspan class=\"pttext\">Cada acetil-CoA que completa o Krebs produz 3 NADH (≈7,5 ATP), 1 FADH₂ (≈1,5 ATP), 1 GTP (≈1 ATP), total aproximado de 10 ATP equivalentes por volta. O ciclo depende indiretamente de O₂ para reoxidar NADH/FADH₂.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Cada acetil-CoA en Krebs produce 3 NADH (≈7,5 ATP), 1 FADH₂ (≈1,5 ATP) y 1 GTP (≈1 ATP): total ≈10 ATP equivalentes. El ciclo depende indirectamente de O₂ para reoxidar NADH/FADH₂.\u003c/span>\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003csection id=\"flashcards\" class=\"section\">\u003cdiv class=\"container\">\n\u003cdiv class=\"chapter-title\">\u003cspan class=\"chap-icon\">🃏\u003c/span>Flashcards de Bioquímica II\u003c/div>\n\u003cdiv class=\"info-block success\">\u003cdiv class=\"label\">124 cartões\u003c/div>\u003ch4>Recuperação ativa com resposta explicada\u003c/h4>\u003cp>Tente responder em voz alta antes de virar o cartão. Filtre por tema para revisar uma aula específica ou embaralhe para treinar integração.\u003c/p>\u003c/div>\n\u003cdiv class=\"study-tools\">\u003clabel for=\"fcFilter\">Tema\u003c/label>\u003cselect id=\"fcFilter\">\u003c/select>\u003clabel for=\"fcSearch\">Buscar\u003c/label>\u003cinput id=\"fcSearch\" type=\"search\" placeholder=\"Ex.: carnitina, ureia, citrato, complexo I...\">\u003cbutton class=\"tool-btn\" type=\"button\" onclick=\"shuffleFlashcards()\">🔀 Embaralhar\u003c/button>\u003cspan class=\"result-note\" id=\"fcVisible\">\u003c/span>\u003c/div>\n\u003cdiv id=\"flashcard-grid\" class=\"flashcard-grid\">\u003c/div>\u003cdiv id=\"fcEmpty\" class=\"empty-state\">Nenhum flashcard corresponde ao filtro.\u003c/div>\n\u003c/div>\u003c/section>\u003csection id=\"quiz\" class=\"section\">\u003cdiv class=\"container\">\n\u003cdiv class=\"chapter-title\">\u003cspan class=\"chap-icon\">📝\u003c/span>Simulado de Bioquímica II\u003c/div>\n\u003cdiv class=\"info-block purple\">\u003cdiv class=\"label\">100 questões\u003c/div>\u003ch4>Perguntas dos slides + aprofundamento didático\u003c/h4>\u003cp>O banco combina múltipla escolha, verdadeiro/falso e questões abertas. Todas têm uma correção explicada como mini-aula.\u003c/p>\u003c/div>\n\u003cdiv class=\"q-stats\">\u003cdiv class=\"sbox c\">\u003cdiv class=\"sv\" id=\"sC\">0\u003c/div>\u003cdiv class=\"sl\">Corretas\u003c/div>\u003c/div>\u003cdiv class=\"sbox w\">\u003cdiv class=\"sv\" id=\"sW\">0\u003c/div>\u003cdiv class=\"sl\">Incorretas\u003c/div>\u003c/div>\u003cdiv class=\"sbox p\">\u003cdiv class=\"sv\" id=\"sP\">100\u003c/div>\u003cdiv class=\"sl\">Pendentes\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"study-tools\">\u003clabel for=\"qCategory\">Tema\u003c/label>\u003cselect id=\"qCategory\">\u003c/select>\u003clabel for=\"qType\">Tipo\u003c/label>\u003cselect id=\"qType\">\u003coption value=\"\">Todos\u003c/option>\u003coption value=\"mc\">Múltipla escolha\u003c/option>\u003coption value=\"tf\">Verdadeiro/Falso\u003c/option>\u003coption value=\"gap\">Completar lacuna\u003c/option>\u003c/select>\u003cspan class=\"result-note\" id=\"qVisible\">\u003c/span>\u003c/div>\n\u003cdiv id=\"quizContainer\">\u003c/div>\u003cdiv id=\"qEmpty\" class=\"empty-state\">Nenhuma questão corresponde ao filtro.\u003c/div>\u003cbutton class=\"reset-btn\" onclick=\"resetQuiz()\">🔄 Reiniciar Simulado\u003c/button>\n\u003c/div>\u003c/section>\n\u003cbutton id=\"scrolltop\" onclick=\"window.scrollTo({top:0,behavior:'smooth'})\" aria-label=\"Voltar ao topo\">↑\u003c/button>\u003ca class=\"back-btn\" href=\"dashboard.html\">← Voltar\u003c/a>\n\u003cfooter>Bioquímica II — P2 · Material educacional · \u003cspan data-flashcard-count>124\u003c/span> flashcards · \u003cspan data-question-count>100\u003c/span> questões com explicação\u003c/footer>\n\u003cscript>\nconst TOPICS=[[\"lip\",\"🫒\",\"Lipídios\",\"Lipídios fornecem cerca de 9 kcal/g, formam membranas e participam da \"],[\"aa\",\"🧬\",\"Metabolismo dos aminoácidos\",\"Aminoácidos não têm reserva especializada. Seu grupo amino deve ser pr\"],[\"krebs\",\"🔄\",\"Ciclo de Krebs\",\"Na matriz mitocondrial (exceto succinato desidrogenase, na membrana in\"],[\"ox\",\"⚡\",\"Fosforilação oxidativa\",\"Na membrana mitocondrial interna, NADH e FADH₂ doam elétrons à cadeia \"]];\nlet FC=[];\nconst QD=[];\nconst canvas=document.getElementById('particles'),ctx=canvas.getContext('2d');let particles=[];\nfunction resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}resize();window.addEventListener('resize',resize);\nfor(let i=0;i\u003c60;i++)particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*2+.5,dx:(Math.random()-.5)*.3,dy:(Math.random()-.5)*.3,alpha:Math.random()*.35+.08,color:Math.random()>.5?'56,232,192':'79,156,249'});\nfunction animParticles(){ctx.clearRect(0,0,canvas.width,canvas.height);particles.forEach(p=>{p.x+=p.dx;p.y+=p.dy;if(p.x\u003c0||p.x>canvas.width)p.dx*=-1;if(p.y\u003c0||p.y>canvas.height)p.dy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(${p.color},${p.alpha})`;ctx.fill();});requestAnimationFrame(animParticles)}animParticles();\n\nfunction showSection(id,btn){document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===id||s.dataset.group===id));document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');window.scrollTo({top:0,behavior:'smooth'});}\nfunction showSectionByName(id){showSection(id,document.querySelector(`nav.tabs button[data-section=\"${id}\"]`));}\nwindow.addEventListener('scroll',()=>{document.getElementById('scrolltop').style.display=window.scrollY>300?'block':'none';});\nconst topicCards=document.getElementById('topicCards');TOPICS.forEach(([id,icon,name,desc])=>{const card=document.createElement('article');card.className='intro-card';card.innerHTML=`\u003cdiv class=\"ic-icon\">${icon}\u003c/div>\u003cdiv class=\"ic-name\">${name}\u003c/div>\u003cdiv class=\"ic-desc\">${desc}\u003c/div>`;card.onclick=()=>showSectionByName(id);topicCards.appendChild(card);});\n\nfunction fillSelect(select,values){select.innerHTML='\u003coption value=\"\">Todos os temas\u003c/option>'+values.map(v=>`\u003coption value=\"${v}\">${v}\u003c/option>`).join('');}\nconst fcFilter=document.getElementById('fcFilter'),fcSearch=document.getElementById('fcSearch');fillSelect(fcFilter,[...new Set(FC.map(x=>x.c))]);\nfunction renderFlashcards(){const grid=document.getElementById('flashcard-grid'),category=fcFilter.value,term=fcSearch.value.trim().toLocaleLowerCase('pt-BR');const shown=FC.filter(x=>(!category||x.c===category)&&(!term||(x.q+' '+x.a).toLocaleLowerCase('pt-BR').includes(term)));grid.innerHTML='';shown.forEach(({c,q,a})=>{const card=document.createElement('article');card.className='flashcard';card.innerHTML=`\u003cdiv class=\"flashcard-inner\">\u003cdiv class=\"flashcard-front\">\u003cdiv class=\"fc-tag\">${c}\u003c/div>\u003cdiv class=\"fc-q\">${q}\u003c/div>\u003cdiv class=\"fc-hint\">clique para virar ↻\u003c/div>\u003c/div>\u003cdiv class=\"flashcard-back\">\u003cdiv class=\"fc-tag\" style=\"color:var(--green)\">Resposta explicada\u003c/div>\u003cdiv class=\"fc-back-text\" style=\"margin-top:8px\">${a}\u003c/div>\u003c/div>\u003c/div>`;card.onclick=()=>card.classList.toggle('flipped');grid.appendChild(card);});document.getElementById('fcVisible').textContent=`${shown.length} de ${FC.length} cartões`;document.getElementById('fcEmpty').style.display=shown.length?'none':'block';}\nfcFilter.addEventListener('change',()=>window.renderFlashcards());fcSearch.addEventListener('input',()=>window.renderFlashcards());function shuffleFlashcards(){for(let i=FC.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[FC[i],FC[j]]=[FC[j],FC[i]];}renderFlashcards();}renderFlashcards();\n\nlet QS={c:0,w:0,a:0};const qCategory=document.getElementById('qCategory'),qType=document.getElementById('qType');fillSelect(qCategory,[...new Set(QD.map(x=>x.c))]);\nfunction renderQuiz(){const ct=document.getElementById('quizContainer');ct.innerHTML='';const tl={mc:'Múltipla Escolha',tf:'V ou F',ab:'Aberta'},tc={mc:'tmc',tf:'ttf',ab:'tab'};QD.forEach((q,i)=>{const d=document.createElement('article');d.className='q-card';d.id='q'+i;d.dataset.category=q.c;d.dataset.type=q.t;let body='';if(q.t==='mc')body=`\u003cdiv class=\"opts\">${q.o.map(o=>`\u003cbutton class=\"opt-btn\" data-l=\"${o.l}\" onclick=\"answerMC(${i},'${o.l}')\">\u003cspan class=\"ol\">${o.l})\u003c/span>\u003cspan>${o.v}\u003c/span>\u003c/button>`).join('')}\u003c/div>`;else if(q.t==='tf')body=`\u003cdiv class=\"tf-opts\">\u003cbutton class=\"tf-btn\" data-v=\"V\" onclick=\"answerTF(${i},'V')\">✅ VERDADEIRO\u003c/button>\u003cbutton class=\"tf-btn\" data-v=\"F\" onclick=\"answerTF(${i},'F')\">❌ FALSO\u003c/button>\u003c/div>`;else body=`\u003cbutton class=\"open-btn\" id=\"ob${i}\" onclick=\"revealOpen(${i})\">💡 Ver resposta explicada\u003c/button>`;d.innerHTML=`\u003cdiv class=\"q-head\">\u003cspan class=\"q-num\">Questão ${q.n}\u003c/span>\u003cdiv style=\"display:flex;gap:.4rem;flex-wrap:wrap\">\u003cspan class=\"q-tbadge ${tc[q.t]}\">${tl[q.t]}\u003c/span>\u003cspan class=\"ctag\">${q.c}\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"res-ind\" id=\"ri${i}\">\u003c/div>\u003cp class=\"q-text\">${q.q}\u003c/p>${body}\u003cdiv class=\"exp-box\" id=\"ex${i}\">\u003cdiv class=\"et\">📖 Explicação do professor\u003c/div>\u003cp>${q.ex.replace(/\\n/g,'\u003cbr>')}\u003c/p>\u003c/div>`;ct.appendChild(d);});updateScores();filterQuiz();}\nfunction answerMC(i,ch){const q=QD[i],card=document.getElementById('q'+i);if(card.classList.contains('ans'))return;card.querySelectorAll('.opt-btn').forEach(b=>{b.disabled=true;if(b.dataset.l===q.cr)b.classList.add('ca');if(b.dataset.l===ch&&ch!==q.cr)b.classList.add('wa')});const ok=ch===q.cr;card.classList.add('ans',ok?'cq':'wq');const ri=document.getElementById('ri'+i);ri.className=`res-ind vis ${ok?'c':'w'}`;ri.innerHTML=ok?'✅ Correto!':`❌ Incorreto. Resposta: ${q.cr}`;document.getElementById('ex'+i).classList.add('vis');ok?QS.c++:QS.w++;QS.a++;updateScores();}\nfunction answerTF(i,ch){const q=QD[i],card=document.getElementById('q'+i);if(card.classList.contains('ans'))return;card.querySelectorAll('.tf-btn').forEach(b=>{b.disabled=true;if(b.dataset.v===q.cr)b.classList.add('ca');if(b.dataset.v===ch&&ch!==q.cr)b.classList.add('wa')});const ok=ch===q.cr;card.classList.add('ans',ok?'cq':'wq');const ri=document.getElementById('ri'+i);ri.className=`res-ind vis ${ok?'c':'w'}`;ri.innerHTML=ok?'✅ Correto!':`❌ Incorreto. Resposta: ${q.cr==='V'?'VERDADEIRO':'FALSO'}`;document.getElementById('ex'+i).classList.add('vis');ok?QS.c++:QS.w++;QS.a++;updateScores();}\nfunction revealOpen(i){const card=document.getElementById('q'+i);if(card.classList.contains('ans'))return;card.classList.add('ans');document.getElementById('ob'+i).style.display='none';document.getElementById('ex'+i).classList.add('vis');QS.a++;updateScores();}\nfunction updateScores(){document.getElementById('sC').textContent=QS.c;document.getElementById('sW').textContent=QS.w;document.getElementById('sP').textContent=QD.length-QS.a;}\nfunction filterQuiz(){const category=qCategory.value,type=qType.value;let count=0;document.querySelectorAll('#quizContainer .q-card').forEach(card=>{const show=(!category||card.dataset.category===category)&&(!type||card.dataset.type===type);card.style.display=show?'block':'none';if(show)count++;});document.getElementById('qVisible').textContent=`${count} de ${QD.length} questões${(category||type)?' · filtro ativo':''} `;document.getElementById('qEmpty').style.display=count?'none':'block';}\nqCategory.addEventListener('change',filterQuiz);qType.addEventListener('change',filterQuiz);function resetQuiz(){QS={c:0,w:0,a:0};renderQuiz();}renderQuiz();\n\u003c/script>\u003cscript src=\"study-timer.js\">\u003c/script>\u003cscript src=\"study-progress.js\">\u003c/script>\u003cscript src=\"enzo-ia.js\">\u003c/script>\n\u003cscript>\n/* Marca-texto persistente — módulo reutilizável dos Resumos do Enzo. */\n(()=>{\n  'use strict';\n  const TARGET_SELECTOR=[\n    '.section p','.section li','.section td','.section th',\n    '.section h1','.section h2','.section h3','.section h4','.section h5','.section h6',\n    '.section blockquote','.section .fc-q','.section .fc-back-text'\n  ].join(',');\n  const STORAGE_KEY=`enzo-highlights:v1:${\"bioquimica_2_final_p2\"}`;\n  const COLORS=['yellow','green','red'];\n  let records=loadRecords();\n  let history=[];\n  let mode=null;\n  let color='yellow';\n  let erasing=false;\n  let eraseSnapshot=null;\n  let eraseChanged=false;\n  let observer=null;\n  let toastTimer=null;\n\n  const toolbar=document.createElement('aside');\n  toolbar.id='enzo-highlighter';\n  toolbar.setAttribute('aria-label','Ferramenta de marca-texto');\n  toolbar.innerHTML=`\n    \u003cbutton class=\"enzo-hl-toggle\" type=\"button\" aria-expanded=\"false\" title=\"Abrir marca-texto\">\n      \u003cspan aria-hidden=\"true\">🖍️\u003c/span>\u003cspan>Grifar\u003c/span>\u003cspan class=\"enzo-hl-count\" aria-label=\"Trechos grifados\">0\u003c/span>\n    \u003c/button>\n    \u003cdiv class=\"enzo-hl-panel\" role=\"toolbar\" aria-label=\"Cores e ferramentas\">\n      \u003cbutton class=\"enzo-hl-color active\" type=\"button\" data-color=\"yellow\" aria-label=\"Grifar em amarelo\" title=\"Amarelo\">Amarelo\u003c/button>\n      \u003cbutton class=\"enzo-hl-color\" type=\"button\" data-color=\"green\" aria-label=\"Grifar em verde\" title=\"Verde\">Verde\u003c/button>\n      \u003cbutton class=\"enzo-hl-color\" type=\"button\" data-color=\"red\" aria-label=\"Grifar em vermelho\" title=\"Vermelho\">Vermelho\u003c/button>\n      \u003cspan class=\"enzo-hl-divider\" aria-hidden=\"true\">\u003c/span>\n      \u003cbutton class=\"enzo-hl-tool enzo-hl-eraser\" type=\"button\" aria-label=\"Ativar borracha\" title=\"Borracha: arraste sobre as palavras\">🧽\u003c/button>\n      \u003cbutton class=\"enzo-hl-tool enzo-hl-undo\" type=\"button\" aria-label=\"Desfazer última ação\" title=\"Desfazer\" disabled>↶\u003c/button>\n    \u003c/div>`;\n  const toast=document.createElement('div');\n  toast.className='enzo-hl-toast';\n  toast.setAttribute('role','status');\n  toast.setAttribute('aria-live','polite');\n  document.body.append(toolbar,toast);\n\n  const toggle=toolbar.querySelector('.enzo-hl-toggle');\n  const countBadge=toolbar.querySelector('.enzo-hl-count');\n  const undoButton=toolbar.querySelector('.enzo-hl-undo');\n  const eraserButton=toolbar.querySelector('.enzo-hl-eraser');\n  const colorButtons=[...toolbar.querySelectorAll('.enzo-hl-color')];\n\n  function loadRecords(){\n    try{\n      const parsed=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');\n      return Array.isArray(parsed)?parsed.filter(r=>r&&r.id&&r.key&&Number.isFinite(r.start)&&Number.isFinite(r.end)&&COLORS.includes(r.color)):[];\n    }catch(_){return[]}\n  }\n  function saveRecords(){\n    try{localStora
