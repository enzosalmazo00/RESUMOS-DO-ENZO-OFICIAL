\">\u003ctable class=\"compare-table\">\u003cthead>\u003ctr>\u003cth>Tipo\u003c/th>\u003cth>Mecanismo predominante\u003c/th>\u003cth>Pistas\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>DM1\u003c/td>\u003ctd>Destruição autoimune de células β → deficiência absoluta de insulina.\u003c/td>\u003ctd>Pode ocorrer em qualquer idade; tendência à cetose; insulina é indispensável.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>DM2\u003c/td>\u003ctd>Resistência à insulina + falência progressiva da célula β.\u003c/td>\u003ctd>Associado a genética, adiposidade visceral, sedentarismo e idade, mas também ocorre em jovens.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Gestacional\u003c/td>\u003ctd>Resistência à insulina do segundo/terceiro trimestre excede capacidade β.\u003c/td>\u003ctd>Aumenta riscos materno-fetais e risco futuro de DM2.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Outros\u003c/td>\u003ctd>Monogênico, pancreático, endocrinopatias, fármacos etc.\u003c/td>\u003ctd>Idade atípica, história familiar forte ou contexto específico.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"table-wrap\">\u003ctable class=\"compare-table\">\u003cthead>\u003ctr>\u003cth>Teste\u003c/th>\u003cth>Normal/prediabetes\u003c/th>\u003cth>Diabetes — critério diagnóstico\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Glicemia plasmática de jejum\u003c/td>\u003ctd>Normal \u003c100 mg/dL; prediabetes 100–125\u003c/td>\u003ctd>≥126 mg/dL após ≥8 h de jejum.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TOTG 75 g — 2 horas\u003c/td>\u003ctd>Normal \u003c140; prediabetes 140–199\u003c/td>\u003ctd>≥200 mg/dL.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>HbA1c\u003c/td>\u003ctd>Normal \u003c5,7%; prediabetes 5,7–6,4%\u003c/td>\u003ctd>≥6,5% por método padronizado.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Glicemia casual\u003c/td>\u003ctd>—\u003c/td>\u003ctd>≥200 mg/dL com sintomas clássicos ou crise hiperglicêmica.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003carticle class=\"info-block warn\">\u003cdiv class=\"label\">Confirmação\u003c/div>\u003ch4>Um número isolado nem sempre fecha o diagnóstico\u003c/h4>\u003cp>Sem hiperglicemia inequívoca, o resultado deve ser confirmado por repetição ou por outro teste anormal. HbA1c pode ser inadequada quando a sobrevida das hemácias está alterada, em hemoglobinopatias, gestação ou transfusão recente.\u003c/p>\u003c/article>\u003cdiv class=\"table-wrap\">\u003ctable class=\"compare-table\">\u003cthead>\u003ctr>\u003cth>Achado clínico\u003c/th>\u003cth>Mecanismo\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Poliúria\u003c/td>\u003ctd>Glicosúria causa diurese osmótica.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Polidipsia\u003c/td>\u003ctd>Perda de água e hiperosmolalidade estimulam sede.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Polifagia\u003c/td>\u003ctd>Células não utilizam combustível adequadamente apesar da hiperglicemia.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Perda de peso\u003c/td>\u003ctd>Glicosúria + lipólise + proteólise, especialmente no DM1.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Visão turva\u003c/td>\u003ctd>Mudanças osmóticas no cristalino e/ou complicações microvasculares.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Infecções recorrentes\u003c/td>\u003ctd>Hiperglicemia prejudica defesa e favorece crescimento microbiano.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003carticle class=\"info-block danger\">\u003cdiv class=\"label\">Complicações\u003c/div>\u003ch4>Por que controlar?\u003c/h4>\u003cul>\u003cli>Microvasculares: retinopatia, nefropatia e neuropatia.\u003c/li>\u003cli>Macrovasculares: doença coronariana, cerebrovascular e arterial periférica.\u003c/li>\u003cli>Agudas: cetoacidose diabética, estado hiperosmolar e hipoglicemia relacionada ao tratamento.\u003c/li>\u003c/ul>\u003c/article>\u003c/div>\u003c/section>\u003csection id=\"hipoglicemia\" class=\"section\" data-group=\"insulina\">\u003cdiv class=\"container\">\u003cdiv class=\"chapter-title\">\u003cspan class=\"chap-icon\">⚠️\u003c/span>Hipoglicemia: reconhecer e agir com segurança\u003c/div>\u003cp class=\"section-lead\">Hipoglicemia é especialmente relevante em pessoas que usam insulina ou secretagogos. Sintomas autonômicos funcionam como alarme; neuroglicopenia indica falta de glicose no cérebro.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable class=\"compare-table\">\u003cthead>\u003ctr>\u003cth>Nível\u003c/th>\u003cth>Definição prática\u003c/th>\u003cth>Conduta conceitual\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Glicose \u003c70 e ≥54 mg/dL\u003c/td>\u003ctd>Pessoa consciente: carboidrato de ação rápida e reavaliação.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Glicose \u003c54 mg/dL\u003c/td>\u003ctd>Clinicamente importante; tratar imediatamente e revisar causa.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Alteração mental/física que exige ajuda, independentemente do número\u003c/td>\u003ctd>Emergência: glucagon ou glicose IV conforme ambiente; proteger via aérea.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"table-wrap\">\u003ctable class=\"compare-table\">\u003cthead>\u003ctr>\u003cth>Grupo de sintomas\u003c/th>\u003cth>Exemplos\u003c/th>\u003cth>Mecanismo\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Autonômicos adrenérgicos\u003c/td>\u003ctd>Tremor, palpitação, ansiedade\u003c/td>\u003ctd>Catecolaminas.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Autonômicos colinérgicos\u003c/td>\u003ctd>Sudorese, fome, parestesia\u003c/td>\u003ctd>Acetilcolina autonômica.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Neuroglicopênicos\u003c/td>\u003ctd>Confusão, visão turva, comportamento estranho, convulsão, coma\u003c/td>\u003ctd>Oferta insuficiente de glicose cerebral.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003carticle class=\"info-block success\">\u003cdiv class=\"label\">Regra 15–15\u003c/div>\u003ch4>Se estiver acordado e puder engolir\u003c/h4>\u003cp>Administrar cerca de \u003cstrong>15 g de carboidrato de ação rápida\u003c/strong>, aguardar 15 minutos e medir novamente; repetir se continuar baixa. Depois, identificar a causa e considerar lanche/refeição conforme o contexto.\u003c/p>\u003c/article>\u003carticle class=\"info-block danger\">\u003cdiv class=\"label\">Nunca por via oral\u003c/div>\u003ch4>Pessoa inconsciente ou incapaz de engolir\u003c/h4>\u003cp>Não oferecer líquidos, mel ou alimentos pela boca por risco de aspiração. Usar glucagon disponível conforme treinamento/prescrição e acionar emergência. Em ambiente de saúde, glicose intravenosa é opção de ação imediata.\u003c/p>\u003c/article>\u003carticle class=\"info-block warn\">\u003cdiv class=\"label\">Causas comuns\u003c/div>\u003ch4>Por que aconteceu?\u003c/h4>\u003cul>\u003cli>Dose excessiva ou troca do tipo de insulina; refeição atrasada ou menos carboidrato.\u003c/li>\u003cli>Exercício não planejado, álcool, insuficiência renal/hepática ou perda de peso sem ajuste.\u003c/li>\u003cli>Aplicação intramuscular acidental e aumento de absorção por calor/exercício local podem contribuir.\u003c/li>\u003c/ul>\u003c/article>\u003c/div>\u003c/section>\u003csection id=\"glucagon\" class=\"section\" data-group=\"glucagon\">\u003cdiv class=\"container\">\u003cdiv class=\"chapter-title\">\u003cspan class=\"chap-icon\">📈\u003c/span>Glucagon: biossíntese, receptor e efeitos\u003c/div>\u003cp class=\"section-lead\">Glucagon é uma hormona peptídica de 29 aminoácidos secretada pelas células α pancreáticas. Seu alvo metabólico principal é o fígado, onde aumenta a produção de glicose no jejum.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable class=\"compare-table\">\u003cthead>\u003ctr>\u003cth>Etapa\u003c/th>\u003cth>O que ocorre\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Pré-pró-glucagon\u003c/td>\u003ctd>Peptídeo precursor com sequência sinal.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pró-glucagon\u003c/td>\u003ctd>Processamento específico do tecido determina os peptídeos finais.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Célula α pancreática\u003c/td>\u003ctd>Pró-hormônio-convertase 2 produz principalmente glucagon.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Células L intestinais\u003c/td>\u003ctd>Processamento por PC1/3 produz GLP-1, GLP-2, oxintomodulina e outros peptídeos.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Glucagon maduro\u003c/td>\u003ctd>29 aminoácidos, cadeia única, massa aproximada de 3,5 kDa; armazenado em grânulos.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"pathway\">\u003cdiv class=\"path-node\">\u003cstrong>Glucagon\u003c/strong>\u003csmall>receptor hepático Gs\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>Adenilato-ciclase\u003c/strong>\u003csmall>cAMP ↑\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>PKA\u003c/strong>\u003csmall>fosforila alvos\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>Produção hepática de glicose\u003c/strong>\u003csmall>glicogenólise + gliconeogênese\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"table-wrap\">\u003ctable class=\"compare-table\">\u003cthead>\u003ctr>\u003cth>Via/tecido\u003c/th>\u003cth>Efeito do glucagon\u003c/th>\u003cth>Explicação\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Glicogênio hepático\u003c/td>\u003ctd>↑ glicogenólise; ↓ glicogênese\u003c/td>\u003ctd>Ativa fosforilase e inibe glicogênio-sintase por fosforilação.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Glicólise hepática\u003c/td>\u003ctd>↓ glicólise; ↑ gliconeogênese\u003c/td>\u003ctd>Reduz F2,6BP e inibe piruvato-quinase hepática.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Aminoácidos\u003c/td>\u003ctd>↑ captação hepática e ureogênese\u003c/td>\u003ctd>Aminoácidos alimentam gliconeogênese; refeição proteica também estimula insulina.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Lipídios/cetonas\u003c/td>\u003ctd>Favorece oxidação hepática e cetogênese no contexto de baixa insulina\u003c/td>\u003ctd>A lipólise adiposa humana é regulada fortemente por catecolaminas e baixa insulina; efeito direto do glucagon é limitado.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Músculo esquelético\u003c/td>\u003ctd>Pouco efeito direto\u003c/td>\u003ctd>Músculo praticamente não expressa receptor funcional relevante de glucagon.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003carticle class=\"info-block success\">\u003cdiv class=\"label\">Frase-chave\u003c/div>\u003ch4>Glucagon protege a glicemia no jejum\u003c/h4>\u003cp>No início do jejum, mobiliza glicogênio hepático. À medida que o glicogênio cai, sustenta gliconeogênese a partir de lactato, alanina, glicerol e outros precursores.\u003c/p>\u003c/article>\u003carticle class=\"info-block warn\">\u003cdiv class=\"label\">Armadilha\u003c/div>\u003ch4>Glucagon não é “adrenalina pancreática”\u003c/h4>\u003cp>Ambos elevam glicose, mas adrenalina age rapidamente em fígado e músculo durante estresse/exercício; glucagon é sobretudo hepático e integrado ao jejum.\u003c/p>\u003c/article>\u003c/div>\u003c/section>\u003csection id=\"glucagon_clinico\" class=\"section\" data-group=\"glucagon\">\u003cdiv class=\"container\">\u003cdiv class=\"chapter-title\">\u003cspan class=\"chap-icon\">💉\u003c/span>Regulação e aplicações clínicas do glucagon\u003c/div>\u003cp class=\"section-lead\">A secreção de glucagon integra glicose, aminoácidos, sistema autonômico e hormonas paracrinas das ilhotas. Na farmacologia, sua ação via cAMP permite aplicações além do metabolismo cotidiano.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable class=\"compare-table\">\u003cthead>\u003ctr>\u003cth>Estimula secreção\u003c/th>\u003cth>Inibe secreção\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Hipoglicemia; aminoácidos, especialmente arginina/alanina; estímulo simpático β; exercício\u003c/td>\u003ctd>Hiperglicemia; insulina e zinco das células β; somatostatina; GLP-1\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003carticle class=\"info-block purple\">\u003cdiv class=\"label\">Por que proteína estimula glucagon?\u003c/div>\u003ch4>Evitar hipoglicemia após refeição proteica\u003c/h4>\u003cp>Aminoácidos também estimulam insulina. Sem glucagon, a insulina poderia reduzir excessivamente a glicose; glucagon preserva produção hepática enquanto os aminoácidos entram nos tecidos.\u003c/p>\u003c/article>\u003cdiv class=\"table-wrap\">\u003ctable class=\"compare-table\">\u003cthead>\u003ctr>\u003cth>Uso\u003c/th>\u003cth>Mecanismo/princípio\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Hipoglicemia grave\u003c/td>\u003ctd>Mobiliza glicogênio hepático e aumenta gliconeogênese; disponível em formulações injetáveis e intranasais.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Relaxamento gastrointestinal\u003c/td>\u003ctd>Reduz motilidade para determinados exames/procedimentos.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Intoxicação por β-bloqueador\u003c/td>\u003ctd>Eleva cAMP cardíaco independentemente do receptor β; efeito inotrópico e cronotrópico. Evidência clínica é limitada e integra protocolo toxicológico.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003carticle class=\"info-block warn\">\u003cdiv class=\"label\">Limitação\u003c/div>\u003ch4>Glucagon precisa de reserva hepática\u003c/h4>\u003cp>Pode responder pior em jejum prolongado, desnutrição, doença hepática grave ou consumo importante de álcool, situações em que o glicogênio está reduzido. Glicose intravenosa pode ser necessária.\u003c/p>\u003c/article>\u003carticle class=\"info-block danger\">\u003cdiv class=\"label\">Valores plasmáticos\u003c/div>\u003ch4>Não decore 50–100 pg/mL como universal\u003c/h4>\u003cp>Faixas variam muito com método, coleta, estado alimentar e laboratório. A interpretação é contextual; o valor isolado raramente é a principal ferramenta clínica.\u003c/p>\u003c/article>\u003carticle class=\"info-block \">\u003cdiv class=\"label\">Secretina e somatostatina\u003c/div>\u003ch4>Não confunda as funções\u003c/h4>\u003cul>\u003cli>\u003cstrong>Secretina:\u003c/strong> produzida por células S duodenais; estimula bicarbonato pancreático e biliar. Pode modular glucagon, mas não é seu principal regulador fisiológico.\u003c/li>\u003cli>\u003cstrong>Somatostatina:\u003c/strong> produzida por células δ pancreáticas e outros tecidos; inibe tanto insulina quanto glucagon e reduz secreções/motilidade gastrointestinais.\u003c/li>\u003c/ul>\u003c/article>\u003c/div>\u003c/section>\u003csection id=\"integracao\" class=\"section\" data-group=\"glucagon\">\u003cdiv class=\"container\">\u003cdiv class=\"chapter-title\">\u003cspan class=\"chap-icon\">🧭\u003c/span>Integração metabólica: alimentado, jejum e exercício\u003c/div>\u003cp class=\"section-lead\">As vias nunca funcionam isoladamente. A relação insulina/glucagon, a carga energética e o tecido determinam qual fluxo prevalece.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable class=\"compare-table\">\u003cthead>\u003ctr>\u003cth>Estado\u003c/th>\u003cth>Hormonas dominantes\u003c/th>\u003cth>Fígado\u003c/th>\u003cth>Músculo/adiposo\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Após refeição rica em carboidrato\u003c/td>\u003ctd>Insulina ↑; glucagon ↓\u003c/td>\u003ctd>Glicólise, glicogênese, pentoses e lipogênese.\u003c/td>\u003ctd>GLUT4, glicogênio muscular, síntese proteica e TAG adiposo.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Jejum noturno\u003c/td>\u003ctd>Insulina ↓; glucagon ↑\u003c/td>\u003ctd>Primeiro glicogenólise; gliconeogênese cresce.\u003c/td>\u003ctd>Adiposo libera ácidos graxos; músculo reduz captação de glicose.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Jejum prolongado\u003c/td>\u003ctd>Glucagon/catecolaminas; insulina baixa\u003c/td>\u003ctd>Gliconeogênese + cetogênese; rim participa.\u003c/td>\u003ctd>Lipólise; cérebro usa mais cetonas e poupa proteína.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Exercício intenso\u003c/td>\u003ctd>Adrenalina, Ca²⁺, AMP; insulina relativa ↓\u003c/td>\u003ctd>Produção de glicose para circulação.\u003c/td>\u003ctd>Glicogenólise/glicólise; lactato pode entrar no Cori.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Exercício moderado prolongado\u003c/td>\u003ctd>Catecolaminas e baixa insulina\u003c/td>\u003ctd>Glicogenólise/gliconeogênese.\u003c/td>\u003ctd>Oxidação de glicose, glicogênio, ácidos graxos e lactato.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003carticle class=\"info-block success\">\u003cdiv class=\"label\">Mapa mental\u003c/div>\u003ch4>A pergunta que resolve a maioria das provas\u003c/h4>\u003cp>\u003cstrong>Qual tecido? Qual estado hormonal? Precisa de ATP, armazenar carbono, produzir NADPH ou manter glicemia?\u003c/strong> A mesma molécula — G6P — terá destinos diferentes conforme essas respostas.\u003c/p>\u003c/article>\u003cdiv class=\"table-wrap\">\u003ctable class=\"compare-table\">\u003cthead>\u003ctr>\u003cth>Enzima\u003c/th>\u003cth>Insulina\u003c/th>\u003cth>Glucagon/adrenalina\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Glicogênio-sintase\u003c/td>\u003ctd>Ativa por desfosforilação\u003c/td>\u003ctd>Inibida por fosforilação.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Glicogênio-fosforilase\u003c/td>\u003ctd>Inibida por desfosforilação\u003c/td>\u003ctd>Ativada por fosforilação.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PFK-2/FBPase-2 hepática\u003c/td>\u003ctd>F2,6BP ↑ → PFK-1 ↑ → glicólise\u003c/td>\u003ctd>F2,6BP ↓ → FBPase-1 ↑ → gliconeogênese.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Piruvato-quinase hepática\u003c/td>\u003ctd>Ativa desfosforilada\u003c/td>\u003ctd>Inibida por PKA.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\u003c/section>\u003csection id=\"pistas\" class=\"section\" data-group=\"carboidratos\">\u003cdiv class=\"container\">\u003cdiv class=\"chapter-title\">\u003cspan class=\"chap-icon\">🔑\u003c/span>Pistas de prova e armadilhas clássicas\u003c/div>\u003cp class=\"section-lead\">Use palavras-chave para levantar a hipótese, mas confirme sempre o tecido, a enzima, o cofator e o sentido da reação.\u003c/p>\u003cdiv class=\"clue-grid\">\u003carticle class=\"clue-card\">\u003cspan>QUANDO VIR\u003c/span>\u003cstrong>Hemácia + ATP\u003c/strong>\u003cem>→ pense em\u003c/em>\u003ch4>Glicólise anaeróbica\u003c/h4>\u003cp>Sem mitocôndria: ATP vem da fosforilação em nível de substrato.\u003c/p>\u003c/article>\u003carticle class=\"clue-card\">\u003cspan>QUANDO VIR\u003c/span>\u003cstrong>GLUT4\u003c/strong>\u003cem>→ pense em\u003c/em>\u003ch4>Músculo e adipócito\u003c/h4>\u003cp>Insulina ou exercício promove translocação.\u003c/p>\u003c/article>\u003carticle class=\"clue-card\">\u003cspan>QUANDO VIR\u003c/span>\u003cstrong>SGLT1\u003c/strong>\u003cem>→ pense em\u003c/em>\u003ch4>Glicose/galactose + Na⁺\u003c/h4>\u003cp>Absorção apical intestinal por transporte ativo secundário.\u003c/p>\u003c/article>\u003carticle class=\"clue-card\">\u003cspan>QUANDO VIR\u003c/span>\u003cstrong>GLUT5\u003c/strong>\u003cem>→ pense em\u003c/em>\u003ch4>Frutose\u003c/h4>\u003cp>Transportador apical por difusão facilitada.\u003c/p>\u003c/article>\u003carticle class=\"clue-card\">\u003cspan>QUANDO VIR\u003c/span>\u003cstrong>PFK-1\u003c/strong>\u003cem>→ pense em\u003c/em>\u003ch4>Passo comprometedor da glicólise\u003c/h4>\u003cp>AMP e F2,6BP ativam; ATP e citrato inibem.\u003c/p>\u003c/article>\u003carticle class=\"clue-card\">\u003cspan>QUANDO VIR\u003c/span>\u003cstrong>1 e 3 gastam; 7 e 10 produzem\u003c/strong>\u003cem>→ pense em\u003c/em>\u003ch4>ATP na glicólise\u003c/h4>\u003cp>As reações de ganho ocorrem duas vezes por glicose.\u003c/p>\u003c/article>\u003carticle class=\"clue-card\">\u003cspan>QUANDO VIR\u003c/span>\u003cstrong>Piruvato + NADH\u003c/strong>\u003cem>→ pense em\u003c/em>\u003ch4>Lactato + NAD⁺\u003c/h4>\u003cp>LDH regenera NAD⁺; não usa NADPH.\u003c/p>\u003c/article>\u003carticle class=\"clue-card\">\u003cspan>QUANDO VIR\u003c/span>\u003cstrong>Acetaldeído\u003c/strong>\u003cem>→ pense em\u003c/em>\u003ch4>Fermentação alcoólica\u003c/h4>\u003cp>Intermediário entre piruvato e etanol em levedura.\u003c/p>\u003c/article>\u003carticle class=\"clue-card\">\u003cspan>QUANDO VIR\u003c/span>\u003cstrong>Glicogenina\u003c/strong>\u003cem>→ pense em\u003c/em>\u003ch4>Primer do glicogênio\u003c/h4>\u003cp>Autoglicosila-se; sintase não inicia do zero.\u003c/p>\u003c/article>\u003carticle class=\"clue-card\">\u003cspan>QUANDO VIR\u003c/span>\u003cstrong>α-1,4\u003c/strong>\u003cem>→ pense em\u003c/em>\u003ch4>Cadeia do glicogênio\u003c/h4>\u003cp>Sintase forma; fosforilase rompe.\u003c/p>\u003c/article>\u003carticle class=\"clue-card\">\u003cspan>QUANDO VIR\u003c/span>\u003cstrong>α-1,6\u003c/strong>\u003cem>→ pense em\u003c/em>\u003ch4>Ramificação\u003c/h4>\u003cp>Ramificadora cria; desramificadora resolve.\u003c/p>\u003c/article>\u003carticle class=\"clue-card\">\u003cspan>QUANDO VIR\u003c/span>\u003cstrong>Músculo não libera glicose\u003c/strong>\u003cem>→ pense em\u003c/em>\u003ch4>Sem glicose-6-fosfatase\u003c/h4>\u003cp>G6P muscular entra na glicólise.\u003c/p>\u003c/article>\u003carticle class=\"clue-card\">\u003cspan>QUANDO VIR\u003c/span>\u003cstrong>Hipoglicemia + hepatomegalia + lactato ↑\u003c/strong>\u003cem>→ pense em\u003c/em>\u003ch4>Von Gierke\u003c/h4>\u003cp>Defeito do sistema glicose-6-fosfatase.\u003c/p>\u003c/article>\u003carticle class=\"clue-card\">\u003cspan>QUANDO VIR\u003c/span>\u003cstrong>NADPH + ribose-5-P\u003c/strong>\u003cem>→ pense em\u003c/em>\u003ch4>Via das pentoses\u003c/h4>\u003cp>Ocorre no citosol e não produz ATP.\u003c/p>\u003c/article>\u003carticle class=\"clue-card\">\u003cspan>QUANDO VIR\u003c/span>\u003cstrong>Transcetolase\u003c/strong>\u003cem>→ pense em\u003c/em>\u003ch4>TPP — vitamina B1\u003c/h4>\u003cp>Transfere unidades de 2 carbonos.\u003c/p>\u003c/article>\u003carticle class=\"clue-card\">\u003cspan>QUANDO VIR\u003c/span>\u003cstrong>Fava + icterícia + urina escura\u003c/strong>\u003cem>→ pense em\u003c/em>\u003ch4>Deficiência de G6PD\u003c/h4>\u003cp>Estresse oxidativo causa hemólise.\u003c/p>\u003c/article>\u003carticle class=\"clue-card\">\u003cspan>QUANDO VIR\u003c/span>\u003cstrong>Corpúsculos de Heinz + bite cells\u003c/strong>\u003cem>→ pense em\u003c/em>\u003ch4>Lesão oxidativa da hemoglobina\u003c/h4>\u003cp>Pista clássica de G6PD.\u003c/p>\u003c/article>\u003carticle class=\"clue-card\">\u003cspan>QUANDO VIR\u003c/span>\u003cstrong>Músculo/hemácia → lactato → fígado\u003c/strong>\u003cem>→ pense em\u003c/em>\u003ch4>Ciclo de Cori\u003c/h4>\u003cp>Fígado gasta 6 equivalentes; periferia ganha 2 ATP.\u003c/p>\u003c/article>\u003carticle class=\"clue-card\">\u003cspan>QUANDO VIR\u003c/span>\u003cstrong>Insulina + receptor tirosina-quinase\u003c/strong>\u003cem>→ pense em\u003c/em>\u003ch4>PI3K–Akt\u003c/h4>\u003cp>GLUT4, glicogênio, lipídios e proteína aumentam.\u003c/p>\u003c/article>\u003carticle class=\"clue-card\">\u003cspan>QUANDO VIR\u003c/span>\u003cstrong>Insulina e peptídeo C equimolares\u003c/strong>\u003cem>→ pense em\u003c/em>\u003ch4>Secreção endógena\u003c/h4>\u003cp>Insulina exógena não vem acompanhada de peptídeo C.\u003c/p>\u003c/article>\u003carticle class=\"clue-card\">\u003cspan>QUANDO VIR\u003c/span>\u003cstrong>Poliúria + polidipsia + polifagia + perda de peso\u003c/strong>\u003cem>→ pense em\u003c/em>\u003ch4>Diabetes mellitus\u003c/h4>\u003cp>As “4 P” refletem glicosúria e catabolismo.\u003c/p>\u003c/article>\u003carticle class=\"clue-card\">\u003cspan>QUANDO VIR\u003c/span>\u003cstrong>Glicemia \u003c70 mg/dL\u003c/strong>\u003cem>→ pense em\u003c/em>\u003ch4>Hipoglicemia nível 1\u003c/h4>\u003cp>Se consciente: regra 15–15.\u003c/p>\u003c/article>\u003carticle class=\"clue-card\">\u003cspan>QUANDO VIR\u003c/span>\u003cstrong>Inconsciente e não deglute\u003c/strong>\u003cem>→ pense em\u003c/em>\u003ch4>Glucagon/resgate e emergência\u003c/h4>\u003cp>Nunca oferecer alimento ou líquido por via oral.\u003c/p>\u003c/article>\u003carticle class=\"clue-card\">\u003cspan>QUANDO VIR\u003c/span>\u003cstrong>Glucagon + Gs/cAMP/PKA\u003c/strong>\u003cem>→ pense em\u003c/em>\u003ch4>Produção hepática de glicose\u003c/h4>\u003cp>Glicogenólise e gliconeogênese aumentam.\u003c/p>\u003c/article>\u003carticle class=\"clue-card\">\u003cspan>QUANDO VIR\u003c/span>\u003cstrong>Refeição proteica\u003c/strong>\u003cem>→ pense em\u003c/em>\u003ch4>Insulina + glucagon\u003c/h4>\u003cp>Capta aminoácidos sem causar queda excessiva de glicose.\u003c/p>\u003c/article>\u003c/div>\u003c/div>\u003c/section>\u003csection id=\"antibioticos\" class=\"section\">\u003cdiv class=\"container\">\n\u003cdiv class=\"sequence-badge\">ESTRUTURA BACTERIANA → PROCESSO METABÓLICO → EFEITO DO ANTIBIÓTICO\u003c/div>\n\u003cdiv class=\"chapter-title\">\u003cspan class=\"chap-icon\">🦠\u003c/span>Antibióticos do ponto de vista bioquímico\u003c/div>\n\u003cp class=\"section-lead\">Para entender a ação de um antibiótico, primeiro precisamos localizar onde a bactéria produz energia, constrói suas moléculas e mantém sua estrutura. Depois, identificamos qual processo é interrompido e qual consequência funcional aparece — inclusive as consequências que recaem sobre o próprio hospedeiro humano.\u003c/p>\n\n\u003ch3 class=\"subsection-title\">1. O princípio da seletividade metabólica\u003c/h3>\n\u003cp>Antibióticos funcionam porque exploram diferenças bioquímicas e estruturais entre a célula bacteriana e a célula humana. A ideia central é a \u003cstrong>toxicidade seletiva\u003c/strong>: o fármaco deve alterar exclusivamente o metabolismo bacteriano, interferindo na síntese de componentes estruturais e energéticos essenciais, sem afetar diretamente o metabolismo do hospedeiro.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable class=\"compare-table\">\u003cthead>\u003ctr>\u003cth>Estrutura bacteriana\u003c/th>\u003cth>Ausente ou muito diferente na célula humana\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Parede celular de peptidoglicano\u003c/td>\u003ctd>Células humanas não têm parede celular.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Ribossomos 70S\u003c/td>\u003ctd>Ribossomos humanos citosólicos são 80S.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Citoplasma sem organelas confinadas\u003c/td>\u003ctd>Células humanas compartimentalizam reações em organelas como a mitocôndria.\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003carticle class=\"info-block success\">\u003cdiv class=\"label\">Dois pilares\u003c/div>\u003ch4>Toxicidade seletiva e ausência de cruce\u003c/h4>\u003cp>O antibiótico ideal é desenhado para não afetar diretamente o metabolismo do hospedeiro eucarioto, explorando diferenças enzimáticas e estruturais fundamentais entre os dois tipos celulares.\u003c/p>\u003c/article>\n\n\u003ch3 class=\"subsection-title\">2. Anatomia metabólica da bactéria\u003c/h3>\n\u003cp>A bactéria não possui núcleo nem mitocôndrias. O DNA fica no nucleoide; os ribossomos 70S permanecem no citoplasma; e a membrana plasmática assume funções que, nas células humanas, são fortemente associadas às mitocôndrias. A parede celular envolve a membrana e ajuda a bactéria a resistir à pressão osmótica.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable class=\"compare-table\">\u003cthead>\u003ctr>\u003cth>Local\u003c/th>\u003cth>Processos bioquímicos principais\u003c/th>\u003cth>Importância funcional\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Citoplasma\u003c/td>\u003ctd>Glicólise, ciclo de Krebs, várias etapas catabólicas e anabólicas, síntese de precursores e tradução nos ribossomos.\u003c/td>\u003ctd>É o espaço onde nutrientes são transformados e onde a maior parte dos componentes celulares começa a ser produzida.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Nucleoide\u003c/td>\u003ctd>Replicação do DNA e transcrição em RNA.\u003c/td>\u003ctd>Armazena a informação que orienta crescimento, divisão e adaptação.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Membrana plasmática\u003c/td>\u003ctd>Cadeia transportadora de elétrons, formação do gradiente de prótons, ATP-sintase e transporte de solutos.\u003c/td>\u003ctd>Integra respiração, produção de ATP e controle das trocas com o meio.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Parede celular\u003c/td>\u003ctd>Montagem do peptidoglicano.\u003c/td>\u003ctd>Mantém forma e resistência mecânica, evitando ruptura pela entrada de água.\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\n\u003ch3 class=\"subsection-title\">3. Catabolismo e anabolismo bacterianos\u003c/h3>\n\u003cdiv class=\"mechanism-grid\">\n\u003carticle class=\"mechanism-card\">\u003cspan class=\"target\">CATABOLISMO\u003c/span>\u003ch4>Quebrar para obter energia\u003c/h4>\u003cp>A bactéria degrada nutrientes, como carboidratos, gorduras e proteínas, em moléculas menores. Parte da energia liberada é conservada em ATP e em transportadores de elétrons reduzidos.\u003c/p>\u003c/article>\n\u003carticle class=\"mechanism-card\">\u003cspan class=\"target\">ANABOLISMO\u003c/span>\u003ch4>Construir usando energia\u003c/h4>\u003cp>A bactéria usa ATP, poder redutor e precursores para fabricar proteínas, ácidos nucleicos, lipídios e componentes da parede.\u003c/p>\u003c/article>\n\u003c/div>\n\u003carticle class=\"info-block success\">\u003cdiv class=\"label\">Exemplo funcional\u003c/div>\u003ch4>Produzir ATP e depois gastar ATP\u003c/h4>\u003cp>Ao degradar glicose, a bactéria obtém energia e intermediários. Em seguida, usa esse ATP e esses fragmentos de carbono para sintetizar proteínas e duplicar o DNA antes da divisão. Se um antibiótico bloqueia a síntese proteica, o catabolismo pode até continuar por algum tempo, mas a célula não consegue construir adequadamente os componentes necessários para crescer.\u003c/p>\u003c/article>\n\n\u003ch3 class=\"subsection-title\">4. O ciclo de Krebs bacteriano: localização e função anfibólica\u003c/h3>\n\u003cp class=\"section-lead\">Assim como nas células eucariotas, o ciclo de Krebs bacteriano oxida acetil-CoA, formado a partir de açúcares, gorduras e proteínas, e libera dióxido de carbono (CO₂). A diferença essencial é topográfica: onde essa maquinaria fica localizada.\u003c/p>\n\u003cdiv class=\"pathway\">\u003cdiv class=\"path-node\">\u003cstrong>Açúcares, gorduras e proteínas\u003c/strong>\u003csmall>fontes de carbono\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>Acetil-CoA\u003c/strong>\u003csmall>ponto de convergência\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>Ciclo de Krebs\u003c/strong>\u003csmall>enzimas livres no citoplasma\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>CO₂ + coenzimas reduzidas\u003c/strong>\u003csmall>NADH e FADH₂\u003c/small>\u003c/div>\u003c/div>\n\u003cdiv class=\"table-wrap\">\u003ctable class=\"compare-table\">\u003cthead>\u003ctr>\u003cth>Aspecto\u003c/th>\u003cth>Explicação\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Ubicação topográfica\u003c/td>\u003ctd>As enzimas do ciclo flutuam livres no citoplasma bacteriano, sem confinamento em uma organela como a mitocôndria.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Processo de oxidação\u003c/td>\u003ctd>Assim como nas células eucariotas, o ciclo oxida o acetil-CoA para gerar CO₂ e coenzimas reduzidas.\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003carticle class=\"info-block purple\">\u003cdiv class=\"label\">Encruzilhada metabólica\u003c/div>\u003ch4>Função anfibólica: catabolismo e anabolismo ao mesmo tempo\u003c/h4>\u003cp>O ciclo de Krebs bacteriano não serve só para gerar ATP a partir da degradação de nutrientes (catabolismo). Seus intermediários também são retirados do ciclo para sintetizar blocos construtores, como aminoácidos e outras moléculas necessárias à célula (anabolismo). Por isso é chamado de via \u003cstrong>anfibólica\u003c/strong>: opera nos dois sentidos, degradação e síntese.\u003c/p>\u003c/article>\n\n\u003ch3 class=\"subsection-title\">5. Oxidação e gestão de energia pela membrana plasmática\u003c/h3>\n\u003cp class=\"section-lead\">Como a bactéria não possui mitocôndrias, os componentes da cadeia respiratória estão inseridos em sua membrana plasmática, que passa a exercer o papel funcionalmente equivalente ao da membrana mitocondrial nas células humanas.\u003c/p>\n\u003cdiv class=\"pathway\">\u003cdiv class=\"path-node\">\u003cstrong>NADH e FADH₂\u003c/strong>\u003csmall>produzidos no ciclo de Krebs citoplasmático\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>Migração até a membrana\u003c/strong>\u003csmall>equivalência funcional à mitocondrial\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>H⁺ para fora\u003c/strong>\u003csmall>gradiente eletroquímico\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>ATP-sintase\u003c/strong>\u003csmall>ADP + Pi → ATP\u003c/small>\u003c/div>\u003c/div>\n\u003cp>A oxidação de nutrientes transfere elétrons para moléculas como NAD⁺, formando NADH. Essas coenzimas reduzidas — NADH e FADH₂ — migram do citoplasma até a membrana plasmática, que abriga a cadeia respiratória e funciona como equivalente da membrana mitocondrial. A energia do fluxo eletrônico bombeia H⁺ para fora da membrana, criando a força próton-motriz. Quando os prótons retornam pela ATP-sintase, a enzima produz ATP. A mesma força também pode participar do transporte de nutrientes e da manutenção do equilíbrio iônico.\u003c/p>\n\u003carticle class=\"info-block purple\">\u003cdiv class=\"label\">Ponto-chave\u003c/div>\u003ch4>A membrana bacteriana é barreira e central energética\u003c/h4>\u003cp>Se a membrana perde sua organização, a bactéria não perde apenas o controle sobre o que entra e sai. Ela também perde o gradiente de prótons, reduz a produção de ATP e compromete o transporte de substâncias necessárias ao metabolismo.\u003c/p>\u003c/article>\n\n\u003ch3 class=\"subsection-title\">6. Lise osmótica: o exemplo da vancomicina e da fosfomicina\u003c/h3>\n\u003cp>O citoplasma bacteriano contém muitas partículas dissolvidas. Por osmose, a água tende a entrar na célula. A parede de peptidoglicano funciona como uma malha rígida que contém essa pressão osmótica interna. Quando a síntese da parede é bloqueada durante o crescimento, surgem regiões frágeis; a membrana perde sustentação mecânica, e a entrada descontrolada de água provoca sua ruptura — a lise osmótica.\u003c/p>\n\u003cdiv class=\"pathway\">\u003cdiv class=\"path-node\">\u003cstrong>1. Bloqueio\u003c/strong>\u003csmall>vancomicina e fosfomicina inibem a síntese do peptidoglicano\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>2. Debilitamento estrutural\u003c/strong>\u003csmall>a malha de peptidoglicano fica incompleta\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>3. Ruptura e lise\u003c/strong>\u003csmall>entrada incontrolável de água\u003c/small>\u003c/div>\u003c/div>\n\u003carticle class=\"info-block danger\">\u003cdiv class=\"label\">Exemplo nomeado pela professora\u003c/div>\u003ch4>Vancomicina e fosfomicina bloqueiam a síntese do peptidoglicano\u003c/h4>\u003cp>Ao inibir a síntese desse polímero rico em carboidratos, a parede perde sua contenção mecânica. A incapacidade de suportar o gradiente osmótico natural provoca entrada incontrolável de líquido, desencadeando lise osmótica e morte celular.\u003c/p>\u003c/article>\n\u003carticle class=\"info-block warn\">\u003cdiv class=\"label\">Não confundir\u003c/div>\u003ch4>Aminoglicosídeos não matam principalmente por lise osmótica\u003c/h4>\u003cp>A lise osmótica está ligada sobretudo à perda da resistência da parede, como ocorre com vancomicina e fosfomicina. Aminoglicosídeos atuam inicialmente no ribossomo 30S. As proteínas defeituosas produzidas podem lesionar a membrana e ampliar a entrada do próprio fármaco, mas o alvo primário não é o peptidoglicano.\u003c/p>\u003c/article>\n\n\u003ch3 class=\"subsection-title\">7. Antibióticos com estruturas derivadas de carboidratos\u003c/h3>\n\u003cp>Os aminoglicosídeos possuem grupos de aminoaçúcares ligados a um núcleo aminociclitol. Portanto, apresentam uma estrutura rica em grupos amina e hidroxila, semelhante a derivados de carboidratos. Em pH fisiológico, vários grupos amina ficam protonados, tornando a molécula policatiônica, muito polar e hidrossolúvel.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable class=\"compare-table\">\u003cthead>\u003ctr>\u003cth>Característica estrutural\u003c/th>\u003cth>Consequência bioquímica e farmacológica\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Aminoaçúcares + aminociclitol\u003c/td>\u003ctd>Formam a estrutura típica de gentamicina, amicacina, tobramicina e estreptomicina.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Múltiplas cargas positivas\u003c/td>\u003ctd>Favorecem ligação eletrostática ao RNA ribossômico bacteriano, que possui cargas negativas.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Alta polaridade\u003c/td>\u003ctd>Dificulta atravessar membranas lipídicas por difusão simples e explica a absorção intestinal muito baixa.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Hidrossolubilidade\u003c/td>\u003ctd>Favorece distribuição no compartimento extracelular e eliminação renal.\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\n\u003ch3 class=\"subsection-title\">8. Como os aminoglicosídeos agem\u003c/h3>\n\u003cp class=\"section-lead\">O alvo principal é a subunidade 30S do ribossomo bacteriano. O efeito é bactericida porque o bloqueio não apenas reduz a produção proteica: também produz proteínas anormais capazes de prejudicar a membrana.\u003c/p>\n\u003cdiv class=\"pathway\">\u003cdiv class=\"path-node\">\u003cstrong>Entrada na bactéria\u003c/strong>\u003csmall>depende de energia e potencial\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>Ligação à 30S\u003c/strong>\u003csmall>RNA ribossômico\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>Leitura incorreta do mRNA\u003c/strong>\u003csmall>proteínas defeituosas\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>Dano celular\u003c/strong>\u003csmall>membrana e funções vitais\u003c/small>\u003c/div>\u003c/div>\n\u003cul>\n\u003cli>\u003cstrong>Iniciação prejudicada:\u003c/strong> dificulta a montagem correta do complexo que começa a tradução.\u003c/li>\n\u003cli>\u003cstrong>Erro de leitura:\u003c/strong> o ribossomo incorpora aminoácidos incorretos porque interpreta mal os códons do mRNA.\u003c/li>\n\u003cli>\u003cstrong>Proteínas defeituosas:\u003c/strong> algumas são inseridas na membrana e aumentam sua permeabilidade.\u003c/li>\n\u003cli>\u003cstrong>Entrada dependente de energia:\u003c/strong> a captação efetiva está relacionada ao gradiente eletroquímico e ao metabolismo oxidativo.\u003c/li>\n\u003cli>\u003cstrong>Consequência:\u003c/strong> apresentam pouca atividade contra bactérias anaeróbias estritas, nas quais o transporte dependente de oxigênio não funciona adequadamente.\u003c/li>\n\u003c/ul>\n\u003carticle class=\"info-block warn\">\u003cdiv class=\"label\">Exemplo\u003c/div>\u003ch4>Por que combinar com um agente que atua na parede?\u003c/h4>\u003cp>Quando a parede bacteriana é enfraquecida, a entrada do aminoglicosídeo pode ser facilitada. Assim, o primeiro fármaco aumenta o acesso ao ribossomo e o aminoglicosídeo intensifica o dano proteico. Esse princípio explica a possibilidade de sinergismo em situações selecionadas.\u003c/p>\u003c/article>\n\n\u003ch3 class=\"subsection-title\">9. Impacto clínico direto no hospedeiro humano\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable class=\"compare-table\">\u003cthead>\u003ctr>\u003cth>Característica/efeito\u003c/th>\u003cth>Explicação funcional\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Baixa absorção oral\u003c/td>\u003ctd>Como são muito polares, atravessam mal o epitélio intestinal íntegro. Para efeitos sistêmicos, geralmente precisam de administração parenteral.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Eliminação renal\u003c/td>\u003ctd>São eliminados principalmente por filtração glomerular. Redução da função renal pode aumentar a exposição e exige ajuste e monitorização.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Nefrotoxicidade\u003c/td>\u003ctd>Podem acumular-se em células tubulares proximais e causar lesão renal, geralmente relacionada à exposição.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Ototoxicidade\u003c/td>\u003ctd>Podem lesar células sensoriais cocleares ou vestibulares, com alteração auditiva ou do equilíbrio.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Bloqueio neuromuscular\u003c/td>\u003ctd>Em condições predisponentes, podem reduzir a liberação de acetilcolina e a resposta da placa motora.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Seletividade não absoluta\u003c/td>\u003ctd>O ribossomo bacteriano é o alvo preferencial, mas efeitos adversos mostram que o hospedeiro não é biologicamente indiferente ao fármaco.\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\n\u003ch3 class=\"subsection-title\">10. Metabolismo sanguíneo e glicemia\u003c/h3>\n\u003cp>Aminoglicosídeos não atuam diretamente nas vias humanas de glicólise, glicogênese, glicogenólise ou gliconeogênese. Também não são agonistas nem antagonistas de insulina ou glucagon. Por isso, seu mecanismo farmacológico não provoca diretamente aumento ou redução da glicose sanguínea. Como regra geral, isso vale para os antibióticos revisados nesta seção: a toxicidade seletiva assegura que as vias metabólicas do processamento primário de carboidratos no humano permaneçam intactas.\u003c/p>\n\u003carticle class=\"reaction-card\">\u003cspan>Relação direta\u003c/span>\u003cdiv class=\"reaction-formula\">Aminoglicosídeo → ribossomo bacteriano 30S → erro de tradução\u003c/div>\u003cp>O alvo principal pertence à bactéria, e não ao sistema humano de controle glicêmico.\u003c/p>\u003c/article>\n\u003carticle class=\"info-block success\">\u003cdiv class=\"label\">Interpretação clínica\u003c/div>\u003ch4>Glicemia pode mudar por causa do quadro clínico, não pelo mecanismo antibiótico\u003c/h4>\u003cp>Infecção, febre, resposta ao estresse, sepse, redução da ingestão alimentar, diabetes prévio, disfunção renal e outros medicamentos podem alterar a glicemia durante o tratamento. Essa variação é indireta e precisa ser diferenciada da ação bioquímica do antibiótico.\u003c/p>\u003c/article>\n\n\u003ch3 class=\"subsection-title\">11. A consequência indireta: microbiota e digestão colônica\u003c/h3>\n\u003cp class=\"section-lead\">Embora o metabolismo celular humano não seja diretamente afetado pela maioria dos antibióticos revisados, a erradicação da microbiota intestinal tem um custo fisiológico real — o chamado \"dano colateral\" do tratamento.\u003c/p>\n\u003cdiv class=\"pathway\">\u003cdiv class=\"path-node\">\u003cstrong>Antibiótico\u003c/strong>\u003csmall>não age no metabolismo humano\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>Erradicação da microbiota\u003c/strong>\u003csmall>bactérias simbióticas do cólon\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>Menos fermentação\u003c/strong>\u003csmall>de carboidratos complexos\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>Desequilíbrio digestivo\u003c/strong>\u003csmall>a nível intestinal\u003c/small>\u003c/div>\u003c/div>\n\u003cdiv class=\"table-wrap\">\u003ctable class=\"compare-table\">\u003cthead>\u003ctr>\u003cth>Aspecto\u003c/th>\u003cth>Explicação\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>O dano colateral\u003c/td>\u003ctd>Ainda que o metabolismo celular humano não seja afetado diretamente, a erradicação da microbiota intestinal tem um custo fisiológico.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Alteração digestiva\u003c/td>\u003ctd>Ao esgotar a flora simbiótica, o antibiótico afeta indiretamente a fermentação e o processamento dos carboidratos complexos no cólon, originando desequilíbrios metabólicos a nível intestinal para o hospedeiro.\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003carticle class=\"info-block warn\">\u003cdiv class=\"label\">Distinção importante\u003c/div>\u003ch4>Efeito direto (bactéria patogênica) versus efeito indireto (microbiota comensal)\u003c/h4>\u003cp>O antibiótico não escolhe apenas o patógeno-alvo: ele também reduz bactérias comensais que normalmente fermentam fibras e carboidratos complexos no intestino grosso. Essa é uma consequência indireta e ecológica, diferente do mecanismo bioquímico direto que o fármaco exerce sobre o micro-organismo-alvo.\u003c/p>\u003c/article>\n\n\u003carticle class=\"info-block purple\">\u003cdiv class=\"label\">Resumo integrador\u003c/div>\u003ch4>Da estrutura ao efeito\u003c/h4>\u003cp>A bactéria quebra nutrientes no catabolismo, usa o ciclo de Krebs citoplasmático de forma anfibólica e a membrana para conservar energia, gastando ATP no anabolismo. A parede de peptidoglicano impede lise osmótica; vancomicina e fosfomicina a bloqueiam e causam ruptura por entrada de água. Aminoglicosídeos, formados por aminoaçúcares ligados a um aminociclitol, entram de maneira dependente de energia, ligam-se à subunidade 30S e provocam erros de tradução. Eles podem causar nefrotoxicidade, ototoxicidade e bloqueio neuromuscular no hospedeiro, mas não alteram diretamente os níveis de glicose sanguínea. Mesmo quando o metabolismo celular humano é poupado, a erradicação da microbiota intestinal cobra seu preço na digestão colônica de carboidratos.\u003c/p>\u003c/article>\n\u003c/div>\u003c/section>\u003csection id=\"flashcards\" class=\"section\">\u003cdiv class=\"container\">\n\u003cdiv class=\"chapter-title\">\u003cspan class=\"chap-icon\">🃏\u003c/span>Flashcards de Bioquímica II\u003c/div>\n\u003cdiv class=\"info-block success\">\u003cdiv class=\"label\">120 cartões\u003c/div>\u003ch4>Recuperação ativa com resposta explicada\u003c/h4>\u003cp>Tente responder em voz alta antes de virar o cartão. Filtre por tema para revisar uma aula específica ou embaralhe para treinar integração.\u003c/p>\u003c/div>\n\u003cdiv class=\"study-tools\">\u003clabel for=\"fcFilter\">Tema\u003c/label>\u003cselect id=\"fcFilter\">\u003c/select>\u003clabel for=\"fcSearch\">Buscar\u003c/label>\u003cinput id=\"fcSearch\" type=\"search\" placeholder=\"Ex.: PFK-1, G6PD, insulina, glucagon...\">\u003cbutton class=\"tool-btn\" type=\"button\" onclick=\"shuffleFlashcards()\">🔀 Embaralhar\u003c/button>\u003cspan class=\"result-note\" id=\"fcVisible\">\u003c/span>\u003c/div>\n\u003cdiv id=\"flashcard-grid\" class=\"flashcard-grid\">\u003c/div>\u003cdiv id=\"fcEmpty\" class=\"empty-state\">Nenhum flashcard corresponde ao filtro.\u003c/div>\n\u003c/div>\u003c/section>\u003csection id=\"quiz\" class=\"section\">\u003cdiv class=\"container\">\n\u003cdiv class=\"chapter-title\">\u003cspan class=\"chap-icon\">📝\u003c/span>Simulado de Bioquímica II\u003c/div>\n\u003cdiv class=\"info-block purple\">\u003cdiv class=\"label\">120 questões\u003c/div>\u003ch4>Perguntas dos slides + aprofundamento didático\u003c/h4>\u003cp>O banco combina múltipla escolha, verdadeiro/falso e questões abertas. Todas têm uma correção explicada como mini-aula.\u003c/p>\u003c/div>\n\u003cdiv class=\"q-stats\">\u003cdiv class=\"sbox c\">\u003cdiv class=\"sv\" id=\"sC\">0\u003c/div>\u003cdiv class=\"sl\">Corretas\u003c/div>\u003c/div>\u003cdiv class=\"sbox w\">\u003cdiv class=\"sv\" id=\"sW\">0\u003c/div>\u003cdiv class=\"sl\">Incorretas\u003c/div>\u003c/div>\u003cdiv class=\"sbox p\">\u003cdiv class=\"sv\" id=\"sP\">120\u003c/div>\u003cdiv class=\"sl\">Pendentes\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"study-tools\">\u003clabel for=\"qCategory\">Tema\u003c/label>\u003cselect id=\"qCategory\">\u003c/select>\u003clabel for=\"qType\">Tipo\u003c/label>\u003cselect id=\"qType\">\u003coption value=\"\">Todos\u003c/option>\u003coption value=\"mc\">Múltipla escolha\u003c/option>\u003coption value=\"tf\">Verdadeiro/Falso\u003c/option>\u003coption value=\"ab\">Aberta\u003c/option>\u003c/select>\u003cspan class=\"result-note\" id=\"qVisible\">\u003c/span>\u003c/div>\n\u003cdiv id=\"quizContainer\">\u003c/div>\u003cdiv id=\"qEmpty\" class=\"empty-state\">Nenhuma questão corresponde ao filtro.\u003c/div>\u003cbutton class=\"reset-btn\" onclick=\"resetQuiz()\">🔄 Reiniciar Simulado\u003c/button>\n\u003c/div>\u003c/section>\n\u003cbutton id=\"scrolltop\" onclick=\"window.scrollTo({top:0,behavior:'smooth'})\" aria-label=\"Voltar ao topo\">↑\u003c/button>\u003ca class=\"back-btn\" href=\"dashboard.html\">← Voltar\u003c/a>\n\u003cfooter>Bioquímica II — P1 · Material educacional · \u003cspan data-flashcard-count>132\u003c/span> flashcards · \u003cspan data-question-count>136\u003c/span> questões com explicação\u003c/footer>\n\u003cscript>\nconst TOPICS=[\n[\"carboidratos\",\"🍞\",\"Carboidratos — partes 1 e 2\",\"Uso imediato, reserva e produção de glicose\"],\n[\"pentoses\",\"🛡️\",\"Metabolismo das pentoses\",\"NADPH, ribose e proteção antioxidante\"],\n[\"cori\",\"🔄\",\"Ciclo de Cori\",\"Músculo, hemácia e fígado\"],\n[\"insulina\",\"🔑\",\"Importância da insulina\",\"Síntese, sinalização e efeitos\"],\n[\"glucagon\",\"📈\",\"Importância do glucagon\",\"Jejum e produção hepática de glicose\"],\n[\"antibioticos\",\"🦠\",\"Antibióticos\",\"Bioquímica bacteriana, ciclo de Krebs, parede celular e aminoglicosídeos\"]\n];\nlet FC=[{\"c\": \"Fundamentos\", \"q\": \"O que é metabolismo?\", \"a\": \"Conjunto integrado de reações que transforma matéria e energia para manter estrutura, função e homeostase.\"}, {\"c\": \"Fundamentos\", \"q\": \"Qual a diferença entre catabolismo e anabolismo?\", \"a\": \"Catabolismo degrada e libera energia/intermediários; anabolismo constrói e consome ATP e poder redutor.\"}, {\"c\": \"Fundamentos\", \"q\": \"Qual é a função central do ATP?\", \"a\": \"Transferir energia livre e grupos fosfato para trabalho químico, mecânico e de transporte.\"}, {\"c\": \"Fundamentos\", \"q\": \"NADH e NADPH são equivalentes?\", \"a\": \"Não. NADH é usado sobretudo para produção de ATP; NADPH fornece poder redutor para biossíntese e defesa antioxidante.\"}, {\"c\": \"Fundamentos\", \"q\": \"Por que a glicose não atravessa livremente a membrana?\", \"a\": \"É polar e hidrofílica; precisa de transportadores SGLT ou GLUT para cruzar a bicamada lipídica.\"}, {\"c\": \"Fundamentos\", \"q\": \"O que são monossacarídeos?\", \"a\": \"Carboidratos que não podem ser hidrolisados em açúcares menores, como glicose, galactose, frutose e ribose.\"}, {\"c\": \"Fundamentos\", \"q\": \"Sacarose, lactose e maltose são formadas por quais monossacarídeos?\", \"a\": \"Sacarose = glicose + frutose; lactose = glicose + galactose; maltose = glicose + glicose.\"}, {\"c\": \"Fundamentos\", \"q\": \"Por que a hemácia depende de glicose?\", \"a\": \"Ela não possui mitocôndria e obtém ATP exclusivamente por glicólise anaeróbica.\"}, {\"c\": \"Fundamentos\", \"q\": \"O cérebro usa somente glicose em qualquer situação?\", \"a\": \"Glicose é o combustível predominante; no jejum prolongado o cérebro aumenta o uso de corpos cetônicos, mas ainda requer glicose.\"}, {\"c\": \"Fundamentos\", \"q\": \"O que a designação D/L informa?\", \"a\": \"A configuração do carbono quiral mais distante do grupo carbonila; não informa o sentido de rotação da luz.\"}, {\"c\": \"Digestão e transporte\", \"q\": \"O que as amilases rompem?\", \"a\": \"Ligações glicosídicas α-1,4 internas do amido e glicogênio; não rompem α-1,6.\"}, {\"c\": \"Digestão e transporte\", \"q\": \"O que são dextrinas-limite?\", \"a\": \"Fragmentos ramificados ricos em ligações α-1,6 que restam após ação das amilases.\"}, {\"c\": \"Digestão e transporte\", \"q\": \"Qual enzima digere a lactose?\", \"a\": \"Lactase da borda em escova, formando glicose e galactose.\"}, {\"c\": \"Digestão e transporte\", \"q\": \"Por que deficiência de lactase causa diarreia?\", \"a\": \"Lactose não absorvida retém água por osmose e é fermentada pela microbiota, produzindo gases e ácidos.\"}, {\"c\": \"Digestão e transporte\", \"q\": \"Como glicose e galactose entram no enterócito?\", \"a\": \"Pelo SGLT1 apical, cotransportadas com dois íons Na⁺.\"}, {\"c\": \"Digestão e transporte\", \"q\": \"Como a frutose entra no enterócito?\", \"a\": \"Por difusão facilitada através do GLUT5 apical.\"}, {\"c\": \"Digestão e transporte\", \"q\": \"Como os monossacarídeos saem do enterócito?\", \"a\": \"Pelo GLUT2 basolateral em direção ao sangue portal.\"}, {\"c\": \"Digestão e transporte\", \"q\": \"De onde vem a energia do SGLT1?\", \"a\": \"Do gradiente de Na⁺ mantido pela Na⁺/K⁺-ATPase; por isso é transporte ativo secundário.\"}, {\"c\": \"Digestão e transporte\", \"q\": \"Qual é a função do SGLT2?\", \"a\": \"Reabsorver a maior parte da glicose filtrada no túbulo proximal renal.\"}, {\"c\": \"Digestão e transporte\", \"q\": \"Onde predomina GLUT1?\", \"a\": \"Hemácias e barreiras, especialmente hematoencefálica e placentária; garante captação basal.\"}, {\"c\": \"Digestão e transporte\", \"q\": \"Onde predomina GLUT3?\", \"a\": \"Neurônios e outros tecidos de alta demanda; possui alta afinidade por glicose.\"}, {\"c\": \"Digestão e transporte\", \"q\": \"Como insulina e exercício afetam GLUT4?\", \"a\": \"Ambos promovem translocação de vesículas com GLUT4 para a membrana de músculo e tecido adiposo.\"}, {\"c\": \"Glicólise\", \"q\": \"Onde ocorre a glicólise?\", \"a\": \"No citosol de todas as células.\"}, {\"c\": \"Glicólise\", \"q\": \"Qual é o produto principal da glicólise?\", \"a\": \"Duas moléculas de piruvato por molécula de glicose.\"}, {\"c\": \"Glicólise\", \"q\": \"Qual o saldo líquido da glicólise por glicose?\", \"a\": \"2 ATP, 2 NADH e 2 piruvatos.\"}, {\"c\": \"Glicólise\", \"q\": \"Por que são produzidos 4 ATP, mas o saldo é 2?\", \"a\": \"Dois ATP foram investidos nas reações 1 e 3.\"}, {\"c\": \"Glicólise\", \"q\": \"Quais reações consomem ATP?\", \"a\": \"Reação 1, hexoquinase/glicoquinase, e reação 3, PFK-1.\"}, {\"c\": \"Glicólise\", \"q\": \"Quais reações produzem ATP?\", \"a\": \"Reação 7, fosfoglicerato-quinase, e reação 10, piruvato-quinase; cada uma ocorre duas vezes.\"}, {\"c\": \"Glicólise\", \"q\": \"Qual reação produz NADH?\", \"a\": \"Reação 6: G3P-desidrogenase converte G3P em 1,3-BPG.\"}, {\"c\": \"Glicólise\", \"q\": \"Quais enzimas catalisam reações irreversíveis?\", \"a\": \"Hexoquinase/glicoquinase, PFK-1 e piruvato-quinase.\"}, {\"c\": \"Glicólise\", \"q\": \"Qual é a etapa comprometora da glicólise?\", \"a\": \"PFK-1: F6P → F1,6BP.\"}, {\"c\": \"Glicólise\", \"q\": \"Como ATP e citrato afetam PFK-1?\", \"a\": \"Inibem, sinalizando energia e carbono abundantes.\"}, {\"c\": \"Glicólise\", \"q\": \"Como AMP e F2,6BP afetam PFK-1?\", \"a\": \"Ativam, sinalizando baixa energia ou estado alimentado hepático.\"}, {\"c\": \"Glicólise\", \"q\": \"Por que a reação 2 converte aldose em cetose?\", \"a\": \"A isomerização G6P → F6P posiciona a carbonila para clivagem simétrica posterior.\"}, {\"c\": \"Glicólise\", \"q\": \"O que a aldolase produz?\", \"a\": \"G3P e DHAP a partir de F1,6BP.\"}, {\"c\": \"Glicólise\", \"q\": \"Qual é a função da triose-fosfato-isomerase?\", \"a\": \"Converter DHAP em G3P, de modo que os seis carbonos sigam pela mesma sequência.\"}, {\"c\": \"Glicólise\", \"q\": \"O que é fosforilação em nível de substrato?\", \"a\": \"Transferência direta de fosfato de um intermediário rico em energia para ADP; ocorre nas reações 7 e 10.\"}, {\"c\": \"Glicólise\", \"q\": \"Qual enzima é inibida por fluoreto?\", \"a\": \"Enolase; essa propriedade ajuda a reduzir glicólise em tubos de coleta.\"}, {\"c\": \"Glicólise\", \"q\": \"Como a F1,6BP regula piruvato-quinase?\", \"a\": \"Ativa por feed-forward: o produto inicial acelera uma etapa final.\"}, {\"c\": \"Glicólise\", \"q\": \"Por que glicólise não exige oxigênio diretamente?\", \"a\": \"Nenhuma das dez reações usa O₂; o oxigênio influencia a reoxidação mitocondrial do NADH.\"}, {\"c\": \"Glicólise\", \"q\": \"Hexoquinase e glicoquinase diferem como?\", \"a\": \"Hexoquinase tem alta afinidade e é inibida por G6P; glicoquinase tem maior Km/capacidade e atua no fígado/célula β.\"}, {\"c\": \"Glicólise\", \"q\": \"Qual é o balanço de carbonos da glicólise?\", \"a\": \"Uma glicose de 6 carbonos origina dois piruvatos de 3 carbonos; nenhum carbono é perdido como CO₂.\"}, {\"c\": \"Piruvato e fermentação\", \"q\": \"Qual enzima converte piruvato em lactato?\", \"a\": \"Lactato-desidrogenase (LDH).\"}, {\"c\": \"Piruvato e fermentação\", \"q\": \"Qual cofator participa da reação piruvato–lactato?\", \"a\": \"NADH/NAD⁺; NADPH não é o cofator dessa reação.\"}, {\"c\": \"Piruvato e fermentação\", \"q\": \"Por que formar lactato mantém a glicólise?\", \"a\": \"Regenera NAD⁺ necessário à G3P-desidrogenase.\"}, {\"c\": \"Piruvato e fermentação\", \"q\": \"Quais células produzem lactato continuamente?\", \"a\": \"Hemácias, porque não possuem mitocôndrias.\"}, {\"c\": \"Piruvato e fermentação\", \"q\": \"Qual complexo forma acetil-CoA a partir de piruvato?\", \"a\": \"Complexo piruvato-desidrogenase na matriz mitocondrial.\"}, {\"c\": \"Piruvato e fermentação\", \"q\": \"Piruvato → acetil-CoA é reversível?\", \"a\": \"Não; por isso acetil-CoA não gera glicose líquida em humanos.\"}, {\"c\": \"Piruvato e fermentação\", \"q\": \"Qual enzima forma oxaloacetato a partir de piruvato?\", \"a\": \"Piruvato-carboxilase, dependente de biotina e ativada por acetil-CoA.\"}, {\"c\": \"Piruvato e fermentação\", \"q\": \"Qual é o intermediário da fermentação alcoólica?\", \"a\": \"Acetaldeído.\"}, {\"c\": \"Piruvato e fermentação\", \"q\": \"Quais enzimas fazem fermentação alcoólica?\", \"a\": \"Piruvato-descarboxilase e álcool-desidrogenase; a primeira não existe na via humana.\"}, {\"c\": \"Piruvato e fermentação\", \"q\": \"Lactato causa sozinho a fadiga muscular?\", \"a\": \"Não. A acidose relaciona-se principalmente à alta hidrólise de ATP; lactato é combustível e intermediário reciclável.\"}, {\"c\": \"Glicogênio\", \"q\": \"Quais ligações formam o glicogênio?\", \"a\": \"α-1,4 nas cadeias e α-1,6 nas ramificações.\"}, {\"c\": \"Glicogênio\", \"q\": \"Por que o glicogênio é ramificado?\", \"a\": \"Ramificações aumentam solubilidade e extremidades para síntese/degradação simultâneas.\"}, {\"c\": \"Glicogênio\", \"q\": \"Qual é a função do glicogênio hepático?\", \"a\": \"Manter a glicemia entre refeições e no início do jejum.\"}, {\"c\": \"Glicogênio\", \"q\": \"Qual é a função do glicogênio muscular?\", \"a\": \"Produzir ATP local para contração.\"}, {\"c\": \"Glicogênio\", \"q\": \"Qual transportador capta glicose no fígado?\", \"a\": \"GLUT2, independente de insulina.\"}, {\"c\": \"Glicogênio\", \"q\": \"Qual transportador aumenta na membrana muscular com insulina?\", \"a\": \"GLUT4.\"}, {\"c\": \"Glicogênio\", \"q\": \"Qual enzima converte G6P em G1P?\", \"a\": \"Fosfoglucomutase.\"}, {\"c\": \"Glicogênio\", \"q\": \"Como a glicose é ativada para glicogênese?\", \"a\": \"G1P reage com UTP formando UDP-glicose.\"}, {\"c\": \"Glicogênio\", \"q\": \"Qual é a função da glicogenina?\", \"a\": \"Autoglicosilar-se e formar o primer inicial do glicogênio.\"}, {\"c\": \"Glicogênio\", \"q\": \"Qual enzima alonga glicogênio?\", \"a\": \"Glicogênio-sintase, formando ligações α-1,4 com UDP-glicose.\"}, {\"c\": \"Glicogênio\", \"q\": \"Qual enzima cria ligações α-1,6?\", \"a\": \"Enzima ramificadora.\"}, {\"c\": \"Glicogênio\", \"q\": \"Como insulina regula a glicogênio-sintase?\", \"a\": \"Promove desfosforilação e ativação.\"}, {\"c\": \"Glicogênio\", \"q\": \"Qual enzima remove resíduos α-1,4 na glicogenólise?\", \"a\": \"Glicogênio-fosforilase, liberando G1P por fosforólise.\"}, {\"c\": \"Glicogênio\", \"q\": \"Por que a fosforilase para perto da ramificação?\", \"a\": \"Ela não consegue romper α-1,6 e para quatro resíduos antes do ponto de ramificação.\"}, {\"c\": \"Glicogênio\", \"q\": \"Quais atividades tem a enzima desramificadora?\", \"a\": \"Transferase move três resíduos; α-1,6-glicosidase libera a glicose do ponto de ramificação.\"}, {\"c\": \"Glicogênio\", \"q\": \"Qual produto sai da ligação α-1,6?\", \"a\": \"Glicose livre; a maioria dos resíduos α-1,4 sai como G1P.\"}, {\"c\": \"Glicogênio\", \"q\": \"Por que músculo não eleva diretamente a glicemia?\", \"a\": \"Não possui glicose-6-fosfatase para transformar G6P em glicose livre.\"}, {\"c\": \"Glicogênio\", \"q\": \"Como Ca²⁺ estimula glicogenólise muscular?\", \"a\": \"Liga-se à calmodulina da fosforilase-quinase durante contração.\"}, {\"c\": \"Glicogênio\", \"q\": \"Como AMP afeta fosforilase muscular?\", \"a\": \"Ativa alostericamente quando a energia está baixa.\"}, {\"c\": \"Glicogênio\", \"q\": \"Por que glicogênio muscular rende 3 ATP anaeróbicos por glicose?\", \"a\": \"O resíduo entra como G6P e poupa o ATP da hexoquinase.\"}, {\"c\": \"Gliconeogênese e clínica\", \"q\": \"O que é gliconeogênese?\", \"a\": \"Síntese de glicose a partir de precursores não carboidratos, principalmente no fígado e rim.\"}, {\"c\": \"Gliconeogênese e clínica\", \"q\": \"Quais são os principais precursores?\", \"a\": \"Lactato, alanina/outros aminoácidos glicogênicos, glicerol e propionato.\"}, {\"c\": \"Gliconeogênese e clínica\", \"q\": \"Quais são os três desvios irreversíveis?\", \"a\": \"Piruvato-carboxilase + PEPCK; F1,6-bisfosfatase; G6-fosfatase.\"}, {\"c\": \"Gliconeogênese e clínica\", \"q\": \"Qual é o custo por glicose formada de 2 piruvatos?\", \"a\": \"4 ATP, 2 GTP e 2 NADH.\"}, {\"c\": \"Gliconeogênese e clínica\", \"q\": \"Como glicerol entra na gliconeogênese?\", \"a\": \"Glicerol → glicerol-3-P → DHAP.\"}, {\"c\": \"Gliconeogênese e clínica\", \"q\": \"Por que acetil-CoA de ácido graxo par não gera glicose líquida?\", \"a\": \"PDH é irreversível e os carbonos do acetil-CoA são perdidos como CO₂ no ciclo de Krebs.\"}, {\"c\": \"Gliconeogênese e clínica\", \"q\": \"Quais destinos principais tem G6P?\", \"a\": \"Glicólise, glicogênese, via das pentoses e, em tecidos com G6-fosfatase, glicose livre.\"}, {\"c\": \"Gliconeogênese e clínica\", \"q\": \"O que falta na doença de Von Gierke Ia?\", \"a\": \"Atividade da glicose-6-fosfatase.\"}, {\"c\": \"Gliconeogênese e clínica\", \"q\": \"Qual defeito causa Von Gierke Ib?\", \"a\": \"Transportador de G6P do retículo endoplasmático, SLC37A4.\"}, {\"c\": \"Gliconeogênese e clínica\", \"q\": \"Por que Von Gierke causa lactato elevado?\", \"a\": \"G6P acumulada entra na glicólise e o lactato não é reciclado adequadamente em glicose.\"}, {\"c\": \"Gliconeogênese e clínica\", \"q\": \"Qual conjunto sugere Von Gierke?\", \"a\": \"Hipoglicemia de jejum, hepatomegalia, acidose láctica, hiperuricemia e hipertrigliceridemia.\"}, {\"c\": \"Gliconeogênese e clínica\", \"q\": \"Qual princípio central do manejo de Von Gierke?\", \"a\": \"Evitar jejum e fornecer glicose de forma regular e lenta sob orientação especializada.\"}, {\"c\": \"Pentoses, G6PD e Cori\", \"q\": \"Outro nome da via das pentoses?\", \"a\": \"Via da hexose-monofosfato ou shunt das pentoses.\"}, {\"c\": \"Pentoses, G6PD e Cori\", \"q\": \"Onde ocorre a via das pentoses?\", \"a\": \"No citosol.\"}, {\"c\": \"Pentoses, G6PD e Cori\", \"q\": \"A via das pentoses produz ATP?\", \"a\": \"Não produz nem consome ATP diretamente.\"}, {\"c\": \"Pentoses, G6PD e Cori\", \"q\": \"Quais produtos da fase oxidativa por G6P?\", \"a\": \"2 NADPH, 1 ribulose-5-P e 1 CO₂.\"}, {\"c\": \"Pentoses, G6PD e Cori\", \"q\": \"Qual é a enzima limitante da fase oxidativa?\", \"a\": \"Glicose-6-fosfato-desidrogenase, G6PD.\"}, {\"c\": \"Pentoses, G6PD e Cori\", \"q\": \"A fase oxidativa é reversível?\", \"a\": \"Não; a fase não oxidativa é reversível.\"}, {\"c\": \"Pentoses, G6PD e Cori\", \"q\": \"Qual é a função da ribose-5-P?\", \"a\": \"Fornecer o açúcar de nucleotídeos e ácidos nucleicos.\"}, {\"c\": \"Pentoses, G6PD e Cori\", \"q\": \"Qual é a função do NADPH na hemácia?\", \"a\": \"Manter glutationa reduzida para neutralizar peróxidos.\"}, {\"c\": \"Pentoses, G6PD e Cori\", \"q\": \"Qual cofator a transcetolase requer?\", \"a\": \"TPP, pirofosfato de tiamina derivado da vitamina B1, e Mg²⁺.\"}, {\"c\": \"Pentoses, G6PD e Cori\", \"q\": \"Quantos carbonos transfere a transcetolase?\", \"a\": \"Dois carbonos; transaldolase transfere três.\"}, {\"c\": \"Pentoses, G6PD e Cori\", \"q\": \"Por que a via é ativa em síntese de lipídios?\", \"a\": \"Fornece NADPH para reações redutoras.\"}, {\"c\": \"Pentoses, G6PD e Cori\", \"q\": \"Qual herança da deficiência de G6PD?\", \"a\": \"Ligada ao cromossomo X.\"}, {\"c\": \"Pentoses, G6PD e Cori\", \"q\": \"Quais gatilhos clássicos de hemólise em G6PD?\", \"a\": \"Infecção, fava, naftalina e fármacos oxidantes como primaquina e dapsona.\"}, {\"c\": \"Pentoses, G6PD e Cori\", \"q\": \"O que são corpúsculos de Heinz?\", \"a\": \"Agregados de hemoglobina oxidada/desnaturada.\"}, {\"c\": \"Pentoses, G6PD e Cori\", \"q\": \"O que são bite cells?\", \"a\": \"Hemácias mordidas após remoção esplênica de corpúsculos de Heinz.\"}, {\"c\": \"Pentoses, G6PD e Cori\", \"q\": \"O que circula no Ciclo de Cori?\", \"a\": \"Lactato vai ao fígado e glicose retorna à periferia.\"}, {\"c\": \"Pentoses, G6PD e Cori\", \"q\": \"Qual custo energético líquido do Ciclo de Cori?\", \"a\": \"Periferia ganha 2 ATP; fígado gasta 6; custo líquido de 4 equivalentes.\"}, {\"c\": \"Pentoses, G6PD e Cori\", \"q\": \"Além do fígado, quem pode reciclar lactato?\", \"a\": \"Rim por gliconeogênese e tecidos oxidativos, como coração, usando lactato como combustível.\"}, {\"c\": \"Insulina e diabetes\", \"q\": \"Quantos aminoácidos tem a insulina madura?\", \"a\": \"51: cadeia A com 21 e cadeia B com 30, unidas por pontes dissulfeto.\"}, {\"c\": \"Insulina e diabetes\", \"q\": \"O que indica o peptídeo C?\", \"a\": \"Secreção endógena de insulina, pois é liberado em quantidade equimolar.\"}, {\"c\": \"Insulina e diabetes\", \"q\": \"Qual tipo de receptor a insulina usa?\", \"a\": \"Receptor tirosina-quinase.\"}, {\"c\": \"Insulina e diabetes\", \"q\": \"Qual via leva GLUT4 à membrana?\", \"a\": \"IRS–PI3K–Akt.\"}, {\"c\": \"Insulina e diabetes\", \"q\": \"Quais efeitos hepáticos da insulina?\", \"a\": \"Aumenta glicogênese/glicólise/lipogênese e reduz glicogenólise/gliconeogênese/cetogênese.\"}, {\"c\": \"Insulina e diabetes\", \"q\": \"Qual mecanismo central do DM1?\", \"a\": \"Destruição autoimune de células β e deficiência absoluta de insulina.\"}, {\"c\": \"Insulina e diabetes\", \"q\": \"Qual mecanismo central do DM2?\", \"a\": \"Resistência à insulina com falência progressiva da célula β.\"}, {\"c\": \"Insulina e diabetes\", \"q\": \"Quais são as quatro P da diabetes?\", \"a\": \"Poliúria, polidipsia, polifagia e perda de peso.\"}, {\"c\": \"Insulina e diabetes\", \"q\": \"Quais critérios diagnósticos principais de diabetes?\", \"a\": \"Jejum ≥126; 2 h TOTG ≥200; HbA1c ≥6,5%; ou casual ≥200 com sintomas/crise.\"}, {\"c\": \"Insulina e diabetes\", \"q\": \"Por que hiperglicemia causa poliúria?\", \"a\": \"Glicosúria excede reabsorção renal e provoca diurese osmótica.\"}, {\"c\": \"Glucagon e hipoglicemia\", \"q\": \"Onde é produzido o glucagon?\", \"a\": \"Nas células α das ilhotas pancreáticas.\"}, {\"c\": \"Glucagon e hipoglicemia\", \"q\": \"Quantos aminoácidos tem o glucagon?\", \"a\": \"29 aminoácidos em uma cadeia peptídica única.\"}, {\"c\": \"Glucagon e hipoglicemia\", \"q\": \"Qual receptor/via o glucagon usa?\", \"a\": \"Receptor acoplado a Gs → adenilato-ciclase → cAMP → PKA.\"}, {\"c\": \"Glucagon e hipoglicemia\", \"q\": \"Quais efeitos hepáticos elevam a glicemia?\", \"a\": \"Glicogenólise e gliconeogênese aumentam; glicogênese e glicólise hepática diminuem.\"}, {\"c\": \"Glucagon e hipoglicemia\", \"q\": \"Glucagon age diretamente no glicogênio muscular?\", \"a\": \"Praticamente não; o músculo não possui resposta relevante ao receptor de glucagon.\"}, {\"c\": \"Glucagon e hipoglicemia\", \"q\": \"Como tratar hipoglicemia consciente?\", \"a\": \"Regra 15–15: 15 g de carboidrato rápido, reavaliar em 15 min e repetir se necessário.\"}, {\"c\": \"Glucagon e hipoglicemia\", \"q\": \"Como agir se a pessoa não consegue engolir?\", \"a\": \"Não dar nada por boca; usar glucagon conforme treinamento/prescrição e acionar emergência.\"}, {\"c\": \"Glucagon e hipoglicemia\", \"q\": \"Quais usos clínicos principais do glucagon?\", \"a\": \"Resgate de hipoglicemia grave, relaxamento gastrointestinal e uso adjuvante em intoxicação por β-bloqueador.\"}];\nconst QD=[{\"t\": \"mc\", \"c\": \"Fundamentos\", \"q\": \"Qual alternativa define corretamente catabolismo?\", \"o\": [{\"l\": \"A\", \"v\": \"Construção de moléculas com consumo de energia\"}, {\"l\": \"B\", \"v\": \"Degradação de moléculas com liberação de energia e intermediários\"}, {\"l\": \"C\", \"v\": \"Transporte de glicose por GLUT4\"}, {\"l\": \"D\", \"v\": \"Síntese exclusiva de glicogênio\"}], \"cr\": \"B\", \"ex\": \"Catabolismo quebra moléculas e captura parte da energia em ATP, NADH ou FADH₂; também fornece blocos para o anabolismo.\", \"n\": 1}, {\"t\": \"mc\", \"c\": \"Fundamentos\", \"q\": \"Qual tecido depende exclusivamente da glicólise para produzir ATP?\", \"o\": [{\"l\": \"A\", \"v\": \"Hepatócito\"}, {\"l\": \"B\", \"v\": \"Cardiomiócito\"}, {\"l\": \"C\", \"v\": \"Hemácia madura\"}, {\"l\": \"D\", \"v\": \"Adipócito\"}], \"cr\": \"C\", \"ex\": \"A hemácia madura não possui mitocôndria; portanto, seu ATP vem da glicólise anaeróbica.\", \"n\": 2}, {\"t\": \"mc\", \"c\": \"Fundamentos\", \"q\": \"Qual molécula fornece poder redutor principalmente para síntese de lipídios e defesa antioxidante?\", \"o\": [{\"l\": \"A\", \"v\": \"NADPH\"}, {\"l\": \"B\", \"v\": \"NADH\"}, {\"l\": \"C\", \"v\": \"ADP\"}, {\"l\": \"D\", \"v\": \"GTP\"}], \"cr\": \"A\", \"ex\": \"NADPH é o poder redutor anabólico e mantém a glutationa reduzida; NADH é mais associado à produção de ATP.\", \"n\": 3}, {\"t\": \"mc\", \"c\": \"Fundamentos\", \"q\": \"Glicose, frutose e galactose têm a mesma fórmula molecular, mas estruturas diferentes. Elas são:\", \"o\": [{\"l\": \"A\", \"v\": \"Isótopos\"}, {\"l\": \"B\", \"v\": \"Isômeros\"}, {\"l\": \"C\", \"v\": \"Polímeros\"}, {\"l\": \"D\", \"v\": \"Enzimas\"}], \"cr\": \"B\", \"ex\": \"Todas podem ter fórmula C₆H₁₂O₆, mas diferem na organização dos átomos.\", \"n\": 4}, {\"t\": \"mc\", \"c\": \"Digestão e transporte\", \"q\": \"A α-amilase salivar e pancreática rompe principalmente qual ligação?\", \"o\": [{\"l\": \"A\", \"v\": \"β-1,4\"}, {\"l\": \"B\", \"v\": \"α-1,6\"}, {\"l\": \"C\", \"v\": \"α-1,4\"}, {\"l\": \"D\", \"v\": \"Peptídica\"}], \"cr\": \"C\", \"ex\": \"Amilases hidrolisam ligações α-1,4 internas; as ramificações α-1,6 exigem isomaltase na borda em escova.\", \"n\": 5}, {\"t\": \"mc\", \"c\": \"Digestão e transporte\", \"q\": \"Qual transportador realiza a entrada apical de glicose e galactose no enterócito?\", \"o\": [{\"l\": \"A\", \"v\": \"GLUT2\"}, {\"l\": \"B\", \"v\": \"GLUT4\"}, {\"l\": \"C\", \"v\": \"SGLT1\"}, {\"l\": \"D\", \"v\": \"GLUT5\"}], \"cr\": \"C\", \"ex\": \"SGLT1 cotransporta glicose ou galactose com Na⁺ usando transporte ativo secundário.\", \"n\": 6}, {\"t\": \"mc\", \"c\": \"Digestão e transporte\", \"q\": \"A frutose entra pela membrana apical do enterócito principalmente por:\", \"o\": [{\"l\": \"A\", \"v\": \"GLUT5\"}, {\"l\": \"B\", \"v\": \"SGLT2\"}, {\"l\": \"C\", \"v\": \"GLUT4\"}, {\"l\": \"D\", \"v\": \"Na⁺/K⁺-ATPase\"}], \"cr\": \"A\", \"ex\": \"GLUT5 realiza difusão facilitada de frutose; GLUT2 participa da saída basolateral.\", \"n\": 7}, {\"t\": \"mc\", \"c\": \"Digestão e transporte\", \"q\": \"Qual transportador é recrutado para a membrana de músculo e adipócito pela insulina?\", \"o\": [{\"l\": \"A\", \"v\": \"GLUT1\"}, {\"l\": \"B\", \"v\": \"GLUT2\"}, {\"l\": \"C\", \"v\": \"GLUT3\"}, {\"l\": \"D\", \"v\": \"GLUT4\"}], \"cr\": \"D\", \"ex\": \"A via PI3K–Akt promove translocação do GLUT4 já armazenado em vesículas.\", \"n\": 8}, {\"t\": \"mc\", \"c\": \"Digestão e transporte\", \"q\": \"A energia indireta usada pelo SGLT1 depende de:\", \"o\": [{\"l\": \"A\", \"v\": \"Gradiente de Na⁺ mantido pela Na⁺/K⁺-ATPase\"}, {\"l\": \"B\", \"v\": \"Hidrólise de GTP pelo próprio SGLT1\"}, {\"l\": \"C\", \"v\": \"Gradiente de Ca²⁺\"}, {\"l\": \"D\", \"v\": \"Insulina ligada ao enterócito\"}], \"cr\": \"A\", \"ex\": \"O SGLT1 não hidrolisa ATP diretamente: ele usa o gradiente eletroquímico de Na⁺.\", \"n\": 9}, {\"t\": \"mc\", \"c\": \"Digestão e transporte\", \"q\": \"Qual combinação está correta?\", \"o\": [{\"l\": \"A\", \"v\": \"GLUT1 — frutose intestinal\"}, {\"l\": \"B\", \"v\": \"GLUT3 — captação neuronal de alta afinidade\"}, {\"l\": \"C\", \"v\": \"GLUT5 — glicose muscular dependente de insulina\"}, {\"l\": \"D\", \"v\": \"SGLT2 — saída basolateral do enterócito\"}], \"cr\": \"B\", \"ex\": \"GLUT3 é de alta afinidade e importante em neurônios. GLUT5 transporta frutose; SGLT2 é renal.\", \"n\": 10}, {\"t\": \"mc\", \"c\": \"Glicólise\", \"q\": \"Qual é o saldo líquido da glicólise por molécula de glicose?\", \"o\": [{\"l\": \"A\", \"v\": \"4 ATP, 2 FADH₂ e 1 piruvato\"}, {\"l\": \"B\", \"v\": \"2 ATP, 2 NADH e 2 piruvatos\"}, {\"l\": \"C\", \"v\": \"2 ATP, 2 NADPH e 2 acetil-CoA\"}, {\"l\": \"D\", \"v\": \"6 ATP e 1 lactato\"}], \"cr\": \"B\", \"ex\": \"São formados 4 ATP, mas 2 foram consumidos; também formam-se 2 NADH e 2 piruvatos.\", \"n\": 11}, {\"t\": \"mc\", \"c\": \"Glicólise\", \"q\": \"Em quais reações ocorre consumo de ATP?\", \"o\": [{\"l\": \"A\", \"v\": \"Hexoquinase e PFK-1\"}, {\"l\": \"B\", \"v\": \"Aldolase e enolase\"}, {\"l\": \"C\", \"v\": \"Fosfoglicerato-quinase e piruvato-quinase\"}, {\"l\": \"D\", \"v\": \"G3P-desidrogenase e enolase\"}], \"cr\": \"A\", \"ex\": \"As reações 1 e 3 consomem ATP para formar G6P e F1,6BP.\", \"n\": 12}, {\"t\": \"mc\", \"c\": \"Glicólise\", \"q\": \"Em quais reações ocorre produção direta de ATP?\", \"o\": [{\"l\": \"A\", \"v\": \"1 e 3\"}, {\"l\": \"B\", \"v\": \"4 e 5\"}, {\"l\": \"C\", \"v\": \"6 e 8\"}, {\"l\": \"D\", \"v\": \"7 e 10\"}], \"cr\": \"D\", \"ex\": \"Fosfoglicerato-quinase e piruvato-quinase fazem fosforilação em nível de substrato.\", \"n\": 13}, {\"t\": \"mc\", \"c\": \"Glicólise\", \"q\": \"Qual é a enzima comprometora e principal reguladora da glicólise?\", \"o\": [{\"l\": \"A\", \"v\": \"Hexoquinase\"}, {\"l\": \"B\", \"v\": \"PFK-1\"}, {\"l\": \"C\", \"v\": \"Aldolase\"}, {\"l\": \"D\", \"v\": \"Enolase\"}], \"cr\": \"B\", \"ex\": \"PFK-1 converte F6P em F1,6BP e responde intensamente ao estado energético e a F2,6BP.\", \"n\": 14}, {\"t\": \"mc\", \"c\": \"Glicólise\", \"q\": \"Qual composto ativa PFK-1?\", \"o\": [{\"l\": \"A\", \"v\": \"ATP\"}, {\"l\": \"B\", \"v\": \"Citrato\"}, {\"l\": \"C\", \"v\": \"AMP\"}, {\"l\": \"D\", \"v\": \"Acetil-CoA\"}], \"cr\": \"C\", \"ex\": \"AMP sinaliza baixa energia. ATP e citrato inibem PFK-1.\", \"n\": 15}, {\"t\": \"mc\", \"c\": \"Glicólise\", \"q\": \"Qual enzima produz NADH na glicólise?\", \"o\": [{\"l\": \"A\", \"v\": \"Gliceraldeído-3-fosfato-desidrogenase\"}, {\"l\": \"B\", \"v\": \"Piruvato-quinase\"}, {\"l\": \"C\", \"v\": \"Fosfoglicose-isomerase\"}, {\"l\": \"D\", \"v\": \"Lactato-desidrogenase\"}], \"cr\": \"A\", \"ex\": \"Na reação 6, G3P é oxidado e NAD⁺ é reduzido a NADH.\", \"n\": 16}, {\"t\": \"mc\", \"c\": \"Glicólise\", \"q\": \"Após a reação da aldolase, qual triose precisa ser isomerizada para seguir a via?\", \"o\": [{\"l\": \"A\", \"v\": \"G3P em DHAP\"}, {\"l\": \"B\", \"v\": \"DHAP em G3P\"}, {\"l\": \"C\", \"v\": \"PEP em piruvato\"}, {\"l\": \"D\", \"v\": \"G6P em F6P\"}], \"cr\": \"B\", \"ex\": \"A triose-fosfato-isomerase converte DHAP em G3P; assim duas moléculas de G3P seguem adiante.\", \"n\": 17}, {\"t\": \"mc\", \"c\": \"Glicólise\", \"q\": \"Qual reação é inibida pelo fluoreto?\", \"o\": [{\"l\": \"A\", \"v\": \"PFK-1\"}, {\"l\": \"B\", \"v\": \"Enolase\"}, {\"l\": \"C\", \"v\": \"Hexoquinase\"}, {\"l\": \"D\", \"v\": \"Aldolase\"}], \"cr\": \"B\", \"ex\": \"A enolase converte 2-PG em PEP e é inibida por fluoreto.\", \"n\": 18}, {\"t\": \"mc\", \"c\": \"Glicólise\", \"q\": \"A glicólise é considerada uma via que:\", \"o\": [{\"l\": \"A\", \"v\": \"Ocorre apenas na mitocôndria\"}, {\"l\": \"B\", \"v\": \"Usa oxigênio diretamente na reação 6\"}, {\"l\": \"C\", \"v\": \"Ocorre no citosol e não usa O₂ diretamente\"}, {\"l\": \"D\", \"v\": \"Produz CO₂ em sua etapa final\"}], \"cr\": \"C\", \"ex\": \"As dez reações são citosólicas e não consomem O₂; nenhum carbono é liberado como CO₂ na glicólise.\", \"n\": 19}, {\"t\": \"mc\", \"c\": \"Glicólise\", \"q\": \"Qual afirmação diferencia glicoquinase de hexoquinase?\", \"o\": [{\"l\": \"A\", \"v\": \"Glicoquinase tem alta afinidade e é inibida por G6P\"}, {\"l\": \"B\", \"v\": \"Glicoquinase tem maior Km/capacidade e atua no fígado\"}, {\"l\": \"C\", \"v\": \"Hexoquinase existe apenas no fígado\"}, {\"l\": \"D\", \"v\": \"Hexoquinase produz frutose-6-fosfato\"}], \"cr\": \"B\", \"ex\": \"A glicoquinase lida com cargas elevadas de glicose no fígado e funciona como sensor na célula β.\", \"n\": 20}, {\"t\": \"mc\", \"c\": \"Piruvato e fermentação\", \"q\": \"A conversão de piruvato em lactato permite:\", \"o\": [{\"l\": \"A\", \"v\": \"Produzir NADPH\"}, {\"l\": \"B\", \"v\": \"Regenerar NAD⁺\"}, {\"l\": \"C\", \"v\": \"Liberar CO₂\"}, {\"l\": \"D\", \"v\": \"Formar acetil-CoA\"}], \"cr\": \"B\", \"ex\": \"LDH consome NADH e regenera NAD⁺, permitindo continuidade da reação 6 da glicólise.\", \"n\": 21}, {\"t\": \"mc\", \"c\": \"Piruvato e fermentação\", \"q\": \"Qual é o cofator redox da lactato-desidrogenase?\", \"o\": [{\"l\": \"A\", \"v\": \"NADH/NAD⁺\"}, {\"l\": \"B\", \"v\": \"NADPH/NADP⁺\"}, {\"l\": \"C\", \"v\": \"FADH₂/FAD\"}, {\"l\": \"D\", \"v\": \"CoA/acetil-CoA\"}], \"cr\": \"A\", \"ex\": \"A reação lactato–piruvato usa NADH/NAD⁺, não NADPH.\", \"n\": 22}, {\"t\": \"mc\", \"c\": \"Piruvato e fermentação\", \"q\": \"Em condições aeróbicas, o principal destino oxidativo do piruvato é:\", \"o\": [{\"l\": \"A\", \"v\": \"Acetaldeído\"}, {\"l\": \"B\", \"v\": \"Acetil-CoA\"}, {\"l\": \"C\", \"v\": \"Ribose-5-P\"}, {\"l\": \"D\", \"v\": \"Glicogênio diretamente\"}], \"cr\": \"B\", \"ex\": \"O complexo piruvato-desidrogenase forma acetil-CoA, CO₂ e NADH na matriz mitocondrial.\", \"n\": 23}, {\"t\": \"mc\", \"c\": \"Piruvato e fermentação\", \"q\": \"Na fermentação alcoólica, o intermediário entre piruvato e etanol é:\", \"o\": [{\"l\": \"A\", \"v\": \"Oxaloacetato\"}, {\"l\": \"B\", \"v\": \"Acetaldeído\"}, {\"l\": \"C\", \"v\": \"Lactato\"}, {\"l\": \"D\", \"v\": \"Citrato\"}], \"cr\": \"B\", \"ex\": \"Piruvato-descarboxilase produz acetaldeído e CO₂; álcool-desidrogenase produz etanol.\", \"n\": 24}, {\"t\": \"mc\", \"c\": \"Piruvato e fermentação\", \"q\": \"Qual enzima desvia piruvato para gliconeogênese?\", \"o\": [{\"l\": \"A\", \"v\": \"Piruvato-carboxilase\"}, {\"l\": \"B\", \"v\": \"Piruvato-descarboxilase\"}, {\"l\": \"C\", \"v\": \"Piruvato-quinase\"}, {\"l\": \"D\", \"v\": \"PFK-1\"}], \"cr\": \"A\", \"ex\": \"Piruvato-carboxilase forma oxaloacetato na mitocôndria, usando biotina e ATP.\", \"n\": 25}, {\"t\": \"mc\", \"c\": \"Piruvato e fermentação\", \"q\": \"Qual afirmação sobre lactato é correta?\", \"o\": [{\"l\": \"A\", \"v\": \"É um resíduo sem uti
