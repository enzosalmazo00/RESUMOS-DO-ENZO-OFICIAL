a.\", \"n\": 90}, {\"c\": \"Metabolismo das pirimidinas\", \"ce\": \"Metabolismo de las pirimidinas\", \"t\": \"tf\", \"q\": \"A CTP sintetase utiliza UTP como substrato.\", \"qe\": \"La CTP sintetasa utiliza UTP como sustrato.\", \"cr\": \"V\", \"ex\": \"Verdadeiro. UMP recebe fosfato por quinases e vira UDP, depois UTP. CTP sintetase usa glutamina e ATP para converter UTP em CTP. Complemento: ribonucleotídeo redutase produz desoxirribonucleotídeos; timidilato sintase converte dUMP em dTMP usando N5,N10-metileno-THF. Isso permite produzir DNA, não apenas RNA. O 5-fluorouracil interfere na timidilato sintase por seu metabólito FdUMP.\", \"exe\": \"Verdadero. UMP recibe fosfato por cinasas y pasa a UDP, luego UTP. CTP sintetasa utiliza glutamina y ATP para convertir UTP en CTP. Complemento: ribonucleótido reductasa produce desoxirribonucleótidos; timidilato sintasa convierte dUMP en dTMP usando N5,N10-metileno-THF. Esto permite producir ADN. El 5-fluorouracilo interfiere con timidilato sintasa mediante FdUMP.\", \"n\": 91}, {\"c\": \"Metabolismo das pirimidinas\", \"ce\": \"Metabolismo de las pirimidinas\", \"t\": \"tf\", \"q\": \"O N-acetilglutamato é o ativador obrigatório da CPS II.\", \"qe\": \"El N-acetilglutamato es el activador obligatorio de CPS II.\", \"cr\": \"F\", \"ex\": \"Falso. CPS I: mitocondrial, ciclo da ureia, usa amônia livre, ativação obrigatória por N-acetilglutamato, predominante em hepatócitos periportais; também existe no intestino. CPS II: citosólica, síntese de pirimidinas, usa nitrogênio amídico da glutamina, ativada por PRPP, presente em muitos tecidos. Ambas consomem 2 ATP, mas possuem funções e compartimentos diferentes. A expressão «somente hepatócitos» do slide é uma simplificação.\", \"exe\": \"Falso. CPS I: mitocondrial, ciclo de urea, usa amoníaco libre, activación obligatoria por N-acetilglutamato, predomina en hepatocitos periportales y también existe en intestino. CPS II: citosólica, síntesis de pirimidinas, usa nitrógeno amídico de glutamina, activada por PRPP, presente en muchos tejidos. Ambas consumen 2 ATP pero tienen funciones y compartimentos distintos.\", \"n\": 92}, {\"c\": \"Metabolismo das pirimidinas\", \"ce\": \"Metabolismo de las pirimidinas\", \"t\": \"tf\", \"q\": \"A ordem de montagem do anel e incorporação da ribose distingue as vias de purinas e pirimidinas.\", \"qe\": \"El orden de montaje del anillo e incorporación de ribosa distingue las vías de purinas y pirimidinas.\", \"cr\": \"V\", \"ex\": \"Verdadeiro. Purinas: dois anéis; montagem sobre PRPP desde o início, glicina contribui para o esqueleto, IMP é precursor de AMP/GMP, síntese citosólica. Pirimidinas: um anel; montagem antes de PRPP, aspartato é precursor estrutural principal, UMP é precursor de outros nucleotídeos, síntese citosólica com etapa mitocondrial da DHODH. Não confunda o anel pronto com o nucleotídeo pronto.\", \"exe\": \"Verdadero. Purinas: dos anillos; montaje sobre PRPP desde el inicio, glicina contribuye al esqueleto, IMP es precursor de AMP/GMP, síntesis citosólica. Pirimidinas: un anillo; montaje antes de PRPP, aspartato es precursor estructural principal, UMP es precursor de otros nucleótidos, síntesis citosólica con etapa mitocondrial de DHODH.\", \"n\": 93}, {\"c\": \"Metabolismo das pirimidinas\", \"ce\": \"Metabolismo de las pirimidinas\", \"t\": \"tf\", \"q\": \"A degradação de timina produz urato como produto característico.\", \"qe\": \"La degradación de timina produce urato como producto característico.\", \"cr\": \"F\", \"ex\": \"Falso. dTMP → timidina pela nucleotidase → timina pela timidina fosforilase. A di-hidropirimidina desidrogenase (DPD) reduz timina a di-hidrotimina; di-hidropirimidinase abre o anel formando N-carbamoil-β-aminoisobutirato (β-ureidoisobutirato); β-ureidopropionase libera β-aminoisobutirato. Sua transaminação pode formar metilmalonato semialdeído, cujo metabolismo pode gerar propionil-CoA e, por metilmalonil-CoA, succinil-CoA. A mutase atua sobre metilmalonil-CoA, não diretamente sobre o semialdeído.\", \"exe\": \"Falso. dTMP → timidina por nucleotidasa → timina por timidina fosforilasa. DPD reduce timina a dihidrotimina; dihidropirimidinasa abre el anillo formando N-carbamoil-β-aminoisobutirato; β-ureidopropionasa libera β-aminoisobutirato. Su transaminación puede formar metilmalonato semialdehído y luego propionil-CoA, metilmalonil-CoA y succinil-CoA. La mutasa actúa sobre metilmalonil-CoA, no sobre el semialdehído.\", \"n\": 94}, {\"c\": \"Metabolismo das pirimidinas\", \"ce\": \"Metabolismo de las pirimidinas\", \"t\": \"tf\", \"q\": \"A β-alanina é produto do catabolismo da uracila.\", \"qe\": \"La β-alanina es producto del catabolismo del uracilo.\", \"cr\": \"V\", \"ex\": \"Verdadeiro. CMP → citidina; em humanos, citidina desaminase converte citidina em uridina, que pode liberar uracila pela uridina fosforilase. Uracila → di-hidrouracila (DPD) → N-carbamoil-β-alanina (di-hidropirimidinase) → β-alanina + CO₂ + NH₃ (β-ureidopropionase). Correção: o esquema dos slides mostra citosina livre desaminada e «alanina»; o produto humano característico é β-alanina, diferente de α-alanina. DPD também metaboliza 5-fluorouracil, e sua deficiência pode causar toxicidade grave.\", \"exe\": \"Verdadero. CMP → citidina; en humanos, citidina desaminasa convierte citidina en uridina, que puede liberar uracilo por uridina fosforilasa. Uracilo → dihidrouracilo (DPD) → N-carbamoil-β-alanina (dihidropirimidinasa) → β-alanina + CO₂ + NH₃ (β-ureidopropionasa). Corrección: el esquema muestra citosina libre desaminada y «alanina»; el producto humano característico es β-alanina, distinta de α-alanina. DPD también metaboliza 5-fluorouracilo.\", \"n\": 95}, {\"c\": \"Metabolismo das pirimidinas\", \"ce\": \"Metabolismo de las pirimidinas\", \"t\": \"tf\", \"q\": \"A acidúria orótica clássica envolve alteração da síntese de UMP.\", \"qe\": \"La aciduria orótica clásica implica alteración de la síntesis de UMP.\", \"cr\": \"V\", \"ex\": \"Verdadeiro. Deficiência autossômica recessiva da UMP sintase, que reúne orotato fosforribosiltransferase e OMP descarboxilase. O bloqueio orotato → OMP → UMP acumula ácido orótico no sangue e urina e reduz nucleotídeos necessários à síntese de DNA. Causa anemia megaloblástica, atraso de crescimento e possível leucopenia. A anemia não é causada por deficiência primária de B12 ou folato e não responde adequadamente a essas vitaminas. Uridina contorna o bloqueio pela via de salvamento.\", \"exe\": \"Verdadero. Deficiencia autosómica recesiva de UMP sintasa, que reúne orotato fosforribosiltransferasa y OMP descarboxilasa. El bloqueo orotato → OMP → UMP acumula ácido orótico en sangre y orina y reduce nucleótidos para síntesis de ADN. Causa anemia megaloblástica, retraso de crecimiento y posible leucopenia. La anemia no se debe a deficiencia primaria de B12 o folato y no responde adecuadamente a esas vitaminas. Uridina evita el bloqueo por rescate.\", \"n\": 96}, {\"c\": \"Metabolismo das pirimidinas\", \"ce\": \"Metabolismo de las pirimidinas\", \"t\": \"tf\", \"q\": \"A hiperamonemia é um achado que favorece a deficiência de UMP sintase em relação à deficiência de OTC.\", \"qe\": \"La hiperamonemia favorece la deficiencia de UMP sintasa frente a la deficiencia de OTC.\", \"cr\": \"F\", \"ex\": \"Falso. Os slides listam atraso do desenvolvimento, malformações cardíacas, estrabismo bilateral, incapacidade de sentar sem ajuda e macrocristalúria com obstrução ureteral. São manifestações possíveis ou descritas, não critérios universais. Diferenciar de deficiência de ornitina transcarbamilase (OTC): nela, o carbamoil-fosfato mitocondrial em excesso alimenta a via pirimídica e aumenta orotato, com hiperamonemia; na deficiência de UMP sintase, a hiperamonemia não é característica.\", \"exe\": \"Falso. Las diapositivas enumeran retraso del desarrollo, malformaciones cardíacas, estrabismo bilateral, incapacidad de sentarse sin ayuda y macrocristaluria con obstrucción ureteral. Son manifestaciones posibles o descritas, no criterios universales. Diferenciar de deficiencia de ornitina transcarbamilasa (OTC): el exceso de carbamoil-fosfato mitocondrial alimenta la vía pirimidínica y aumenta orotato con hiperamonemia; en déficit de UMP sintasa, hiperamonemia no es característica.\", \"n\": 97}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"mc\", \"q\": \"Quais três propriedades caracterizam porfirinas?\", \"qe\": \"¿Qué tres propiedades caracterizan porfirinas?\", \"ex\": \"Alternativa D. Estrutura tetrapirrólica cíclica, cor e fluorescência. — São compostos cíclicos de quatro anéis pirrólicos unidos por pontes metino (=CH–). Pirrol é um heterociclo de cinco membros com nitrogênio. A porfina, núcleo básico, tem fórmula C20H14N4. A conjugação eletrônica explica cor e fluorescência vermelha de porfirinas livres sob iluminação apropriada. Podem coordenar metais. Heme contém ferro; clorofila contém magnésio; cobalamina contém cobalto. Clorofila é um derivado clorínico e B12 contém um anel corrina, não uma porfirina verdadeira; são estruturas tetrapirrólicas relacionadas.\", \"exe\": \"Opción D. Estructura tetrapirrólica cíclica, color y fluorescencia. — Son compuestos cíclicos de cuatro anillos pirrólicos unidos por puentes metino (=CH–). Pirrol es un heterociclo de cinco miembros con nitrógeno. La porfina tiene fórmula C20H14N4. La conjugación electrónica explica color y fluorescencia roja de porfirinas libres bajo iluminación apropiada. Pueden coordinar metales. Hemo contiene hierro; clorofila magnesio; cobalamina cobalto. Clorofila es derivado clorínico y B12 contiene anillo corrina, no una porfirina verdadera.\", \"n\": 98, \"cr\": \"D\", \"o\": [{\"l\": \"A\", \"v\": \"Anel único de seis membros e ausência de fluorescência\", \"ve\": \"Anillo único de seis miembros y ausencia de fluorescencia\"}, {\"l\": \"B\", \"v\": \"Cadeia linear de glicose, cor e ferro\", \"ve\": \"Cadena lineal de glucosa, color y hierro\"}, {\"l\": \"C\", \"v\": \"Dois anéis fundidos, ausência de cor e fosfato\", \"ve\": \"Dos anillos fusionados, ausencia de color y fosfato\"}, {\"l\": \"D\", \"v\": \"Estrutura tetrapirrólica cíclica, cor e fluorescência.\", \"ve\": \"Estructura tetrapirrólica cíclica, color y fluorescencia.\"}]}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"mc\", \"q\": \"Qual metal está no centro da cobalamina?\", \"qe\": \"¿Qué metal está en el centro de cobalamina?\", \"ex\": \"Alternativa A. Cobalto. — Clorofila capta energia luminosa para a fotossíntese, processo que usa CO₂ e água para produzir carboidratos e liberar oxigênio. Cianocobalamina é uma forma de B12; B12 é necessária para síntese de DNA, maturação eritroide e função neurológica. Sua deficiência causa anemia megaloblástica e neuropatia; anemia perniciosa é especificamente deficiência de B12 por gastrite autoimune com falta de fator intrínseco. Fármacos citados que podem interferir na absorção: omeprazol/lansoprazol (IBP), ranitidina/famotidina (H2), metformina, colchicina, neomicina e ácido para-aminossalicílico. A relevância depende de exposição, duração e paciente.\", \"exe\": \"Opción A. Cobalto. — Clorofila capta energía luminosa para fotosíntesis, que utiliza CO₂ y agua para producir carbohidratos y liberar oxígeno. Cianocobalamina es una forma de B12; B12 es necesaria para síntesis de ADN, maduración eritroide y función neurológica. Su déficit causa anemia megaloblástica y neuropatía; anemia perniciosa es específicamente déficit por gastritis autoinmune con falta de factor intrínseco. Fármacos citados: omeprazol/lansoprazol, ranitidina/famotidina, metformina, colchicina, neomicina y ácido paraaminosalicílico. La relevancia depende de exposición y paciente.\", \"n\": 99, \"cr\": \"A\", \"o\": [{\"l\": \"A\", \"v\": \"Cobalto.\", \"ve\": \"Cobalto.\"}, {\"l\": \"B\", \"v\": \"Ferro\", \"ve\": \"Hierro\"}, {\"l\": \"C\", \"v\": \"Zinco\", \"ve\": \"Zinc\"}, {\"l\": \"D\", \"v\": \"Magnésio\", \"ve\": \"Magnesio\"}]}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"mc\", \"q\": \"Qual estado do ferro permite a ligação reversível de O₂ na hemoglobina?\", \"qe\": \"¿Qué estado de hierro permite unión reversible de O₂ en hemoglobina?\", \"ex\": \"Alternativa D. Fe²⁺. — Heme b é protoporfirina IX coordenada a Fe²⁺. Na hemoglobina transporta O₂ no sangue; na mioglobina armazena O₂ muscular. Oxidação para Fe³⁺ na hemoglobina forma metemoglobina, incapaz de ligar O₂ naquele sítio; na mioglobina forma metmioglobina. Citocromo c transfere elétrons na cadeia respiratória; citocromos P450 oxidam xenobióticos e substâncias endógenas; catalase degrada H₂O₂ em água e O₂; triptofano pirrolase (triptofano 2,3-dioxigenase) inicia oxidação do triptofano na via da quinurenina.\", \"exe\": \"Opción D. Fe²⁺. — Hemo b es protoporfirina IX coordinada a Fe²⁺. Hemoglobina transporta O₂; mioglobina almacena O₂ muscular. Oxidación a Fe³⁺ en hemoglobina forma metahemoglobina, incapaz de unir O₂ en ese sitio; en mioglobina forma metamioglobina. Citocromo c transfiere electrones; P450 oxida xenobióticos y sustancias endógenas; catalasa degrada H₂O₂ en agua y O₂; triptófano pirrolasa (triptófano 2,3-dioxigenasa) inicia oxidación de triptófano en la vía de quinurenina.\", \"n\": 100, \"cr\": \"D\", \"o\": [{\"l\": \"A\", \"v\": \"Fe³⁺\", \"ve\": \"Fe³⁺\"}, {\"l\": \"B\", \"v\": \"Fe⁰\", \"ve\": \"Fe⁰\"}, {\"l\": \"C\", \"v\": \"Fe⁴⁺\", \"ve\": \"Fe⁴⁺\"}, {\"l\": \"D\", \"v\": \"Fe²⁺.\", \"ve\": \"Fe²⁺.\"}]}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"mc\", \"q\": \"Por que a hemácia madura não sintetiza heme?\", \"qe\": \"¿Por qué el eritrocito maduro no sintetiza hemo?\", \"ex\": \"Alternativa B. Não possui mitocôndrias. — A síntese ocorre principalmente em precursores eritroides da medula óssea e hepatócitos. Os slides apresentam 40–50 mg/dia e 80–85% destinado à hemoglobina; o primeiro número não deve ser interpretado como produção corporal total, pois a renovação eritrocitária requer quantidade maior. Hemácias maduras não possuem mitocôndrias e não sintetizam heme. B6 na forma piridoxal-fosfato (PLP) é coenzima da ALA sintase; deficiência pode causar anemia microcítica/sideroblástica. Isoniazida interfere com B6; alguns antiparkinsonianos também podem interferir no seu metabolismo. PLP não é o grupo que liga O₂ na hemoglobina: essa função é do ferro do heme.\", \"exe\": \"Opción B. Carece de mitocondrias. — La síntesis ocurre principalmente en precursores eritroides de médula ósea y hepatocitos. Las diapositivas presentan 40–50 mg/día y 80–85% destinado a hemoglobina; la primera cifra no debe interpretarse como producción corporal total, pues la renovación eritrocitaria requiere más. Eritrocitos maduros carecen de mitocondrias y no sintetizan hemo. B6 como piridoxal-fosfato (PLP) es coenzima de ALA sintasa; su déficit puede causar anemia microcítica/sideroblástica. Isoniazida interfiere con B6; algunos antiparkinsonianos también pueden hacerlo. PLP no une O₂ en hemoglobina; lo hace el hierro del hemo.\", \"n\": 101, \"cr\": \"B\", \"o\": [{\"l\": \"A\", \"v\": \"Não possui membrana\", \"ve\": \"Carece de membrana\"}, {\"l\": \"B\", \"v\": \"Não possui mitocôndrias.\", \"ve\": \"Carece de mitocondrias.\"}, {\"l\": \"C\", \"v\": \"Não possui ferro\", \"ve\": \"Carece de hierro\"}, {\"l\": \"D\", \"v\": \"Não possui hemoglobina\", \"ve\": \"Carece de hemoglobina\"}]}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"mc\", \"q\": \"Qual enzima regula a biossíntese de heme e qual seu cofator?\", \"qe\": \"¿Qué enzima regula biosíntesis de hemo y cuál es su cofactor?\", \"ex\": \"Alternativa C. ALA sintase; PLP (B6). — Na matriz mitocondrial, glicina + succinil-CoA → δ-aminolevulinato (ALA) + CoA + CO₂, com PLP. ALA sintase (ALAS) catalisa a etapa inicial limitante. ALAS1 é regulada negativamente pelo heme no fígado; ALAS2 eritroide é regulada pela disponibilidade de ferro e diferenciação celular. Succinil-CoA conecta a síntese de heme ao ciclo de Krebs.\", \"exe\": \"Opción C. ALA sintasa; PLP (B6). — En matriz mitocondrial, glicina + succinil-CoA → δ-aminolevulinato (ALA) + CoA + CO₂, con PLP. ALA sintasa (ALAS) cataliza el paso inicial limitante. ALAS1 es regulada negativamente por hemo en hígado; ALAS2 eritroide por disponibilidad de hierro y diferenciación celular. Succinil-CoA conecta síntesis de hemo con ciclo de Krebs.\", \"n\": 102, \"cr\": \"C\", \"o\": [{\"l\": \"A\", \"v\": \"ALA desidratase; B12\", \"ve\": \"ALA deshidratasa; B12\"}, {\"l\": \"B\", \"v\": \"UGT1A1; B6\", \"ve\": \"UGT1A1; B6\"}, {\"l\": \"C\", \"v\": \"ALA sintase; PLP (B6).\", \"ve\": \"ALA sintasa; PLP (B6).\"}, {\"l\": \"D\", \"v\": \"Ferroquelatase; B1\", \"ve\": \"Ferroquelatasa; B1\"}]}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"mc\", \"q\": \"Qual produto surge da união de duas moléculas de ALA?\", \"qe\": \"¿Qué producto surge de unir dos moléculas de ALA?\", \"ex\": \"Alternativa A. Porfobilinogênio. — No citosol, duas moléculas de ALA condensam-se em porfobilinogênio (PBG), um monômero pirrólico, pela ALA desidratase (porfobilinogênio sintase), dependente de zinco. Chumbo inibe essa enzima e também a ferroquelatase; aumenta ALA e compromete síntese de heme.\", \"exe\": \"Opción A. Porfobilinógeno. — En citosol, dos moléculas de ALA se condensan en porfobilinógeno (PBG), un monómero pirrólico, por ALA deshidratasa (porfobilinógeno sintasa), dependiente de zinc. Plomo inhibe esta enzima y ferroquelatasa; aumenta ALA y compromete síntesis de hemo.\", \"n\": 103, \"cr\": \"A\", \"o\": [{\"l\": \"A\", \"v\": \"Porfobilinogênio.\", \"ve\": \"Porfobilinógeno.\"}, {\"l\": \"B\", \"v\": \"Biliverdina\", \"ve\": \"Biliverdina\"}, {\"l\": \"C\", \"v\": \"Protoporfirina IX\", \"ve\": \"Protoporfirina IX\"}, {\"l\": \"D\", \"v\": \"Uroporfirinogênio III\", \"ve\": \"Uroporfirinógeno III\"}]}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"mc\", \"q\": \"Qual enzima forma hidroximetilbilano?\", \"qe\": \"¿Qué enzima forma hidroximetilbilano?\", \"ex\": \"Alternativa D. HMBS (porfobilinogênio desaminase). — A porfobilinogênio desaminase (hidroximetilbilano sintase, HMBS) une quatro PBG em hidroximetilbilano, tetrapirrol linear. A uroporfirinogênio III sintase fecha e reorganiza o anel em uroporfirinogênio III. Sem essa enzima, pode ocorrer ciclização espontânea para isômero I não produtivo para heme.\", \"exe\": \"Opción D. HMBS (porfobilinógeno desaminasa). — Porfobilinógeno desaminasa (hidroximetilbilano sintasa, HMBS) une cuatro PBG en hidroximetilbilano lineal. Uroporfirinógeno III sintasa cierra y reorganiza el anillo en uroporfirinógeno III. Sin esta enzima puede ocurrir ciclación espontánea a isómero I no productivo para hemo.\", \"n\": 104, \"cr\": \"D\", \"o\": [{\"l\": \"A\", \"v\": \"UROD\", \"ve\": \"UROD\"}, {\"l\": \"B\", \"v\": \"FECH\", \"ve\": \"FECH\"}, {\"l\": \"C\", \"v\": \"PPOX\", \"ve\": \"PPOX\"}, {\"l\": \"D\", \"v\": \"HMBS (porfobilinogênio desaminase).\", \"ve\": \"HMBS (porfobilinógeno desaminasa).\"}]}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"mc\", \"q\": \"Qual enzima está relacionada à porfiria cutânea tardia?\", \"qe\": \"¿Qué enzima se relaciona con porfiria cutánea tardía?\", \"ex\": \"Alternativa B. UROD. — Uroporfirinogênio descarboxilase (UROD) remove CO₂ de quatro grupos acetato, convertendo-os em grupos metila e produzindo coproporfirinogênio III no citosol. É a última etapa citosólica. Deficiência de UROD associa-se à porfiria cutânea tardia.\", \"exe\": \"Opción B. UROD. — Uroporfirinógeno descarboxilasa (UROD) retira CO₂ de cuatro grupos acetato, convirtiéndolos en metilo y produciendo coproporfirinógeno III en citosol. Es el último paso citosólico. Deficiencia de UROD se asocia a porfiria cutánea tardía.\", \"n\": 105, \"cr\": \"B\", \"o\": [{\"l\": \"A\", \"v\": \"UGT1A1\", \"ve\": \"UGT1A1\"}, {\"l\": \"B\", \"v\": \"UROD.\", \"ve\": \"UROD.\"}, {\"l\": \"C\", \"v\": \"CPS II\", \"ve\": \"CPS II\"}, {\"l\": \"D\", \"v\": \"HGPRT\", \"ve\": \"HGPRT\"}]}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"mc\", \"q\": \"Qual enzima forma protoporfirina IX?\", \"qe\": \"¿Qué enzima forma protoporfirina IX?\", \"ex\": \"Alternativa D. PPOX. — Na mitocôndria, coproporfirinogênio oxidase (CPOX) converte coproporfirinogênio III em protoporfirinogênio IX por descarboxilação oxidativa de duas cadeias propionato a vinila. Protoporfirinogênio oxidase (PPOX) oxida protoporfirinogênio IX a protoporfirina IX. Porfirinogênios são formas reduzidas, enquanto porfirinas têm sistema conjugado oxidado.\", \"exe\": \"Opción D. PPOX. — En mitocondria, coproporfirinógeno oxidasa (CPOX) convierte coproporfirinógeno III en protoporfirinógeno IX mediante descarboxilación oxidativa de dos propionatos a vinilos. Protoporfirinógeno oxidasa (PPOX) oxida protoporfirinógeno IX a protoporfirina IX. Los porfirinógenos son formas reducidas y las porfirinas tienen sistema conjugado oxidado.\", \"n\": 106, \"cr\": \"D\", \"o\": [{\"l\": \"A\", \"v\": \"HMBS\", \"ve\": \"HMBS\"}, {\"l\": \"B\", \"v\": \"CPOX\", \"ve\": \"CPOX\"}, {\"l\": \"C\", \"v\": \"ALA sintase\", \"ve\": \"ALA sintasa\"}, {\"l\": \"D\", \"v\": \"PPOX.\", \"ve\": \"PPOX.\"}]}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"mc\", \"q\": \"Qual enzima insere Fe²⁺ na protoporfirina IX?\", \"qe\": \"¿Qué enzima inserta Fe²⁺ en protoporfirina IX?\", \"ex\": \"Alternativa B. Ferroquelatase. — A ferroquelatase (FECH), na membrana mitocondrial interna, insere Fe²⁺ na protoporfirina IX, formando heme. É a última das oito etapas. Sequência espacial: etapa 1 mitocondrial, etapas 2–5 citosólicas, etapas 6–8 mitocondriais. Chumbo interfere na FECH; deficiência hereditária pode causar protoporfiria eritropoiética.\", \"exe\": \"Opción B. Ferroquelatasa. — Ferroquelatasa (FECH), en membrana mitocondrial interna, inserta Fe²⁺ en protoporfirina IX formando hemo. Es el último de ocho pasos. Secuencia espacial: paso 1 mitocondrial, pasos 2–5 citosólicos, pasos 6–8 mitocondriales. Plomo interfiere con FECH; su déficit hereditario puede causar protoporfiria eritropoyética.\", \"n\": 107, \"cr\": \"B\", \"o\": [{\"l\": \"A\", \"v\": \"UROD\", \"ve\": \"UROD\"}, {\"l\": \"B\", \"v\": \"Ferroquelatase.\", \"ve\": \"Ferroquelatasa.\"}, {\"l\": \"C\", \"v\": \"HMBS\", \"ve\": \"HMBS\"}, {\"l\": \"D\", \"v\": \"PPOX\", \"ve\": \"PPOX\"}]}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"mc\", \"q\": \"Onde ocorre principalmente a degradação de hemácias senescentes?\", \"qe\": \"¿Dónde ocurre principalmente degradación de eritrocitos senescentes?\", \"ex\": \"Alternativa A. Macrófagos do baço, fígado e medula óssea. — Após aproximadamente 120 dias de vida, hemácias senescentes são fagocitadas por macrófagos principalmente no baço, fígado e medula óssea. Globina é degradada em aminoácidos reutilizáveis. Ferro é recuperado e armazenado ou transportado pela transferrina. A porção porfirínica é convertida em pigmentos biliares. O slide menciona renovação de cerca de 6 g/dia de hemoglobina; esse valor é aproximado.\", \"exe\": \"Opción A. Macrófagos de bazo, hígado y médula ósea. — Tras aproximadamente 120 días, eritrocitos senescentes son fagocitados por macrófagos principalmente en bazo, hígado y médula ósea. Globina se degrada a aminoácidos reutilizables. Hierro se recupera y almacena o transporta por transferrina. La porción porfirínica se convierte en pigmentos biliares. La diapositiva menciona renovación aproximada de 6 g/día de hemoglobina.\", \"n\": 108, \"cr\": \"A\", \"o\": [{\"l\": \"A\", \"v\": \"Macrófagos do baço, fígado e medula óssea.\", \"ve\": \"Macrófagos de bazo, hígado y médula ósea.\"}, {\"l\": \"B\", \"v\": \"Neurônios corticais\", \"ve\": \"Neuronas corticales\"}, {\"l\": \"C\", \"v\": \"Células beta pancreáticas\", \"ve\": \"Células beta pancreáticas\"}, {\"l\": \"D\", \"v\": \"Enterócitos do duodeno\", \"ve\": \"Enterocitos duodenales\"}]}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"mc\", \"q\": \"Quais produtos são formados diretamente pela heme oxigenase?\", \"qe\": \"¿Qué productos forma directamente hemo oxigenasa?\", \"ex\": \"Alternativa B. Biliverdina, ferro e CO. — Heme oxigenase abre o anel do heme, usando O₂ e poder redutor, formando biliverdina, ferro e monóxido de carbono (CO). Biliverdina redutase converte biliverdina (verde) em bilirrubina não conjugada (amarela), pouco hidrossolúvel. Ela circula ligada à albumina e não é filtrada normalmente na urina. Heme oxigenase é a etapa regulatória inicial da degradação.\", \"exe\": \"Opción B. Biliverdina, hierro y CO. — Hemo oxigenasa abre el anillo de hemo usando O₂ y poder reductor, formando biliverdina, hierro y monóxido de carbono (CO). Biliverdina reductasa convierte biliverdina (verde) en bilirrubina no conjugada (amarilla), poco hidrosoluble. Circula unida a albúmina y normalmente no se filtra en orina. Hemo oxigenasa es la etapa reguladora inicial.\", \"n\": 109, \"cr\": \"B\", \"o\": [{\"l\": \"A\", \"v\": \"Urato, ferro e ureia\", \"ve\": \"Urato, hierro y urea\"}, {\"l\": \"B\", \"v\": \"Biliverdina, ferro e CO.\", \"ve\": \"Biliverdina, hierro y CO.\"}, {\"l\": \"C\", \"v\": \"Bilirrubina, amônia e ATP\", \"ve\": \"Bilirrubina, amoníaco y ATP\"}, {\"l\": \"D\", \"v\": \"Heme, glicina e CO₂\", \"ve\": \"Hemo, glicina y CO₂\"}]}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"mc\", \"q\": \"Qual enzima conjuga a bilirrubina?\", \"qe\": \"¿Qué enzima conjuga bilirrubina?\", \"ex\": \"Alternativa C. UGT1A1. — Hepatócitos captam bilirrubina; transportadores OATP participam do transporte hepático, especialmente da recaptura de conjugados. UGT1A1 (UDP-glucuronosiltransferase) conjuga bilirrubina com ácido glucurônico, aumentando solubilidade. MRP2 exporta bilirrubina conjugada para canalículos biliares. Bilirrubina direta corresponde principalmente à conjugada; indireta, principalmente à não conjugada. A direta pode aparecer na urina quando elevada no plasma.\", \"exe\": \"Opción C. UGT1A1. — Hepatocitos captan bilirrubina; transportadores OATP participan en transporte hepático, especialmente recaptación de conjugados. UGT1A1 (UDP-glucuronosiltransferasa) conjuga bilirrubina con ácido glucurónico, aumentando solubilidad. MRP2 exporta bilirrubina conjugada a canalículos biliares. Bilirrubina directa corresponde principalmente a conjugada; indirecta a no conjugada. La directa puede aparecer en orina si aumenta en plasma.\", \"n\": 110, \"cr\": \"C\", \"o\": [{\"l\": \"A\", \"v\": \"Heme oxigenase\", \"ve\": \"Hemo oxigenasa\"}, {\"l\": \"B\", \"v\": \"Biliverdina redutase\", \"ve\": \"Biliverdina reductasa\"}, {\"l\": \"C\", \"v\": \"UGT1A1.\", \"ve\": \"UGT1A1.\"}, {\"l\": \"D\", \"v\": \"Ferroquelatase\", \"ve\": \"Ferroquelatasa\"}]}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"mc\", \"q\": \"Qual pigmento contribui para a cor marrom das fezes?\", \"qe\": \"¿Qué pigmento contribuye al color marrón de las heces?\", \"ex\": \"Alternativa D. Estercobilina. — Bactérias intestinais convertem bilirrubina em urobilinogênio. A maior parte é eliminada pelas fezes após oxidação a pigmentos como estercobilina (marrom); parte retorna pela circulação entero-hepática, e pequena fração alcança os rins e origina urobilina (amarela). Obstrução biliar pode causar fezes claras e urina escura por bilirrubina conjugada.\", \"exe\": \"Opción D. Estercobilina. — Bacterias intestinales convierten bilirrubina en urobilinógeno. La mayor parte se elimina en heces tras oxidación a pigmentos como estercobilina (marrón); parte retorna por circulación enterohepática y una pequeña fracción llega al riñón y origina urobilina (amarilla). Obstrucción biliar puede causar heces claras y orina oscura por bilirrubina conjugada.\", \"n\": 111, \"cr\": \"D\", \"o\": [{\"l\": \"A\", \"v\": \"Urobilina\", \"ve\": \"Urobilina\"}, {\"l\": \"B\", \"v\": \"Biliverdina\", \"ve\": \"Biliverdina\"}, {\"l\": \"C\", \"v\": \"Porfobilinogênio\", \"ve\": \"Porfobilinógeno\"}, {\"l\": \"D\", \"v\": \"Estercobilina.\", \"ve\": \"Estercobilina.\"}]}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"mc\", \"q\": \"Qual diferença entre hiperbilirrubinemia e icterícia?\", \"qe\": \"¿Qué diferencia hay entre hiperbilirrubinemia e ictericia?\", \"ex\": \"Alternativa C. A primeira é laboratorial; a segunda é sinal clínico. — Hiperbilirrubinemia é bilirrubina acima do limite de referência; icterícia é coloração amarelada de pele, mucosas e escleras, geralmente visível em torno de 2–3 mg/dL. O slide 10 indica total até 1,0, direta até 0,4 e indireta até 0,6 mg/dL; o slide 9 usa total 0,3–1,2, direta 0–0,3 e indireta 0,2–0,9 mg/dL. São intervalos didáticos distintos; use o laboratório na prática. Pode ocorrer por produção excessiva, insuficiência de captação/conjugação ou falha de excreção.\", \"exe\": \"Opción C. La primera es de laboratorio; la segunda es signo clínico. — Hiperbilirrubinemia es bilirrubina por encima del límite de referencia; ictericia es coloración amarilla de piel, mucosas y escleras, generalmente visible alrededor de 2–3 mg/dL. Diapositiva 10 indica total hasta 1,0, directa hasta 0,4 e indirecta hasta 0,6 mg/dL; la 9 usa total 0,3–1,2, directa 0–0,3 e indirecta 0,2–0,9 mg/dL. Son intervalos didácticos distintos; use el laboratorio en práctica. Puede deberse a producción excesiva o falla de captación, conjugación o excreción.\", \"n\": 112, \"cr\": \"C\", \"o\": [{\"l\": \"A\", \"v\": \"A primeira é urinária; a segunda é exclusivamente fecal\", \"ve\": \"La primera es urinaria; la segunda exclusivamente fecal\"}, {\"l\": \"B\", \"v\": \"A primeira é cutânea; a segunda é enzimática\", \"ve\": \"La primera es cutánea; la segunda enzimática\"}, {\"l\": \"C\", \"v\": \"A primeira é laboratorial; a segunda é sinal clínico.\", \"ve\": \"La primera es de laboratorio; la segunda es signo clínico.\"}, {\"l\": \"D\", \"v\": \"São sempre sinônimos\", \"ve\": \"Son siempre sinónimos\"}]}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"mc\", \"q\": \"Qual fração tende a aumentar na hemólise isolada?\", \"qe\": \"¿Qué fracción tiende a aumentar en hemólisis aislada?\", \"ex\": \"Alternativa B. Bilirrubina indireta. — Predomínio indireto: hemólise aumentada, síndrome de Gilbert (redução leve de UGT1A1), Crigler-Najjar (deficiência importante de UGT1A1). Predomínio direto: colestase por cálculos biliares ou outras obstruções e defeitos de excreção. Hepatites e cirrose podem elevar ambas as frações; álcool e fármacos podem causar lesão hepática. O padrão de bilirrubina isoladamente não fecha diagnóstico.\", \"exe\": \"Opción B. Bilirrubina indirecta. — Predominio indirecto: hemólisis aumentada, síndrome de Gilbert (reducción leve de UGT1A1), Crigler-Najjar (déficit importante de UGT1A1). Predominio directo: colestasis por cálculos biliares u otras obstrucciones y defectos de excreción. Hepatitis y cirrosis pueden elevar ambas fracciones; alcohol y fármacos pueden lesionar hígado. El patrón aislado no establece diagnóstico.\", \"n\": 113, \"cr\": \"B\", \"o\": [{\"l\": \"A\", \"v\": \"Protoporfirina IX plasmática\", \"ve\": \"Protoporfirina IX plasmática\"}, {\"l\": \"B\", \"v\": \"Bilirrubina indireta.\", \"ve\": \"Bilirrubina indirecta.\"}, {\"l\": \"C\", \"v\": \"Estercobilina sérica\", \"ve\": \"Estercobilina sérica\"}, {\"l\": \"D\", \"v\": \"Bilirrubina direta\", \"ve\": \"Bilirrubina directa\"}]}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"mc\", \"q\": \"Por que a luz solar provoca lesões nas porfirias cutâneas?\", \"qe\": \"¿Por qué la luz solar causa lesiones en porfirias cutáneas?\", \"ex\": \"Alternativa D. Porfirinas fotoativadas geram espécies reativas de oxigênio. — São doenças por alterações de enzimas da síntese de heme, hereditárias ou adquiridas, com acúmulo de precursores. As formas cutâneas podem produzir fotossensibilidade, bolhas, fragilidade, cicatrizes, hipertricose e, em formas graves raras, lesões mutilantes em áreas expostas, dentes avermelhados (eritrodontia), urina escura e anemia hemolítica. As porfirinas absorvem luz e transferem energia ao oxigênio, gerando espécies reativas que lesam tecidos. Pele, mãos, face, dentes e urina são locais ou manifestações destacados nos slides. Nem todos os pacientes apresentam essas alterações.\", \"exe\": \"Opción D. Porfirinas fotoactivadas generan especies reactivas de oxígeno. — Son enfermedades por alteraciones de enzimas de síntesis de hemo, hereditarias o adquiridas, con acumulación de precursores. Formas cutáneas pueden causar fotosensibilidad, ampollas, fragilidad, cicatrices, hipertricosis y, en formas graves raras, lesiones mutilantes en zonas expuestas, dientes rojizos (eritrodoncia), orina oscura y anemia hemolítica. Las porfirinas absorben luz y transfieren energía al oxígeno generando especies reactivas que dañan tejidos. Piel, manos, cara, dientes y orina son lugares o manifestaciones destacadas. No todos presentan estos cambios.\", \"n\": 114, \"cr\": \"D\", \"o\": [{\"l\": \"A\", \"v\": \"A luz converte urato em cristais\", \"ve\": \"La luz convierte urato en cristales\"}, {\"l\": \"B\", \"v\": \"A luz remove ferro da hemoglobina diretamente\", \"ve\": \"La luz elimina hierro de hemoglobina directamente\"}, {\"l\": \"C\", \"v\": \"A luz bloqueia toda UGT1A1\", \"ve\": \"La luz bloquea toda UGT1A1\"}, {\"l\": \"D\", \"v\": \"Porfirinas fotoativadas geram espécies reativas de oxigênio.\", \"ve\": \"Porfirinas fotoactivadas generan especies reactivas de oxígeno.\"}]}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"mc\", \"q\": \"Quais precursores se acumulam nas porfirias hepáticas agudas?\", \"qe\": \"¿Qué precursores se acumulan en porfirias hepáticas agudas?\", \"ex\": \"Alternativa B. ALA e PBG (com exceções conforme o subtipo). — Nas porfirias hepáticas agudas, ALA e PBG podem acumular-se e associar-se a dor abdominal intensa, alterações autonômicas, neuropatia, fraqueza e paralisia. ALA é particularmente implicado na neurotoxicidade. Porfiria aguda intermitente (HMBS) tipicamente não causa fotossensibilidade; porfiria cutânea tardia (UROD) causa lesões cutâneas. Os slides associam palidez, hipertricose, lesões faciais e dentes à lenda de vampiros e lobisomens e citam Julia Gnuse; trate isso como analogia histórica especulativa, não fato causal estabelecido. Diagnóstico depende do padrão de ALA, PBG e porfirinas, seguido de avaliação específica.\", \"exe\": \"Opción B. ALA y PBG (con excepciones según subtipo). — En porfirias hepáticas agudas, ALA y PBG pueden acumularse y asociarse con dolor abdominal intenso, cambios autonómicos, neuropatía, debilidad y parálisis. ALA está especialmente implicado en neurotoxicidad. Porfiria aguda intermitente (HMBS) típicamente no causa fotosensibilidad; porfiria cutánea tardía (UROD) causa lesiones cutáneas. Las diapositivas asocian palidez, hipertricosis, lesiones faciales y dientes con leyendas de vampiros y licántropos y citan a Julia Gnuse; es una analogía histórica especulativa, no causalidad establecida. El diagnóstico depende del patrón de ALA, PBG y porfirinas.\", \"n\": 115, \"cr\": \"B\", \"o\": [{\"l\": \"A\", \"v\": \"UTP e CTP\", \"ve\": \"UTP y CTP\"}, {\"l\": \"B\", \"v\": \"ALA e PBG (com exceções conforme o subtipo).\", \"ve\": \"ALA y PBG (con excepciones según subtipo).\"}, {\"l\": \"C\", \"v\": \"Urato e xantina\", \"ve\": \"Urato y xantina\"}, {\"l\": \"D\", \"v\": \"AMP e GMP\", \"ve\": \"AMP y GMP\"}]}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"mc\", \"q\": \"Quais são os dois substratos iniciais da síntese de heme?\", \"qe\": \"¿Cuáles son los dos sustratos iniciales de síntesis de hemo?\", \"o\": [{\"l\": \"A\", \"v\": \"Ribose e ATP\", \"ve\": \"Ribosa y ATP\"}, {\"l\": \"B\", \"v\": \"Glutamina e bicarbonato\", \"ve\": \"Glutamina y bicarbonato\"}, {\"l\": \"C\", \"v\": \"Urato e alanina\", \"ve\": \"Urato y alanina\"}, {\"l\": \"D\", \"v\": \"Glicina e succinil-CoA\", \"ve\": \"Glicina y succinil-CoA\"}], \"cr\": \"D\", \"ex\": \"Alternativa D. ALA sintase condensa glicina e succinil-CoA com PLP na mitocôndria.\", \"exe\": \"Opción D. ALA sintasa condensa glicina y succinil-CoA con PLP en mitocondria.\", \"n\": 116}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"mc\", \"q\": \"Qual metal está presente no heme?\", \"qe\": \"¿Qué metal está presente en hemo?\", \"o\": [{\"l\": \"A\", \"v\": \"Cálcio\", \"ve\": \"Calcio\"}, {\"l\": \"B\", \"v\": \"Cobalto\", \"ve\": \"Cobalto\"}, {\"l\": \"C\", \"v\": \"Magnésio\", \"ve\": \"Magnesio\"}, {\"l\": \"D\", \"v\": \"Ferro\", \"ve\": \"Hierro\"}], \"cr\": \"D\", \"ex\": \"Alternativa D. O heme possui ferro; clorofila possui magnésio; cobalamina possui cobalto.\", \"exe\": \"Opción D. Hemo posee hierro; clorofila magnesio; cobalamina cobalto.\", \"n\": 117}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"mc\", \"q\": \"Quais enzimas são inibidas pelo chumbo na síntese de heme?\", \"qe\": \"¿Qué enzimas inhibe plomo en síntesis de hemo?\", \"o\": [{\"l\": \"A\", \"v\": \"UGT1A1 e MRP2\", \"ve\": \"UGT1A1 y MRP2\"}, {\"l\": \"B\", \"v\": \"CPS I e CPS II\", \"ve\": \"CPS I y CPS II\"}, {\"l\": \"C\", \"v\": \"ALA desidratase e ferroquelatase\", \"ve\": \"ALA deshidratasa y ferroquelatasa\"}, {\"l\": \"D\", \"v\": \"HGPRT e APRT\", \"ve\": \"HGPRT y APRT\"}], \"cr\": \"C\", \"ex\": \"Alternativa C. A intoxicação interfere em duas etapas da síntese e pode elevar ALA.\", \"exe\": \"Opción C. La intoxicación interfiere en dos pasos de síntesis y puede elevar ALA.\", \"n\": 118}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"mc\", \"q\": \"Qual enzima catalisa a etapa regulatória inicial do catabolismo do heme?\", \"qe\": \"¿Qué enzima cataliza el paso regulador inicial del catabolismo de hemo?\", \"o\": [{\"l\": \"A\", \"v\": \"Ferroquelatase\", \"ve\": \"Ferroquelatasa\"}, {\"l\": \"B\", \"v\": \"CTP sintetase\", \"ve\": \"CTP sintetasa\"}, {\"l\": \"C\", \"v\": \"ALA sintase\", \"ve\": \"ALA sintasa\"}, {\"l\": \"D\", \"v\": \"Heme oxigenase\", \"ve\": \"Hemo oxigenasa\"}], \"cr\": \"D\", \"ex\": \"Alternativa D. Heme oxigenase abre o anel e libera biliverdina, ferro e CO.\", \"exe\": \"Opción D. Hemo oxigenasa abre el anillo y libera biliverdina, hierro y CO.\", \"n\": 119}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"mc\", \"q\": \"Urina escura, fezes claras e bilirrubina direta elevada sugerem qual mecanismo?\", \"qe\": \"Orina oscura, heces claras y bilirrubina directa elevada sugieren ¿qué mecanismo?\", \"o\": [{\"l\": \"A\", \"v\": \"Colestase/obstrução biliar\", \"ve\": \"Colestasis/obstrucción biliar\"}, {\"l\": \"B\", \"v\": \"Hemólise isolada\", \"ve\": \"Hemólisis aislada\"}, {\"l\": \"C\", \"v\": \"Deficiência de B6 isolada\", \"ve\": \"Déficit aislado de B6\"}, {\"l\": \"D\", \"v\": \"Deficiência de HGPRT\", \"ve\": \"Déficit de HGPRT\"}], \"cr\": \"A\", \"ex\": \"Alternativa A. A bilirrubina conjugada não é excretada adequadamente na bile e pode aparecer na urina.\", \"exe\": \"Opción A. La bilirrubina conjugada no se excreta bien por bilis y puede aparecer en orina.\", \"n\": 120}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"mc\", \"q\": \"Qual conjunto de sinais é compatível com porfiria cutânea grave?\", \"qe\": \"¿Qué conjunto de signos es compatible con porfiria cutánea grave?\", \"o\": [{\"l\": \"A\", \"v\": \"Poliúria, polidipsia e hiperglicemia\", \"ve\": \"Poliuria, polidipsia e hiperglucemia\"}, {\"l\": \"B\", \"v\": \"Fotossensibilidade, bolhas e hipertricose\", \"ve\": \"Fotosensibilidad, ampollas e hipertricosis\"}, {\"l\": \"C\", \"v\": \"Tremor, rigidez e bradicinesia\", \"ve\": \"Temblor, rigidez y bradicinesia\"}, {\"l\": \"D\", \"v\": \"Podagra, tofos e hiperuricemia\", \"ve\": \"Podagra, tofos e hiperuricemia\"}], \"cr\": \"B\", \"ex\": \"Alternativa B. Porfirinas fotoativadas geram espécies reativas e lesam a pele.\", \"exe\": \"Opción B. Porfirinas fotoactivadas generan especies reactivas y lesionan piel.\", \"n\": 121}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"tf\", \"q\": \"Hemácias maduras sintetizam heme na matriz mitocondrial.\", \"qe\": \"Eritrocitos maduros sintetizan hemo en matriz mitocondrial.\", \"cr\": \"F\", \"ex\": \"Falso. Não possuem mitocôndrias.\", \"exe\": \"Falso. Carecen de mitocondrias.\", \"n\": 122}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"tf\", \"q\": \"Bilirrubina não conjugada normalmente circula ligada à albumina.\", \"qe\": \"Bilirrubina no conjugada normalmente circula unida a albúmina.\", \"cr\": \"V\", \"ex\": \"Verdadeiro. A ligação permite transportar o pigmento pouco solúvel.\", \"exe\": \"Verdadero. La unión permite transportar el pigmento poco soluble.\", \"n\": 123}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"tf\", \"q\": \"Toda porfiria causa fotossensibilidade.\", \"qe\": \"Toda porfiria causa fotosensibilidad.\", \"cr\": \"F\", \"ex\": \"Falso. Porfiria aguda intermitente tipicamente não causa manifestações cutâneas.\", \"exe\": \"Falso. Porfiria aguda intermitente típicamente no causa manifestaciones cutáneas.\", \"n\": 124}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"tf\", \"q\": \"Porfirinas possuem quatro anéis pirrólicos unidos em uma estrutura cíclica.\", \"qe\": \"Las porfirinas poseen cuatro anillos pirrólicos unidos en una estructura cíclica.\", \"cr\": \"V\", \"ex\": \"Verdadeiro. São compostos cíclicos de quatro anéis pirrólicos unidos por pontes metino (=CH–). Pirrol é um heterociclo de cinco membros com nitrogênio. A porfina, núcleo básico, tem fórmula C20H14N4. A conjugação eletrônica explica cor e fluorescência vermelha de porfirinas livres sob iluminação apropriada. Podem coordenar metais. Heme contém ferro; clorofila contém magnésio; cobalamina contém cobalto. Clorofila é um derivado clorínico e B12 contém um anel corrina, não uma porfirina verdadeira; são estruturas tetrapirrólicas relacionadas.\", \"exe\": \"Verdadero. Son compuestos cíclicos de cuatro anillos pirrólicos unidos por puentes metino (=CH–). Pirrol es un heterociclo de cinco miembros con nitrógeno. La porfina tiene fórmula C20H14N4. La conjugación electrónica explica color y fluorescencia roja de porfirinas libres bajo iluminación apropiada. Pueden coordinar metales. Hemo contiene hierro; clorofila magnesio; cobalamina cobalto. Clorofila es derivado clorínico y B12 contiene anillo corrina, no una porfirina verdadera.\", \"n\": 125}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"tf\", \"q\": \"A cobalamina possui ferro no centro de um anel porfirínico verdadeiro.\", \"qe\": \"La cobalamina posee hierro en el centro de un anillo porfirínico verdadero.\", \"cr\": \"F\", \"ex\": \"Falso. Clorofila capta energia luminosa para a fotossíntese, processo que usa CO₂ e água para produzir carboidratos e liberar oxigênio. Cianocobalamina é uma forma de B12; B12 é necessária para síntese de DNA, maturação eritroide e função neurológica. Sua deficiência causa anemia megaloblástica e neuropatia; anemia perniciosa é especificamente deficiência de B12 por gastrite autoimune com falta de fator intrínseco. Fármacos citados que podem interferir na absorção: omeprazol/lansoprazol (IBP), ranitidina/famotidina (H2), metformina, colchicina, neomicina e ácido para-aminossalicílico. A relevância depende de exposição, duração e paciente.\", \"exe\": \"Falso. Clorofila capta energía luminosa para fotosíntesis, que utiliza CO₂ y agua para producir carbohidratos y liberar oxígeno. Cianocobalamina es una forma de B12; B12 es necesaria para síntesis de ADN, maduración eritroide y función neurológica. Su déficit causa anemia megaloblástica y neuropatía; anemia perniciosa es específicamente déficit por gastritis autoinmune con falta de factor intrínseco. Fármacos citados: omeprazol/lansoprazol, ranitidina/famotidina, metformina, colchicina, neomicina y ácido paraaminosalicílico. La relevancia depende de exposición y paciente.\", \"n\": 126}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"tf\", \"q\": \"O ferro férrico (Fe³⁺) é a forma normal responsável pela ligação reversível de oxigênio na hemoglobina.\", \"qe\": \"El hierro férrico (Fe³⁺) es la forma normal responsable de la unión reversible de oxígeno en hemoglobina.\", \"cr\": \"F\", \"ex\": \"Falso. Heme b é protoporfirina IX coordenada a Fe²⁺. Na hemoglobina transporta O₂ no sangue; na mioglobina armazena O₂ muscular. Oxidação para Fe³⁺ na hemoglobina forma metemoglobina, incapaz de ligar O₂ naquele sítio; na mioglobina forma metmioglobina. Citocromo c transfere elétrons na cadeia respiratória; citocromos P450 oxidam xenobióticos e substâncias endógenas; catalase degrada H₂O₂ em água e O₂; triptofano pirrolase (triptofano 2,3-dioxigenase) inicia oxidação do triptofano na via da quinurenina.\", \"exe\": \"Falso. Hemo b es protoporfirina IX coordinada a Fe²⁺. Hemoglobina transporta O₂; mioglobina almacena O₂ muscular. Oxidación a Fe³⁺ en hemoglobina forma metahemoglobina, incapaz de unir O₂ en ese sitio; en mioglobina forma metamioglobina. Citocromo c transfiere electrones; P450 oxida xenobióticos y sustancias endógenas; catalasa degrada H₂O₂ en agua y O₂; triptófano pirrolasa (triptófano 2,3-dioxigenasa) inicia oxidación de triptófano en la vía de quinurenina.\", \"n\": 127}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"tf\", \"q\": \"A ausência de mitocôndrias impede que hemácias maduras completem a síntese de heme.\", \"qe\": \"La ausencia de mitocondrias impide que eritrocitos maduros completen la síntesis de hemo.\", \"cr\": \"V\", \"ex\": \"Verdadeiro. A síntese ocorre principalmente em precursores eritroides da medula óssea e hepatócitos. Os slides apresentam 40–50 mg/dia e 80–85% destinado à hemoglobina; o primeiro número não deve ser interpretado como produção corporal total, pois a renovação eritrocitária requer quantidade maior. Hemácias maduras não possuem mitocôndrias e não sintetizam heme. B6 na forma piridoxal-fosfato (PLP) é coenzima da ALA sintase; deficiência pode causar anemia microcítica/sideroblástica. Isoniazida interfere com B6; alguns antiparkinsonianos também podem interferir no seu metabolismo. PLP não é o grupo que liga O₂ na hemoglobina: essa função é do ferro do heme.\", \"exe\": \"Verdadero. La síntesis ocurre principalmente en precursores eritroides de médula ósea y hepatocitos. Las diapositivas presentan 40–50 mg/día y 80–85% destinado a hemoglobina; la primera cifra no debe interpretarse como producción corporal total, pues la renovación eritrocitaria requiere más. Eritrocitos maduros carecen de mitocondrias y no sintetizan hemo. B6 como piridoxal-fosfato (PLP) es coenzima de ALA sintasa; su déficit puede causar anemia microcítica/sideroblástica. Isoniazida interfiere con B6; algunos antiparkinsonianos también pueden hacerlo. PLP no une O₂ en hemoglobina; lo hace el hierro del hemo.\", \"n\": 128}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"tf\", \"q\": \"O piridoxal-fosfato é uma forma ativa da vitamina B6.\", \"qe\": \"El piridoxal fosfato es una forma activa de vitamina B6.\", \"cr\": \"V\", \"ex\": \"Verdadeiro. Na matriz mitocondrial, glicina + succinil-CoA → δ-aminolevulinato (ALA) + CoA + CO₂, com PLP. ALA sintase (ALAS) catalisa a etapa inicial limitante. ALAS1 é regulada negativamente pelo heme no fígado; ALAS2 eritroide é regulada pela disponibilidade de ferro e diferenciação celular. Succinil-CoA conecta a síntese de heme ao ciclo de Krebs.\", \"exe\": \"Verdadero. En matriz mitocondrial, glicina + succinil-CoA → δ-aminolevulinato (ALA) + CoA + CO₂, con PLP. ALA sintasa (ALAS) cataliza el paso inicial limitante. ALAS1 es regulada negativamente por hemo en hígado; ALAS2 eritroide por disponibilidad de hierro y diferenciación celular. Succinil-CoA conecta síntesis de hemo con ciclo de Krebs.\", \"n\": 129}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"tf\", \"q\": \"A ALA desidratase catalisa a inserção final de ferro na protoporfirina IX.\", \"qe\": \"La ALA deshidratasa cataliza la inserción final de hierro en protoporfirina IX.\", \"cr\": \"F\", \"ex\": \"Falso. No citosol, duas moléculas de ALA condensam-se em porfobilinogênio (PBG), um monômero pirrólico, pela ALA desidratase (porfobilinogênio sintase), dependente de zinco. Chumbo inibe essa enzima e também a ferroquelatase; aumenta ALA e compromete síntese de heme.\", \"exe\": \"Falso. En citosol, dos moléculas de ALA se condensan en porfobilinógeno (PBG), un monómero pirrólico, por ALA deshidratasa (porfobilinógeno sintasa), dependiente de zinc. Plomo inhibe esta enzima y ferroquelatasa; aumenta ALA y compromete síntesis de hemo.\", \"n\": 130}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"tf\", \"q\": \"Quatro moléculas de PBG são unidas para formar hidroximetilbilano.\", \"qe\": \"Cuatro moléculas de PBG se unen para formar hidroximetilbilano.\", \"cr\": \"V\", \"ex\": \"Verdadeiro. A porfobilinogênio desaminase (hidroximetilbilano sintase, HMBS) une quatro PBG em hidroximetilbilano, tetrapirrol linear. A uroporfirinogênio III sintase fecha e reorganiza o anel em uroporfirinogênio III. Sem essa enzima, pode ocorrer ciclização espontânea para isômero I não produtivo para heme.\", \"exe\": \"Verdadero. Porfobilinógeno desaminasa (hidroximetilbilano sintasa, HMBS) une cuatro PBG en hidroximetilbilano lineal. Uroporfirinógeno III sintasa cierra y reorganiza el anillo en uroporfirinógeno III. Sin esta enzima puede ocurrir ciclación espontánea a isómero I no productivo para hemo.\", \"n\": 131}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"tf\", \"q\": \"A uroporfirinogênio III sintase insere ferro no anel.\", \"qe\": \"La uroporfirinógeno III sintasa inserta hierro en el anillo.\", \"cr\": \"F\", \"ex\": \"Falso. A porfobilinogênio desaminase (hidroximetilbilano sintase, HMBS) une quatro PBG em hidroximetilbilano, tetrapirrol linear. A uroporfirinogênio III sintase fecha e reorganiza o anel em uroporfirinogênio III. Sem essa enzima, pode ocorrer ciclização espontânea para isômero I não produtivo para heme.\", \"exe\": \"Falso. Porfobilinógeno desaminasa (hidroximetilbilano sintasa, HMBS) une cuatro PBG en hidroximetilbilano lineal. Uroporfirinógeno III sintasa cierra y reorganiza el anillo en uroporfirinógeno III. Sin esta enzima puede ocurrir ciclación espontánea a isómero I no productivo para hemo.\", \"n\": 132}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"tf\", \"q\": \"A UROD converte grupos acetato em grupos metila por descarboxilação.\", \"qe\": \"La UROD convierte grupos acetato en grupos metilo por descarboxilación.\", \"cr\": \"V\", \"ex\": \"Verdadeiro. Uroporfirinogênio descarboxilase (UROD) remove CO₂ de quatro grupos acetato, convertendo-os em grupos metila e produzindo coproporfirinogênio III no citosol. É a última etapa citosólica. Deficiência de UROD associa-se à porfiria cutânea tardia.\", \"exe\": \"Verdadero. Uroporfirinógeno descarboxilasa (UROD) retira CO₂ de cuatro grupos acetato, convirtiéndolos en metilo y produciendo coproporfirinógeno III en citosol. Es el último paso citosólico. Deficiencia de UROD se asocia a porfiria cutánea tardía.\", \"n\": 133}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"tf\", \"q\": \"A CPOX e a PPOX catalisam exatamente a mesma reação.\", \"qe\": \"CPOX y PPOX catalizan exactamente la misma reacción.\", \"cr\": \"F\", \"ex\": \"Falso. Na mitocôndria, coproporfirinogênio oxidase (CPOX) converte coproporfirinogênio III em protoporfirinogênio IX por descarboxilação oxidativa de duas cadeias propionato a vinila. Protoporfirinogênio oxidase (PPOX) oxida protoporfirinogênio IX a protoporfirina IX. Porfirinogênios são formas reduzidas, enquanto porfirinas têm sistema conjugado oxidado.\", \"exe\": \"Falso. En mitocondria, coproporfirinógeno oxidasa (CPOX) convierte coproporfirinógeno III en protoporfirinógeno IX mediante descarboxilación oxidativa de dos propionatos a vinilos. Protoporfirinógeno oxidasa (PPOX) oxida protoporfirinógeno IX a protoporfirina IX. Los porfirinógenos son formas reducidas y las porfirinas tienen sistema conjugado oxidado.\", \"n\": 134}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"tf\", \"q\": \"As etapas 2 a 5 da síntese de heme são citosólicas.\", \"qe\": \"Las etapas 2 a 5 de la síntesis de hemo son citosólicas.\", \"cr\": \"V\", \"ex\": \"Verdadeiro. A ferroquelatase (FECH), na membrana mitocondrial interna, insere Fe²⁺ na protoporfirina IX, formando heme. É a última das oito etapas. Sequência espacial: etapa 1 mitocondrial, etapas 2–5 citosólicas, etapas 6–8 mitocondriais. Chumbo interfere na FECH; deficiência hereditária pode causar protoporfiria eritropoiética.\", \"exe\": \"Verdadero. Ferroquelatasa (FECH), en membrana mitocondrial interna, inserta Fe²⁺ en protoporfirina IX formando hemo. Es el último de ocho pasos. Secuencia espacial: paso 1 mitocondrial, pasos 2–5 citosólicos, pasos 6–8 mitocondriales. Plomo interfiere con FECH; su déficit hereditario puede causar protoporfiria eritropoyética.\", \"n\": 135}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"tf\", \"q\": \"A ferroquelatase atua exclusivamente no citosol.\", \"qe\": \"La ferroquelatasa actúa exclusivamente en el citosol.\", \"cr\": \"F\", \"ex\": \"Falso. A ferroquelatase (FECH), na membrana mitocondrial interna, insere Fe²⁺ na protoporfirina IX, formando heme. É a última das oito etapas. Sequência espacial: etapa 1 mitocondrial, etapas 2–5 citosólicas, etapas 6–8 mitocondriais. Chumbo interfere na FECH; deficiência hereditária pode causar protoporfiria eritropoiética.\", \"exe\": \"Falso. Ferroquelatasa (FECH), en membrana mitocondrial interna, inserta Fe²⁺ en protoporfirina IX formando hemo. Es el último de ocho pasos. Secuencia espacial: paso 1 mitocondrial, pasos 2–5 citosólicos, pasos 6–8 mitocondriales. Plomo interfiere con FECH; su déficit hereditario puede causar protoporfiria eritropoyética.\", \"n\": 136}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"tf\", \"q\": \"O ferro das hemácias senescentes pode ser reutilizado pelo organismo.\", \"qe\": \"El hierro de eritrocitos senescentes puede reutilizarse en el organismo.\", \"cr\": \"V\", \"ex\": \"Verdadeiro. Após aproximadamente 120 dias de vida, hemácias senescentes são fagocitadas por macrófagos principalmente no baço, fígado e medula óssea. Globina é degradada em aminoácidos reutilizáveis. Ferro é recuperado e armazenado ou transportado pela transferrina. A porção porfirínica é convertida em pigmentos biliares. O slide menciona renovação de cerca de 6 g/dia de hemoglobina; esse valor é aproximado.\", \"exe\": \"Verdadero. Tras aproximadamente 120 días, eritrocitos senescentes son fagocitados por macrófagos principalmente en bazo, hígado y médula ósea. Globina se degrada a aminoácidos reutilizables. Hierro se recupera y almacena o transporta por transferrina. La porción porfirínica se convierte en pigmentos biliares. La diapositiva menciona renovación aproximada de 6 g/día de hemoglobina.\", \"n\": 137}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"tf\", \"q\": \"A globina é convertida diretamente em bilirrubina.\", \"qe\": \"La globina se convierte directamente en bilirrubina.\", \"cr\": \"F\", \"ex\": \"Falso. Após aproximadamente 120 dias de vida, hemácias senescentes são fagocitadas por macrófagos principalmente no baço, fígado e medula óssea. Globina é degradada em aminoácidos reutilizáveis. Ferro é recuperado e armazenado ou transportado pela transferrina. A porção porfirínica é convertida em pigmentos biliares. O slide menciona renovação de cerca de 6 g/dia de hemoglobina; esse valor é aproximado.\", \"exe\": \"Falso. Tras aproximadamente 120 días, eritrocitos senescentes son fagocitados por macrófagos principalmente en bazo, hígado y médula ósea. Globina se degrada a aminoácidos reutilizables. Hierro se recupera y almacena o transporta por transferrina. La porción porfirínica se convierte en pigmentos biliares. La diapositiva menciona renovación aproximada de 6 g/día de hemoglobina.\", \"n\": 138}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"tf\", \"q\": \"A biliverdina redutase converte biliverdina em bilirrubina.\", \"qe\": \"La biliverdina reductasa convierte biliverdina en bilirrubina.\", \"cr\": \"V\", \"ex\": \"Verdadeiro. Heme oxigenase abre o anel do heme, usando O₂ e poder redutor, formando biliverdina, ferro e monóxido de carbono (CO). Biliverdina redutase converte biliverdina (verde) em bilirrubina não conjugada (amarela), pouco hidrossolúvel. Ela circula ligada à albumina e não é filtrada normalmente na urina. Heme oxigenase é a etapa regulatória inicial da degradação.\", \"exe\": \"Verdadero. Hemo oxigenasa abre el anillo de hemo usando O₂ y poder reductor, formando biliverdina, hierro y monóxido de carbono (CO). Biliverdina reductasa convierte biliverdina (verde) en bilirrubina no conjugada (amarilla), poco hidrosoluble. Circula unida a albúmina y normalmente no se filtra en orina. Hemo oxigenasa es la etapa reguladora inicial.\", \"n\": 139}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"tf\", \"q\": \"A bilirrubina não conjugada é normalmente filtrada livremente pelos rins.\", \"qe\": \"La bilirrubina no conjugada normalmente se filtra libremente por los riñones.\", \"cr\": \"F\", \"ex\": \"Falso. Heme oxigenase abre o anel do heme, usando O₂ e poder redutor, formando biliverdina, ferro e monóxido de carbono (CO). Biliverdina redutase converte biliverdina (verde) em bilirrubina não conjugada (amarela), pouco hidrossolúvel. Ela circula ligada à albumina e não é filtrada normalmente na urina. Heme oxigenase é a etapa regulatória inicial da degradação.\", \"exe\": \"Falso. Hemo oxigenasa abre el anillo de hemo usando O₂ y poder reductor, formando biliverdina, hierro y monóxido de carbono (CO). Biliverdina reductasa convierte biliverdina (verde) en bilirrubina no conjugada (amarilla), poco hidrosoluble. Circula unida a albúmina y normalmente no se filtra en orina. Hemo oxigenasa es la etapa reguladora inicial.\", \"n\": 140}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"tf\", \"q\": \"A conjugação com ácido glucurônico aumenta a solubilidade da bilirrubina.\", \"qe\": \"La conjugación con ácido glucurónico aumenta la solubilidad de la bilirrubina.\", \"cr\": \"V\", \"ex\": \"Verdadeiro. Hepatócitos captam bilirrubina; transportadores OATP participam do transporte hepático, especialmente da recaptura de conjugados. UGT1A1 (UDP-glucuronosiltransferase) conjuga bilirrubina com ácido glucurônico, aumentando solubilidade. MRP2 exporta bilirrubina conjugada para canalículos biliares. Bilirrubina direta corresponde principalmente à conjugada; indireta, principalmente à não conjugada. A direta pode aparecer na urina quando elevada no plasma.\", \"exe\": \"Verdadero. Hepatocitos captan bilirrubina; transportadores OATP participan en transporte hepático, especialmente recaptación de conjugados. UGT1A1 (UDP-glucuronosiltransferasa) conjuga bilirrubina con ácido glucurónico, aumentando solubilidad. MRP2 exporta bilirrubina conjugada a canalículos biliares. Bilirrubina directa corresponde principalmente a conjugada; indirecta a no conjugada. La directa puede aparecer en orina si aumenta en plasma.\", \"n\": 141}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"tf\", \"q\": \"MRP2 transporta bilirrubina conjugada do canalículo biliar para o núcleo do hepatócito.\", \"qe\": \"MRP2 transporta bilirrubina conjugada desde el canalículo biliar al núcleo del hepatocito.\", \"cr\": \"F\", \"ex\": \"Falso. Hepatócitos captam bilirrubina; transportadores OATP participam do transporte hepático, especialmente da recaptura de conjugados. UGT1A1 (UDP-glucuronosiltransferase) conjuga bilirrubina com ácido glucurônico, aumentando solubilidade. MRP2 exporta bilirrubina conjugada para canalículos biliares. Bilirrubina direta corresponde principalmente à conjugada; indireta, principalmente à não conjugada. A direta pode aparecer na urina quando elevada no plasma.\", \"exe\": \"Falso. Hepatocitos captan bilirrubina; transportadores OATP participan en transporte hepático, especialmente recaptación de conjugados. UGT1A1 (UDP-glucuronosiltransferasa) conjuga bilirrubina con ácido glucurónico, aumentando solubilidad. MRP2 exporta bilirrubina conjugada a canalículos biliares. Bilirrubina directa corresponde principalmente a conjugada; indirecta a no conjugada. La directa puede aparecer en orina si aumenta en plasma.\", \"n\": 142}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"tf\", \"q\": \"Uma parte do urobilinogênio intestinal participa da circulação entero-hepática.\", \"qe\": \"Una parte del urobilinógeno intestinal participa en la circulación enterohepática.\", \"cr\": \"V\", \"ex\": \"Verdadeiro. Bactérias intestinais convertem bilirrubina em urobilinogênio. A maior parte é eliminada pelas fezes após oxidação a pigmentos como estercobilina (marrom); parte retorna pela circulação entero-hepática, e pequena fração alcança os rins e origina urobilina (amarela). Obstrução biliar pode causar fezes claras e urina escura por bilirrubina conjugada.\", \"exe\": \"Verdadero. Bacterias intestinales convierten bilirrubina en urobilinógeno. La mayor parte se elimina en heces tras oxidación a pigmentos como estercobilina (marrón); parte retorna por circulación enterohepática y una pequeña fracción llega al riñón y origina urobilina (amarilla). Obstrucción biliar puede causar heces claras y orina oscura por bilirrubina conjugada.\", \"n\": 143}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"tf\", \"q\": \"A obstrução biliar completa favorece o escurecimento das fezes por excesso de estercobilina.\", \"qe\": \"La obstrucción biliar completa favorece el oscurecimiento de las heces por exceso de estercobilina.\", \"cr\": \"F\", \"ex\": \"Falso. Bactérias intestinais convertem bilirrubina em urobilinogênio. A maior parte é eliminada pelas fezes após oxidação a pigmentos como estercobilina (marrom); parte retorna pela circulação entero-hepática, e pequena fração alcança os rins e origina urobilina (amarela). Obstrução biliar pode causar fezes claras e urina escura por bilirrubina conjugada.\", \"exe\": \"Falso. Bacterias intestinales convierten bilirrubina en urobilinógeno. La mayor parte se elimina en heces tras oxidación a pigmentos como estercobilina (marrón); parte retorna por circulación enterohepática y una pequeña fracción llega al riñón y origina urobilina (amarilla). Obstrucción biliar puede causar heces claras y orina oscura por bilirrubina conjugada.\", \"n\": 144}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"tf\", \"q\": \"Pode haver hiperbilirrubinemia sem icterícia clinicamente perceptível.\", \"qe\": \"Puede existir hiperbilirrubinemia sin ictericia clínicamente perceptible.\", \"cr\": \"V\", \"ex\": \"Verdadeiro. Hiperbilirrubinemia é bilirrubina acima do limite de referência; icterícia é coloração amarelada de pele, mucosas e escleras, geralmente visível em torno de 2–3 mg/dL. O slide 10 indica total até 1,0, direta até 0,4 e indireta até 0,6 mg/dL; o slide 9 usa total 0,3–1,2, direta 0–0,3 e indireta 0,2–0,9 mg/dL. São intervalos didáticos distintos; use o laboratório na prática. Pode ocorrer por produção excessiva, insuficiência de captação/conjugação ou falha de excreção.\", \"exe\": \"Verdadero. Hiperbilirrubinemia es bilirrubina por encima del límite de referencia; ictericia es coloración amarilla de piel, mucosas y escleras, generalmente visible alrededor de 2–3 mg/dL. Diapositiva 10 indica total hasta 1,0, directa hasta 0,4 e indirecta hasta 0,6 mg/dL; la 9 usa total 0,3–1,2, directa 0–0,3 e indirecta 0,2–0,9 mg/dL. Son intervalos didácticos distintos; use el laboratorio en práctica. Puede deberse a producción excesiva o falla de captación, conjugación o excreción.\", \"n\": 145}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"tf\", \"q\": \"A síndrome de Gilbert se caracteriza primariamente por obstrução mecânica dos ductos biliares.\", \"qe\": \"El síndrome de Gilbert se caracteriza primariamente por obstrucción mecánica de conductos biliares.\", \"cr\": \"F\", \"ex\": \"Falso. Predomínio indireto: hemólise aumentada, síndrome de Gilbert (redução leve de UGT1A1), Crigler-Najjar (deficiência importante de UGT1A1). Predomínio direto: colestase por cálculos biliares ou outras obstruções e defeitos de excreção. Hepatites e cirrose podem elevar ambas as frações; álcool e fármacos podem causar lesão hepática. O padrão de bilirrubina isoladamente não fecha diagnóstico.\", \"exe\": \"Falso. Predominio indirecto: hemólisis aumentada, síndrome de Gilbert (reducción leve de UGT1A1), Crigler-Najjar (déficit importante de UGT1A1). Predominio directo: colestasis por cálculos biliares u otras obstrucciones y defectos de excreción. Hepatitis y cirrosis pueden elevar ambas fracciones; alcohol y fármacos pueden lesionar hígado. El patrón aislado no establece diagnóstico.\", \"n\": 146}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"tf\", \"q\": \"Hepatites podem elevar tanto a fração direta quanto a indireta da bilirrubina.\", \"qe\": \"Las hepatitis pueden elevar tanto la fracción directa como la indirecta de bilirrubina.\", \"cr\": \"V\", \"ex\": \"Verdadeiro. Predomínio indireto: hemólise aumentada, síndrome de Gilbert (redução leve de UGT1A1), Crigler-Najjar (deficiência importante de UGT1A1). Predomínio direto: colestase por cálculos biliares ou outras obstruções e defeitos de excreção. Hepatites e cirrose podem elevar ambas as frações; álcool e fármacos podem causar lesão hepática. O padrão de bilirrubina isoladamente não fecha diagnóstico.\", \"exe\": \"Verdadero. Predominio indirecto: hemólisis aumentada, síndrome de Gilbert (reducción leve de UGT1A1), Crigler-Najjar (déficit importante de UGT1A1). Predominio directo: colestasis por cálculos biliares u otras obstrucciones y defectos de excreción. Hepatitis y cirrosis pueden elevar ambas fracciones; alcohol y fármacos pueden lesionar hígado. El patrón aislado no establece diagnóstico.\", \"n\": 147}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"tf\", \"q\": \"A fototoxicidade nas porfirias cutâneas envolve geração de espécies reativas de oxigênio.\", \"qe\": \"La fototoxicidad en porfirias cutáneas implica generar especies reactivas de oxígeno.\", \"cr\": \"V\", \"ex\": \"Verdadeiro. São doenças por alterações de enzimas da síntese de heme, hereditárias ou adquiridas, com acúmulo de precursores. As formas cutâneas podem produzir fotossensibilidade, bolhas, fragilidade, cicatrizes, hipertricose e, em formas graves raras, lesões mutilantes em áreas expostas, dentes avermelhados (eritrodontia), urina escura e anemia hemolítica. As porfirinas absorvem luz e transferem energia ao oxigênio, gerando espécies reativas que lesam tecidos. Pele, mãos, face, dentes e urina são locais ou manifestações destacados nos slides. Nem todos os pacientes apresentam essas alterações.\", \"exe\": \"Verdadero. Son enfermedades por alteraciones de enzimas de síntesis de hemo, hereditarias o adquiridas, con acumulación de precursores. Formas cutáneas pueden causar fotosensibilidad, ampollas, fragilidad, cicatrices, hipertricosis y, en formas graves raras, lesiones mutilantes en zonas expuestas, dientes rojizos (eritrodoncia), orina oscura y anemia hemolítica. Las porfirinas absorben luz y transfieren energía al oxígeno generando especies reactivas que dañan tejidos. Piel, manos, cara, dientes y orina son lugares o manifestaciones destacadas. No todos presentan estos cambios.\", \"n\": 148}, {\"c\": \"Metabolismo das porfirinas e do grupo heme\", \"ce\": \"Metabolismo de las porfirinas y el grupo hemo\", \"t\": \"tf\", \"q\": \"Todos os pacientes com porfiria desenvolvem eritrodontia e lesões mutilantes.\", \"qe\": \"Todos los pacientes con porfiria desarrollan eritrodoncia y lesiones mutilantes.\", \"cr\": \"F\", \"ex\": \"Falso. São doenças por alterações de enzimas da síntese de heme, hereditárias ou adquiridas, com acúmulo de precursores. As formas cutâneas podem produzir fotossensibilidade, bolhas, fragilidade, cicatrizes, hipertricose e, em formas graves raras, lesões mutilantes em áreas expostas, dentes avermelhados (eritrodontia), urina escura e anemia hemolítica. As porfirinas absorvem luz e transferem energia ao oxigênio, gerando espécies reativas que lesam tecidos. Pele, mãos, face, dentes e urina são locais ou manifestações destacados nos slides. Nem todos os pacientes apresentam essas alterações.\", \"exe\": \"Falso. Son enfermedades por alter
