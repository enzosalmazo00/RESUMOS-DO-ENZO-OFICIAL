bose-5-P\"}], \"cr\": \"A\", \"ex\": \"O Ca²⁺ da contração integra sinal mecânico e mobilização de glicogênio.\", \"n\": 35}, {\"t\": \"mc\", \"c\": \"Glicogênio\", \"q\": \"Como a insulina afeta a glicogênio-sintase?\", \"o\": [{\"l\": \"A\", \"v\": \"Fosforila e inibe\"}, {\"l\": \"B\", \"v\": \"Desfosforila e ativa\"}, {\"l\": \"C\", \"v\": \"Degrada a enzima\"}, {\"l\": \"D\", \"v\": \"Não produz efeito\"}], \"cr\": \"B\", \"ex\": \"Insulina favorece proteína-fosfatase 1 e inibe GSK3, promovendo síntese de glicogênio.\", \"n\": 36}, {\"t\": \"mc\", \"c\": \"Gliconeogênese e Von Gierke\", \"q\": \"Qual conjunto contém apenas precursores gliconeogênicos importantes?\", \"o\": [{\"l\": \"A\", \"v\": \"Acetil-CoA de ácido graxo par, colesterol e corpos cetônicos\"}, {\"l\": \"B\", \"v\": \"Lactato, alanina e glicerol\"}, {\"l\": \"C\", \"v\": \"Leucina, acetona e colesterol\"}, {\"l\": \"D\", \"v\": \"Palmitato, acetil-CoA e etanol\"}], \"cr\": \"B\", \"ex\": \"Lactato, alanina e glicerol entram na formação de glicose por vias específicas.\", \"n\": 37}, {\"t\": \"mc\", \"c\": \"Gliconeogênese e Von Gierke\", \"q\": \"Qual enzima substitui funcionalmente a PFK-1 na gliconeogênese?\", \"o\": [{\"l\": \"A\", \"v\": \"Frutose-1,6-bisfosfatase\"}, {\"l\": \"B\", \"v\": \"Fosfoglicerato-quinase\"}, {\"l\": \"C\", \"v\": \"Aldolase\"}, {\"l\": \"D\", \"v\": \"G6PD\"}], \"cr\": \"A\", \"ex\": \"F1,6-bisfosfatase hidrolisa F1,6BP para F6P e constitui um desvio irreversível.\", \"n\": 38}, {\"t\": \"mc\", \"c\": \"Gliconeogênese e Von Gierke\", \"q\": \"Qual é o custo de alta energia para formar glicose a partir de dois piruvatos?\", \"o\": [{\"l\": \"A\", \"v\": \"2 ATP\"}, {\"l\": \"B\", \"v\": \"4 ATP + 2 GTP\"}, {\"l\": \"C\", \"v\": \"2 GTP somente\"}, {\"l\": \"D\", \"v\": \"6 NADPH\"}], \"cr\": \"B\", \"ex\": \"A gliconeogênese consome seis equivalentes de fosfato de alta energia, além de 2 NADH.\", \"n\": 39}, {\"t\": \"mc\", \"c\": \"Gliconeogênese e Von Gierke\", \ confirme.\", \"n\": 53}, {\"t\": \"mc\", \"c\": \"Insulina e diabetes\", \"q\": \"Qual achado explica a poliúria diabética?\", \"o\": [{\"l\": \"A\", \"v\": \"Falta de ADH em todos os casos\"}, {\"l\": \"B\", \"v\": \"Diurese osmótica por glicosúria\"}, {\"l\": \"C\", \"v\": \"Aumento direto de aldosterona\"}, {\"l\": \"D\", \"v\": \"Inibição do SGLT1 intestinal\"}], \"cr\": \"B\", \"ex\": \"Quando a carga filtrada excede a reabsorção, glicose urinária retém água e aumenta o volume urinário.\", \"n\": 54}, {\"t\": \"mc\", \"c\": \"Insulina e diabetes\", \"q\": \"No DM1, o defeito primário é:\", \"o\": [{\"l\": \"A\", \"v\": \"Resistência isolada do GLUT5\"}, {\"l\": \"B\", \"v\": \"Destruição autoimune de células β\"}, {\"l\": \"C\", \"v\": \"Excesso absoluto de insulina\"}, {\"l\": \"D\", \"v\": \"Deficiência de glucagon\"}], \"cr\": \"B\", \"ex\": \"A perda de células β causa deficiência absoluta de insulina e tendência a cetose.\", \"n\": 55}, {\"t\": \"mc\", \"c\": \"Insulina e diabetes\", \"q\": \"Qual conjunto corresponde às quatro P clássicas?\", \"o\": [{\"l\": \"A\", \"v\": \"Poliúria, polidipsia, polifagia e perda de peso\"}, {\"l\": \"B\", \"v\": \"Palidez, prurido, parestesia e pneumonia\"}, {\"l\": \"C\", \"v\": \"Poliúria, pancitopenia, petéquias e prurido\"}, {\"l\": \"D\", \"v\": \"Polidipsia, proteinúria, pancreatite e perda visual\"}], \"cr\": \"A\", \"ex\": \"As quatro P resultam de glicosúria/diurese osmótica e do estado catabólico.\", \"n\": 56}, {\"t\": \"mc\", \"c\": \"Glucagon e hipoglicemia\", \"q\": \"O glucagon é produzido principalmente por:\", \"o\": [{\"l\": \"A\", \"v\": \"Células β\"}, {\"l\": \"B\", \"v\": \"Células α\"}, {\"l\": \"C\", \"v\": \"Células δ\"}, {\"l\": \"D\", \"v\": \"Células acinares\"}], \"cr\": \"B\", \"ex\": \"Células α das ilhotas armazenam e secretam glucagon.\", \"n\": 57}, {\"t\": \"mc\", \"c\": \"Glucagon e hipoglicemia\", \"q\": \"Qual via de sinalização é ativada pelo receptor de glucagon?\", \"o\": [{\"l\": \"A\", \"v\": \"Gs–cAMP–PKA\"}, {\"l\": \"B\", \"v\": \"Gi–cGMP\"}, {\"l\": \"C\", \"v\": \"Receptor tirosina-quinase–Akt\"}, {\"l\": \"D\", \"v\": \"Receptor nuclear–DNA\"}], \"cr\": \"A\", \"ex\": \"O receptor hepático de glucagon é acoplado a Gs e eleva cAMP/PKA.\", \"n\": 58}, {\"t\": \"mc\", \"c\": \"Glucagon e hipoglicemia\", \"q\": \"Uma pessoa está inconsciente por hipoglicemia. Qual conduta é incorreta?\", \"o\": [{\"l\": \"A\", \"v\": \"Acionar emergência\"}, {\"l\": \"B\", \"v\": \"Usar glucagon se disponível e treinado\"}, {\"l\": \"C\", \"v\": \"Oferecer suco pela boca\"}, {\"l\": \"D\", \"v\": \"Proteger a via aérea\"}], \"cr\": \"C\", \"ex\": \"Nada deve ser oferecido por via oral a quem não pode engolir, pelo risco de aspiração.\", \"n\": 59}, {\"t\": \"mc\", \"c\": \"Glucagon e hipoglicemia\", \"q\": \"Qual uso do glucagon explora aumento de cAMP cardíaco independente de receptor β?\", \"o\": [{\"l\": \"A\", \"v\": \"Intoxicação por β-bloqueador\"}, {\"l\": \"B\", \"v\": \"Deficiência de lactase\"}, {\"l\": \"C\", \"v\": \"G6PD\"}, {\"l\": \"D\", \"v\": \"Hipercalcemia\"}], \"cr\": \"A\", \"ex\": \"Glucagon pode ser adjuvante em intoxicação por β-bloqueador por efeito inotrópico/cronotrópico via cAMP.\", \"n\": 60}, {\"t\": \"tf\", \"c\": \"Fundamentos\", \"q\": \"Anabolismo e catabolismo são vias isoladas que nunca compartilham intermediários.\", \"cr\": \"F\", \"ex\": \"As vias são integradas: intermediários como glicose-6-fosfato, piruvato e acetil-CoA conectam produção de energia, armazenamento e biossíntese.\", \"n\": 61}, {\"t\": \"tf\", \"c\": \"Fundamentos\", \"q\": \"A oxidação de nutrientes transfere elétrons para carreadores como NAD⁺ e FAD.\", \"cr\": \"V\", \"ex\": \"NAD⁺ e FAD recebem elétrons e hidrogênios, formando NADH e FADH₂, que podem alimentar a cadeia respiratória.\", \"n\": 62}, {\"t\": \"tf\", \"c\": \"Digestão e transporte\", \"q\": \"A celulose fornece glicose ao ser humano porque possuímos celulase intestinal.\", \"cr\": \"F\", \"ex\": \"Humanos não produzem celulase; a celulose atua principalmente como fibra e pode ser parcialmente fermentada pela microbiota.\", \"n\": 63}, {\"t\": \"tf\", \"c\": \"Digestão e transporte\", \"q\": \"GLUT2 permite difusão facilitada e pode transportar glicose conforme o gradiente.\", \"cr\": \"V\", \"ex\": \"GLUT2 é um transportador facilitativo de alta capacidade, importante em fígado, membrana basolateral intestinal e célula β pancreática.\", \"n\": 64}, {\"t\": \"tf\", \"c\": \"Digestão e transporte\", \"q\": \"Na intolerância à lactose, a lactose não absorvida pode puxar água e ser fermentada por bactérias.\", \"cr\": \"V\", \"ex\": \"Isso explica diarreia osmótica, distensão, gases e dor após ingestão de lactose em pessoas com baixa lactase.\", \"n\": 65}, {\"t\": \"tf\", \"c\": \"Glicólise\", \"q\": \"A glicólise converte uma glicose de seis carbonos em dois piruvatos de três carbonos.\", \"cr\": \"V\", \"ex\": \"A clivagem ocorre após a formação de F1,6BP e as duas trioses seguem pela fase de rendimento.\", \"n\": 66}, {\"t\": \"tf\", \"c\": \"Glicólise\", \"q\": \"A fase de investimento consome quatro ATP por glicose.\", \"cr\": \"F\", \"ex\": \"São consumidos dois ATP: um pela hexoquinase/glicoquinase e outro pela PFK-1.\", \"n\": 67}, {\"t\": \"tf\", \"c\": \"Glicólise\", \"q\": \"A reação da piruvato-quinase é reversível em condições celulares.\", \"cr\": \"F\", \"ex\": \"Ela é fortemente exergônica e irreversível; a gliconeogênese precisa de um desvio por piruvato-carboxilase e PEPCK.\", \"n\": 68}, {\"t\": \"tf\", \"c\": \"Glicólise\", \"q\": \"O oxigênio é substrato direto da glicólise.\", \"cr\": \"F\", \"ex\": \"Nenhuma das dez reações usa O₂ diretamente. O oxigênio influencia indiretamente a reoxidação mitocondrial do NADH.\", \"n\": 69}, {\"t\": \"tf\", \"c\": \"Piruvato e fermentação\", \"q\": \"Na reação da LDH, a formação de lactato regenera NAD⁺.\", \"cr\": \"V\", \"ex\": \"Piruvato recebe elétrons do NADH, formando lactato e NAD⁺; assim a glicólise pode continuar quando a reoxidação mitocondrial é insuficiente ou ausente.\", \"n\": 70}, {\"t\": \"tf\", \"c\": \"Piruvato e fermentação\", \"q\": \"O lactato é apenas um resíduo tóxico responsável sozinho pela fadiga muscular.\", \"cr\": \"F\", \"ex\": \"Lactato é combustível e transportador de carbono; pode ser oxidado ou reciclado. Fadiga é multifatorial e não se explica por lactato isoladamente.\", \"n\": 71}, {\"t\": \"tf\", \"c\": \"Glicogênio\", \"q\": \"A ramificação aumenta solubilidade e cria muitas extremidades não redutoras.\", \"cr\": \"V\", \"ex\": \"Muitas extremidades permitem síntese e degradação simultâneas e rápidas por várias enzimas.\", \"n\": 72}, {\"t\": \"tf\", \"c\": \"Glicogênio\", \"q\": \"A glicogênio-fosforilase rompe diretamente ligações α-1,6.\", \"cr\": \"F\", \"ex\": \"Ela remove resíduos α-1,4 até perto da ramificação; a enzima desramificadora resolve a ligação α-1,6.\", \"n\": 73}, {\"t\": \"tf\", \"c\": \"Glicogênio\", \"q\": \"O glicogênio muscular serve principalmente para manter a glicemia de todo o organismo.\", \"cr\": \"F\", \"ex\": \"Como o músculo não tem glicose-6-fosfatase, usa sua G6P localmente para produzir ATP durante atividade.\", \"n\": 74}, {\"t\": \"tf\", \"c\": \"Glicogênio\", \"q\": \"Glucagon ativa de forma relevante a glicogenólise do músculo esquelético.\", \"cr\": \"F\", \"ex\": \"O músculo esquelético praticamente não responde diretamente ao glucagon; adrenalina, Ca²⁺ e AMP mobilizam seu glicogênio.\", \"n\": 75}, {\"t\": \"tf\", \"c\": \"Gliconeogênese e Von Gierke\", \"q\": \"Gliconeogênese é a simples inversão de todas as reações da glicólise.\", \"cr\": \"F\", \"ex\": \"Três etapas glicolíticas são irreversíveis e precisam de quatro enzimas de desvio na gliconeogênese.\", \"n\": 76}, {\"t\": \"tf\", \"c\": \"Gliconeogênese e Von Gierke\", \"q\": \"Ácidos graxos de cadeia par fornecem acetil-CoA, mas não produzem glicose líquida em humanos.\", \"cr\": \"V\", \"ex\": \"Acetil-CoA não retorna a piruvato e seus carbonos são perdidos como CO₂ no ciclo de Krebs; glicerol ainda pode formar glicose.\", \"n\": 77}, {\"t\": \"tf\", \"c\": \"Gliconeogênese e Von Gierke\", \"q\": \"Na doença de Von Gierke tipo Ia, a produção de glicose livre pelo fígado fica prejudicada.\", \"cr\": \"V\", \"ex\": \"Sem glicose-6-fosfatase, o passo final da glicogenólise e da gliconeogênese não libera glicose para o sangue.\", \"n\": 78}, {\"t\": \"tf\", \"c\": \"Pentoses, G6PD e Cori\", \"q\": \"A via das pentoses-fosfato produz ATP diretamente.\", \"cr\": \"F\", \"ex\": \"Sua função central é produzir NADPH e pentoses/intermediários; não há fosforilação em nível de substrato nem ATP direto.\", \"n\": 79}, {\"t\": \"tf\", \"c\": \"Pentoses, G6PD e Cori\", \"q\": \"A fase não oxidativa da via das pentoses é reversível.\", \"cr\": \"V\", \"ex\": \"Ela adapta a produção de ribose às necessidades e conecta pentoses a F6P e G3P da glicólise.\", \"n\": 80}, {\"t\": \"tf\", \"c\": \"Pentoses, G6PD e Cori\", \"q\": \"NADH e NADPH são intercambiáveis em todas as enzimas celulares.\", \"cr\": \"F\", \"ex\": \"As enzimas reconhecem cofatores específicos: NADH é predominantemente catabólico; NADPH sustenta redução biossintética e antioxidante.\", \"n\": 81}, {\"t\": \"tf\", \"c\": \"Pentoses, G6PD e Cori\", \"q\": \"Na deficiência de G6PD, oxidantes podem precipitar hemoglobina e formar corpos de Heinz.\", \"cr\": \"V\", \"ex\": \"A falta de NADPH reduz a regeneração de glutationa, favorecendo dano oxidativo à hemoglobina e à membrana da hemácia.\", \"n\": 82}, {\"t\": \"tf\", \"c\": \"Pentoses, G6PD e Cori\", \"q\": \"O Ciclo de Cori transfere parte do custo energético do músculo para o fígado.\", \"cr\": \"V\", \"ex\": \"O músculo obtém ATP rápido; o fígado gasta energia para reconverter lactato em glicose.\", \"n\": 83}, {\"t\": \"tf\", \"c\": \"Insulina e diabetes\", \"q\": \"A insulina é sintetizada inicialmente como pré-pró-insulina.\", \"cr\": \"V\", \"ex\": \"O peptídeo sinal é retirado no retículo, formando pró-insulina; clivagem posterior gera insulina e peptídeo C.\", \"n\": 84}, {\"t\": \"tf\", \"c\": \"Insulina e diabetes\", \"q\": \"A insulina favorece glicogênese, glicólise e lipogênese no estado alimentado.\", \"cr\": \"V\", \"ex\": \"Ela promove captação e armazenamento de combustível e reduz produção hepática de glicose e lipólise.\", \"n\": 85}, {\"t\": \"tf\", \"c\": \"Insulina e diabetes\", \"q\": \"Resistência à insulina significa necessariamente ausência total do receptor de insulina.\", \"cr\": \"F\", \"ex\": \"Geralmente há redução da resposta em diferentes pontos da sinalização, inflamação e menor translocação do GLUT4, não ausência completa do receptor.\", \"n\": 86}, {\"t\": \"tf\", \"c\": \"Insulina e diabetes\", \"q\": \"Uma glicemia casual de 200 mg/dL sempre confirma diabetes em qualquer pessoa assintomática sem repetição.\", \"cr\": \"F\", \"ex\": \"O critério casual ≥200 mg/dL exige sintomas clássicos ou crise hiperglicêmica; sem quadro inequívoco, é necessária confirmação por teste apropriado.\", \"n\": 87}, {\"t\": \"tf\", \"c\": \"Glucagon e hipoglicemia\", \"q\": \"Glucagon e insulina são hormônios contrarreguladores que ajudam a estabilizar a glicemia.\", \"cr\": \"V\", \"ex\": \"Insulina predomina após refeição; glucagon predomina no jejum, estimulando produção hepática de glicose.\", \"n\": 88}, {\"t\": \"tf\", \"c\": \"Glucagon e hipoglicemia\", \"q\": \"Glucagon eleva glicemia principalmente por agir no fígado.\", \"cr\": \"V\", \"ex\": \"Ele aumenta glicogenólise e gliconeogênese hepáticas; o músculo esquelético não é seu principal alvo direto.\", \"n\": 89}, {\"t\": \"tf\", \"c\": \"Glucagon e hipoglicemia\", \"q\": \"Uma pessoa inconsciente por hipoglicemia deve receber açúcar ou líquido pela boca imediatamente.\", \"cr\": \"F\", \"ex\": \"Há risco de aspiração. Deve-se acionar ajuda, posicionar/proteger via aérea e administrar glucagon se disponível e conforme treinamento.\", \"n\": 90}, {\"t\": \"ab\", \"c\": \"Glicólise\", \"q\": \"Defina glicólise e indique seu produto final.\", \"ex\": \"Glicólise é a sequência citosólica de dez reações que converte C₆H₁₂O₆ (glicose) em duas moléculas de piruvato. O saldo líquido é 2 ATP e 2 NADH. Se a célula precisa regenerar NAD⁺ rapidamente, o piruvato pode virar lactato; com mitocôndria e oxigenação adequadas, pode virar acetil-CoA.\", \"n\": 91}, {\"t\": \"ab\", \"c\": \"Glicólise\", \"q\": \"Quais são as principais funções da glicólise?\", \"ex\": \"Produzir ATP rapidamente; formar NADH; fornecer piruvato para oxidação, lactato ou gliconeogênese; e gerar intermediários para outras biossínteses. Ela é indispensável para hemácias e muito importante em exercício intenso e tecidos hipóxicos.\", \"n\": 92}, {\"t\": \"ab\", \"c\": \"Glicólise\", \"q\": \"Compare a primeira e a segunda fase da glicólise.\", \"ex\": \"Na fase de investimento, a célula consome 2 ATP e prepara a glicose para ser clivada em duas trioses. Na fase de rendimento, cada triose gera NADH e ATP: por glicose são formados 4 ATP e 2 NADH. Como 2 ATP já foram gastos, o saldo é 2 ATP.\", \"n\": 93}, {\"t\": \"ab\", \"c\": \"Glicólise\", \"q\": \"Quais são as três enzimas irreversíveis da glicólise e como são reguladas?\", \"ex\": \"Hexoquinase/glicoquinase, PFK-1 e piruvato-quinase. Hexoquinase sofre inibição por G6P; glicoquinase atua com alta glicose hepática. PFK-1 é ativada por AMP e F2,6BP e inibida por ATP/citrato. Piruvato-quinase é ativada por F1,6BP e inibida por ATP/alanina; no fígado, glucagon a inibe por fosforilação.\", \"n\": 94}, {\"t\": \"ab\", \"c\": \"Piruvato e fermentação\", \"q\": \"Descreva os principais destinos do piruvato.\", \"ex\": \"Pode virar acetil-CoA pelo complexo piruvato-desidrogenase; lactato pela LDH; oxaloacetato pela piruvato-carboxilase; alanina por transaminação; e, em leveduras, acetaldeído e etanol. O destino depende do tecido, oxigenação, estado energético e hormonal.\", \"n\": 95}, {\"t\": \"ab\", \"c\": \"Piruvato e fermentação\", \"q\": \"Explique a reação piruvato–lactato e seu balanço redox.\", \"ex\": \"Piruvato + NADH + H⁺ ⇌ lactato + NAD⁺, catalisado pela lactato-desidrogenase. O ponto-chave é regenerar NAD⁺ para a gliceraldeído-3-fosfato-desidrogenase; não se produz ATP nessa reação, mas ela permite que a glicólise continue.\", \"n\": 96}, {\"t\": \"ab\", \"c\": \"Piruvato e fermentação\", \"q\": \"Escreva os balanços simplificados das fermentações lática e alcoólica.\", \"ex\": \"Lática: C₆H₁₂O₆ (glicose) + 2 ADP + 2 Pi → 2 lactato + 2 ATP + 2 H₂O. Alcoólica: C₆H₁₂O₆ (glicose) + 2 ADP + 2 Pi → 2 C₂H₅OH (etanol) + 2 CO₂ (dióxido de carbono) + 2 ATP + 2 H₂O. Em humanos ocorre fermentação lática; a alcoólica é típica de leveduras.\", \"n\": 97}, {\"t\": \"ab\", \"c\": \"Glicogênio\", \"q\": \"Diferencie glicogênese, glicogenólise e gliconeogênese.\", \"ex\": \"Glicogênese armazena glicose como glicogênio. Glicogenólise quebra glicogênio em G1P/G6P. Gliconeogênese fabrica glicose nova a partir de lactato, alanina, glicerol e outros precursores. Uma mexe no depósito; a outra cria glicose a partir de não carboidratos.\", \"n\": 98}, {\"t\": \"ab\", \"c\": \"Glicogênio\", \"q\": \"Explique a função da glicogenina e das enzimas ramificadora e desramificadora.\", \"ex\": \"Glicogenina cria o primer ao ligar glicoses à própria tirosina. A ramificadora transfere um segmento e forma ligação α-1,6. Na degradação, a desramificadora tem duas atividades: transferase, que move resíduos, e α-1,6-glicosidase, que libera a glicose do ponto de ramificação.\", \"n\": 99}, {\"t\": \"ab\", \"c\": \"Glicogênio\", \"q\": \"Compare o destino da glicose-6-fosfato no fígado e no músculo.\", \"ex\": \"No músculo, G6P entra sobretudo na glicólise para produzir ATP. No fígado, além de glicólise, glicogênio e via das pentoses, ela pode ser desfosforilada por glicose-6-fosfatase e liberada como glicose sanguínea. Por isso o fígado sustenta a glicemia e o músculo usa seu estoque localmente.\", \"n\": 100}, {\"t\": \"ab\", \"c\": \"Glicogênio\", \"q\": \"Como insulina, glucagon, adrenalina, Ca²⁺ e AMP regulam o glicogênio?\", \"ex\": \"Insulina favorece desfosforilação: ativa glicogênio-sintase e inibe a degradação. Glucagon no fígado e adrenalina ativam cAMP/PKA e glicogenólise. No músculo em contração, Ca²⁺ ativa fosforilase-quinase e AMP ativa alostericamente a fosforilase, garantindo combustível rápido.\", \"n\": 101}, {\"t\": \"ab\", \"c\": \"Gliconeogênese e Von Gierke\", \"q\": \"Quais são os quatro desvios das etapas irreversíveis na gliconeogênese?\", \"ex\": \"Piruvato-carboxilase converte piruvato em oxaloacetato; PEPCK converte oxaloacetato em PEP; frutose-1,6-bisfosfatase forma F6P; glicose-6-fosfatase forma glicose livre. As duas primeiras contornam a piruvato-quinase; as outras contornam PFK-1 e hexo/glicoquinase.\", \"n\": 102}, {\"t\": \"ab\", \"c\": \"Gliconeogênese e Von Gierke\", \"q\": \"Explique a doença de Von Gierke tipo Ia e seus achados.\", \"ex\": \"É deficiência de glicose-6-fosfatase. O fígado não conclui glicogenólise nem gliconeogênese, causando hipoglicemia grave de jejum. G6P e glicogênio acumulam, levando a hepatomegalia; os desvios elevam lactato, ácido úrico e triglicerídeos. Alimentação frequente/amido cru pode ajudar a evitar jejum prolongado sob orientação especializada.\", \"n\": 103}, {\"t\": \"ab\", \"c\": \"Pentoses, G6PD e Cori\", \"q\": \"Quais são as funções da via das pentoses-fosfato e em que tecidos ela é ativa?\", \"ex\": \"Produz NADPH para síntese redutora e defesa antioxidante, e ribose-5-fosfato para nucleotídeos. É ativa em fígado, tecido adiposo, córtex adrenal, gônadas, glândula mamária lactante e hemácias; nestas, o NADPH é essencial contra peróxidos.\", \"n\": 104}, {\"t\": \"ab\", \"c\": \"Pentoses, G6PD e Cori\", \"q\": \"Compare as fases oxidativa e não oxidativa da via das pentoses.\", \"ex\": \"A oxidativa é irreversível e gera 2 NADPH, CO₂ e ribulose-5-P por G6P. A não oxidativa é reversível e reorganiza açúcares de 3 a 7 carbonos, formando ribose-5-P ou retornando F6P/G3P à glicólise. Assim a célula ajusta NADPH e ribose às suas necessidades.\", \"n\": 105}, {\"t\": \"ab\", \"c\": \"Pentoses, G6PD e Cori\", \"q\": \"Explique por que a deficiência de G6PD causa hemólise após certos gatilhos.\", \"ex\": \"Com pouca G6PD, a hemácia produz menos NADPH e regenera menos glutationa reduzida. Infecção, favas e alguns fármacos aumentam oxidantes; hemoglobina precipita em corpos de Heinz, a membrana se danifica e surgem células mordidas, icterícia e urina escura. O diagnóstico deve considerar que o teste pode parecer normal logo após uma crise.\", \"n\": 106}, {\"t\": \"ab\", \"c\": \"Pentoses, G6PD e Cori\", \"q\": \"Descreva passo a passo o Ciclo de Cori e seu balanço energético.\", \"ex\": \"Músculo intenso ou hemácia converte glicose em 2 lactatos e ganha 2 ATP. Lactato viaja ao fígado, vira piruvato e depois glicose por gliconeogênese, que custa 6 equivalentes de ATP. A glicose retorna ao sangue. Balanço do organismo: custo líquido de 4 ATP, pago pelo fígado para sustentar o tecido periférico.\", \"n\": 107}, {\"t\": \"ab\", \"c\": \"Insulina e diabetes\", \"q\": \"Explique síntese, secreção e ação da insulina.\", \"ex\": \"Pré-pró-insulina vira pró-insulina e depois insulina + peptídeo C. Na célula β, glicose aumenta ATP, fecha canal KATP, despolariza, abre Ca²⁺ e provoca exocitose. O receptor tirosina-quinase ativa IRS–PI3K–Akt, transloca GLUT4 em músculo/adipócito e promove síntese/armazenamento, enquanto reduz produção hepática de glicose.\", \"n\": 108}, {\"t\": \"ab\", \"c\": \"Insulina e diabetes\", \"q\": \"Compare diabetes mellitus tipo 1 e tipo 2.\", \"ex\": \"DM1: destruição autoimune de células β, deficiência absoluta de insulina, início frequentemente mais rápido e maior risco de cetoacidose; requer insulina. DM2: resistência à insulina com falência β progressiva, forte relação com predisposição e adiposidade, tratamento individualizado com estilo de vida e medicamentos, podendo necessitar insulina.\", \"n\": 109}, {\"t\": \"ab\", \"c\": \"Insulina e diabetes\", \"q\": \"Quais são os critérios laboratoriais de diagnóstico do diabetes?\", \"ex\": \"Glicemia de jejum ≥126 mg/dL; glicemia de 2 h no TOTG 75 g ≥200 mg/dL; HbA1c ≥6,5% em método apropriado; ou glicemia casual ≥200 mg/dL com sintomas clássicos/crise. Sem hiperglicemia inequívoca, o resultado deve ser confirmado. Critérios são clínicos e devem seguir diretriz vigente.\", \"n\": 110}, {\"t\": \"ab\", \"c\": \"Insulina e diabetes\", \"q\": \"Explique as quatro P do diabetes.\", \"ex\": \"Poliúria: glicosúria causa diurese osmótica. Polidipsia: perda de água aumenta sede. Polifagia: células percebem menor utilização de combustível, apesar da glicose sanguínea. Perda de peso: lipólise/proteólise e perda calórica urinária, especialmente no DM1 descompensado.\", \"n\": 111}, {\"t\": \"ab\", \"c\": \"Insulina e diabetes\", \"q\": \"O que significa resistência à insulina?\", \"ex\": \"É resposta biológica menor a uma concentração de insulina. Músculo capta menos glicose, tecido adiposo suprime menos lipólise e fígado continua produzindo glicose. No início, a célula β compensa com hiperinsulinemia; com o tempo pode falhar e a hiperglicemia se instala.\", \"n\": 112}, {\"t\": \"ab\", \"c\": \"Glucagon e hipoglicemia\", \"q\": \"Explique como o glucagon aumenta a glicemia.\", \"ex\": \"Ao ligar-se ao receptor hepático Gs, ele ativa adenilato-ciclase, cAMP e PKA. Isso ativa fosforilase-quinase/glicogênio-fosforilase, inibe glicogênio-sintase, reduz glicólise hepática e favorece gliconeogênese. O resultado é produção e liberação de glicose pelo fígado.\", \"n\": 113}, {\"t\": \"ab\", \"c\": \"Glucagon e hipoglicemia\", \"q\": \"Quais estímulos aumentam e quais reduzem a secreção de glucagon?\", \"ex\": \"Aumentam: hipoglicemia, aminoácidos de refeição proteica, exercício/estímulo simpático. Reduzem: glicose elevada, insulina, somatostatina e sinais incretínicos como GLP-1. A resposta integrada evita hipoglicemia após proteína e limita hiperglicemia após carboidrato.\", \"n\": 114}, {\"t\": \"ab\", \"c\": \"Glucagon e hipoglicemia\", \"q\": \"Quais são os principais usos clínicos do glucagon?\", \"ex\": \"Resgate de hipoglicemia grave quando a pessoa não pode ingerir carboidrato; relaxamento gastrointestinal em alguns exames/procedimentos; e uso adjuvante em intoxicação por β-bloqueador por elevar cAMP cardíaco. Dose, via e indicação seguem produto/protocolo; após despertar, oferecer carboidrato se deglutição segura e buscar avaliação.\", \"n\": 115}, {\"t\": \"ab\", \"c\": \"Glucagon e hipoglicemia\", \"q\": \"Como agir diante de hipoglicemia leve em pessoa consciente e diante de hipoglicemia grave?\", \"ex\": \"Consciente e capaz de engolir: consumir cerca de 15 g de carboidrato de ação rápida, reavaliar em 15 minutos e repetir se continuar baixa; depois fazer lanche/refeição conforme contexto. Inconsciente/convulsionando: não dar nada pela boca, acionar emergência, administrar glucagon se disponível e treinado e proteger a via aérea.\", \"n\": 116}, {\"t\": \"ab\", \"c\": \"Integração metabólica\", \"q\": \"Compare o estado alimentado e o jejum.\", \"ex\": \"Após refeição, insulina alta promove GLUT4, glicólise, glicogênio e lipídios; glucagon cai. No jejum, insulina baixa e glucagon alto sustentam glicemia: primeiro predomina glicogenólise hepática, depois gliconeogênese; tecido adiposo fornece ácidos graxos e glicerol. O objetivo é poupar glicose para tecidos dependentes.\", \"n\": 117}, {\"t\": \"ab\", \"c\": \"Integração metabólica\", \"q\": \"Acompanhe uma molécula de glicose desde o intestino até o músculo após uma refeição.\", \"ex\": \"Amido é digerido a glicose; SGLT1 leva glicose com Na⁺ ao enterócito e GLUT2 a libera no sangue portal. Fígado capta parte por GLUT2 e armazena/usa. A glicemia estimula insulina; no músculo, PI3K–Akt leva GLUT4 à membrana. A glicose entra, vira G6P e segue para glicogênio ou glicólise.\", \"n\": 118}, {\"t\": \"ab\", \"c\": \"Pistas de prova\", \"q\": \"Monte um mapa de palavras-chave para: fava + icterícia; hipoglicemia + hepatomegalia; exercício + lactato; quatro P; e inconsciência por glicemia baixa.\", \"ex\": \"Fava + icterícia/urina escura → deficiência de G6PD e hemólise oxidativa. Hipoglicemia de jejum + hepatomegalia + lactato alto → Von Gierke. Exercício intenso + lactato → regeneração de NAD⁺ e Ciclo de Cori. Quatro P → diabetes descompensado. Inconsciência por hipoglicemia → nada oral, emergência e glucagon se disponível.\", \"n\": 119}, {\"t\": \"ab\", \"c\": \"Integração metabólica\", \"q\": \"Explique por que a glicose-6-fosfato é uma encruzilhada metabólica.\", \"ex\": \"Ela pode entrar na glicólise para gerar ATP, virar glicogênio, seguir pela via das pentoses para NADPH/ribose ou, em fígado/rim, ser desfosforilada e liberada como glicose. O destino muda conforme energia, tecido e hormônios; por isso G6P conecta praticamente todo o conteúdo dos cinco slides.\", \"n\": 120}];\nFC.push(...[{\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"Onde ocorre a cadeia respiratória bacteriana?\",\"a\":\"Na membrana plasmática, pois bactérias não possuem mitocôndrias.\"},{\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"Como a membrana bacteriana participa da produção de ATP?\",\"a\":\"A cadeia respiratória cria um gradiente de H⁺; o retorno dos prótons pela ATP-sintase converte ADP + Pi em ATP.\"},{\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"Diferencie catabolismo e anabolismo bacterianos.\",\"a\":\"Catabolismo degrada nutrientes e conserva energia; anabolismo usa ATP, poder redutor e precursores para construir componentes celulares.\"},{\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"Por que a parede celular evita lise osmótica?\",\"a\":\"O peptidoglicano oferece resistência mecânica à entrada de água e contém a pressão exercida sobre a membrana.\"},{\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"O que acontece quando a parede fica frágil?\",\"a\":\"A entrada de água aumenta a pressão sobre a membrana sem suporte, que pode deformar-se e romper, causando lise osmótica.\"},{\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"Do que é formada a estrutura básica dos aminoglicosídeos?\",\"a\":\"De grupos de aminoaçúcares ligados a um núcleo aminociclitol.\"},{\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"Por que aminoglicosídeos são polares?\",\"a\":\"Possuem vários grupos amina protonáveis e hidroxilas, adquirindo múltiplas cargas e alta hidrossolubilidade.\"},{\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"Qual é o alvo dos aminoglicosídeos?\",\"a\":\"A subunidade 30S do ribossomo bacteriano, especialmente o RNA ribossômico.\"},{\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"Como aminoglicosídeos alteram a tradução?\",\"a\":\"Prejudicam a iniciação e provocam leitura incorreta do mRNA, formando proteínas defeituosas.\"},{\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"Por que aminoglicosídeos têm pouca ação contra anaeróbios estritos?\",\"a\":\"Sua entrada eficaz depende de energia ligada ao gradiente eletroquímico e ao metabolismo oxidativo.\"},{\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"Quais efeitos adversos principais dos aminoglicosídeos?\",\"a\":\"Nefrotoxicidade, ototoxicidade e, em situações predisponentes, bloqueio neuromuscular.\"},{\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"Aminoglicosídeos alteram diretamente a glicemia?\",\"a\":\"Não. Seu alvo é o ribossomo bacteriano 30S, não as vias humanas da glicose nem os receptores de insulina e glucagon.\"},{\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"O que é toxicidade seletiva?\",\"a\":\"O princípio pelo qual o antibiótico altera exclusivamente o metabolismo bacteriano, sem afetar diretamente o metabolismo do hospedeiro humano.\"},{\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"Onde fica o ciclo de Krebs na bactéria?\",\"a\":\"No citoplasma, com as enzimas flutuando livres, sem confinamento em uma organela como a mitocôndria.\"},{\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"O que significa a função anfibólica do ciclo de Krebs bacteriano?\",\"a\":\"Ele atua tanto no catabolismo, gerando ATP a partir da oxidação do acetil-CoA, quanto no anabolismo, fornecendo intermediários para síntese de aminoácidos e outras moléculas.\"},{\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"Para onde migram o NADH e o FADH₂ produzidos pelo ciclo de Krebs bacteriano?\",\"a\":\"Migram até a membrana plasmática, que hospeda a cadeia respiratória e funciona como equivalente da membrana mitocondrial.\"},{\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"Quais antibióticos bloqueiam a síntese de peptidoglicano e causam lise osmótica, segundo o exemplo da aula?\",\"a\":\"Vancomicina e fosfomicina.\"},{\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"Qual é a sequência de eventos da lise osmótica causada por vancomicina e fosfomicina?\",\"a\":\"Bloqueio da síntese do peptidoglicano → debilitamento estrutural da parede → entrada incontrolável de água → ruptura e lise da célula.\"},{\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"Qual é a consequência indireta do uso de antibióticos sobre a digestão de carboidratos no intestino?\",\"a\":\"A erradicação da microbiota intestinal compromete a fermentação e o processamento de carboidratos complexos no cólon, gerando desequilíbrios metabólicos locais.\"},{\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"Por que se diz que a microbiota sofre um 'dano colateral' com o uso de antibióticos?\",\"a\":\"Porque, mesmo sem afetar diretamente o metabolismo celular humano, o antibiótico elimina também bactérias comensais do cólon, não apenas o patógeno-alvo.\"},{\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"Quais estruturas bacterianas ilustram o princípio da seletividade metabólica em relação à célula humana?\",\"a\":\"A parede celular de peptidoglicano, ausente em humanos, e os ribossomos 70S, diferentes dos 80S humanos.\"}]);\nQD.push(...[{\"t\":\"mc\",\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"Em qual estrutura bacteriana ocorre a cadeia transportadora de elétrons?\",\"o\":[{\"l\":\"A\",\"v\":\"Nucleoide\"},{\"l\":\"B\",\"v\":\"Membrana plasmática\"},{\"l\":\"C\",\"v\":\"Parede de peptidoglicano\"},{\"l\":\"D\",\"v\":\"Ribossomo 30S\"}],\"cr\":\"B\",\"ex\":\"Sem mitocôndrias, a bactéria instala sua cadeia respiratória na membrana plasmática.\",\"n\":121},{\"t\":\"mc\",\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"A força próton-motriz participa diretamente de qual processo?\",\"o\":[{\"l\":\"A\",\"v\":\"Produção de ATP pela ATP-sintase\"},{\"l\":\"B\",\"v\":\"Formação do nucleoide\"},{\"l\":\"C\",\"v\":\"Ligação do glicogênio ao DNA\"},{\"l\":\"D\",\"v\":\"Produção de insulina\"}],\"cr\":\"A\",\"ex\":\"O retorno de H⁺ pela ATP-sintase fornece energia para formar ATP a partir de ADP e Pi.\",\"n\":122},{\"t\":\"mc\",\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"Qual alternativa define anabolismo bacteriano?\",\"o\":[{\"l\":\"A\",\"v\":\"Degradação de nutrientes para liberar energia\"},{\"l\":\"B\",\"v\":\"Construção de moléculas com gasto de energia\"},{\"l\":\"C\",\"v\":\"Ruptura osmótica exclusiva\"},{\"l\":\"D\",\"v\":\"Perda espontânea da membrana\"}],\"cr\":\"B\",\"ex\":\"O anabolismo usa ATP, poder redutor e precursores para sintetizar proteínas, lipídios, ácidos nucleicos e parede.\",\"n\":123},{\"t\":\"mc\",\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"A lise osmótica após perda da parede ocorre porque:\",\"o\":[{\"l\":\"A\",\"v\":\"A membrana passa a produzir glicose\"},{\"l\":\"B\",\"v\":\"A água entra e a membrana fica sem suporte mecânico\"},{\"l\":\"C\",\"v\":\"O ribossomo vira uma mitocôndria\"},{\"l\":\"D\",\"v\":\"O DNA transforma-se em peptidoglicano\"}],\"cr\":\"B\",\"ex\":\"A parede contém a pressão osmótica. Sem sua resistência, a entrada de água pode levar à ruptura da membrana.\",\"n\":124},{\"t\":\"mc\",\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"A estrutura dos aminoglicosídeos contém principalmente:\",\"o\":[{\"l\":\"A\",\"v\":\"Aminoaçúcares ligados a um aminociclitol\"},{\"l\":\"B\",\"v\":\"Somente ácidos graxos\"},{\"l\":\"C\",\"v\":\"Um núcleo esteroide\"},{\"l\":\"D\",\"v\":\"Peptidoglicano intacto\"}],\"cr\":\"A\",\"ex\":\"Os aminoaçúcares e o aminociclitol explicam o caráter policatiônico e hidrossolúvel da classe.\",\"n\":125},{\"t\":\"mc\",\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"Qual é o alvo primário dos aminoglicosídeos?\",\"o\":[{\"l\":\"A\",\"v\":\"Subunidade 30S\"},{\"l\":\"B\",\"v\":\"Receptor de insulina\"},{\"l\":\"C\",\"v\":\"Glicose-6-fosfatase humana\"},{\"l\":\"D\",\"v\":\"Parede como alvo único\"}],\"cr\":\"A\",\"ex\":\"Eles se ligam à 30S, prejudicam iniciação e fidelidade da leitura do mRNA.\",\"n\":126},{\"t\":\"mc\",\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"Qual consequência resulta da leitura incorreta do mRNA?\",\"o\":[{\"l\":\"A\",\"v\":\"Proteínas bacterianas defeituosas\"},{\"l\":\"B\",\"v\":\"Produção direta de insulina\"},{\"l\":\"C\",\"v\":\"Aumento obrigatório da glicemia\"},{\"l\":\"D\",\"v\":\"Síntese de glicogênio humano\"}],\"cr\":\"A\",\"ex\":\"A incorporação de aminoácidos incorretos produz proteínas anormais; algumas agravam o dano de membrana.\",\"n\":127},{\"t\":\"mc\",\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"Qual efeito no hospedeiro exige atenção com aminoglicosídeos?\",\"o\":[{\"l\":\"A\",\"v\":\"Nefrotoxicidade e ototoxicidade\"},{\"l\":\"B\",\"v\":\"Produção de peptidoglicano humano\"},{\"l\":\"C\",\"v\":\"Hipoglicemia direta obrigatória\"},{\"l\":\"D\",\"v\":\"Síntese de ribossomos 70S humanos\"}],\"cr\":\"A\",\"ex\":\"Acúmulo renal e lesão de células sensoriais do ouvido interno explicam riscos importantes da classe.\",\"n\":128},{\"t\":\"tf\",\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"Bactérias utilizam mitocôndrias para a fosforilação oxidativa.\",\"cr\":\"F\",\"ex\":\"Bactérias não possuem mitocôndrias; sua cadeia respiratória fica na membrana plasmática.\",\"n\":129},{\"t\":\"tf\",\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"O catabolismo fornece energia e intermediários que podem sustentar o anabolismo.\",\"cr\":\"V\",\"ex\":\"A degradação de nutrientes produz ATP, poder redutor e fragmentos usados na construção celular.\",\"n\":130},{\"t\":\"tf\",\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"A parede de peptidoglicano ajuda a impedir a lise osmótica.\",\"cr\":\"V\",\"ex\":\"Sua rigidez contém a pressão produzida pela entrada de água e sustenta a membrana.\",\"n\":131},{\"t\":\"tf\",\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"O mecanismo primário dos aminoglicosídeos é bloquear diretamente a síntese de peptidoglicano.\",\"cr\":\"F\",\"ex\":\"O alvo primário é a subunidade 30S; alterações de membrana são consequências do erro de tradução.\",\"n\":132},{\"t\":\"tf\",\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"Aminoglicosídeos são moléculas polares formadas por aminoaçúcares e aminociclitol.\",\"cr\":\"V\",\"ex\":\"Os grupos amina e hidroxila conferem cargas e alta hidrossolubilidade.\",\"n\":133},{\"t\":\"tf\",\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"A entrada eficaz dos aminoglicosídeos depende do estado energético e do metabolismo oxidativo bacteriano.\",\"cr\":\"V\",\"ex\":\"Essa dependência ajuda a explicar a baixa atividade contra anaeróbios estritos.\",\"n\":134},{\"t\":\"tf\",\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"Aminoglicosídeos podem causar nefrotoxicidade e ototoxicidade no hospedeiro.\",\"cr\":\"V\",\"ex\":\"Apesar da seletividade pelo ribossomo bacteriano, a classe pode lesar túbulos renais e estruturas cocleares ou vestibulares.\",\"n\":135},{\"t\":\"tf\",\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"Aminoglicosídeos reduzem diretamente a glicemia ao ativar receptores de insulina.\",\"cr\":\"F\",\"ex\":\"Eles não agem sobre receptores de insulina ou glucagon nem sobre as vias humanas da glicose; mudanças glicêmicas durante infecção são indiretas.\",\"n\":136},{\"t\":\"mc\",\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"Onde estão localizadas as enzimas do ciclo de Krebs na bactéria?\",\"o\":[{\"l\":\"A\",\"v\":\"Na matriz mitocondrial\"},{\"l\":\"B\",\"v\":\"Livres no citoplasma\"},{\"l\":\"C\",\"v\":\"Na parede de peptidoglicano\"},{\"l\":\"D\",\"v\":\"No nucleoide\"}],\"cr\":\"B\",\"ex\":\"Sem mitocôndrias, as enzimas do ciclo de Krebs bacteriano flutuam livres no citoplasma, sem confinamento de organela.\",\"n\":137},{\"t\":\"mc\",\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"A função anfibólica do ciclo de Krebs bacteriano significa que ele:\",\"o\":[{\"l\":\"A\",\"v\":\"Atua apenas no catabolismo\"},{\"l\":\"B\",\"v\":\"Atua apenas no anabolismo\"},{\"l\":\"C\",\"v\":\"Integra catabolismo e anabolismo\"},{\"l\":\"D\",\"v\":\"Não produz ATP nem precursores\"}],\"cr\":\"C\",\"ex\":\"O ciclo fornece ATP pela via catabólica e, ao mesmo tempo, intermediários de carbono para vias anabólicas como a síntese proteica.\",\"n\":138},{\"t\":\"mc\",\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"Para onde migram o NADH e o FADH₂ produzidos no ciclo de Krebs bacteriano?\",\"o\":[{\"l\":\"A\",\"v\":\"Para o nucleoide\"},{\"l\":\"B\",\"v\":\"Para a parede celular\"},{\"l\":\"C\",\"v\":\"Para a membrana plasmática\"},{\"l\":\"D\",\"v\":\"Para fora da célula\"}],\"cr\":\"C\",\"ex\":\"Essas coenzimas reduzidas migram até a membrana plasmática, que hospeda a cadeia respiratória bacteriana e funciona como equivalente da membrana mitocondrial.\",\"n\":139},{\"t\":\"mc\",\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"Vancomicina e fosfomicina compartilham qual mecanismo geral de ação?\",\"o\":[{\"l\":\"A\",\"v\":\"Inibição da síntese de peptidoglicano, levando à lise osmótica\"},{\"l\":\"B\",\"v\":\"Inibição da subunidade 30S do ribossomo\"},{\"l\":\"C\",\"v\":\"Bloqueio direto de receptores de insulina\"},{\"l\":\"D\",\"v\":\"Inibição da RNA-polimerase\"}],\"cr\":\"A\",\"ex\":\"Ambas enfraquecem a parede celular ao interferir na formação do peptidoglicano, tornando a bactéria vulnerável à entrada descontrolada de água.\",\"n\":140},{\"t\":\"mc\",\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"Qual é a consequência indireta do uso de antibióticos discutida quanto ao impacto sobre o hospedeiro humano?\",\"o\":[{\"l\":\"A\",\"v\":\"Aumento direto e obrigatório da glicemia\"},{\"l\":\"B\",\"v\":\"Alteração da microbiota intestinal e da digestão colônica de carboidratos\"},{\"l\":\"C\",\"v\":\"Produção de peptidoglicano humano\"},{\"l\":\"D\",\"v\":\"Substituição do ribossomo 70S humano\"}],\"cr\":\"B\",\"ex\":\"Mesmo sem agir sobre o metabolismo celular humano, antibióticos podem eliminar bactérias simbiontes do intestino, afetando a fermentação de carboidratos complexos no cólon.\",\"n\":141},{\"t\":\"tf\",\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"O ciclo de Krebs bacteriano ocorre dentro de uma organela análoga à mitocôndria.\",\"cr\":\"F\",\"ex\":\"Bactérias não possuem mitocôndrias; as enzimas do ciclo ficam livres no citoplasma.\",\"n\":142},{\"t\":\"tf\",\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"A membrana plasmática bacteriana pode ser considerada funcionalmente equivalente à membrana mitocondrial.\",\"cr\":\"V\",\"ex\":\"Ela hospeda a cadeia respiratória e permite a síntese de ATP pela ATP-sintase, papel desempenhado pela membrana mitocondrial nas células humanas.\",\"n\":143},{\"t\":\"tf\",\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"A vancomicina e a fosfomicina causam lise osmótica ao debilitar a parede celular bacteriana.\",\"cr\":\"V\",\"ex\":\"Ao bloquear a formação do peptidoglicano, ambas comprometem a resistência mecânica da parede frente à pressão osmótica interna.\",\"n\":144},{\"t\":\"tf\",\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"A erradicação da microbiota intestinal por antibióticos não tem nenhum custo fisiológico para o hospedeiro.\",\"cr\":\"F\",\"ex\":\"Embora o metabolismo celular humano não seja diretamente afetado, a perda da flora simbiótica prejudica a fermentação de carboidratos complexos e pode causar desequilíbrios digestivos.\",\"n\":145},{\"t\":\"tf\",\"c\":\"Antibióticos e metabolismo bacteriano\",\"q\":\"O ciclo de Krebs bacteriano tem função apenas catabólica, sem contribuir para vias biossintéticas.\",\"cr\":\"F\",\"ex\":\"Sua função é anfibólica: fornece tanto energia (ATP) quanto precursores de carbono para síntese de proteínas e outras moléculas.\",\"n\":146}]);\ndocument.querySelectorAll('[data-flashcard-count]').forEach(el=>el.textContent=FC.length);\ndocument.querySelectorAll('[data-question-count]').forEach(el=>el.textContent=QD.length);\n\nconst canvas=document.getElementById('particles'),ctx=canvas.getContext('2d');let particles=[];\nfunction resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}resize();window.addEventListener('resize',resize);\nfor(let i=0;i\u003c60;i++)particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*2+.5,dx:(Math.random()-.5)*.3,dy:(Math.random()-.5)*.3,alpha:Math.random()*.35+.08,color:Math.random()>.5?'56,232,192':'79,156,249'});\nfunction animParticles(){ctx.clearRect(0,0,canvas.width,canvas.height);particles.forEach(p=>{p.x+=p.dx;p.y+=p.dy;if(p.x\u003c0||p.x>canvas.width)p.dx*=-1;if(p.y\u003c0||p.y>canvas.height)p.dy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(${p.color},${p.alpha})`;ctx.fill();});requestAnimationFrame(animParticles)}animParticles();\n\nfunction showSection(id,btn){document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===id||s.dataset.group===id));document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');window.scrollTo({top:0,behavior:'smooth'});}\nfunction showSectionByName(id){showSection(id,document.querySelector(`nav.tabs button[data-section=\"${id}\"]`));}\nwindow.addEventListener('scroll',()=>{document.getElementById('scrolltop').style.display=window.scrollY>300?'block':'none';});\nconst topicCards=document.getElementById('topicCards');TOPICS.forEach(([id,icon,name,desc])=>{const card=document.createElement('article');card.className='intro-card';card.innerHTML=`\u003cdiv class=\"ic-icon\">${icon}\u003c/div>\u003cdiv class=\"ic-name\">${name}\u003c/div>\u003cdiv class=\"ic-desc\">${desc}\u003c/div>`;card.onclick=()=>showSectionByName(id);topicCards.appendChild(card);});\n\nfunction fillSelect(select,values){select.innerHTML='\u003coption value=\"\">Todos os temas\u003c/option>'+values.map(v=>`\u003coption value=\"${v}\">${v}\u003c/option>`).join('');}\nconst fcFilter=document.getElementById('fcFilter'),fcSearch=document.getElementById('fcSearch');fillSelect(fcFilter,[...new Set(FC.map(x=>x.c))]);\nfunction renderFlashcards(){const grid=document.getElementById('flashcard-grid'),category=fcFilter.value,term=fcSearch.value.trim().toLocaleLowerCase('pt-BR');const shown=FC.filter(x=>(!category||x.c===category)&&(!term||(x.q+' '+x.a).toLocaleLowerCase('pt-BR').includes(term)));grid.innerHTML='';shown.forEach(({c,q,a})=>{const card=document.createElement('article');card.className='flashcard';card.innerHTML=`\u003cdiv class=\"flashcard-inner\">\u003cdiv class=\"flashcard-front\">\u003cdiv class=\"fc-tag\">${c}\u003c/div>\u003cdiv class=\"fc-q\">${q}\u003c/div>\u003cdiv class=\"fc-hint\">clique para virar ↻\u003c/div>\u003c/div>\u003cdiv class=\"flashcard-back\">\u003cdiv class=\"fc-tag\" style=\"color:var(--green)\">Resposta explicada\u003c/div>\u003cdiv class=\"fc-back-text\" style=\"margin-top:8px\">${a}\u003c/div>\u003c/div>\u003c/div>`;card.onclick=()=>card.classList.toggle('flipped');grid.appendChild(card);});document.getElementById('fcVisible').textContent=`${shown.length} de ${FC.length} cartões`;document.getElementById('fcEmpty').style.display=shown.length?'none':'block';}\nfcFilter.addEventListener('change',renderFlashcards);fcSearch.addEventListener('input',renderFlashcards);function shuffleFlashcards(){for(let i=FC.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[FC[i],FC[j]]=[FC[j],FC[i]];}renderFlashcards();}renderFlashcards();\n\nlet QS={c:0,w:0,a:0};const qCategory=document.getElementById('qCategory'),qType=document.getElementById('qType');fillSelect(qCategory,[...new Set(QD.map(x=>x.c))]);\nfunction renderQuiz(){const ct=document.getElementById('quizContainer');ct.innerHTML='';const tl={mc:'Múltipla Escolha',tf:'V ou F',ab:'Aberta'},tc={mc:'tmc',tf:'ttf',ab:'tab'};QD.forEach((q,i)=>{const d=document.createElement('article');d.className='q-card';d.id='q'+i;d.dataset.category=q.c;d.dataset.type=q.t;let body='';if(q.t==='mc')body=`\u003cdiv class=\"opts\">${q.o.map(o=>`\u003cbutton class=\"opt-btn\" data-l=\"${o.l}\" onclick=\"answerMC(${i},'${o.l}')\">\u003cspan class=\"ol\">${o.l})\u003c/span>\u003cspan>${o.v}\u003c/span>\u003c/button>`).join('')}\u003c/div>`;else if(q.t==='tf')body=`\u003cdiv class=\"tf-opts\">\u003cbutton class=\"tf-btn\" data-v=\"V\" onclick=\"answerTF(${i},'V')\">✅ VERDADEIRO\u003c/button>\u003cbutton class=\"tf-btn\" data-v=\"F\" onclick=\"answerTF(${i},'F')\">❌ FALSO\u003c/button>\u003c/div>`;else body=`\u003cbutton class=\"open-btn\" id=\"ob${i}\" onclick=\"revealOpen(${i})\">💡 Ver resposta explicada\u003c/button>`;d.innerHTML=`\u003cdiv class=\"q-head\">\u003cspan class=\"q-num\">Questão ${q.n}\u003c/span>\u003cdiv style=\"display:flex;gap:.4rem;flex-wrap:wrap\">\u003cspan class=\"q-tbadge ${tc[q.t]}\">${tl[q.t]}\u003c/span>\u003cspan class=\"ctag\">${q.c}\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"res-ind\" id=\"ri${i}\">\u003c/div>\u003cp class=\"q-text\">${q.q}\u003c/p>${body}\u003cdiv class=\"exp-box\" id=\"ex${i}\">\u003cdiv class=\"et\">📖 Explicação do professor\u003c/div>\u003cp>${q.ex.replace(/\\n/g,'\u003cbr>')}\u003c/p>\u003c/div>`;ct.appendChild(d);});updateScores();filterQuiz();}\nfunction answerMC(i,ch){const q=QD[i],card=document.getElementById('q'+i);if(card.classList.contains('ans'))return;card.querySelectorAll('.opt-btn').forEach(b=>{b.disabled=true;if(b.dataset.l===q.cr)b.classList.add('ca');if(b.dataset.l===ch&&ch!==q.cr)b.classList.add('wa')});const ok=ch===q.cr;card.classList.add('ans',ok?'cq':'wq');const ri=document.getElementById('ri'+i);ri.className=`res-ind vis ${ok?'c':'w'}`;ri.innerHTML=ok?'✅ Correto!':`❌ Incorreto. Resposta: ${q.cr}`;document.getElementById('ex'+i).classList.add('vis');ok?QS.c++:QS.w++;QS.a++;updateScores();}\nfunction answerTF(i,ch){const q=QD[i],card=document.getElementById('q'+i);if(card.classList.contains('ans'))return;card.querySelectorAll('.tf-btn').forEach(b=>{b.disabled=true;if(b.dataset.v===q.cr)b.classList.add('ca');if(b.dataset.v===ch&&ch!==q.cr)b.classList.add('wa')});const ok=ch===q.cr;card.classList.add('ans',ok?'cq':'wq');const ri=document.getElementById('ri'+i);ri.className=`res-ind vis ${ok?'c':'w'}`;ri.innerHTML=ok?'✅ Correto!':`❌ Incorreto. Resposta: ${q.cr==='V'?'VERDADEIRO':'FALSO'}`;document.getElementById('ex'+i).classList.add('vis');ok?QS.c++:QS.w++;QS.a++;updateScores();}\nfunction revealOpen(i){const card=document.getElementById('q'+i);if(card.classList.contains('ans'))return;card.classList.add('ans');document.getElementById('ob'+i).style.display='none';document.getElementById('ex'+i).classList.add('vis');QS.a++;updateScores();}\nfunction updateScores(){document.getElementById('sC').textContent=QS.c;document.getElementById('sW').textContent=QS.w;document.getElementById('sP').textContent=QD.length-QS.a;}\nfunction filterQuiz(){const category=qCategory.value,type=qType.value;let count=0;document.querySelectorAll('#quizContainer .q-card').forEach(card=>{const show=(!category||card.dataset.category===category)&&(!type||card.dataset.type===type);card.style.display=show?'block':'none';if(show)count++;});document.getElementById('qVisible').textContent=`${count} de ${QD.length} questões`;document.getElementById('qEmpty').style.display=count?'none':'block';}\nqCategory.addEventListener('change',filterQuiz);qType.addEventListener('change',filterQuiz);function resetQuiz(){QS={c:0,w:0,a:0};renderQuiz();}renderQuiz();\n\u003c/script>\u003cscript src=\"study-timer.js\">\u003c/script>\u003cscript src=\"study-progress.js\">\u003c/script>\u003cscript src=\"enzo-ia.js\">\u003c/script>\n\u003cscript>\n/* Marca-texto persistente — módulo reutilizável dos Resumos do Enzo. */\n(()=>{\n  'use strict';\n  const TARGET_SELECTOR=[\n    '.section p','.section li','.section td','.section th',\n    '.section h1','.section h2','.section h3','.section h4','.section h5','.section h6',\n    '.section blockquote','.section .fc-q','.section .fc-back-text'\n  ].join(',');\n  const STORAGE_KEY=`enzo-highlights:v1:${\"bioquimica_2_final_p1\"}`;\n  const COLORS=['yellow','green','red'];\n  let records=loadRecords();\n  let history=[];\n  let mode=null;\n  let color='yellow';\n  let erasing=false;\n  let eraseSnapshot=null;\n  let eraseChanged=false;\n  let observer=null;\n  let toastTimer=null;\n\n  const toolbar=document.createElement('aside');\n  toolbar.id='enzo-highlighter';\n  toolbar.setAttribute('aria-label','Ferramenta de marca-texto');\n  toolbar.innerHTML=`\n    \u003cbutton class=\"enzo-hl-toggle\" type=\"button\" aria-expanded=\"false\" title=\"Abrir marca-texto\">\n      \u003cspan aria-hidden=\"true\">🖍️\u003c/span>\u003cspan>Grifar\u003c/span>\u003cspan class=\"enzo-hl-count\" aria-label=\"Trechos grifados\">0\u003c/span>\n    \u003c/button>\n    \u003cdiv class=\"enzo-hl-panel\" role=\"toolbar\" aria-label=\"Cores e ferramentas\">\n      \u003cbutton class=\"enzo-hl-color active\" type=\"button\" data-color=\"yellow\" aria-label=\"Grifar em amarelo\" title=\"Amarelo\">Amarelo\u003c/button>\n      \u003cbutton class=\"enzo-hl-color\" type=\"button\" data-color=\"green\" aria-label=\"Grifar em verde\" title=\"Verde\">Verde\u003c/button>\n      \u003cbutton class=\"enzo-hl-color\" type=\"button\" data-color=\"red\" aria-label=\"Grifar em vermelho\" title=\"Vermelho\">Vermelho\u003c/button>\n      \u003cspan class=\"enzo-hl-divider\" aria-hidden=\"true\">\u003c/span>\n      \u003cbutton class=\"enzo-hl-tool enzo-hl-eraser\" type=\"button\" aria-label=\"Ativar borracha\" title=\"Borracha: arraste sobre as palavras\">🧽\u003c/button>\n      \u003cbutton class=\"enzo-hl-tool enzo-hl-undo\" type=\"button\" aria-label=\"Desfazer última ação\" title=\"Desfazer\" disabled>↶\u003c/button>\n    \u003c/div>`;\n  const toast=document.createElement('div');\n  toast.className='enzo-hl-toast';\n  toast.setAttribute('role','status');\n  toast.setAttribute('aria-live','polite');\n  document.body.append(toolbar,toast);\n\n  const toggle=toolbar.querySelector('.enzo-hl-toggle');\n  const countBadge=toolbar.querySelector('.enzo-hl-count');\n  const undoButton=toolbar.querySelector('.enzo-hl-undo');\n  const eraserButton=toolbar.querySelector('.enzo-hl-eraser');\n  const colorButtons=[...toolbar.querySelectorAll('.enzo-hl-color')];\n\n  function loadRecords(){\n    try{\n      const parsed=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');\n      return Array.isArray(parsed)?parsed.filter(r=>r&&r.id&&r.key&&Number.isFinite(r.start)&&Number.isFinite(r.end)&&COLORS.includes(r.color)):[];\n    }catch(_){return[]}\n  }\n  function saveRecords(){\n    try{localStorage.setItem(STORAGE_KEY,JSON.stringify(records))}catch(_){showToast('Não foi possível salvar os grifos neste navegador.')}\n  }\n  function snapshot(){return records.map(r=>({...r}))}\n  function pushHistory(state=snapshot()){\n    history.push(state);\n    if(history.length>40)history.shift();\n    updateToolbar();\n  }\n  function makeId(){return `${Date.now().toString(36)}${Math.random().toString(36).slice(2,9)}`}\n  function hashText(text){\n    let h=2166136261;\n    for(let i=0;i\u003ctext.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619)}\n    return (h>>>0).toString(36);\n  }\n  function normalizedText(el){return (el.textContent||'').replace(/\\s+/g,' ').trim()}\n  function isAllowedTarget(el){\n    return !!(el&&normalizedText(el)&&!el.closest('#enzo-highlighter,.study-tools,.q-stats,nav,footer')&&!el.matches('button,input,select,textarea'));\n  }\n  function assignKeys(){\n    const occurrences=new Map();\n    document.querySelectorAll(TARGET_SELECTOR).forEach(el=>{\n      if(!isAllowedTarget(el)||el.dataset.enzoHlKey)return;\n      const section=el.closest('.section')?.id||'page';\n      const base=`${section}:${hashText(normalizedText(el))}`;\n      const occurrence=occurrences.get(base)||0;\n      occurrences.set(base,occurrence+1);\n      el.dataset.enzoHlKey=`${base}:${occurrence}`;\n    });\n  }\n  function textNodes(root){\n    const nodes=[];\n    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(node){\n      return node.nodeValue&&node.nodeValue.length?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;\n    }});\n    while(walker.nextNode())nodes.push(walker.currentNode);\n    return nodes;\n  }\n  function boundaryOffset(root,node,offset){\n    let total=0;\n    for(const text of textNodes(root)){\n      if(text===node)return total+Math.max(0,Math.min(offset,text.nodeValue.length));\n      total+=text.nodeValue.length;\n    }\n    try{\n      const probe=document.createRange();\n      probe.selectNodeContents(root);probe.setEnd(node,offset);\n      return probe.toString().length;\n    }catch(_){return total}\n  }\n  function withObserverPaused(fn){\n    if(observer)observer.disconnect();\n    try{return fn()}finally{if(observer)observeDynamicAreas()}\n  }\n  function wrapRecord(rec){\n    const root=document.querySelector(`[data-enzo-hl-key=\"${rec.key}\"]`);\n    if(!root)return false;\n    const full=root.textContent||'';\n    if(rec.start\u003c0||rec.end>full.length||rec.start>=rec.end)return false;\n    if(rec.text&&full.slice(rec.start,rec.end)!==rec.text)return false;\n    const nodes=textNodes(root);\n    const segments=[];\n    let cursor=0;\n    for(const node of nodes){\n      const next=cursor+node.nodeValue.length;\n      const start=Math.max(rec.start,cursor),end=Math.min(rec.end,next);\n      if(start\u003cend)segments.push({node,start:start-cursor,end:end-cursor});\n      cursor=next;\n    }\n    for(let i=segments.length-1;i>=0;i--){\n      const seg=segments[i];\n      const range=document.createRange();\n      range.setStart(seg.node,seg.start);range.setEnd(seg.node,seg.end);\n      const mark=document.createElement('mark');\n      mark.className='enzo-highlight';mark.dataset.color=rec.color;mark.dataset.highlightId=rec.id;\n      mark.appendChild(range.extractContents());range.insertNode(mark);\n    }\n    return segments.length>0;\n  }\n  function clearRenderedMarks(){\n    document.querySelectorAll('mark.enzo-highlight').forEach(mark=>{\n      const parent=mark.parentNode;if(!parent)return;\n      parent.replaceChild(document.createTextNode(mark.textContent||''),mark);parent.normalize();\n    });\n  }\n  function renderAll(){\n    withObserverPaused(()=>{\n      clearRenderedMarks();assignKeys();records.forEach(wrapRecord);\n    });\n    updateToolbar();\n  }\n  function renderMissing(){\n    withObserverPaused(()=>{\n      assignKeys();\n      const rendered=new Set([...document.querySelectorAll('mark.enzo-highlight')].map(m=>m.dataset.highlightId));\n      records.forEach(rec=>{if(!rendered.has(rec.id))wrapRecord(rec)});\n    });\n    updateToolbar();\n  }\n  function selectionParts(range){\n    assignKeys();\n    const parts=[];\n    document.querySelectorAll('[data-enzo-hl-key]').forEach(root=>{\n      if(!isAllowedTarget(root))return;\n      let intersects=false;try{intersects=range.intersectsNode(root)}catch(_){return}\n      if(!intersects)return;\n      const full=root.textContent||'';\n      let start=root.contains(range.startContainer)?boundaryOffset(root,range.startContainer,range.startOffset):0;\n      let end=root.contains(range.endContainer)?boundaryOffset(root,range.endContainer,range.endOffset):full.length;\n      start=Math.max(0,Math.min(start,full.length));end=Math.max(start,Math.min(end,full.length));\n      if(full.slice(start,end).trim())parts.push({root,key:root.dataset.enzoHlKey,full,start,end});\n    });\n    return parts;\n  }\n  function applySelection(){\n    if(mode!=='highlight')return;\n    const selection=window.getSelection();\n    if(!selection||selection.isCollapsed||!selection.rangeCount)return;\n    if(toolbar.contains(selection.anchorNode)||toolbar.contains(selection.focusNode))return;\n    const parts=selectionParts(selection.getRangeAt(0));\n    if(!parts.length)return;\n    const before=snapshot();\n    const additions=[];\n    const removeIds=new Set();\n    parts.forEach(part=>{\n      records.forEach(rec=>{if(rec.key===part.key&&rec.start\u003cpart.end&&rec.end>part.start)removeIds.add(rec.id)});\n      const selected=part.full.slice(part.start,part.end);\n      const token=/\\S+\\s*/g;let match;\n      while((match=token.exec(selected))){\n        const start=part.start+match.index,end=start+match[0].length;\n        additions.push({id:makeId(),key:part.key,start,end,color,text:part.full.slice(start,end)});\n      }\n    });\n    if(!additions.length)return;\n    pushHistory(before);\n    records=records.filter(rec=>!removeIds.has(rec.id));\n    records.push(...additions);\n    saveRecords();renderAll();selection.removeAllRanges();\n    showToast(`${additions.length} ${additions.length===1?'palavra grifada':'palavras grifadas'} em ${colorLabel(color)}.`);\n  }\n  function removeRecordMarks(id){\n    document.querySelectorAll(`mark.enzo-highlight[data-highlight-id=\"${id}\"]`).forEach(mark=>{\n      const parent=mark.parentNode;if(!parent)return;\n      parent.replaceChild(document.createTextNode(mark.textContent||''),mark);parent.normalize();\n    });\n  }\n  function eraseAtPoint(x,y){\n    const mark=document.elementFromPoint(x,y)?.closest?.('mark.enzo-highlight');\n    if(!mark)return;\n    const id=mark.dataset.highlightId;\n    if(!id||!records.some(r=>r.id===id))return;\n    if(!eraseChanged){pushHistory(eraseSnapshot||snapshot());eraseChanged=true}\n    records=records.filter(r=>r.id!==id);\n    withObserverPaused(()=>removeRecordMarks(id));\n    saveRecords();updateToolbar();\n  }\n  function undo(){\n    if(!history.length)return;\n    records=history.pop();saveRecords();renderAll();showToast('Última ação desfeita.');\n  }\n  function setMode(next){\n    mode=next;\n    document.body.classList.toggle('enzo-highlight-mode',mode==='highlight');\n    document.body.classList.toggle('enzo-eraser-mode',mode==='erase');\n    eraserButton.classList.toggle('active',mode==='erase');\n    colorButtons.forEach(btn=>btn.classList.toggle('active',mode==='highlight'&&btn.dataset.color===color));\n  }\n  function colorLabel(value){return value==='yellow'?'amarelo':value==='green'?'verde':'vermelho'}\n  function updateToolbar(){\n    countBadge.textContent=records.length;countBadge.classList.toggle('visible',records.length>0);\n    undoButton.disabled=history.length===0;\n  }\n  function showToast(message){\n    toast.textContent=message;toast.classList.add('visible');clearTimeout(toastTimer);\n    toastTimer=setTimeout(()=>toast.classList.remove('visible'),2300);\n  }\n  function observeDynamicAreas(){\n    const targets=[document.getElementById('quizContainer'),document.getElementById('flashcard-grid')].filter(Boolean);\n    targets.forEach(target=>observer.observe(target,{childList:true,subtree:true}));\n  }\n\n  toggle.addEventListener('click',()=>{\n    const willOpen=!toolbar.classList.contains('open');\n    toolbar.classList.toggle('open',willOpen);toggle.setAttribute('aria-expanded',String(willOpen));\n    setMode(willOpen?'highlight':null);\n    if(willOpen)showToast('Escolha a cor e selecione o texto.');\n  });\n  colorButtons.forEach(btn=>btn.addEventListener('click',()=>{\n    color=btn.dataset.color;setMode('highlight');showToast(`Marca-texto ${colorLabel(color)} ativado.`);\n  }));\n  eraserButton.addEventListener('click',()=>{\n    setMode('erase');showToast('Borracha ativa: clique ou arraste sobre as palavras grifadas.');\n  });\n  undoButton.addEventListener('click',undo);\n  toolbar.addEventListener('pointerdown',event=>event.stopPropagation());\n\n  document.addEventListener('pointerdown',event=>{\n    if(mode!=='erase'||toolbar.contains(event.target))return;\n    erasing=true;eraseSnapshot=snapshot();eraseChanged=false;eraseAtPoint(event.clientX,event.clientY);\n  });\n  document.addEventListener('pointermove',event=>{\n    if(!erasing||mode!=='erase')return;\n    event.preventDefault();eraseAtPoint(event.clientX,event.clientY);\n  },{passive:false});\n  document.addEventListener('pointerup',event=>{\n    if(erasing){erasing=false;if(eraseChanged)showToast('Trecho apagado.');eraseSnapshot=null;return}\n    if(mode==='highlight'&&!toolbar.contains(event.target))setTimeout(applySelection,0);\n  });\n  document.addEventListener('keydown',event=>{\n    if(event.key==='Escape'&&toolbar.classList.contains('open')){toolbar.classList.remove('open');toggle.setAttribute('aria-expanded','false');setMode(null)}\n    if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='z'&&!/INPUT|TEXTAREA/.test(document.activeElement?.tagName||'')){\n      if(history.length){event.preventDefault();undo()}\n    }\n  });\n\n  observer=new MutationObserver(()=>{clearTimeout(observer._timer);observer._timer=setTimeout(renderMissing,40)});\n  assignKeys();renderAll();observeDynamicAreas();updateToolbar();\n})();\n\u003c/script>\n\u003cscript>\n/* Post-its privados por aluno — persistência no Supabase com RLS. */\n(()=>{\n  'use strict';\n  const TABLE='resumo_anotacoes';\n  const PAGE=\"bioquimica_2_final_p1\";\n  const LABELS={\n    nota:{name:'Nota',icon:'📝'},\n    importante:{name:'Importante',icon:'⭐'},\n    prova:{name:'Prova',icon:'🎯'},\n    atencao:{name:'Atenção',icon:'⚠️'}\n  };\n  const ANCHOR_SELECTOR=[\n    'p','li','td','th','h1','h2','h3','h4','h5','h6',\n    'blockquote','.fc-q','.fc-back-text'\n  ].join(',');\n  let client=null,user=null,notes=[],initialized=false,editingId=null,topZ=70;\n\n  const toggle=document.createElement('button');\n  toggle.id='enzo-notes-toggle';toggle.type='button';toggle.title='Criar uma anotação';\n  toggle.setAttribute('aria-label','Criar uma anotação');\n  toggle.innerHTML='\u003cspan aria-hidden=\"true\">🗒️\u003c/span>\u003cspan class=\"note-count\" aria-label=\"Quantidade de anotações\">0\u003c/span>';\n\n  const composer=document.createElement('form');\n  composer.id='enzo-note-composer';\n  composer.innerHTML=`\n    \u003cdiv class=\"enzo-note-form-title\">\u003cspan>🗒️ \u003cb class=\"enzo-note-title-text\">Nova anotação\u003c/b>\u003c/span>\u003cbutton class=\"enzo-note-close\" type=\"button\" aria-label=\"Fechar\">×\u003c/button>\u003c/div>\n    \u003cp class=\"enzo-note-drag-hint\">↕ Arraste esta caixa pelo cabeçalho até o ponto onde deseja deixar o post-it.\u003c/p>\n    \u003cdiv class=\"enzo-note-fields\">\n      \u003clabel for=\"enzo-note-label\">Marcação\u003c/label>\n      \u003cselect id=\"enzo-note-label\">\n        \u003coption value=\"nota\">📝 Nota\u003c/option>\n        \u003coption value=\"importante\">⭐ Importante\u003c/option>\n        \u003coption value=\"prova\">🎯 Prova\u003c/option>\n        \u003coption value=\"atencao\">⚠️ Atenção\u003c/option>\n      \u003c/select>\n      \u003clabel for=\"enzo-note-text\">Anotação\u003c/label>\n      \u003ctextarea id=\"enzo-note-text\" maxlength=\"3000\" required placeholder=\"Escreva o que você compreendeu, uma observação ou algo que pode cair na prova...\">\u003c/textarea>\n    \u003c/div>\n    \u003cdiv class=\"enzo-note-actions\">\u003cbutton class=\"enzo-note-cancel\" type=\"button\">Cancelar\u003c/button>\u003cbutton class=\"enzo-note-save\" type=\"submit\">Salvar anotação\u003c/button>\u003c/div>\n    \u003cdiv class=\"enzo-note-status\" role=\"status\" aria-live=\"polite\">\u003c/div>`;\n  document.body.append(toggle,composer);\n\n  const count=toggle.querySelector('.note-count');\n  const titleText=composer.querySelector('.enzo-note-title-text');\n  const labelField=composer.querySelector('#enzo-note-label');\n  const textField=composer.querySelector('#enzo-note-text');\n  const saveButton=composer.querySelector('.enzo-note-save');\n  const status=composer.querySelector('.enzo-note-status');\n\n  function getClient(){return window.authClient||window.supabaseClient||window._sb||null}\n  function cleanText(value){return String(value||'').replace(/\\s+/g,' ').trim()}\n  function hashText(text){\n    let h=2166136261;\n    for(let i=0;i\u003ctext.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619)}\n    return (h>>>0).toString(36);\n  }\n  function setStatus(message,error=false){status.textContent=message||'';status.classList.toggle('error',error)}\n  function updateCount(){count.textContent=notes.length;count.classList.toggle('visible',notes.length>0)}\n  function currentSection(){return document.querySelector('.section.active')||document.querySelector('.section')}\n  function sectionContainer(section){return section?.querySelector('.container')||null}\n  function anchorElements(section){\n    if(!section)return[];\n    assignAnchors(section);\n    return [...section.querySelectorAll('[data-enzo-note-anchor]')].filter(el=>cleanText(el.textContent)&&!el.closest('.enzo-study-note,#enzo-note-composer,.study-tools,.q-stats'));\n  }\n  function assignAnchors(section=document){\n    const seen=new Map();\n    section.querySelectorAll(ANCHOR_SELECTOR).forEach(el=>{\n      if(!el.closest('.section'))return;\n      if(el.closest('.enzo-study-note,#enzo-note-composer,.study-tools,.q-stats,nav,footer'))return;\n      const text=cleanText(el.textContent);if(!text)return;\n      const sectionId=el.closest('.section')?.id||'page';\n      const base=`${sectionId}:${hashText(text)}`;\n      const occurrence=seen.get(base)||0;seen.set(base,occurrence+1);\n      el.dataset.enzoNoteAnchor=el.dataset.enzoHlKey||`${base}:${occurrence}`;\n    });\n  }\n  function findAnchor(note,section){\n    const anchors=anchorElements(section);\n    let found=anchors.find(el=>el.dataset.enzoNoteAnchor===note.anchor_key);\n    if(!found&&note.anchor_excerpt){\n      const needle=cleanText(note.anchor_excerpt).slice(0,100);\n      found=anchors.find(el=>cleanText(el.textContent).includes(needle));\n    }\n    return found||null;\n  }\n  function relativeTop(el,container){\n    const er=el.getBoundingClientRect(),cr=container.getBoundingClientRect();\n    return er.top-cr.top+container.scrollTop;\n  }\n  function clamp(value,min,max){return Math.max(min,Math.min(max,value))}\n  const SIZE_META=/^\\[\\[enzo-size:(\\d+)x(\\d+)\\]\\]\\s*/;\n  function unpackExcerpt(value){\n    const raw=String(value||''),match=raw.match(SIZE_META);\n    return {text:raw.replace(SIZE_META,''),width:match?Number(match[1]):232,height:match?Number(match[2]):132};\n  }\n  function packExcerpt(text,width=232,height=132){\n    const safeWidth=clamp(Math.round(Number(width)||232),160,600);\n    const safeHeight=clamp(Math.round(Number(height)||132),110,700);\n    return `[[enzo-size:${safeWidth}x${safeHeight}]] ${cleanText(text).slice(0,240)}`.trim();\n  }\n  function normalizeNote(note){\n    const packed=unpackExcerpt(note.anchor_excerpt);\n    return {...note,anchor_excerpt:packed.text,x_pct:Number(note.x_pct)||0,y_offset:Number(note.y_offset)||0,width_px:packed.width,height_px:packed.height};\n  }\n  function noteElement(id){return document.querySelector(`.enzo-study-note[data-note-id=\"${id}\"]`)}\n  function setSync(el,message,error=false){\n    const sync=el?.querySelector('.enzo-note-sync');if(!sync)return;\n    sync.textContent=message;sync.classList.toggle('error',error);\n  }\n  function positionNote(el,note){\n    const section=document.getElementById(note.section_id),container=sectionContainer(section);\n    if(!section||!container||!el||container.clientWidth===0)return;\n    const maxWidth=Math.max(150,Math.min(600,container.clientWidth-8));\n    el.style.width=`${clamp(Number(note.width_px)||232,Math.min(160,maxWidth),maxWidth)}px`;\n    el.style.height=`${clamp(Number(note.height_px)||132,110,700)}px`;\n    const maxLeft=Math.max(0,container.clientWidth-el.offsetWidth);\n    const left=clamp((Number(note.x_pct)||0)*maxLeft,0,maxLeft);\n    const anchor=findAnchor(note,section);\n    const baseTop=anchor?relativeTop(anchor,container):0;\n    const maxTop=Math.max(8,container.scrollHeight-el.offsetHeight-8);\n    const top=clamp(baseTop+(Number(note.y_offset)||0),8,maxTop);\n    el.style.left=`${left}px`;el.style.top=`${top}px`;el.style.visibility='visible';\n  }\n  function layoutNotes(){notes.forEach(note=>positionNote(noteElement(note.id),note))}\n  function createNoteElement(note){\n    const meta=LABELS[note.label]||LABELS.nota;\n    const el=document.createElement('article');\n    el.className='enzo-study-note';el.dataset.noteId=note.id;el.dataset.label=note.label;el.style.visibility='hidden';\n    const head=document.createElement('div');head.className='enzo-note-head';\n    const tag=document.createElement('span');tag.className='enzo-note-tag';tag.textContent=`${meta.icon} ${meta.name}`;\n    const edit=document.createElement('button');edit.className='enzo-note-mini';edit.type='button';edit.title='Editar';edit.setAttribute('aria-label','Editar anotação');edit.textContent='✎';\n    const remove=document.createElement('button');remove.className='enzo-note-mini';remove.type='button';remove.title='Excluir';remove.setAttribute('aria-label','Excluir anotação');remove.textContent='×';\n    head.append(tag,edit,remove);\n    const body=document.createElement('div');body.className='enzo-note-body';body.textContent=note.content;\n    const sync=document.createElement('span');sync.className='enzo-note-sync';sync.textContent='salva';\n    const resize=document.createElement('button');resize.className='enzo-note-resize';resize.type='button';resize.title='Arraste para ajustar o tamanho';resize.setAttribute('aria-label','Ajustar tamanho da anotação');resize.textContent='⌟';\n    el.append(head,body,sync,resize);\n    edit.addEventListener('pointerdown',event=>event.stopPropagation());\n    remove.addEventListener('pointerdown',event=>event.stopPropagation());\n    edit.addEventListener('click',()=>openComposer(note));\n    remove.addEventListener('click',()=>deleteNote(note));\n    el.addEventListener('pointerdown',()=>{el.style.zIndex=String(++topZ)});\n    enableDrag(el,head,note);\n    enableResize(el,resize,note);\n    return el;\n  }\n  function renderNotes(){\n    document.querySelectorAll('.enzo-study-note').forEach(el=>el.remove());\n    notes.forEach(note=>{\n      const section=document.getElementById(note.section_id),container=sectionContainer(section);\n      if(!container)return;\n      const el=createNoteElement(note);container.appendChild(el);positionNote(el,note);\n    });\n    updateCount();requestAnimationFrame(layoutNotes);\n  }\n  function defaultPlacement(){\n    const section=currentSection(),container=sectionContainer(section);\n    if(!section||!container)return null;\n    const anchors=anchorElements(section);\n    const containerRect=container.getBoundingClientRect();\n    const desiredViewportY=clamp(window.innerHeight*.44,150,window.innerHeight-180);\n    let anchor=anchors.filter(el=>{\n      const r=el.getBoundingClientRect();return r.bottom>100&&r.top\u003cwindow.innerHeight-70;\n    }).sort((a,b)=>Math.abs(a.getBoundingClientRect().top-desiredViewportY)-Math.abs(b.getBoundingClientRect().top-desiredViewportY))[0]||anchors[0]||null;\n    const desiredTop=clamp(desiredViewportY-containerRect.top,8,Math.max(8,container.scrollHeight-150));\n    const baseTop=anchor?relativeTop(anchor,container):0;\n    return {\n      section_id:section.id||'intro',\n      anchor_key:anchor?.dataset.enzoNoteAnchor||null,\n      anchor_excerpt:anchor?cleanText(anchor.textContent).slice(0,240):null,\n      x_pct:.78,\n      y_offset:Math.round(desiredTop-baseTop)\n    };\n  }\n  function composerPlacement(){\n    const section=currentSection(),container=sectionContainer(section);\n    if(!section||!container||!composer.classList.contains('open'))return defaultPlacement();\n    const rect=composer.getBoundingClientRect(),containerRect=container.getBoundingClientRect();\n    const noteWidth=232,noteHeight=132;\n    const maxLeft=Math.max(1,container.clientWidth-noteWidth);\n    const left=clamp(rect.left-containerRect.left,0,maxLeft);\n    const top=clamp(rect.top-containerRect.top+container.scrollTop,8,Math.max(8,container.scrollHeight-noteHeight-8));\n    const anchor=nearestAnchorForPosition(section,container,top+20);\n    return {\n      section_id:section.id||'intro',\n      anchor_key:anchor?.dataset.enzoNoteAnchor||null,\n      anchor_excerpt:anchor?cleanText(anchor.textContent).slice(0,240):null,\n      x_pct:clamp(left/maxLeft,0,1),\n      y_offset:Math.round(top-(anchor?relativeTop(anchor,container):0)),\n      width_px:noteWidth,\n      height_px:noteHeight\n    };\n  }\n  function nearestAnchorForPosition(section,container,top){\n    const anchors=anchorElements(section);if(!anchors.length)return null;\n    return anchors.sort((a,b)=>Math.abs(relativeTop(a,container)-top)-Math.abs(relativeTop(b,container)-top))[0];\n  }\n  function enableDrag(el,handle,note){\n    let drag=null;\n    handle.addEventListener('pointerdown',event=>{\n      if(event.target.closest('button'))return;\n      event.preventDefault();handle.setPointerCapture?.(event.pointerId);\n      drag={id:event.pointerId,x:event.clientX,y:event.clientY,left:el.offsetLeft,top:el.offsetTop};\n      el.classList.add('dragging');el.style.zIndex=String(++topZ);\n    });\n    handle.addEventListener('pointermove',event=>{\n      if(!drag||event.pointerId!==drag.id)return;\n      event.preventDefault();\n      const section=document.getElementById(note.section_id),container=sectionContainer(section);if(!container)return;\n      const maxLeft=Math.max(0,container.clientWidth-el.offsetWidth),maxTop=Math.max(8,container.scrollHeight-el.offsetHeight-8);\n      el.style.left=`${clamp(drag.left+event.clientX-drag.x,0,maxLeft)}px`;\n      el.style.top=`${clamp(drag.top+event.clientY-drag.y,8,maxTop)}px`;\n    });\n    const finish=async event=>{\n      if(!drag||event.pointerId!==drag.id)return;\n      handle.releasePointerCapture?.(event.pointerId);drag=null;el.classList.remove('dragging');\n      const section=document.getElementById(note.section_id),container=sectionContainer(section);if(!container)return;\n      const maxLeft=Math.max(1,container.clientWidth-el.offsetWidth);\n      const left=parseFloat(el.style.left)||0,top=parseFloat(el.style.top)||0;\n      const anchor=nearestAnchorForPosition(section,container,top+20);\n      note.x_pct=clamp(left/maxLeft,0,1);\n      note.anchor_key=anchor?.dataset.enzoNoteAnchor||null;\n      note.anchor_excerpt=anchor?cleanText(anchor.textContent).slice(0,240):null;\n      note.y_offset=Math.round(top-(anchor?relativeTop(anchor,container):0));\n      setSync(el,'salvando…');\n      const {error}=await client.from(TABLE).update({\n        anchor_key:note.anchor_key,anchor_excerpt:packExcerpt(note.anchor_excerpt,note.width_px,note.height_px),x_pct:note.x_pct,\n        y_offset:note.y_offset,updated_at:new Date().toISOString()\n      }).eq('id',note.id).eq('user_id',user.id);\n      setSync(el,error?'erro ao salvar':'salva',!!error);\n      if(error)console.error('Falha ao posicionar anotação:',error.message);\n    };\n    handle.addEventListener('pointerup',finish);handle.addEventListener('pointercancel',finish);\n  }\n  function enableResize(el,handle,note){\n    let resizing=null;\n    handle.addEventListener('pointerdown',event=>{\n      event.preventDefault();event.stopPropagation();handle.setPointerCapture?.(event.pointerId);\n      resizing={id:event.pointerId,x:event.clientX,y:event.clientY,width:el.offsetWidth,height:el.offsetHeight};\n      el.classList.add('resizing');el.style.zIndex=String(++topZ);\n    });\n    handle.addEventListener('pointermove',event=>{\n      if(!resizing||event.pointerId!==resizing.id)return;\n      event.preventDefault();\n      const section=document.getElementById(note.section_id),container=sectionContainer(section);if(!container)return;\n      const maxWidth=Math.max(160,Math.min(600,container.clientWidth-el.offsetLeft-4));\n      const width=clamp(resizing.width+event.clientX-resizing.x,160,maxWidth);\n      const height=clamp(resizing.height+event.clientY-resizing.y,110,700);\n      el.style.width=`${Math.round(width)}px`;el.style.height=`${Math.round(height)}px`;\n    });\n    const finish=async event=>{\n      if(!resizing||event.pointerId!==resizing.id)return;\n      handle.releasePointerCapture?.(event.pointerId);resizing=null;el.classList.remove('resizing');\n      const section=document.getElementById(note.section_id),container=sectionContainer(section);if(!container)return;\n      note.width_px=clamp(Math.round(el.offsetWidth),160,600);\n      note.height_px=clamp(Math.round(el.offsetHeight),110,700);\n      const maxLeft=Math.max(1,container.clientWidth-el.offsetWidth),left=parseFloat(el.style.left)||0;\n      note.x_pct=clamp(left/maxLeft,0,1);\n      setSync(el,'salvando…');\n      const {error}=await client.from(TABLE).update({\n        anchor_excerpt:packExcerpt(note.anchor_excerpt,note.width_px,note.height_px),\n        x_pct:note.x_pct,updated_at:new Date().toISOString()\n      }).eq('id',note.id).eq('user_id',user.id);\n      setSync(el,error?'erro ao salvar':'salva',!!error);\n      if(error)console.error('Falha ao salvar o tamanho da anotação:',error.message);\n    };\n
