ata-section=\"ub\" onclick=\"showSection('ub',this)\">🧬 \u003cspan class=\"pttext\">Sistema ubiquitina-proteassoma\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Sistema ubiquitina-proteasoma\u003c/span>\u003c/button>\u003cbutton data-section=\"pu\" onclick=\"showSection('pu',this)\">🧪 \u003cspan class=\"pttext\">Metabolismo das purinas\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Metabolismo de las purinas\u003c/span>\u003c/button>\u003cbutton data-section=\"py\" onclick=\"showSection('py',this)\">🧬 \u003cspan class=\"pttext\">Metabolismo das pirimidinas\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Metabolismo de las pirimidinas\u003c/span>\u003c/button>\u003cbutton data-section=\"he\" onclick=\"showSection('he',this)\">🩸 \u003cspan class=\"pttext\">Metabolismo das porfirinas e do grupo heme\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Metabolismo de las porfirinas y el grupo hemo\u003c/span>\u003c/button>\u003cbutton class=\"fc-tab\" data-section=\"flashcards\" onclick=\"showSection('flashcards',this)\">🃏 Flashcards (55)\u003c/button>\u003cbutton class=\"qz-tab\" data-section=\"quiz\" onclick=\"showSection('quiz',this)\">📝 Questões (153)\u003c/button>\u003c/nav>\u003csection class=\"section active\" id=\"intro\">\u003cdiv class=\"container\">\u003cdiv class=\"sequence-badge\">BIOQUÍMICA II · FINAL\u003c/div>\u003cdiv class=\"chapter-title\">📖 \u003cspan class=\"pttext\">Roteiro de estudo\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Ruta de estudio\u003c/span>\u003c/div>\u003cp class=\"section-lead\">\u003cspan class=\"pttext\">Quatro módulos inéditos da final, com mecanismos passo a passo, aplicações clínicas e exercícios. Estude os fundamentos antes das vias e revise com recuperação ativa.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Cuatro módulos de la evaluación final, con mecanismos paso a paso, aplicaciones clínicas y ejercicios. Estudie los fundamentos antes de las vías y repase con recuperación activa.\u003c/span>\u003c/p>\u003cdiv class=\"info-block success\">\u003cp>\u003cspan class=\"pttext\">4 módulos · 55 flashcards · 153 questões numeradas · português e espanhol\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">4 módulos · 55 tarjetas · 153 preguntas numeradas · portugués y español\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"intro-grid\" id=\"topicCards\">\u003c/div>\u003cdiv class=\"info-block\" style=\"margin-top:20px\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Referências e escopo\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Referencias y alcance\u003c/span>\u003c/div>\u003cp>\u003cspan class=\"pttext\">Base: quatro apresentações da avaliação final (61 slides únicos, incluindo capas e páginas de exercícios). Expansões e ressalvas científicas estão sinalizadas no texto. Referências complementares sugeridas: Harper — Bioquímica Ilustrada; Lehninger — Princípios de Bioquímica; Lippincott — Bioquímica Ilustrada. O conteúdo é educacional, não prescrição clínica.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Base: cuatro presentaciones de la evaluación final (61 diapositivas únicas, incluidas portadas y ejercicios). Ampliaciones y aclaraciones científicas se indican en el texto. Referencias complementarias sugeridas: Harper, Lehninger y Lippincott. Contenido educativo, no prescripción clínica.\u003c/span>\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"section\" id=\"ub\">\u003cdiv class=\"container\">\u003cdiv class=\"chapter-title\">🧬 \u003cspan class=\"pttext\">Sistema ubiquitina-proteassoma\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Sistema ubiquitina-proteasoma\u003c/span>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 1 · slides 2–3\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 1 · diapositivas 2–3\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">O “beijo da morte” e o Nobel\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">El «beso de la muerte» y el Nobel\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">A analogia do beijo da morte representa uma etiqueta molecular que direciona certas proteínas à destruição. Aaron Ciechanover, Avram Hershko e Irwin Rose receberam o Nobel de Química em 2004 pela descoberta da degradação proteica mediada por ubiquitina. A célula não destrói proteínas indiscriminadamente: seleciona alvos para manter a homeostase.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">La analogía del beso de la muerte representa una etiqueta molecular que dirige ciertas proteínas a su destrucción. Aaron Ciechanover, Avram Hershko e Irwin Rose recibieron el Nobel de Química en 2004 por descubrir la degradación proteica mediada por ubiquitina. La célula selecciona sus blancos para mantener la homeostasis.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 2 · slides 4\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 2 · diapositivas 4\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Ubiquitina: definição\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Ubiquitina: definición\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">É uma pequena proteína de 76 aminoácidos, altamente conservada. Atua como sinal covalente ligado a uma proteína-alvo. A ubiquitina não corta a proteína; informa ao sistema qual substrato deve ser processado. Nem toda ubiquitinação leva à degradação: o tipo de cadeia importa.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Es una proteína pequeña de 76 aminoácidos, altamente conservada. Actúa como señal covalente unida a una proteína blanco. No corta la proteína: indica qué sustrato debe procesarse. No toda ubiquitinación conduce a degradación; importa el tipo de cadena.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 3 · slides 5\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 3 · diapositivas 5\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Proteassoma: definição e estrutura\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Proteasoma: definición y estructura\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">É um complexo proteolítico multimérico. O proteassoma 26S contém um núcleo catalítico 20S e reguladores 19S. O 19S reconhece o substrato marcado, remove ubiquitina, desenrola a proteína e usa ATP para introduzi-la no 20S, onde proteases hidrolisam ligações peptídicas. O produto inicial são peptídeos, posteriormente reduzidos a aminoácidos por outras peptidases.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Es un complejo proteolítico multimérico. El proteasoma 26S contiene un núcleo catalítico 20S y reguladores 19S. El 19S reconoce el sustrato marcado, retira ubiquitina, despliega la proteína y usa ATP para introducirla en el 20S, donde se hidrolizan enlaces peptídicos. Los péptidos resultantes pueden convertirse en aminoácidos por otras peptidasas.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 4 · slides 6\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 4 · diapositivas 6\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Finalidade, localização e alvos\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Finalidad, localización y blancos\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">A degradação ocorre principalmente no citosol e no núcleo. Remove proteínas mal dobradas, mutadas ou estruturalmente alteradas e também proteínas normais de vida curta, como reguladores do ciclo celular. Exemplo: eliminar uma proteína defeituosa evita agregados; eliminar uma ciclina na hora certa permite avançar no ciclo celular.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">La degradación ocurre principalmente en citosol y núcleo. Elimina proteínas mal plegadas, mutadas o alteradas y proteínas normales de vida corta, como reguladores del ciclo celular. Ejemplo: eliminar una proteína defectuosa evita agregados; eliminar una ciclina en el momento adecuado permite avanzar en el ciclo celular.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 5 · slides 7\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 5 · diapositivas 7\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">E1: ativação\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">E1: activación\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">A enzima ativadora E1 consome ATP para adenilar a extremidade carboxila da ubiquitina e formar uma ligação tioéster entre a ubiquitina e uma cisteína da E1. É a etapa que fornece energia para a transferência posterior.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">La enzima activadora E1 consume ATP para adenilar el extremo carboxilo de la ubiquitina y formar un enlace tioéster con una cisteína de E1. Esta etapa aporta energía para la transferencia posterior.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 6 · slides 7\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 6 · diapositivas 7\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">E2: conjugação\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">E2: conjugación\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">A enzima conjugadora E2 recebe a ubiquitina ativada de E1 por transferência entre cisteínas. Funciona como transportadora da etiqueta até o complexo que selecionará o alvo.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">La enzima conjugadora E2 recibe ubiquitina activada de E1 por transferencia entre cisteínas. Transporta la etiqueta hasta el complejo que seleccionará el blanco.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 7 · slides 7–8\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 7 · diapositivas 7–8\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">E3: reconhecimento e ligação\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">E3: reconocimiento y enlace\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">A ligase E3 reconhece o substrato por sinais de degradação (degrons) e promove a transferência da ubiquitina. É a principal responsável pela especificidade. Algumas E3 transferem diretamente a partir da E2; outras formam um intermediário próprio.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">La ligasa E3 reconoce el sustrato por señales de degradación (degrones) y promueve la transferencia de ubiquitina. Es la principal responsable de la especificidad. Algunas E3 transfieren directamente desde E2 y otras forman un intermediario propio.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 8 · slides 8\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 8 · diapositivas 8\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Ligação isopeptídica\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Enlace isopeptídico\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">O grupo carboxila da glicina terminal (Gly76) da ubiquitina liga-se ao grupo ε-amino de uma lisina do substrato. É uma ligação covalente chamada isopeptídica porque envolve a cadeia lateral da lisina, e não a ligação peptídica usual do esqueleto proteico.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">El grupo carboxilo de la glicina terminal (Gly76) de ubiquitina se une al grupo ε-amino de una lisina del sustrato. Es un enlace covalente isopeptídico porque involucra la cadena lateral de lisina, no el enlace peptídico habitual del esqueleto proteico.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 9 · slides 9\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 9 · diapositivas 9\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Poliubiquitinação e reciclagem\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Poliubiquitinación y reciclaje\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">Novas ubiquitinas podem ser adicionadas à primeira, formando uma cadeia. Cadeias ligadas por Lys48 são um sinal clássico de degradação proteassomal. Desubiquitinases retiram e reciclam a ubiquitina, enquanto o substrato é desenrolado e degradado. Sequência: E1 → E2 → E3 → cadeia → 26S → peptídeos.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Se pueden añadir nuevas ubiquitinas formando una cadena. Las cadenas unidas por Lys48 son una señal clásica de degradación proteasomal. Las desubiquitinasas retiran y reciclan ubiquitina, mientras el sustrato se despliega y degrada. Secuencia: E1 → E2 → E3 → cadena → 26S → péptidos.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 10 · slides 10–11\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 10 · diapositivas 10–11\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Desequilíbrio e Alzheimer\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Desequilibrio y Alzheimer\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">Os slides relacionam o sistema a câncer cervical e colorretal, HPV, esclerose lateral amiotrófica (ELA), Huntington, Alzheimer e Parkinson. No Alzheimer, os marcadores são agregados de beta-amiloide e tau hiperfosforilada, com perda de memória e capacidades cognitivas e morte neuronal. A disfunção da proteostase contribui, mas não é a causa única dessas doenças.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Las diapositivas relacionan el sistema con cáncer cervical y colorrectal, VPH, esclerosis lateral amiotrófica (ELA), Huntington, Alzheimer y Parkinson. En Alzheimer destacan agregados de beta-amiloide y tau hiperfosforilada, pérdida de memoria y capacidades cognitivas y muerte neuronal. La alteración de proteostasis contribuye, pero no es la única causa.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 11 · slides 12\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 11 · diapositivas 12\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Parkinson e correlação clínica\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Parkinson y correlación clínica\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">Rigidez, tremor e dificuldade de locomoção são manifestações motoras; bradicinesia é característica central. Alterações em genes como PARK2 (parkin, uma E3) e UCHL1 (desubiquitinase) podem afetar a homeostase proteica. Corpos de Lewy contêm predominantemente alfa-sinucleína agregada. Nem todo Parkinson é causado por essas mutações.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Rigidez, temblor y dificultad de locomoción son manifestaciones motoras; la bradicinesia es central. Alteraciones de genes como PARK2 (parkin, una E3) y UCHL1 (desubiquitinasa) pueden afectar la homeostasis proteica. Los cuerpos de Lewy contienen principalmente alfa-sinucleína agregada. No todo Parkinson se debe a estas mutaciones.\u003c/span>\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"section\" id=\"pu\">\u003cdiv class=\"container\">\u003cdiv class=\"chapter-title\">🧪 \u003cspan class=\"pttext\">Metabolismo das purinas\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Metabolismo de las purinas\u003c/span>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 1 · slides 2\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 1 · diapositivas 2\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Bases nitrogenadas e estrutura\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Bases nitrogenadas y estructura\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">Purinas são bases nitrogenadas heterocíclicas de dois anéis fundidos: um de seis membros (pirimidina) e outro de cinco (imidazol). Adenina e guanina integram DNA e RNA. Base + açúcar = nucleosídeo; nucleosídeo + fosfato = nucleotídeo. Exemplo: adenina + ribose = adenosina; adenosina + três fosfatos = ATP.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Las purinas son bases nitrogenadas heterocíclicas de dos anillos fusionados: uno de seis miembros (pirimidina) y otro de cinco (imidazol). Adenina y guanina integran ADN y ARN. Base + azúcar = nucleósido; nucleósido + fosfato = nucleótido. Ejemplo: adenina + ribosa = adenosina; adenosina + tres fosfatos = ATP.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 2 · slides 3\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 2 · diapositivas 3\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Origem dos átomos do anel\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Origen de los átomos del anillo\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">Aspartato fornece N1; glicina fornece C4, C5 e N7; glutamina fornece N3 e N9; CO₂/bicarbonato fornece C6; N10-formil-tetraidrofolato fornece C2 e C8. Derivados do folato transportam unidades de um carbono. O slide representa diferentes formas de folato; o doador imediato nas duas transformilases é N10-formil-THF.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Aspartato aporta N1; glicina C4, C5 y N7; glutamina N3 y N9; CO₂/bicarbonato C6; N10-formil-tetrahidrofolato C2 y C8. Los derivados del folato transportan unidades de un carbono. El donante inmediato en ambas transformilasas es N10-formil-THF.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 3 · slides 4\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 3 · diapositivas 4\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Funções dos nucleotídeos púricos\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Funciones de los nucleótidos púricos\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">DNA/RNA armazenam e expressam informação genética; ATP transfere energia; GTP participa de síntese proteica e sinalização; NADH transporta elétrons; AMPc é segundo mensageiro; coenzima A carrega grupos acila na síntese de lipídios e ciclo de Krebs. Adenosina participa de vasodilatação e controle cardíaco. A excreção de urato elimina produtos nitrogenados; a cor amarela normal da urina deriva sobretudo de pigmentos como urobilina, não do ácido úrico.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">ADN/ARN almacenan y expresan información; ATP transfiere energía; GTP participa en síntesis proteica y señalización; NADH transporta electrones; AMPc es segundo mensajero; coenzima A transporta grupos acilo. Adenosina participa en vasodilatación y control cardíaco. El urato elimina productos nitrogenados; el color amarillo normal de la orina deriva principalmente de pigmentos como urobilina, no del ácido úrico.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 4 · slides 5–6\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 4 · diapositivas 5–6\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Síntese de novo e PRPP\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Síntesis de novo y PRPP\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">Ocorre no citosol, especialmente no fígado, e é endergônica (requer energia). A ribose-5-fosfato da via das pentoses recebe pirofosfato do ATP pela PRPP sintetase: ribose-5-P + ATP → PRPP + AMP. PRPP significa 5-fosforribosil-1-pirofosfato. A glutamina-PRPP amidotransferase catalisa a primeira etapa comprometida com a síntese de purinas e é inibida por nucleotídeos púricos.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Ocurre en citosol, especialmente hígado, y es endergónica (requiere energía). La ribosa-5-fosfato de la vía de pentosas recibe pirofosfato del ATP por PRPP sintetasa: ribosa-5-P + ATP → PRPP + AMP. PRPP es 5-fosforribosil-1-pirofosfato. La glutamina-PRPP amidotransferasa cataliza el primer paso comprometido y es inhibida por nucleótidos púricos.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 5 · slides 6\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 5 · diapositivas 6\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">De PRPP a IMP\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">De PRPP a IMP\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">O anel é construído sobre a ribose em dez etapas: PRPP → fosforribosilamina → GAR → FGAR → FGAM → AIR → CAIR → SAICAR → AICAR → FAICAR → IMP (inosina monofosfato). Glicina, folato, glutamina, bicarbonato e aspartato entram sucessivamente; ocorre liberação de fumarato do esqueleto do aspartato. IMP é o primeiro nucleotídeo púrico completo comum às duas ramificações.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">El anillo se construye sobre la ribosa en diez pasos: PRPP → fosforribosilamina → GAR → FGAR → FGAM → AIR → CAIR → SAICAR → AICAR → FAICAR → IMP (inosina monofosfato). Entran glicina, folato, glutamina, bicarbonato y aspartato; se libera fumarato del esqueleto de aspartato. IMP es el primer nucleótido púrico completo común a ambas ramas.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 6 · slides 6\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 6 · diapositivas 6\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Ramificações para AMP e GMP\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Ramificaciones hacia AMP y GMP\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">IMP + aspartato + GTP → adenilossuccinato → AMP + fumarato. Na outra via, IMP desidrogenase oxida IMP a XMP (xantosina monofosfato), e GMP sintetase usa glutamina e ATP para formar GMP. AMP consome GTP e GMP consome ATP, favorecendo equilíbrio das reservas. AMP e GMP inibem suas respectivas ramificações.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">IMP + aspartato + GTP → adenilosuccinato → AMP + fumarato. En la otra vía, IMP deshidrogenasa oxida IMP a XMP (xantosina monofosfato), y GMP sintetasa utiliza glutamina y ATP para formar GMP. AMP consume GTP y GMP consume ATP, favoreciendo el equilibrio. AMP y GMP inhiben sus propias ramas.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 7 · slides 11–12\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 7 · diapositivas 11–12\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Via de salvamento\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Vía de rescate\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">Recicla bases livres, economizando energia: HGPRT (hipoxantina-guanina fosforribosiltransferase) usa PRPP para converter hipoxantina em IMP e guanina em GMP. APRT converte adenina em AMP. Quando HGPRT falta, aumentam PRPP disponível e síntese de novo, além de diminuir a recuperação de bases.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Recicla bases libres y ahorra energía: HGPRT (hipoxantina-guanina fosforribosiltransferasa) usa PRPP para convertir hipoxantina en IMP y guanina en GMP. APRT convierte adenina en AMP. Si falta HGPRT, aumentan PRPP y síntesis de novo, y disminuye el rescate.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 8 · slides 7\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 8 · diapositivas 7\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Degradação das purinas\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Degradación de purinas\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">AMP pode virar adenosina → inosina → hipoxantina, ou IMP → inosina. GMP → guanosina → guanina → xantina. A xantina oxidoredutase catalisa hipoxantina → xantina → ácido úrico. Humanos não têm uricase funcional, então o urato é o produto final usual. Alopurinol reduz sua formação ao inibir a xantina oxidoredutase.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">AMP puede convertirse en adenosina → inosina → hipoxantina, o IMP → inosina. GMP → guanosina → guanina → xantina. La xantina oxidorreductasa cataliza hipoxantina → xantina → ácido úrico. Los humanos no poseen uricasa funcional, por lo que el urato es el producto final habitual. Alopurinol reduce su formación al inhibir la xantina oxidorreductasa.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 9 · slides 8–9\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 9 · diapositivas 8–9\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Ácido úrico e valores dos slides\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Ácido úrico y valores de las diapositivas\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">Os slides indicam produção aproximada de 500 mg/dia, urato sérico masculino 2,5–7,0 mg/dL e feminino 1,5–6,0 mg/dL, excreção urinária 250–750 mg/24 h e hiperuricemia acima de 7 mg/dL. Os intervalos variam conforme laboratório e dieta; a saturação do urato ocorre aproximadamente a 6,8 mg/dL. Hiperuricemia não é sinônimo de gota.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Las diapositivas indican producción aproximada de 500 mg/día, urato sérico masculino 2,5–7,0 mg/dL y femenino 1,5–6,0 mg/dL, excreción urinaria 250–750 mg/24 h e hiperuricemia superior a 7 mg/dL. Los intervalos varían según laboratorio y dieta; la saturación ocurre aproximadamente a 6,8 mg/dL. Hiperuricemia no equivale a gota.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 10 · slides 9–10\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 10 · diapositivas 9–10\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Gota: mecanismo e evolução\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Gota: mecanismo y evolución\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">Cristais de urato monossódico se depositam nas articulações e desencadeiam inflamação intensa. Fases: hiperuricemia assintomática (nem todos evoluem), crise aguda com dor, calor, edema e eventualmente febre, e artrite gotosa crônica com tofos (depósitos macroscópicos). Exemplo clássico: podagra, inflamação da primeira articulação metatarsofalângica.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Los cristales de urato monosódico se depositan en articulaciones y desencadenan inflamación intensa. Fases: hiperuricemia asintomática (no todos progresan), ataque agudo con dolor, calor, edema y a veces fiebre, y artritis gotosa crónica con tofos (depósitos macroscópicos). Ejemplo: podagra, inflamación de la primera articulación metatarsofalángica.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 11 · slides 10,13\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 11 · diapositivas 10,13\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Fatores de risco e alimentação\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Factores de riesgo y alimentación\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">Predisposição genética, idade, obesidade, álcool (especialmente cerveja), excesso de carnes e vísceras, alguns frutos do mar, tiazídicos, quimioterapia com lise celular e exposição ao chumbo favorecem hiperuricemia. Hidratação auxilia a excreção renal. O slide inclui leguminosas e verduras entre fontes de purinas, mas purinas vegetais não justificam a mesma restrição que vísceras e carnes. Abóbora, alcachofra e aipo são exemplos ilustrados, não tratamentos específicos.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Predisposición genética, edad, obesidad, alcohol (sobre todo cerveza), exceso de carnes y vísceras, algunos mariscos, tiazidas, quimioterapia con lisis celular y plomo favorecen hiperuricemia. La hidratación ayuda a la excreción renal. Las purinas vegetales no justifican la misma restricción que vísceras y carnes. Calabaza, alcachofa y apio son ejemplos ilustrados, no tratamientos específicos.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 12 · slides 11–12\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 12 · diapositivas 11–12\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Síndrome de Lesch-Nyhan\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Síndrome de Lesch-Nyhan\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">Doença hereditária descrita em 1964, ligada ao X, causada por deficiência grave de HGPRT. A via de salvamento falha, PRPP aumenta, há hiperprodução de purinas e hiperuricemia grave. Manifestações incluem litíase urinária, distonia, comprometimento neurológico e automutilação característica; frequentemente reconhecida nos primeiros anos em meninos. A mãe pode ser portadora. O controle do urato não corrige necessariamente a síndrome neurológica.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Enfermedad hereditaria descrita en 1964, ligada al X, causada por deficiencia grave de HGPRT. Falla el rescate, aumenta PRPP, hay sobreproducción de purinas e hiperuricemia grave. Manifestaciones: litiasis urinaria, distonía, compromiso neurológico y automutilación característica; suele reconocerse en los primeros años en varones. La madre puede ser portadora. Controlar urato no necesariamente corrige el síndrome neurológico.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 13 · slides 12\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 13 · diapositivas 12\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Outras alterações metabólicas\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Otras alteraciones metabólicas\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">A hiperatividade de PRPP sintetase pode causar gota primária por produção excessiva. Na doença de Von Gierke (deficiência de glicose-6-fosfatase), excesso de G6P favorece a via das pentoses e produção de purinas; lactato também reduz excreção renal de urato. Na xantinúria hereditária, deficiência de xantina oxidoredutase causa hipouricemia e cálculos de xantina. Nem toda gota primária decorre de PRPP sintetase.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">La hiperactividad de PRPP sintetasa puede causar gota por sobreproducción. En Von Gierke (deficiencia de glucosa-6-fosfatasa), el exceso de G6P favorece la vía de pentosas y síntesis de purinas; el lactato reduce la excreción renal de urato. En xantinuria hereditaria, la deficiencia de xantina oxidorreductasa causa hipouricemia y cálculos de xantina. No toda gota primaria se debe a PRPP sintetasa.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 14 · slides 14\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 14 · diapositivas 14\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Farmacologia: três estratégias e crise\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Farmacología: tres estrategias y crisis\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">Uricostáticos: alopurinol e febuxostate inibem xantina oxidoredutase e reduzem síntese de urato. Uricosúricos: probenecida e sulfinpirazona aumentam excreção renal. Uricolíticos: rasburicase e pegloticase convertem urato em alantoína, mais solúvel, em indicações distintas. Correção importante do slide: colchicina é anti-inflamatória, inibe microtúbulos e reduz a resposta dos neutrófilos; não inibe xantina oxidase nem reduz diretamente o urato.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Uricostáticos: alopurinol y febuxostat inhiben xantina oxidorreductasa y reducen síntesis de urato. Uricosúricos: probenecid y sulfinpirazona aumentan excreción renal. Uricolíticos: rasburicasa y pegloticasa convierten urato en alantoína, más soluble, con indicaciones distintas. Corrección: colchicina es antiinflamatoria, inhibe microtúbulos y reduce la respuesta de neutrófilos; no inhibe xantina oxidasa ni reduce directamente urato.\u003c/span>\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"section\" id=\"py\">\u003cdiv class=\"container\">\u003cdiv class=\"chapter-title\">🧬 \u003cspan class=\"pttext\">Metabolismo das pirimidinas\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Metabolismo de las pirimidinas\u003c/span>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 1 · slides 2–4\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 1 · diapositivas 2–4\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Estrutura e derivados\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Estructura y derivados\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">Pirimidina é um heterociclo aromático de seis membros, com quatro carbonos e dois nitrogênios nas posições 1 e 3. Citosina (C4H5N3O) integra DNA e RNA, timina (C5H6N2O2) integra DNA e uracila (C4H4N2O2) integra RNA. Timina é 5-metiluracila. A uracila e a timina pareiam com adenina; citosina pareia com guanina.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">La pirimidina es un heterociclo aromático de seis miembros, cuatro carbonos y dos nitrógenos en posiciones 1 y 3. Citosina (C4H5N3O) integra ADN y ARN, timina (C5H6N2O2) integra ADN y uracilo (C4H4N2O2) integra ARN. Timina es 5-metiluracilo. Uracilo y timina aparean con adenina; citosina con guanina.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 2 · slides 3,5\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 2 · diapositivas 3,5\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Precursores do anel\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Precursores del anillo\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">Aspartato fornece N1, C4, C5 e C6; bicarbonato fornece C2; glutamina fornece N3. ATP fornece energia. Ao contrário das purinas, o anel pirimídico é construído antes de ser ligado à ribose do PRPP. O folato não fornece diretamente átomos ao anel de UMP, embora participe da síntese de timidilato.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Aspartato aporta N1, C4, C5 y C6; bicarbonato C2; glutamina N3. ATP aporta energía. A diferencia de purinas, el anillo pirimidínico se construye antes de unirse a ribosa del PRPP. El folato no aporta átomos directamente al anillo de UMP, aunque participa en síntesis de timidilato.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 3 · slides 5–7\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 3 · diapositivas 5–7\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">CPS II e complexo CAD\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">CPS II y complejo CAD\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">Carbamoil-fosfato sintetase II (CPS II) usa glutamina, bicarbonato e 2 ATP para gerar carbamoil-fosfato no citosol. Em mamíferos, integra a proteína multifuncional CAD junto com aspartato transcarbamoilase e di-hidroorotase; a proximidade dos sítios catalíticos favorece a transferência de intermediários. PRPP ativa CPS II e UTP exerce retroinibição.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Carbamoil-fosfato sintetasa II (CPS II) utiliza glutamina, bicarbonato y 2 ATP para formar carbamoil-fosfato en citosol. En mamíferos integra CAD con aspartato transcarbamoilasa y dihidroorotasa; la proximidad de los sitios favorece la transferencia de intermediarios. PRPP activa CPS II y UTP ejerce retroinhibición.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 4 · slides 6\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 4 · diapositivas 6\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Formação do orotato\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Formación de orotato\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">Carbamoil-fosfato + aspartato → carbamoil-aspartato pela aspartato transcarbamoilase. A di-hidroorotase promove fechamento do anel formando di-hidroorotato. A di-hidroorotato desidrogenase (DHODH), associada à membrana mitocondrial interna, oxida o intermediário a orotato. Portanto, a via não é exclusivamente citosólica.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Carbamoil-fosfato + aspartato → carbamoil-aspartato por aspartato transcarbamoilasa. La dihidroorotasa cierra el anillo formando dihidroorotato. La dihidroorotato deshidrogenasa (DHODH), asociada a membrana mitocondrial interna, lo oxida a orotato. Por tanto, la vía no es exclusivamente citosólica.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 5 · slides 5–7\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 5 · diapositivas 5–7\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">PRPP, OMP e UMP\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">PRPP, OMP y UMP\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">Orotato + PRPP → OMP (orotidina monofosfato) + PPi pela orotato fosforribosiltransferase. OMP descarboxilase retira CO₂ e forma UMP (uridina monofosfato). As duas atividades pertencem à UMP sintase. OMP é o primeiro nucleotídeo intermediário; UMP é o primeiro nucleotídeo pirimídico canônico da via, como indicado nos slides.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Orotato + PRPP → OMP (orotidina monofosfato) + PPi por orotato fosforribosiltransferasa. OMP descarboxilasa retira CO₂ y forma UMP (uridina monofosfato). Ambas actividades pertenecen a UMP sintasa. OMP es el primer nucleótido intermediario; UMP es el primer nucleótido pirimidínico canónico de la vía.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 6 · slides 6–7\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 6 · diapositivas 6–7\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">UDP, UTP, CTP e timidilato\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">UDP, UTP, CTP y timidilato\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">UMP recebe fosfato por quinases e vira UDP, depois UTP. CTP sintetase usa glutamina e ATP para converter UTP em CTP. Complemento: ribonucleotídeo redutase produz desoxirribonucleotídeos; timidilato sintase converte dUMP em dTMP usando N5,N10-metileno-THF. Isso permite produzir DNA, não apenas RNA. O 5-fluorouracil interfere na timidilato sintase por seu metabólito FdUMP.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">UMP recibe fosfato por cinasas y pasa a UDP, luego UTP. CTP sintetasa utiliza glutamina y ATP para convertir UTP en CTP. Complemento: ribonucleótido reductasa produce desoxirribonucleótidos; timidilato sintasa convierte dUMP en dTMP usando N5,N10-metileno-THF. Esto permite producir ADN. El 5-fluorouracilo interfiere con timidilato sintasa mediante FdUMP.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 7 · slides 8\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 7 · diapositivas 8\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">CPS I versus CPS II\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">CPS I frente a CPS II\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">CPS I: mitocondrial, ciclo da ureia, usa amônia livre, ativação obrigatória por N-acetilglutamato, predominante em hepatócitos periportais; também existe no intestino. CPS II: citosólica, síntese de pirimidinas, usa nitrogênio amídico da glutamina, ativada por PRPP, presente em muitos tecidos. Ambas consomem 2 ATP, mas possuem funções e compartimentos diferentes. A expressão «somente hepatócitos» do slide é uma simplificação.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">CPS I: mitocondrial, ciclo de urea, usa amoníaco libre, activación obligatoria por N-acetilglutamato, predomina en hepatocitos periportales y también existe en intestino. CPS II: citosólica, síntesis de pirimidinas, usa nitrógeno amídico de glutamina, activada por PRPP, presente en muchos tejidos. Ambas consumen 2 ATP pero tienen funciones y compartimentos distintos.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 8 · slides 9\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 8 · diapositivas 9\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Purinas versus pirimidinas\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Purinas frente a pirimidinas\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">Purinas: dois anéis; montagem sobre PRPP desde o início, glicina contribui para o esqueleto, IMP é precursor de AMP/GMP, síntese citosólica. Pirimidinas: um anel; montagem antes de PRPP, aspartato é precursor estrutural principal, UMP é precursor de outros nucleotídeos, síntese citosólica com etapa mitocondrial da DHODH. Não confunda o anel pronto com o nucleotídeo pronto.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Purinas: dos anillos; montaje sobre PRPP desde el inicio, glicina contribuye al esqueleto, IMP es precursor de AMP/GMP, síntesis citosólica. Pirimidinas: un anillo; montaje antes de PRPP, aspartato es precursor estructural principal, UMP es precursor de otros nucleótidos, síntesis citosólica con etapa mitocondrial de DHODH.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 9 · slides 10\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 9 · diapositivas 10\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Catabolismo da timina\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Catabolismo de timina\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">dTMP → timidina pela nucleotidase → timina pela timidina fosforilase. A di-hidropirimidina desidrogenase (DPD) reduz timina a di-hidrotimina; di-hidropirimidinase abre o anel formando N-carbamoil-β-aminoisobutirato (β-ureidoisobutirato); β-ureidopropionase libera β-aminoisobutirato. Sua transaminação pode formar metilmalonato semialdeído, cujo metabolismo pode gerar propionil-CoA e, por metilmalonil-CoA, succinil-CoA. A mutase atua sobre metilmalonil-CoA, não diretamente sobre o semialdeído.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">dTMP → timidina por nucleotidasa → timina por timidina fosforilasa. DPD reduce timina a dihidrotimina; dihidropirimidinasa abre el anillo formando N-carbamoil-β-aminoisobutirato; β-ureidopropionasa libera β-aminoisobutirato. Su transaminación puede formar metilmalonato semialdehído y luego propionil-CoA, metilmalonil-CoA y succinil-CoA. La mutasa actúa sobre metilmalonil-CoA, no sobre el semialdehído.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 10 · slides 10\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 10 · diapositivas 10\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Catabolismo de citosina e uracila\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Catabolismo de citosina y uracilo\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">CMP → citidina; em humanos, citidina desaminase converte citidina em uridina, que pode liberar uracila pela uridina fosforilase. Uracila → di-hidrouracila (DPD) → N-carbamoil-β-alanina (di-hidropirimidinase) → β-alanina + CO₂ + NH₃ (β-ureidopropionase). Correção: o esquema dos slides mostra citosina livre desaminada e «alanina»; o produto humano característico é β-alanina, diferente de α-alanina. DPD também metaboliza 5-fluorouracil, e sua deficiência pode causar toxicidade grave.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">CMP → citidina; en humanos, citidina desaminasa convierte citidina en uridina, que puede liberar uracilo por uridina fosforilasa. Uracilo → dihidrouracilo (DPD) → N-carbamoil-β-alanina (dihidropirimidinasa) → β-alanina + CO₂ + NH₃ (β-ureidopropionasa). Corrección: el esquema muestra citosina libre desaminada y «alanina»; el producto humano característico es β-alanina, distinta de α-alanina. DPD también metaboliza 5-fluorouracilo.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 11 · slides 11–12\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 11 · diapositivas 11–12\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Acidúria orótica hereditária\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Aciduria orótica hereditaria\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">Deficiência autossômica recessiva da UMP sintase, que reúne orotato fosforribosiltransferase e OMP descarboxilase. O bloqueio orotato → OMP → UMP acumula ácido orótico no sangue e urina e reduz nucleotídeos necessários à síntese de DNA. Causa anemia megaloblástica, atraso de crescimento e possível leucopenia. A anemia não é causada por deficiência primária de B12 ou folato e não responde adequadamente a essas vitaminas. Uridina contorna o bloqueio pela via de salvamento.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Deficiencia autosómica recesiva de UMP sintasa, que reúne orotato fosforribosiltransferasa y OMP descarboxilasa. El bloqueo orotato → OMP → UMP acumula ácido orótico en sangre y orina y reduce nucleótidos para síntesis de ADN. Causa anemia megaloblástica, retraso de crecimiento y posible leucopenia. La anemia no se debe a deficiencia primaria de B12 o folato y no responde adecuadamente a esas vitaminas. Uridina evita el bloqueo por rescate.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 12 · slides 13\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 12 · diapositivas 13\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Consequências e diferencial\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Consecuencias y diagnóstico diferencial\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">Os slides listam atraso do desenvolvimento, malformações cardíacas, estrabismo bilateral, incapacidade de sentar sem ajuda e macrocristalúria com obstrução ureteral. São manifestações possíveis ou descritas, não critérios universais. Diferenciar de deficiência de ornitina transcarbamilase (OTC): nela, o carbamoil-fosfato mitocondrial em excesso alimenta a via pirimídica e aumenta orotato, com hiperamonemia; na deficiência de UMP sintase, a hiperamonemia não é característica.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Las diapositivas enumeran retraso del desarrollo, malformaciones cardíacas, estrabismo bilateral, incapacidad de sentarse sin ayuda y macrocristaluria con obstrucción ureteral. Son manifestaciones posibles o descritas, no criterios universales. Diferenciar de deficiencia de ornitina transcarbamilasa (OTC): el exceso de carbamoil-fosfato mitocondrial alimenta la vía pirimidínica y aumenta orotato con hiperamonemia; en déficit de UMP sintasa, hiperamonemia no es característica.\u003c/span>\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"section\" id=\"he\">\u003cdiv class=\"container\">\u003cdiv class=\"chapter-title\">🩸 \u003cspan class=\"pttext\">Metabolismo das porfirinas e do grupo heme\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Metabolismo de las porfirinas y el grupo hemo\u003c/span>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 1 · slides 2–3\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 1 · diapositivas 2–3\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Porfirinas: estrutura e propriedades\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Porfirinas: estructura y propiedades\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">São compostos cíclicos de quatro anéis pirrólicos unidos por pontes metino (=CH–). Pirrol é um heterociclo de cinco membros com nitrogênio. A porfina, núcleo básico, tem fórmula C20H14N4. A conjugação eletrônica explica cor e fluorescência vermelha de porfirinas livres sob iluminação apropriada. Podem coordenar metais. Heme contém ferro; clorofila contém magnésio; cobalamina contém cobalto. Clorofila é um derivado clorínico e B12 contém um anel corrina, não uma porfirina verdadeira; são estruturas tetrapirrólicas relacionadas.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Son compuestos cíclicos de cuatro anillos pirrólicos unidos por puentes metino (=CH–). Pirrol es un heterociclo de cinco miembros con nitrógeno. La porfina tiene fórmula C20H14N4. La conjugación electrónica explica color y fluorescencia roja de porfirinas libres bajo iluminación apropiada. Pueden coordinar metales. Hemo contiene hierro; clorofila magnesio; cobalamina cobalto. Clorofila es derivado clorínico y B12 contiene anillo corrina, no una porfirina verdadera.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 2 · slides 3–4\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 2 · diapositivas 3–4\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Clorofila e vitamina B12\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Clorofila y vitamina B12\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">Clorofila capta energia luminosa para a fotossíntese, processo que usa CO₂ e água para produzir carboidratos e liberar oxigênio. Cianocobalamina é uma forma de B12; B12 é necessária para síntese de DNA, maturação eritroide e função neurológica. Sua deficiência causa anemia megaloblástica e neuropatia; anemia perniciosa é especificamente deficiência de B12 por gastrite autoimune com falta de fator intrínseco. Fármacos citados que podem interferir na absorção: omeprazol/lansoprazol (IBP), ranitidina/famotidina (H2), metformina, colchicina, neomicina e ácido para-aminossalicílico. A relevância depende de exposição, duração e paciente.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Clorofila capta energía luminosa para fotosíntesis, que utiliza CO₂ y agua para producir carbohidratos y liberar oxígeno. Cianocobalamina es una forma de B12; B12 es necesaria para síntesis de ADN, maduración eritroide y función neurológica. Su déficit causa anemia megaloblástica y neuropatía; anemia perniciosa es específicamente déficit por gastritis autoinmune con falta de factor intrínseco. Fármacos citados: omeprazol/lansoprazol, ranitidina/famotidina, metformina, colchicina, neomicina y ácido paraaminosalicílico. La relevancia depende de exposición y paciente.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 3 · slides 5\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 3 · diapositivas 5\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Heme, ferro e hemoproteínas\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Hemo, hierro y hemoproteínas\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">Heme b é protoporfirina IX coordenada a Fe²⁺. Na hemoglobina transporta O₂ no sangue; na mioglobina armazena O₂ muscular. Oxidação para Fe³⁺ na hemoglobina forma metemoglobina, incapaz de ligar O₂ naquele sítio; na mioglobina forma metmioglobina. Citocromo c transfere elétrons na cadeia respiratória; citocromos P450 oxidam xenobióticos e substâncias endógenas; catalase degrada H₂O₂ em água e O₂; triptofano pirrolase (triptofano 2,3-dioxigenase) inicia oxidação do triptofano na via da quinurenina.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Hemo b es protoporfirina IX coordinada a Fe²⁺. Hemoglobina transporta O₂; mioglobina almacena O₂ muscular. Oxidación a Fe³⁺ en hemoglobina forma metahemoglobina, incapaz de unir O₂ en ese sitio; en mioglobina forma metamioglobina. Citocromo c transfiere electrones; P450 oxida xenobióticos y sustancias endógenas; catalasa degrada H₂O₂ en agua y O₂; triptófano pirrolasa (triptófano 2,3-dioxigenasa) inicia oxidación de triptófano en la vía de quinurenina.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 4 · slides 6\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 4 · diapositivas 6\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Produção e vitamina B6\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Producción y vitamina B6\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">A síntese ocorre principalmente em precursores eritroides da medula óssea e hepatócitos. Os slides apresentam 40–50 mg/dia e 80–85% destinado à hemoglobina; o primeiro número não deve ser interpretado como produção corporal total, pois a renovação eritrocitária requer quantidade maior. Hemácias maduras não possuem mitocôndrias e não sintetizam heme. B6 na forma piridoxal-fosfato (PLP) é coenzima da ALA sintase; deficiência pode causar anemia microcítica/sideroblástica. Isoniazida interfere com B6; alguns antiparkinsonianos também podem interferir no seu metabolismo. PLP não é o grupo que liga O₂ na hemoglobina: essa função é do ferro do heme.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">La síntesis ocurre principalmente en precursores eritroides de médula ósea y hepatocitos. Las diapositivas presentan 40–50 mg/día y 80–85% destinado a hemoglobina; la primera cifra no debe interpretarse como producción corporal total, pues la renovación eritrocitaria requiere más. Eritrocitos maduros carecen de mitocondrias y no sintetizan hemo. B6 como piridoxal-fosfato (PLP) es coenzima de ALA sintasa; su déficit puede causar anemia microcítica/sideroblástica. Isoniazida interfiere con B6; algunos antiparkinsonianos también pueden hacerlo. PLP no une O₂ en hemoglobina; lo hace el hierro del hemo.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 5 · slides 7\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 5 · diapositivas 7\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Etapa 1 — ALA sintase\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Etapa 1 — ALA sintasa\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">Na matriz mitocondrial, glicina + succinil-CoA → δ-aminolevulinato (ALA) + CoA + CO₂, com PLP. ALA sintase (ALAS) catalisa a etapa inicial limitante. ALAS1 é regulada negativamente pelo heme no fígado; ALAS2 eritroide é regulada pela disponibilidade de ferro e diferenciação celular. Succinil-CoA conecta a síntese de heme ao ciclo de Krebs.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">En matriz mitocondrial, glicina + succinil-CoA → δ-aminolevulinato (ALA) + CoA + CO₂, con PLP. ALA sintasa (ALAS) cataliza el paso inicial limitante. ALAS1 es regulada negativamente por hemo en hígado; ALAS2 eritroide por disponibilidad de hierro y diferenciación celular. Succinil-CoA conecta síntesis de hemo con ciclo de Krebs.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 6 · slides 7\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 6 · diapositivas 7\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Etapa 2 — ALA desidratase\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Etapa 2 — ALA deshidratasa\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">No citosol, duas moléculas de ALA condensam-se em porfobilinogênio (PBG), um monômero pirrólico, pela ALA desidratase (porfobilinogênio sintase), dependente de zinco. Chumbo inibe essa enzima e também a ferroquelatase; aumenta ALA e compromete síntese de heme.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">En citosol, dos moléculas de ALA se condensan en porfobilinógeno (PBG), un monómero pirrólico, por ALA deshidratasa (porfobilinógeno sintasa), dependiente de zinc. Plomo inhibe esta enzima y ferroquelatasa; aumenta ALA y compromete síntesis de hemo.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 7 · slides 7\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 7 · diapositivas 7\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Etapas 3 e 4 — montagem do tetrapirrol\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Etapas 3 y 4 — montaje del tetrapirrol\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">A porfobilinogênio desaminase (hidroximetilbilano sintase, HMBS) une quatro PBG em hidroximetilbilano, tetrapirrol linear. A uroporfirinogênio III sintase fecha e reorganiza o anel em uroporfirinogênio III. Sem essa enzima, pode ocorrer ciclização espontânea para isômero I não produtivo para heme.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Porfobilinógeno desaminasa (hidroximetilbilano sintasa, HMBS) une cuatro PBG en hidroximetilbilano lineal. Uroporfirinógeno III sintasa cierra y reorganiza el anillo en uroporfirinógeno III. Sin esta enzima puede ocurrir ciclación espontánea a isómero I no productivo para hemo.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 8 · slides 7\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 8 · diapositivas 7\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Etapa 5 — coproporfirinogênio III\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Etapa 5 — coproporfirinógeno III\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">Uroporfirinogênio descarboxilase (UROD) remove CO₂ de quatro grupos acetato, convertendo-os em grupos metila e produzindo coproporfirinogênio III no citosol. É a última etapa citosólica. Deficiência de UROD associa-se à porfiria cutânea tardia.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Uroporfirinógeno descarboxilasa (UROD) retira CO₂ de cuatro grupos acetato, convirtiéndolos en metilo y produciendo coproporfirinógeno III en citosol. Es el último paso citosólico. Deficiencia de UROD se asocia a porfiria cutánea tardía.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 9 · slides 7\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 9 · diapositivas 7\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Etapas 6 e 7 — protoporfirina IX\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Etapas 6 y 7 — protoporfirina IX\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">Na mitocôndria, coproporfirinogênio oxidase (CPOX) converte coproporfirinogênio III em protoporfirinogênio IX por descarboxilação oxidativa de duas cadeias propionato a vinila. Protoporfirinogênio oxidase (PPOX) oxida protoporfirinogênio IX a protoporfirina IX. Porfirinogênios são formas reduzidas, enquanto porfirinas têm sistema conjugado oxidado.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">En mitocondria, coproporfirinógeno oxidasa (CPOX) convierte coproporfirinógeno III en protoporfirinógeno IX mediante descarboxilación oxidativa de dos propionatos a vinilos. Protoporfirinógeno oxidasa (PPOX) oxida protoporfirinógeno IX a protoporfirina IX. Los porfirinógenos son formas reducidas y las porfirinas tienen sistema conjugado oxidado.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 10 · slides 7\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 10 · diapositivas 7\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Etapa 8 — ferroquelatase\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Etapa 8 — ferroquelatasa\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">A ferroquelatase (FECH), na membrana mitocondrial interna, insere Fe²⁺ na protoporfirina IX, formando heme. É a última das oito etapas. Sequência espacial: etapa 1 mitocondrial, etapas 2–5 citosólicas, etapas 6–8 mitocondriais. Chumbo interfere na FECH; deficiência hereditária pode causar protoporfiria eritropoiética.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Ferroquelatasa (FECH), en membrana mitocondrial interna, inserta Fe²⁺ en protoporfirina IX formando hemo. Es el último de ocho pasos. Secuencia espacial: paso 1 mitocondrial, pasos 2–5 citosólicos, pasos 6–8 mitocondriales. Plomo interfiere con FECH; su déficit hereditario puede causar protoporfiria eritropoyética.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 11 · slides 8\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 11 · diapositivas 8\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Catabolismo e reciclagem\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Catabolismo y reciclaje\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">Após aproximadamente 120 dias de vida, hemácias senescentes são fagocitadas por macrófagos principalmente no baço, fígado e medula óssea. Globina é degradada em aminoácidos reutilizáveis. Ferro é recuperado e armazenado ou transportado pela transferrina. A porção porfirínica é convertida em pigmentos biliares. O slide menciona renovação de cerca de 6 g/dia de hemoglobina; esse valor é aproximado.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tras aproximadamente 120 días, eritrocitos senescentes son fagocitados por macrófagos principalmente en bazo, hígado y médula ósea. Globina se degrada a aminoácidos reutilizables. Hierro se recupera y almacena o transporta por transferrina. La porción porfirínica se convierte en pigmentos biliares. La diapositiva menciona renovación aproximada de 6 g/día de hemoglobina.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 12 · slides 9\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 12 · diapositivas 9\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Bilirrubina: produção e transporte\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Bilirrubina: producción y transporte\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">Heme oxigenase abre o anel do heme, usando O₂ e poder redutor, formando biliverdina, ferro e monóxido de carbono (CO). Biliverdina redutase converte biliverdina (verde) em bilirrubina não conjugada (amarela), pouco hidrossolúvel. Ela circula ligada à albumina e não é filtrada normalmente na urina. Heme oxigenase é a etapa regulatória inicial da degradação.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Hemo oxigenasa abre el anillo de hemo usando O₂ y poder reductor, formando biliverdina, hierro y monóxido de carbono (CO). Biliverdina reductasa convierte biliverdina (verde) en bilirrubina no conjugada (amarilla), poco hidrosoluble. Circula unida a albúmina y normalmente no se filtra en orina. Hemo oxigenasa es la etapa reguladora inicial.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 13 · slides 9\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 13 · diapositivas 9\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Conjugação e secreção biliar\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Conjugación y secreción biliar\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">Hepatócitos captam bilirrubina; transportadores OATP participam do transporte hepático, especialmente da recaptura de conjugados. UGT1A1 (UDP-glucuronosiltransferase) conjuga bilirrubina com ácido glucurônico, aumentando solubilidade. MRP2 exporta bilirrubina conjugada para canalículos biliares. Bilirrubina direta corresponde principalmente à conjugada; indireta, principalmente à não conjugada. A direta pode aparecer na urina quando elevada no plasma.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Hepatocitos captan bilirrubina; transportadores OATP participan en transporte hepático, especialmente recaptación de conjugados. UGT1A1 (UDP-glucuronosiltransferasa) conjuga bilirrubina con ácido glucurónico, aumentando solubilidad. MRP2 exporta bilirrubina conjugada a canalículos biliares. Bilirrubina directa corresponde principalmente a conjugada; indirecta a no conjugada. La directa puede aparecer en orina si aumenta en plasma.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 14 · slides 9\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 14 · diapositivas 9\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Metabolismo intestinal e excreção\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Metabolismo intestinal y excreción\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">Bactérias intestinais convertem bilirrubina em urobilinogênio. A maior parte é eliminada pelas fezes após oxidação a pigmentos como estercobilina (marrom); parte retorna pela circulação entero-hepática, e pequena fração alcança os rins e origina urobilina (amarela). Obstrução biliar pode causar fezes claras e urina escura por bilirrubina conjugada.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Bacterias intestinales convierten bilirrubina en urobilinógeno. La mayor parte se elimina en heces tras oxidación a pigmentos como estercobilina (marrón); parte retorna por circulación enterohepática y una pequeña fracción llega al riñón y origina urobilina (amarilla). Obstrucción biliar puede causar heces claras y orina oscura por bilirrubina conjugada.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 15 · slides 9–10\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 15 · diapositivas 9–10\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Hiperbilirrubinemia e icterícia\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Hiperbilirrubinemia e ictericia\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">Hiperbilirrubinemia é bilirrubina acima do limite de referência; icterícia é coloração amarelada de pele, mucosas e escleras, geralmente visível em torno de 2–3 mg/dL. O slide 10 indica total até 1,0, direta até 0,4 e indireta até 0,6 mg/dL; o slide 9 usa total 0,3–1,2, direta 0–0,3 e indireta 0,2–0,9 mg/dL. São intervalos didáticos distintos; use o laboratório na prática. Pode ocorrer por produção excessiva, insuficiência de captação/conjugação ou falha de excreção.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Hiperbilirrubinemia es bilirrubina por encima del límite de referencia; ictericia es coloración amarilla de piel, mucosas y escleras, generalmente visible alrededor de 2–3 mg/dL. Diapositiva 10 indica total hasta 1,0, directa hasta 0,4 e indirecta hasta 0,6 mg/dL; la 9 usa total 0,3–1,2, directa 0–0,3 e indirecta 0,2–0,9 mg/dL. Son intervalos didácticos distintos; use el laboratorio en práctica. Puede deberse a producción excesiva o falla de captación, conjugación o excreción.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 16 · slides 9–10\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 16 · diapositivas 9–10\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Causas e interpretação clínica\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Causas e interpretación clínica\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">Predomínio indireto: hemólise aumentada, síndrome de Gilbert (redução leve de UGT1A1), Crigler-Najjar (deficiência importante de UGT1A1). Predomínio direto: colestase por cálculos biliares ou outras obstruções e defeitos de excreção. Hepatites e cirrose podem elevar ambas as frações; álcool e fármacos podem causar lesão hepática. O padrão de bilirrubina isoladamente não fecha diagnóstico.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Predominio indirecto: hemólisis aumentada, síndrome de Gilbert (reducción leve de UGT1A1), Crigler-Najjar (déficit importante de UGT1A1). Predominio directo: colestasis por cálculos biliares u otras obstrucciones y defectos de excreción. Hepatitis y cirrosis pueden elevar ambas fracciones; alcohol y fármacos pueden lesionar hígado. El patrón aislado no establece diagnóstico.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 17 · slides 11–15\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 17 · diapositivas 11–15\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Porfirias: definição e manifestações\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Porfirias: definición y manifestaciones\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">São doenças por alterações de enzimas da síntese de heme, hereditárias ou adquiridas, com acúmulo de precursores. As formas cutâneas podem produzir fotossensibilidade, bolhas, fragilidade, cicatrizes, hipertricose e, em formas graves raras, lesões mutilantes em áreas expostas, dentes avermelhados (eritrodontia), urina escura e anemia hemolítica. As porfirinas absorvem luz e transferem energia ao oxigênio, gerando espécies reativas que lesam tecidos. Pele, mãos, face, dentes e urina são locais ou manifestações destacados nos slides. Nem todos os pacientes apresentam essas alterações.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Son enfermedades por alteraciones de enzimas de síntesis de hemo, hereditarias o adquiridas, con acumulación de precursores. Formas cutáneas pueden causar fotosensibilidad, ampollas, fragilidad, cicatrices, hipertricosis y, en formas graves raras, lesiones mutilantes en zonas expuestas, dientes rojizos (eritrodoncia), orina oscura y anemia hemolítica. Las porfirinas absorben luz y transfieren energía al oxígeno generando especies reactivas que dañan tejidos. Piel, manos, cara, dientes y orina son lugares o manifestaciones destacadas. No todos presentan estos cambios.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">\u003cspan class=\"pttext\">Tópico 18 · slides 12–15\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Tema 18 · diapositivas 12–15\u003c/span>\u003c/div>\u003ch4>\u003cspan class=\"pttext\">Porfirias agudas e contexto histórico\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Porfirias agudas y contexto histórico\u003c/span>\u003c/h4>\u003cp>\u003cspan class=\"pttext\">Nas porfirias hepáticas agudas, ALA e PBG podem acumular-se e associar-se a dor abdominal intensa, alterações autonômicas, neuropatia, fraqueza e paralisia. ALA é particularmente implicado na neurotoxicidade. Porfiria aguda intermitente (HMBS) tipicamente não causa fotossensibilidade; porfiria cutânea tardia (UROD) causa lesões cutâneas. Os slides associam palidez, hipertricose, lesões faciais e dentes à lenda de vampiros e lobisomens e citam Julia Gnuse; trate isso como analogia histórica especulativa, não fato causal estabelecido. Diagnóstico depende do padrão de ALA, PBG e porfirinas, seguido de avaliação específica.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">En porfirias hepáticas agudas, ALA y PBG pueden acumularse y asociarse con dolor abdominal intenso, cambios autonómicos, neuropatía, debilidad y parálisis. ALA está especialmente implicado en neurotoxicidad. Porfiria aguda intermitente (HMBS) típicamente no causa fotosensibilidad; porfiria cutánea tardía (UROD) causa lesiones cutáneas. Las diapositivas asocian palidez, hipertricosis, lesiones faciales y dientes con leyendas de vampiros y licántropos y citan a Julia Gnuse; es una analogía histórica especulativa, no causalidad establecida. El diagnóstico depende del patrón de ALA, PBG y porfirinas.\u003c/span>\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"section\" id=\"flashcards\">\u003cdiv class=\"container\">\n\u003cdiv class=\"chapter-title\">\u003cspan class=\"chap-icon\">🃏\u003c/span>Flashcards de Bioquímica II\u003c/div>\n\u003cdiv class=\"info-block success\">\u003cdiv class=\"label\">55 flashcards\u003c/div>\u003ch4>Recuperação ativa com resposta explicada\u003c/h4>\u003cp>Tente responder em voz alta antes de virar o cartão. Filtre por tema para revisar uma aula específica ou embaralhe para treinar integração.\u003c/p>\u003c/div>\n\u003cdiv class=\"study-tools\">\u003clabel for=\"fcFilter\">Tema\u003c/label>\u003cselect id=\"fcFilter\">\u003c/select>\u003clabel for=\"fcSearch\">Buscar\u003c/label>\u003cinput id=\"fcSearch\" placeholder=\"Ex.: HGPRT, CPS II, heme, ubiquitina\" type=\"search\"/>\u003cbutton class=\"tool-btn\" onclick=\"shuffleFlashcards()\" type=\"button\">🔀 Embaralhar\u003c/button>\u003cspan class=\"result-note\" id=\"fcVisible\">\u003c/span>\u003c/div>\n\u003cdiv class=\"flashcard-grid\" id=\"flashcard-grid\">\u003c/div>\u003cdiv class=\"empty-state\" id=\"fcEmpty\">Nenhum flashcard corresponde ao filtro.\u003c/div>\n\u003c/div>\u003c/section>\u003csection class=\"section\" id=\"quiz\">\u003cdiv class=\"container\">\n\u003cdiv class=\"chapter-title\">\u003cspan class=\"chap-icon\">📝\u003c/span>Simulado de Bioquímica II\u003c/div>\n\u003cdiv class=\"info-block purple\">\u003cdiv class=\"label\">153 questões\u003c/div>\u003ch4>Perguntas dos slides + aprofundamento didático\u003c/h4>\u003cp>\u003cspan class=\"pttext\">Questões de múltipla escolha e verdadeiro/falso. Todas têm uma única resposta correta e justificativa exibida após responder.\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Preguntas de opción múltiple y verdadero/falso. Todas tienen una única respuesta correcta y justificación después de responder.\u003c/span>\u003c/p>\u003c/div>\n\u003cdiv class=\"q-stats\">\u003cdiv class=\"sbox c\">\u003cdiv class=\"sv\" id=\"sC\">0\u003c/div>\u003cdiv class=\"sl\">Corretas\u003c/div>\u003c/div>\u003cdiv class=\"sbox w\">\u003cdiv class=\"sv\" id=\"sW\">0\u003c/div>\u003cdiv class=\"sl\">Incorretas\u003c/div>\u003c/div>\u003cdiv class=\"sbox p\">\u003cdiv class=\"sv\" id=\"sP\">153\u003c/div>\u003cdiv class=\"sl\">Pendentes\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"study-tools\">\u003clabel for=\"qCategory\">Tema\u003c/label>\u003cselect id=\"qCategory\">\u003c/select>\u003clabel for=\"qType\">Tipo\u003c/label>\u003cselect id=\"qType\">\u003coption value=\"\">Todos\u003c/option>\u003coption value=\"mc\">Múltipla escolha\u003c/option>\u003coption value=\"tf\">Verdadeiro/Falso\u003c/option>\u003c/select>\u003cspan class=\"result-note\" id=\"qVisible\">\u003c/span>\u003c/div>\n\u003cdiv id=\"quizContainer\">\u003c/div>\u003cdiv class=\"empty-state\" id=\"qEmpty\">Nenhuma questão corresponde ao filtro.\u003c/div>\u003cbutton class=\"reset-btn\" onclick=\"resetQuiz()\">🔄 Reiniciar Simulado\u003c/button>\n\u003c/div>\u003c/section>\n\u003cbutton aria-label=\"Voltar ao topo\" id=\"scrolltop\" onclick=\"window.scrollTo({top:0,behavior:'smooth'})\">↑\u003c/button>\u003ca class=\"back-btn\" href=\"dashboard.html\">← Voltar\u003c/a>\n\u003cfooter>Bioquímica II — Final · 55 flashcards · 153 questões com explicação\u003c/footer>\n\u003cscript>\nconst TOPICS=[[\"ub\", \"🧬\", \"Sistema ubiquitina-proteassoma\", \"O “beijo da morte” e o Nobel\", \"Sistema ubiquitina-proteasoma\", \"El «beso de la muerte» y el Nobel\"], [\"pu\", \"🧪\", \"Metabolismo das purinas\", \"Bases nitrogenadas e estrutura\", \"Metabolismo de las purinas\", \"Bases nitrogenadas y estructura\"], [\"py\", \"🧬\", \"Metabolismo das pirimidinas\", \"Estrutura e derivados\", \"Metabolismo de las pirimidinas\", \"Estructura y derivados\"], [\"he\", \"🩸\", \"Metabolismo das porfirinas e do grupo heme\", \"Porfirinas: estrutura e propriedades\", \"Metabolismo de las porfirinas y el grupo hemo\", \"Porfirinas: estructura y propiedades\"]];\nconst rawFC=[{\"c\": \"Sistema ubiquitina-proteassoma\", \"ce\": \"Sistema ubiquitina-proteasoma\", \"q\": \"Quem recebeu o Nobel de 2004 por esse mecanismo?\", \"qe\": \"¿Quién recibió el Nobel de 2004 por este mecanismo?\", \"a\": \"Ciechanover, Hershko e Rose.\", \"ae\": \"Ciechanover, Hershko y Rose.\"}, {\"c\": \"Sistema ubiquitina-proteassoma\", \"ce\": \"Sistema ubiquitina-proteasoma\", \"q\": \"Quantos resíduos possui a ubiquitina e qual sua função?\", \"qe\": \"¿Cuántos residuos tiene la ubiquitina y cuál es su función?\", \"a\": \"76; sinaliza proteínas-alvo.\", \"ae\": \"76; señaliza proteínas blanco.\"}, {\"c\": \"Sistema ubiquitina-proteassoma\", \"ce\": \"Sistema ubiquitina-proteasoma\", \"q\": \"Qual é a função do núcleo 20S?\", \"qe\": \"¿Cuál es la función del núcleo 20S?\", \"a\": \"Hidrolisar ligações peptídicas.\", \"ae\": \"Hidrolizar enlaces peptídicos.\"}, {\"c\": \"Sistema ubiquitina-proteassoma\", \"ce\": \"Sistema ubiquitina-proteasoma\", \"q\": \"Onde ocorre a degradação e quais proteínas são removidas?\", \"qe\": \"¿Dónde ocurre la degradación y qué proteínas se eliminan?\", \"a\": \"Citosol e núcleo; proteínas defeituosas ou regulatórias de vida curta.\", \"ae\": \"Citosol y núcleo; proteínas defectuosas o reguladoras de vida corta.\"}, {\"c\": \"Sistema ubiquitina-proteassoma\", \"ce\": \"Sistema ubiquitina-proteasoma\", \"q\": \"Qual enzima ativa ubiquitina com ATP?\", \"qe\": \"¿Qué enzima activa ubiquitina con ATP?\", \"a\": \"E1.\", \"ae\": \"E1.\"}, {\"c\": \"Sistema ubiquitina-proteassoma\", \"ce\": \"Sistema ubiquitina-proteasoma\", \"q\": \"Qual enzima recebe a ubiquitina de E1?\", \"qe\": \"¿Qué enzima recibe ubiquitina de E1?\", \"a\": \"E2.\", \"ae\": \"E2.\"}, {\"c\": \"Sistema ubiquitina-proteassoma\", \"ce\": \"Sistema ubiquitina-proteasoma\", \"q\": \"Qual enzima confere especificidade ao alvo?\", \"qe\": \"¿Qué enzima confiere especificidad al blanco?\", \"a\": \"E3.\", \"ae\": \"E3.\"}, {\"
