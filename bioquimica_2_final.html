<script type="application/json" id="conteudo-bio">{"p1":"\u003c!DOCTYPE html>\u003chtml lang=\"pt-BR\">\u003chead>\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1.0\">\n\u003ctitle>Bioquímica II — Revisão completa para a Final\u003c/title>\n\u003cscript>window.PAGE_KEY = \"bioquimica_2_final\";\u003c/script>\u003cscript>document.documentElement.style.visibility=\"hidden\";\u003c/script>\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2\">\u003c/script>\u003cscript src=\"auth-guard.js\">\u003c/script>\u003cscript>document.addEventListener(\"authReady\",function(){document.documentElement.style.visibility=\"visible\";});\u003c/script>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n\n\n:root {\n  --bg: #0a0d14;\n  --bg2: #111520;\n  --bg3: #161c2e;\n  --card: #1a2138;\n  --card2: #1f2845;\n  --accent: #4f9cf9;\n  --accent2: #38e8c0;\n  --accent3: #f9784f;\n  --accent4: #b84ff9;\n  --gold: #f9c94f;\n  --red: #f95f5f;\n  --green: #4ff984;\n  --text: #e8eaf6;\n  --muted: #8892b0;\n  --border: rgba(79,156,249,0.15);\n  --shadow: 0 8px 40px rgba(0,0,0,0.5);\n  --radius: 16px;\n  --font-body: 'DM Sans', sans-serif;\n  --font-display: 'Syne', sans-serif;\n  --font-mono: 'JetBrains Mono', monospace;\n}\n\n* { margin:0; padding:0; box-sizing:border-box; }\n\nbody {\n  background: var(--bg);\n  color: var(--text);\n  font-family: var(--font-body);\n  font-size: 14px;\n  line-height: 1.6;\n  min-height: 100vh;\n  overflow-x: hidden;\n}\n\n#particles { position:fixed; inset:0; z-index:0; pointer-events:none; }\n\n/* ── HEADER ── */\nheader {\n  position: relative; z-index:10;\n  text-align: center;\n  padding: 48px 24px 32px;\n  background: linear-gradient(180deg, rgba(79,156,249,0.08) 0%, transparent 100%);\n  border-bottom: 1px solid var(--border);\n}\nheader .badge {\n  display:inline-block;\n  background: linear-gradient(135deg, var(--accent), var(--accent2));\n  color: var(--bg);\n  font-family: var(--font-mono);\n  font-size: 11px; font-weight:600;\n  letter-spacing:2px; text-transform:uppercase;\n  padding: 4px 14px; border-radius:20px; margin-bottom:16px;\n}\nheader h1 {\n  font-family: var(--font-display);\n  font-size: clamp(24px, 4vw, 44px);\n  font-weight: 800; letter-spacing:-1px;\n  background: linear-gradient(135deg, #fff 0%, var(--accent) 50%, var(--accent2) 100%);\n  -webkit-background-clip:text; -webkit-text-fill-color:transparent;\n  background-clip: text; margin-bottom:8px;\n}\nheader .sub { color: var(--muted); font-size:13px; letter-spacing:1px; }\nheader .by { margin-top:12px; color: var(--accent2); font-family:var(--font-mono); font-size:12px; }\nheader .psalm { margin-top:8px; color:var(--gold); font-size:12px; font-style:italic; opacity:0.8; }\n\n/* ── TABS ── */\nnav.tabs {\n  position:sticky; top:0; z-index:100;\n  display:flex; gap:4px; flex-wrap:wrap;\n  background: rgba(10,13,20,0.97);\n  backdrop-filter: blur(20px);\n  border-bottom: 1px solid var(--border);\n  padding: 10px 16px;\n  justify-content: center;\n}\nnav.tabs button {\n  background: var(--card);\n  border: 1px solid var(--border);\n  color: var(--muted);\n  font-family: var(--font-body); font-size:12px; font-weight:600;\n  padding: 6px 14px; border-radius: 8px; cursor:pointer;\n  transition: all 0.2s; letter-spacing: 0.3px;\n}\nnav.tabs button:hover { color: var(--accent); border-color: var(--accent); }\nnav.tabs button.active {\n  background: var(--accent); color: var(--bg);\n  border-color: var(--accent);\n  box-shadow: 0 0 20px rgba(79,156,249,0.4);\n}\nnav.tabs button.fc-tab.active { background: var(--gold); color: var(--bg); border-color: var(--gold); box-shadow: 0 0 20px rgba(249,201,79,0.4); }\nnav.tabs button.qz-tab.active { background: var(--accent4); color: #fff; border-color: var(--accent4); box-shadow: 0 0 20px rgba(184,79,249,0.4); }\n\n/* ── SECTIONS ── */\n.section { display:none; animation: fadeIn 0.4s ease; }\n.section.active { display:block; }\n@keyframes fadeIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }\n\n.container { max-width:1100px; margin:0 auto; padding: 32px 20px; position:relative; z-index:1; }\n\n/* ── CHAPTER TITLE ── */\n.chapter-title {\n  font-family: var(--font-display); font-size:22px; font-weight:700;\n  color: var(--accent); margin-bottom:24px;\n  display:flex; align-items:center; gap:12px;\n}\n.chapter-title::after {\n  content:''; flex:1; height:1px;\n  background: linear-gradient(90deg, var(--border), transparent);\n}\n.chap-icon { font-size:24px; }\n\n/* ── GLOSSARY GRID ── */\n.glossary-grid {\n  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));\n  gap: 14px; margin-bottom:32px;\n}\n.gloss-card {\n  background: var(--card); border:1px solid var(--border);\n  border-radius:var(--radius); padding:18px 20px;\n  cursor:pointer; transition: all 0.25s;\n  position:relative; overflow:hidden;\n}\n.gloss-card::before {\n  content:''; position:absolute; top:0; left:0; right:0; height:3px;\n  background: linear-gradient(90deg, var(--accent), var(--accent2));\n  border-radius:3px 3px 0 0;\n}\n.gloss-card:hover {\n  transform:translateY(-2px); border-color: var(--accent);\n  box-shadow: 0 8px 30px rgba(79,156,249,0.2);\n}\n.gloss-card .term {\n  font-family:var(--font-mono); font-size:13px; color:var(--accent2);\n  font-weight:600; margin-bottom:6px;\n}\n.gloss-card .def { color:var(--text); font-size:13px; line-height:1.6; }\n\n/* ── INFO BLOCKS ── */\n.info-block {\n  background: var(--card2); border-left: 3px solid var(--accent);\n  border-radius: 0 12px 12px 0;\n  padding: 16px 20px; margin-bottom:20px;\n}\n.info-block.warn { border-color: var(--gold); }\n.info-block.danger { border-color: var(--red); }\n.info-block.success { border-color: var(--green); }\n.info-block.purple { border-color: var(--accent4); }\n.info-block .label {\n  font-family:var(--font-mono); font-size:10px; letter-spacing:2px;\n  text-transform:uppercase; color:var(--muted); margin-bottom:8px;\n}\n.info-block h4 { font-family:var(--font-display); font-weight:700; margin-bottom:8px; font-size:15px; color:#fff; }\n.info-block p { color: var(--text); }\n.info-block ul, .info-block ol { padding-left:20px; margin-top:8px; color:var(--text); }\n.info-block li { margin:4px 0; }\n\n/* ── COMPARE TABLE ── */\n.compare-table {\n  width:100%; border-collapse:separate; border-spacing:0;\n  border-radius:var(--radius); overflow:hidden; margin-bottom:28px;\n}\n.compare-table th {\n  background: var(--card2); color:var(--accent);\n  font-family:var(--font-display); font-size:13px; font-weight:700;\n  padding:12px 16px; text-align:left;\n  border-bottom:1px solid var(--border);\n}\n.compare-table td {\n  background: var(--card); padding:10px 16px; font-size:13px;\n  border-bottom:1px solid rgba(255,255,255,0.04); color:var(--text);\n}\n.compare-table tr:last-child td { border-bottom:none; }\n.compare-table tr:hover td { background: var(--card2); }\n\n/* ── SECTION DIVIDER ── */\n.sec-divider {\n  display:flex; align-items:center; gap:12px;\n  margin: 32px 0 20px;\n}\n.sec-divider h3 {\n  font-family:var(--font-display); font-weight:700; font-size:17px;\n  color:var(--accent3); white-space:nowrap;\n}\n.sec-divider::before, .sec-divider::after {\n  content:''; flex:1; height:1px;\n  background: linear-gradient(90deg, transparent, var(--border), transparent);\n}\n\n/* ── FORMULA BOX ── */\n.formula-box {\n  background: rgba(56,232,192,0.06);\n  border: 1px solid rgba(56,232,192,0.25);\n  border-left: 4px solid var(--accent2);\n  border-radius: 0 12px 12px 0;\n  padding:14px 20px; margin-bottom:20px;\n  font-family: var(--font-mono); font-size:15px;\n  color: var(--accent2); font-weight:700;\n}\n.formula-box .formula-label {\n  font-size:10px; letter-spacing:2px; text-transform:uppercase;\n  color:var(--muted); margin-bottom:6px; font-family:var(--font-body);\n}\n\n/* ── EXAMPLE BOX ── */\n.example-box {\n  background:rgba(249,120,79,0.06);\n  border:1px solid rgba(249,120,79,0.2);\n  border-left:4px solid var(--accent3);\n  border-radius:0 12px 12px 0;\n  padding:12px 18px; margin:12px 0 20px;\n}\n.example-box .ex-label {\n  font-size:10px; letter-spacing:2px; text-transform:uppercase;\n  color:var(--accent3); font-weight:700; margin-bottom:6px;\n}\n.example-box p { color:var(--text); font-size:13px; }\n\n/* ── FLASHCARD GRID ── */\n.flashcard-grid {\n  display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));\n  gap:20px; margin-bottom:32px;\n}\n.flashcard { perspective:1000px; height:235px; cursor:pointer; }\n.flashcard-inner {\n  position:relative; width:100%; height:100%;\n  transition: transform 0.6s cubic-bezier(0.4,0,0.2,1);\n  transform-style: preserve-3d;\n}\n.flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }\n.flashcard-front, .flashcard-back {\n  position:absolute; inset:0; border-radius:var(--radius);\n  backface-visibility:hidden; padding:22px;\n  display:flex; flex-direction:column; justify-content:space-between;\n}\n.flashcard-front {\n  background: linear-gradient(135deg, var(--card) 0%, var(--card2) 100%);\n  border: 1px solid var(--border);\n}\n.flashcard-back {\n  transform: rotateY(180deg);\n  background: linear-gradient(135deg, #1a1a3a 0%, #1a2a3e 100%);\n  border: 1px solid rgba(79,156,249,0.3);\n  overflow-y:auto; font-size:12.5px; line-height:1.7;\n}\n.fc-tag {\n  font-family:var(--font-mono); font-size:11px;\n  color:var(--accent2); letter-spacing:1px; text-transform:uppercase;\n}\n.fc-q {\n  font-family:var(--font-display); font-size:16px; font-weight:700;\n  color:#fff; line-height:1.3; margin:8px 0;\n}\n.fc-hint { font-size:11px; color:var(--accent); text-align:right; opacity:0.7; }\n.fc-back-text { color:var(--text); white-space:pre-line; }\n\n/* ── QUIZ ── */\n.q-stats { display:flex; gap:1rem; justify-content:center; margin-bottom:2rem; flex-wrap:wrap; }\n.sbox { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:.65rem 1.1rem; text-align:center; min-width:80px; }\n.sbox .sv { font-size:1.5rem; font-weight:900; font-family:var(--font-display); }\n.sbox .sl { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }\n.sbox.c .sv { color:var(--green); } .sbox.w .sv { color:var(--red); } .sbox.p .sv { color:var(--accent); }\n\n.q-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:1.8rem; margin-bottom:1.5rem; transition:border-color .3s; }\n.q-card.ans.cq { border-color:var(--green); } .q-card.ans.wq { border-color:var(--red); }\n.q-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:.9rem; gap:.5rem; flex-wrap:wrap; }\n.q-num { font-size:11px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:2px; }\n.q-tbadge { font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:1px; padding:.2rem .55rem; border-radius:20px; }\n.tmc { background:rgba(79,156,249,0.15); color:var(--accent); } .ttf { background:rgba(184,79,249,0.15); color:var(--accent4); } .tab { background:rgba(249,201,79,0.15); color:var(--gold); }\n.ctag { font-size:10px; font-weight:700; background:rgba(255,255,255,.06); color:var(--muted); padding:.2rem .55rem; border-radius:20px; }\n.q-text { font-size:15px; font-weight:700; color:#fff; margin-bottom:1.1rem; line-height:1.6; }\n.opts { display:flex; flex-direction:column; gap:.5rem; margin-bottom:.9rem; }\n.opt-btn { background:var(--card2); border:1px solid var(--border); color:var(--text); padding:.7rem 1rem; border-radius:10px; cursor:pointer; font-family:var(--font-body); font-size:14px; text-align:left; transition:all .2s; display:flex; gap:.7rem; align-items:flex-start; width:100%; }\n.opt-btn:hover:not(:disabled) { border-color:var(--accent); color:#fff; }\n.opt-btn:disabled { cursor:default; }\n.opt-btn.ca { background:rgba(79,249,132,0.12); border-color:var(--green); color:var(--green); }\n.opt-btn.wa { background:rgba(249,95,95,0.1); border-color:var(--red); color:var(--red); }\n.ol { font-weight:900; font-size:12px; flex-shrink:0; width:18px; text-align:center; margin-top:1px; }\n.tf-opts { display:flex; gap:1rem; margin-bottom:.9rem; }\n.tf-btn { flex:1; background:var(--card2); border:1px solid var(--border); color:var(--text); padding:.8rem; border-radius:10px; cursor:pointer; font-family:var(--font-body); font-size:15px; font-weight:800; text-align:center; transition:all .2s; }\n.tf-btn:hover:not(:disabled) { border-color:var(--accent4); }\n.tf-btn:disabled { cursor:default; }\n.tf-btn.ca { background:rgba(79,249,132,0.12); border-color:var(--green); color:var(--green); }\n.tf-btn.wa { background:rgba(249,95,95,0.1); border-color:var(--red); color:var(--red); }\n.open-btn { background:var(--card2); border:1px dashed var(--gold); color:var(--gold); padding:.65rem 1.4rem; border-radius:10px; cursor:pointer; font-family:var(--font-body); font-size:14px; font-weight:700; transition:all .2s; margin-bottom:.9rem; }\n.open-btn:hover { background:rgba(249,201,79,0.1); }\n.exp-box { display:none; background:rgba(0,0,0,.2); border:1px solid rgba(255,255,255,.08); border-radius:10px; padding:.9rem 1.1rem; margin-top:.6rem; }\n.exp-box.vis { display:block; }\n.exp-box .et { font-size:11px; font-weight:800; color:var(--accent2); text-transform:uppercase; letter-spacing:1px; margin-bottom:.4rem; }\n.exp-box p { font-size:13px; color:var(--text); line-height:1.7; }\n.res-ind { display:none; align-items:center; gap:.5rem; font-size:14px; font-weight:700; margin-bottom:.6rem; }\n.res-ind.vis { display:flex; }\n.res-ind.c { color:var(--green); } .res-ind.w { color:var(--red); }\n.reset-btn { background:var(--card); border:1px solid var(--border); color:var(--muted); padding:.6rem 1.5rem; border-radius:50px; cursor:pointer; font-family:var(--font-body); font-size:14px; font-weight:700; display:block; margin:2rem auto; transition:all .2s; }\n.reset-btn:hover { border-color:var(--red); color:var(--red); }\n\n/* ── SCROLL TOP ── */\n#scrolltop {\n  position:fixed; bottom:24px; right:24px; z-index:200;\n  background:var(--accent); color:var(--bg);\n  width:40px; height:40px; border-radius:50%;\n  border:none; cursor:pointer; font-size:18px;\n  box-shadow:0 4px 20px rgba(79,156,249,0.4);\n  transition:all 0.2s; display:none;\n}\n#scrolltop:hover { transform:translateY(-2px); }\n\n/* ── BACK BTN ── */\n.back-btn {\n  position:fixed; bottom:24px; left:24px; z-index:9999;\n  display:flex; align-items:center; gap:9px;\n  padding:12px 26px;\n  background:rgba(10,13,20,0.93);\n  border:1.5px solid rgba(79,156,249,0.42);\n  border-radius:50px;\n  color:#e8eaf6;\n  font-size:13px; font-weight:600; letter-spacing:0.03em;\n  text-decoration:none;\n  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);\n  box-shadow:0 4px 24px rgba(79,156,249,0.16), inset 0 1px 0 rgba(255,255,255,0.04);\n  transition:all .25s ease;\n}\n.back-btn:hover {\n  background:rgba(79,156,249,0.14);\n  border-color:rgba(79,156,249,0.85);\n  transform:translateY(-3px);\n  box-shadow:0 8px 32px rgba(79,156,249,0.26);\n}\n\n/* ── UTILITIES ── */\np { margin: 8px 0; color: var(--text); }\nstrong { color: #fff; }\nem { color: var(--accent2); font-style:normal; }\n\n.tag-prova {\n  display:inline-block; background:rgba(249,95,95,0.15);\n  border:1px solid var(--red); color:var(--red);\n  font-family:var(--font-mono); font-size:10px; letter-spacing:2px;\n  padding:2px 10px; border-radius:6px; margin-left:8px;\n  vertical-align:middle; text-transform:uppercase;\n}\n\n/* ── INTRO COVER CARDS ── */\n.intro-grid {\n  display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));\n  gap:16px; margin-bottom:28px;\n}\n.intro-card {\n  background: var(--card); border:1px solid 18px;\n  box-shadow:0 18px 56px rgba(0,0,0,.66);backdrop-filter:blur(20px)\n}\n#enzo-annotations-index.open{display:flex;flex-direction:column}\n.enzo-index-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 15px;border-bottom:1px solid var(--border);background:rgba(184,79,249,.07)}\n.enzo-index-title{font:800 15px var(--font-display);color:#fff}.enzo-index-sub{font:500 10px var(--font-mono);color:var(--muted);margin-top:2px}\n.enzo-index-close{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;font-size:18px}\n.enzo-index-tabs{display:flex;gap:7px;padding:10px 12px;border-bottom:1px solid var(--border)}\n.enzo-index-filter{flex:1;border:1px solid var(--border);background:var(--card);color:var(--muted);border-radius:10px;padding:8px 9px;font:700 10px var(--font-body);cursor:pointer}\n.enzo-index-filter.active{color:#fff;border-color:var(--accent4);background:rgba(184,79,249,.14)}\n.enzo-index-list{overflow:auto;padding:10px;display:grid;gap:8px}\n.enzo-index-empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:12px;line-height:1.55}\n.enzo-index-item{width:100%;display:block;text-align:left;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:12px;padding:10px 11px;cursor:pointer;transition:.18s}\n.enzo-index-item:hover{border-color:var(--accent);transform:translateY(-1px);background:var(--card2)}\n.enzo-index-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px;color:var(--muted);font:700 9px var(--font-mono);text-transform:uppercase;letter-spacing:.55px}\n.enzo-index-text{font:600 12px/1.45 var(--font-body);color:#fff;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}\n.enzo-index-item[data-kind=\"highlight\"] .enzo-index-text{border-left:4px solid #ffe066;padding-left:8px}\n.enzo-index-item[data-color=\"green\"] .enzo-index-text{border-left-color:#78e89b}\n.enzo-index-item[data-color=\"red\"] .enzo-index-text{border-left-color:#ff8585}\n.enzo-index-flash{animation:enzoIndexFlash 1.25s ease}\n@keyframes enzoIndexFlash{0%,100%{box-shadow:0 0 0 0 rgba(184,79,249,0)}35%{box-shadow:0 0 0 7px rgba(184,79,249,.35)}}\n@media(max-width:700px){\n  #enzo-annotations-index-toggle{left:12px;bottom:194px;min-height:42px;padding:9px 12px}\n  #enzo-annotations-index{left:12px;right:12px;bottom:246px;width:auto;max-height:62vh}\n}\n\n\n\n/* ── PAINEL DE UTILIDADES RETRÁTIL ── */\n#enzo-tools-retractor{\n  position:fixed;left:0;top:50%;bottom:auto;transform:translateY(-50%);z-index:10040;width:34px;height:64px;\n  display:flex;align-items:center;justify-content:center;border:1px solid rgba(79,156,249,.42);border-left:0;\n  border-radius:0 14px 14px 0;background:rgba(10,13,20,.96);color:#e8eaf6;cursor:pointer;\n  box-shadow:6px 8px 26px rgba(0,0,0,.38);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);\n  font:900 20px/1 var(--font-body);transition:width .2s ease,background .2s ease,border-color .2s ease,transform .2s ease;\n}\n#enzo-tools-retractor:hover{width:39px;background:rgba(79,156,249,.16);border-color:rgba(79,156,249,.85)}\n#enzo-tools-retractor .enzo-tools-arrow{display:block;transition:transform .22s ease}\nbody.enzo-tools-collapsed #enzo-tools-retractor .enzo-tools-arrow{transform:rotate(180deg)}\n#enzo-highlighter,#enzo-notes-toggle,#enzo-annotations-index-toggle{\n  transition:opacity .2s ease,transform .24s ease,visibility .24s ease,background .2s ease,border-color .2s ease;\n}\nbody.enzo-tools-collapsed #enzo-highlighter,\nbody.enzo-tools-collapsed #enzo-notes-toggle,\nbody.enzo-tools-collapsed #enzo-annotations-index-toggle{\n  opacity:0;visibility:hidden;pointer-events:none;transform:translateX(-120px)!important;\n}\nbody.enzo-tools-collapsed #enzo-note-composer,\nbody.enzo-tools-collapsed #enzo-annotations-index{display:none!important}\nbody.enzo-tools-collapsed .enzo-hl-toast{opacity:0!important;pointer-events:none!important}\n@media(max-width:700px){\n  #enzo-tools-retractor{top:50%;bottom:auto;width:29px;height:56px;border-radius:0 12px 12px 0;font-size:18px}\n  #enzo-tools-retractor:hover{width:32px}\n}\n\n\u003c/style>\u003cstyle>.periodos-bio{position:relative;display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin:1.2rem auto;max-width:58rem}.periodos-bio a{flex:1 1 12rem;padding:.55rem .75rem;color:#e8eaf6;background:#151e34;border:1px solid #506389;border-radius:.65rem;text-decoration:none}.periodos-bio b,.periodos-bio span{display:block}.periodos-bio span{font-size:.82rem}.periodos-bio [aria-current]{border:2px solid #38e8c0}.periodos-bio [aria-current] b{text-decoration:underline}\u003c/style>\u003c/head>\u003cbody>\u003ccanvas id=\"particles\">\u003c/canvas>\n\u003cheader>\u003cdiv class=\"badge\">🧪 Bioquímica II · P1 · 2026\u003c/div>\u003ch1>Bioquímica II — Revisão para a Final\u003c/h1>\u003cdiv class=\"periodos-bio\" role=\"navigation\" aria-label=\"Conteúdo do semestre\">\u003ca href=\"?etapa=p1\" aria-current=\"page\">\u003cb>P1\u003c/b>\u003cspan>Carboidratos, hormônios e antibióticos\u003c/span>\u003c/a>\u003ca href=\"?etapa=p2\">\u003cb>P2\u003c/b>\u003cspan>Lipídios, aminoácidos e bioenergética\u003c/span>\u003c/a>\u003ca href=\"?etapa=final\">\u003cb>Final\u003c/b>\u003cspan>Proteassoma, nucleotídeos e heme\u003c/span>\u003c/a>\u003c/div>\u003cp class=\"sub\">Carboidratos · Pentoses · Ciclo de Cori · Insulina · Glucagon · Antibióticos\u003c/p>\u003cp class=\"by\">⚡ Elaborado por Enzo Salmazo · Explicações funcionais, exemplos e revisão ativa\u003c/p>\u003c/header>\n\u003cnav class=\"tabs\">\n\u003cbutton class=\"active\" data-section=\"intro\" onclick=\"showSection('intro',this)\">📖 Início\u003c/button>\n\u003cbutton data-section=\"carboidratos\" onclick=\"showSection('carboidratos',this)\">🍞 Carboidratos — partes 1 e 2\u003c/button>\n\u003cbutton data-section=\"pentoses\" onclick=\"showSection('pentoses',this)\">🛡️ Metabolismo das pentoses\u003c/button>\n\u003cbutton data-section=\"cori\" onclick=\"showSection('cori',this)\">🔄 Ciclo de Cori\u003c/button>\n\u003cbutton data-section=\"insulina\" onclick=\"showSection('insulina',this)\">🔑 Importância da insulina\u003c/button>\n\u003cbutton data-section=\"glucagon\" onclick=\"showSection('glucagon',this)\">📈 Importância do glucagon\u003c/button>\n\u003cbutton data-section=\"antibioticos\" onclick=\"showSection('antibioticos',this)\">🦠 Antibióticos\u003c/button>\n\u003cbutton class=\"fc-tab\" data-section=\"flashcards\" onclick=\"showSection('flashcards',this)\">🃏 Flashcards (\u003cspan data-flashcard-count>132\u003c/span>)\u003c/button>\n\u003cbutton class=\"qz-tab\" data-section=\"quiz\" onclick=\"showSection('quiz',this)\">📝 Questões (\u003cspan data-question-count>136\u003c/span>)\u003c/button>\n\u003c/nav>\u003csection id=\"intro\" class=\"section active\">\u003cdiv class=\"container\">\n\u003cdiv class=\"sequence-badge\">VISÃO GERAL · CONTEÚDO ORGANIZADO POR UNIDADES\u003c/div>\n\u003cdiv class=\"chapter-title\">\u003cspan class=\"chap-icon\">🧪\u003c/span>Introdução à Bioquímica II\u003c/div>\n\u003cp class=\"section-lead\">Nesta etapa, estudaremos como a glicose entra no organismo, chega às células, produz energia, é armazenada e volta a ser disponibilizada. Depois, conectaremos a via das pentoses e o Ciclo de Cori ao controle hormonal exercido por insulina e glucagon. Por fim, veremos como certos antibióticos interferem na bioquímica bacteriana.\u003c/p>\n\u003cdiv class=\"info-block success\">\u003cdiv class=\"label\">Como estudar\u003c/div>\u003ch4>Entenda o caminho antes de decorar a enzima\u003c/h4>\u003cp>Em cada reação, pergunte: \u003cstrong>onde ocorre?\u003c/strong>, \u003cstrong>qual substrato entra?\u003c/strong>, \u003cstrong>qual produto sai?\u003c/strong>, \u003cstrong>gasta ou produz energia?\u003c/strong> e \u003cstrong>quem regula?\u003c/strong>. Depois use os \u003cspan data-flashcard-count>132\u003c/span> flashcards e as \u003cspan data-question-count>136\u003c/span> questões para recuperação ativa.\u003c/p>\u003c/div>\n\u003cdiv id=\"topicCards\" class=\"intro-grid\">\u003c/div>\n\u003cdiv class=\"info-block purple\">\u003cdiv class=\"label\">Legenda química\u003c/div>\u003ch4>Fórmula + nome, sempre que ela aparece\u003c/h4>\u003cp>C₆H₁₂O₆ \u003cstrong>(glicose)\u003c/strong>, CO₂ \u003cstrong>(dióxido de carbono)\u003c/strong>, H₂O \u003cstrong>(água)\u003c/strong>, H⁺ \u003cstrong>(íon hidrogênio/próton)\u003c/strong>, Na⁺ \u003cstrong>(íon sódio)\u003c/strong> e Ca²⁺ \u003cstrong>(íon cálcio)\u003c/strong>. A escrita desenvolvida aproxima a linguagem química do significado fisiológico.\u003c/p>\u003c/div>\n\u003cdiv class=\"info-block\">\u003cdiv class=\"label\">O que será estudado\u003c/div>\u003ch4>Do metabolismo dos carboidratos à ação dos antibióticos\u003c/h4>\u003col>\n\u003cli>\u003cstrong>Metabolismo dos carboidratos — parte 1:\u003c/strong> fundamentos, digestão, absorção, transportadores, glicólise e destinos do piruvato.\u003c/li>\n\u003cli>\u003cstrong>Metabolismo dos carboidratos — parte 2:\u003c/strong> glicogênio, glicogênese, glicogenólise, gliconeogênese e integração clínica.\u003c/li>\n\u003cli>\u003cstrong>Metabolismo das pentoses:\u003c/strong> produção de NADPH e ribose-5-fosfato, além da deficiência de G6PD.\u003c/li>\n\u003cli>\u003cstrong>Ciclo de Cori:\u003c/strong> transporte do lactato e cooperação energética entre músculo, hemácias e fígado.\u003c/li>\n\u003cli>\u003cstrong>Insulina:\u003c/strong> síntese, secreção, sinalização, efeitos metabólicos, diabetes e hipoglicemia.\u003c/li>\n\u003cli>\u003cstrong>Glucagon:\u003c/strong> controle do jejum, produção hepática de glicose e integração com a insulina.\u003c/li>\n\u003cli>\u003cstrong>Antibióticos:\u003c/strong> metabolismo bacteriano, ciclo de Krebs citoplasmático, membrana, lise osmótica (vancomicina e fosfomicina), aminoglicosídeos, impacto no hospedeiro e na microbiota.\u003c/li>\n\u003c/ol>\u003c/div>\n\u003c/div>\u003c/section>\u003csection id=\"fundamentos\" class=\"section\" data-group=\"carboidratos\">\u003cdiv class=\"container\">\u003cdiv class=\"unit-banner\">\u003cspan>PARTE 1\u003c/span>\u003cstrong>Entrada, utilização e destino imediato da glicose\u003c/strong>\u003cp>Fundamentos, digestão, transporte, glicólise e destinos do piruvato.\u003c/p>\u003c/div>\u003cdiv class=\"chapter-title\">\u003cspan class=\"chap-icon\">🧱\u003c/span>Fundamentos do metabolismo dos carboidratos\u003c/div>\u003cp class=\"section-lead\">Metabolismo é o conjunto coordenado de reações químicas que capta, transforma, armazena e utiliza matéria e energia. O objetivo não é “produzir ATP a qualquer custo”, mas manter a homeostase de cada tecido.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable class=\"compare-table\">\u003cthead>\u003ctr>\u003cth>Conceito\u003c/th>\u003cth>O que acontece\u003c/th>\u003cth>Exemplo\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Catabolismo\u003c/td>\u003ctd>Moléculas maiores são degradadas; energia e intermediários são liberados.\u003c/td>\u003ctd>Glicose → piruvato pela glicólise; glicogênio → glicose-1-fosfato pela glicogenólise.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Anabolismo\u003c/td>\u003ctd>Moléculas complexas são construídas; consome ATP e/ou poder redutor.\u003c/td>\u003ctd>Glicogênese, síntese de ácidos graxos e síntese proteica.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ATP\u003c/td>\u003ctd>Adenosina trifosfato: transfere grupos fosfato e energia livre.\u003c/td>\u003ctd>Contração muscular, bombas iônicas e biossíntese.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>NADH\u003c/td>\u003ctd>Nicotinamida adenina dinucleotídeo reduzida: carrega elétrons para produção de ATP.\u003c/td>\u003ctd>É formado na glicólise e reoxidado na mitocôndria ou ao formar lactato.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>NADPH\u003c/td>\u003ctd>Nicotinamida adenina dinucleotídeo fosfato reduzida: poder redutor para síntese e defesa antioxidante.\u003c/td>\u003ctd>Síntese de lipídios e regeneração da glutationa reduzida.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003carticle class=\"info-block \">\u003cdiv class=\"label\">Base química\u003c/div>\u003ch4>O que é um carboidrato?\u003c/h4>\u003cul>\u003cli>Carboidratos ou glicídios são poli-hidroxialdeídos, poli-hidroxicetonas ou moléculas que os originam por hidrólise.\u003c/li>\u003cli>\u003cstrong>C₆H₁₂O₆ (glicose)\u003c/strong>, \u003cstrong>C₆H₁₂O₆ (frutose)\u003c/strong> e \u003cstrong>C₆H₁₂O₆ (galactose)\u003c/strong> têm a mesma fórmula molecular, mas estruturas diferentes: são isômeros.\u003c/li>\u003cli>Monossacarídeos não são hidrolisáveis; dissacarídeos contêm duas unidades; oligossacarídeos, poucas; polissacarídeos, muitas.\u003c/li>\u003cli>A designação D ou L depende da configuração do carbono quiral mais distante do grupo carbonila, não da direção em que a luz é desviada.\u003c/li>\u003c/ul>\u003c/article>\u003cdiv class=\"table-wrap\">\u003ctable class=\"compare-table\">\u003cthead>\u003ctr>\u003cth>Classe\u003c/th>\u003cth>Exemplos\u003c/th>\u003cth>Função/observação\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Monossacarídeos\u003c/td>\u003ctd>Glicose, galactose, frutose, ribose\u003c/td>\u003ctd>Absorvidos sem hidrólise adicional.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Dissacarídeos\u003c/td>\u003ctd>Sacarose = glicose + frutose; lactose = glicose + galactose; maltose = glicose + glicose\u003c/td>\u003ctd>Precisam de dissacaridases da borda em escova.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Polissacarídeos\u003c/td>\u003ctd>Amido, glicogênio e fibras\u003c/td>\u003ctd>Reserva vegetal, reserva animal ou função estrutural.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003carticle class=\"info-block success\">\u003cdiv class=\"label\">Importância\u003c/div>\u003ch4>Por que a glicose é central?\u003c/h4>\u003cul>\u003cli>Fornece ATP rapidamente e gera intermediários de 3 e 6 carbonos para outras vias.\u003c/li>\u003cli>Hemácias dependem exclusivamente de glicólise porque não possuem mitocôndrias.\u003c/li>\u003cli>O cérebro normalmente usa glicose como combustível predominante; em jejum prolongado aumenta o uso de corpos cetônicos, mas ainda necessita de glicose.\u003c/li>\u003cli>Carboidratos também integram glicoproteínas, glicolipídios, nucleotídeos, matriz extracelular e peptidoglicano bacteriano.\u003c/li>\u003c/ul>\u003c/article>\u003c/div>\u003c/section>\u003csection id=\"digestao\" class=\"section\" data-group=\"carboidratos\">\u003cdiv class=\"container\">\u003cdiv class=\"chapter-title\">\u003cspan class=\"chap-icon\">🍞\u003c/span>Digestão e absorção dos carboidratos\u003c/div>\u003cp class=\"section-lead\">A digestão converte polímeros e dissacarídeos em monossacarídeos. A absorção ocorre principalmente no duodeno e jejuno, atravessando primeiro a membrana apical e depois a basolateral do enterócito.\u003c/p>\u003cdiv class=\"pathway\">\u003cdiv class=\"path-node\">\u003cstrong>Amido\u003c/strong>\u003csmall>ligações α-1,4 e ramificações α-1,6\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>Maltose, maltotriose e dextrinas-limite\u003c/strong>\u003csmall>amilases salivar e pancreática\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>Glicose\u003c/strong>\u003csmall>enzimas da borda em escova\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>Sangue portal\u003c/strong>\u003csmall>absorção pelo enterócito\u003c/small>\u003c/div>\u003c/div>\u003cp class=\"path-caption\">A amilase rompe ligações α-1,4, mas não rompe α-1,6; por isso restam dextrinas-limite.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable class=\"compare-table\">\u003cthead>\u003ctr>\u003cth>Local/enzima\u003c/th>\u003cth>Substrato\u003c/th>\u003cth>Produto\u003c/th>\u003cth>Ponto de prova\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Boca — α-amilase salivar\u003c/td>\u003ctd>Amido/glicogênio\u003c/td>\u003ctd>Maltose, maltotriose e dextrinas\u003c/td>\u003ctd>Atua em α-1,4; é inativada pelo pH gástrico.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Intestino — α-amilase pancreática\u003c/td>\u003ctd>Amido parcialmente digerido\u003c/td>\u003ctd>Oligossacarídeos\u003c/td>\u003ctd>Continua a hidrólise luminal.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Maltase-glicoamilase\u003c/td>\u003ctd>Maltose e oligômeros α-1,4\u003c/td>\u003ctd>Glicose\u003c/td>\u003ctd>Localizada na borda em escova.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sacarase-isomaltase\u003c/td>\u003ctd>Sacarose e ligações α-1,6\u003c/td>\u003ctd>Glicose + frutose; remove ramificações\u003c/td>\u003ctd>A isomaltase resolve dextrinas-limite.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Lactase\u003c/td>\u003ctd>Lactose\u003c/td>\u003ctd>Glicose + galactose\u003c/td>\u003ctd>Deficiência causa distensão, gases e diarreia osmótica.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003carticle class=\"info-block purple\">\u003cdiv class=\"label\">Exemplo\u003c/div>\u003ch4>Por que fibras não viram glicose?\u003c/h4>\u003cp>Humanos não possuem celulase para romper as ligações β-1,4 da celulose. Parte da fibra é fermentada pela microbiota em ácidos graxos de cadeia curta; outra parte aumenta o volume fecal.\u003c/p>\u003c/article>\u003carticle class=\"info-block warn\">\u003cdiv class=\"label\">Armadilha\u003c/div>\u003ch4>“Simples” não significa automaticamente “ruim”\u003c/h4>\u003cp>Frutas contêm açúcares simples, mas também água, fibra e micronutrientes. A resposta glicêmica depende da matriz alimentar, quantidade, processamento, combinação com proteínas/lipídios e condição metabólica.\u003c/p>\u003c/article>\u003c/div>\u003c/section>\u003csection id=\"transportadores\" class=\"section\" data-group=\"carboidratos\">\u003cdiv class=\"container\">\u003cdiv class=\"chapter-title\">\u003cspan class=\"chap-icon\">🚪\u003c/span>Transporte intestinal e transportadores GLUT\u003c/div>\u003cp class=\"section-lead\">A glicose é polar e não atravessa livremente a bicamada lipídica. SGLT usa o gradiente de sódio; GLUT realiza difusão facilitada a favor do gradiente.\u003c/p>\u003carticle class=\"reaction-card\">\u003cspan>Absorção apical de glicose/galactose\u003c/span>\u003cdiv class=\"reaction-formula\">2 Na⁺ (sódio) + glicose → enterócito por SGLT1\u003c/div>\u003cp>Transporte ativo secundário: a energia vem do gradiente de Na⁺ mantido pela Na⁺/K⁺-ATPase basolateral.\u003c/p>\u003c/article>\u003carticle class=\"reaction-card\">\u003cspan>Absorção apical de frutose\u003c/span>\u003cdiv class=\"reaction-formula\">Frutose → enterócito por GLUT5\u003c/div>\u003cp>Difusão facilitada, independente de Na⁺ e insulina.\u003c/p>\u003c/article>\u003carticle class=\"reaction-card\">\u003cspan>Saída basolateral\u003c/span>\u003cdiv class=\"reaction-formula\">Glicose, galactose ou frutose → sangue portal por GLUT2\u003c/div>\u003cp>Difusão facilitada para o interstício e circulação portal.\u003c/p>\u003c/article>\u003cdiv class=\"table-wrap\">\u003ctable class=\"compare-table\">\u003cthead>\u003ctr>\u003cth>Transportador\u003c/th>\u003cth>Principais locais\u003c/th>\u003cth>Função\u003c/th>\u003cth>Insulina?\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>SGLT1\u003c/td>\u003ctd>Intestino delgado; túbulo proximal distal\u003c/td>\u003ctd>Cotransporta glicose/galactose com Na⁺; alta afinidade.\u003c/td>\u003ctd>Não\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SGLT2\u003c/td>\u003ctd>Túbulo proximal renal\u003c/td>\u003ctd>Reabsorve a maior parte da glicose filtrada.\u003c/td>\u003ctd>Não\u003c/td>\u003c/tr>\u003ctr>\u003ctd>GLUT1\u003c/td>\u003ctd>Hemácias, barreira hematoencefálica, placenta\u003c/td>\u003ctd>Captação basal; alta afinidade.\u003c/td>\u003ctd>Não\u003c/td>\u003c/tr>\u003ctr>\u003ctd>GLUT2\u003c/td>\u003ctd>Fígado, membrana basolateral do enterócito, rim; células β em alguns modelos\u003c/td>\u003ctd>Alta capacidade e baixa afinidade; fluxo bidirecional no fígado.\u003c/td>\u003ctd>Não\u003c/td>\u003c/tr>\u003ctr>\u003ctd>GLUT3\u003c/td>\u003ctd>Neurônios e placenta\u003c/td>\u003ctd>Alta afinidade; garante captação em baixa glicemia.\u003c/td>\u003ctd>Não\u003c/td>\u003c/tr>\u003ctr>\u003ctd>GLUT4\u003c/td>\u003ctd>Músculo esquelético, cardíaco e tecido adiposo\u003c/td>\u003ctd>Insulina e exercício promovem translocação de vesículas para a membrana.\u003c/td>\u003ctd>Sim, além do exercício\u003c/td>\u003c/tr>\u003ctr>\u003ctd>GLUT5\u003c/td>\u003ctd>Enterócito apical, espermatozoides, rim\u003c/td>\u003ctd>Transporta principalmente frutose.\u003c/td>\u003ctd>Não\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003carticle class=\"info-block danger\">\u003cdiv class=\"label\">Professor explica\u003c/div>\u003ch4>Insulina não “fabrica” GLUT4 imediatamente\u003c/h4>\u003cp>O efeito agudo é a \u003cstrong>translocação\u003c/strong> do GLUT4 já armazenado em vesículas. Na resistência à insulina, a sinalização e a translocação ficam prejudicadas; não é correto resumir o fenômeno como simples ausência de produção do transportador.\u003c/p>\u003c/article>\u003carticle class=\"info-block purple\">\u003cdiv class=\"label\">Aplicação\u003c/div>\u003ch4>Inibidores de SGLT2\u003c/h4>\u003cp>Ao bloquear a reabsorção renal de glicose, aumentam a glicosúria. Esse mecanismo farmacológico confirma a função fisiológica do SGLT2, mas o uso clínico exige avaliação de indicações, função renal e riscos.\u003c/p>\u003c/article>\u003c/div>\u003c/section>\u003csection id=\"glicolise\" class=\"section\" data-group=\"carboidratos\">\u003cdiv class=\"container\">\u003cdiv class=\"chapter-title\">\u003cspan class=\"chap-icon\">⚙️\u003c/span>Glicólise: visão geral e balanço energético\u003c/div>\u003cp class=\"section-lead\">A glicólise ocorre no citosol de todas as células e converte uma glicose de 6 carbonos em dois piruvatos de 3 carbonos. Ela não usa oxigênio diretamente; “aeróbica” ou “anaeróbica” descreve o destino do NADH e do piruvato.\u003c/p>\u003cdiv class=\"pathway\">\u003cdiv class=\"path-node\">\u003cstrong>C₆H₁₂O₆\u003c/strong>\u003csmall>glicose; 6C\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>2 trioses-fosfato\u003c/strong>\u003csmall>duas moléculas de 3C\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>2 piruvatos\u003c/strong>\u003csmall>3C cada\u003c/small>\u003c/div>\u003c/div>\u003cp class=\"path-caption\">Fase de investimento: −2 ATP. Fase de retorno: +4 ATP e +2 NADH. Saldo: +2 ATP e +2 NADH.\u003c/p>\u003carticle class=\"reaction-card\">\u003cspan>Equação líquida\u003c/span>\u003cdiv class=\"reaction-formula\">Glicose + 2 ADP + 2 Pᵢ + 2 NAD⁺ → 2 piruvatos + 2 ATP + 2 NADH + 2 H⁺ + 2 H₂O\u003c/div>\u003cp>Pᵢ = fosfato inorgânico; NAD⁺ recebe elétrons e se reduz a NADH.\u003c/p>\u003c/article>\u003cdiv class=\"table-wrap\">\u003ctable class=\"compare-table\">\u003cthead>\u003ctr>\u003cth>Fase\u003c/th>\u003cth>Reações\u003c/th>\u003cth>O que ocorre\u003c/th>\u003cth>Balanço por glicose\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Investimento\u003c/td>\u003ctd>1–5\u003c/td>\u003ctd>Fosforilação, isomerização e clivagem em duas trioses.\u003c/td>\u003ctd>Consome 2 ATP.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Retorno\u003c/td>\u003ctd>6–10\u003c/td>\u003ctd>Oxidação do G3P e fosforilações em nível de substrato.\u003c/td>\u003ctd>Produz 4 ATP e 2 NADH.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Saldo\u003c/td>\u003ctd>Total\u003c/td>\u003ctd>Glicose vira 2 piruvatos.\u003c/td>\u003ctd>2 ATP líquidos + 2 NADH.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003carticle class=\"info-block success\">\u003cdiv class=\"label\">Três finalidades\u003c/div>\u003ch4>A glicólise não serve apenas para ATP\u003c/h4>\u003cul>\u003cli>Produzir ATP rapidamente por fosforilação em nível de substrato.\u003c/li>\u003cli>Formar NADH, que pode fornecer elétrons à cadeia respiratória quando há mitocôndria e oxigênio.\u003c/li>\u003cli>Gerar intermediários para síntese: G6P, DHAP, 3-fosfoglicerato, piruvato e acetil-CoA.\u003c/li>\u003c/ul>\u003c/article>\u003carticle class=\"info-block purple\">\u003cdiv class=\"label\">Regulação\u003c/div>\u003ch4>As três reações irreversíveis\u003c/h4>\u003cp>\u003cstrong>Hexoquinase/glicoquinase\u003c/strong> (reação 1), \u003cstrong>fosfofrutoquinase-1 — PFK-1\u003c/strong> (reação 3) e \u003cstrong>piruvato-quinase\u003c/strong> (reação 10). A PFK-1 é o principal ponto comprometedor da glicólise.\u003c/p>\u003c/article>\u003c/div>\u003c/section>\u003csection id=\"glicolise_passos\" class=\"section\" data-group=\"carboidratos\">\u003cdiv class=\"container\">\u003cdiv class=\"chapter-title\">\u003cspan class=\"chap-icon\">🧬\u003c/span>As dez reações da glicólise, uma a uma\u003c/div>\u003cp class=\"section-lead\">Em vez de decorar uma lista, acompanhe quatro perguntas: qual carbono mudou, houve gasto ou produção de ATP, houve oxidação e a reação é reversível?\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable class=\"compare-table\">\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Reação e enzima\u003c/th>\u003cth>O que você deve entender\u003c/th>\u003cth>Energia/regulação\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Glicose → glicose-6-fosfato (G6P) — hexoquinase ou glicoquinase\u003c/td>\u003ctd>O fosfato “aprisiona” a glicose na célula.\u003c/td>\u003ctd>Consome ATP; irreversível. Hexoquinase é inibida por G6P.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>G6P → frutose-6-fosfato (F6P) — fosfoglicose-isomerase\u003c/td>\u003ctd>Aldose vira cetose para permitir clivagem simétrica.\u003c/td>\u003ctd>Reversível.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>F6P → frutose-1,6-bisfosfato (F1,6BP) — PFK-1\u003c/td>\u003ctd>Passo comprometedor: a molécula entra efetivamente na glicólise.\u003c/td>\u003ctd>Consome ATP; irreversível; AMP e F2,6BP ativam; ATP e citrato inibem.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>F1,6BP → gliceraldeído-3-fosfato (G3P) + DHAP — aldolase\u003c/td>\u003ctd>Uma hexose é dividida em duas trioses.\u003c/td>\u003ctd>Reversível.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>DHAP → G3P — triose-fosfato-isomerase\u003c/td>\u003ctd>Somente G3P segue diretamente; agora há 2 G3P.\u003c/td>\u003ctd>Reversível.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>G3P → 1,3-bisfosfoglicerato (1,3-BPG) — G3P-desidrogenase\u003c/td>\u003ctd>Oxida o aldeído e captura energia em NADH e ligação fosfato rica em energia.\u003c/td>\u003ctd>Forma 2 NADH por glicose; reversível.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7\u003c/td>\u003ctd>1,3-BPG → 3-fosfoglicerato (3-PG) — fosfoglicerato-quinase\u003c/td>\u003ctd>Primeira fosforilação em nível de substrato.\u003c/td>\u003ctd>Forma 2 ATP; reversível.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8\u003c/td>\u003ctd>3-PG → 2-fosfoglicerato (2-PG) — fosfoglicerato-mutase\u003c/td>\u003ctd>Reposiciona o fosfato.\u003c/td>\u003ctd>Reversível.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>9\u003c/td>\u003ctd>2-PG → fosfoenolpiruvato (PEP) — enolase\u003c/td>\u003ctd>Remove H₂O (água) e cria PEP de alta energia.\u003c/td>\u003ctd>Reversível; enolase é inibida por fluoreto.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>PEP → piruvato — piruvato-quinase\u003c/td>\u003ctd>Segunda fosforilação em nível de substrato.\u003c/td>\u003ctd>Forma 2 ATP; irreversível; F1,6BP ativa por feed-forward.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003carticle class=\"info-block success\">\u003cdiv class=\"label\">Mnemônico conceitual\u003c/div>\u003ch4>Invista, divida, oxide, recupere\u003c/h4>\u003cp>\u003cstrong>1 e 3 gastam ATP\u003c/strong>; \u003cstrong>4 divide\u003c/strong>; \u003cstrong>6 produz NADH\u003c/strong>; \u003cstrong>7 e 10 produzem ATP\u003c/strong>. Como tudo após a clivagem ocorre duas vezes, cada reação da fase de retorno tem rendimento dobrado.\u003c/p>\u003c/article>\u003carticle class=\"info-block warn\">\u003cdiv class=\"label\">Fígado versus músculo\u003c/div>\u003ch4>O controle hormonal não é idêntico\u003c/h4>\u003cul>\u003cli>No fígado, insulina favorece glicólise e glicogênese; glucagon reduz glicólise e favorece gliconeogênese.\u003c/li>\u003cli>No músculo esquelético, glucagon tem pouco ou nenhum efeito direto relevante; adrenalina, Ca²⁺, AMP e demanda energética são mais importantes.\u003c/li>\u003cli>A glicoquinase hepática tem alto Kₘ/alta capacidade e não é inibida por G6P; a hexoquinase tem alta afinidade e é inibida por G6P.\u003c/li>\u003c/ul>\u003c/article>\u003c/div>\u003c/section>\u003csection id=\"piruvato\" class=\"section\" data-group=\"carboidratos\">\u003cdiv class=\"container\">\u003cdiv class=\"chapter-title\">\u003cspan class=\"chap-icon\">🔀\u003c/span>Destinos do piruvato e fermentações\u003c/div>\u003cp class=\"section-lead\">O destino do piruvato depende da disponibilidade de oxigênio, da presença de mitocôndrias, do estado redox NADH/NAD⁺ e das necessidades biossintéticas.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable class=\"compare-table\">\u003cthead>\u003ctr>\u003cth>Destino\u003c/th>\u003cth>Reação\u003c/th>\u003cth>Onde/por quê\u003c/th>\u003cth>Consequência\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Acetil-CoA\u003c/td>\u003ctd>Piruvato + CoA + NAD⁺ → acetil-CoA + CO₂ + NADH\u003c/td>\u003ctd>Matriz mitocondrial; complexo piruvato-desidrogenase.\u003c/td>\u003ctd>Entra no ciclo do ácido cítrico; reação irreversível.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Lactato\u003c/td>\u003ctd>Piruvato + NADH + H⁺ ⇌ lactato + NAD⁺\u003c/td>\u003ctd>Hemácias e músculo com glicólise rápida; lactato-desidrogenase.\u003c/td>\u003ctd>Regenera NAD⁺ para manter a reação 6 da glicólise.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Oxaloacetato\u003c/td>\u003ctd>Piruvato + CO₂ + ATP → oxaloacetato\u003c/td>\u003ctd>Mitocôndria; piruvato-carboxilase com biotina.\u003c/td>\u003ctd>Gliconeogênese e reposição do ciclo de Krebs.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Alanina\u003c/td>\u003ctd>Piruvato + glutamato ⇌ alanina + α-cetoglutarato\u003c/td>\u003ctd>Músculo/fígado; alanina-aminotransferase.\u003c/td>\u003ctd>Transporta carbono e nitrogênio no ciclo glicose-alanina.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Etanol + CO₂\u003c/td>\u003ctd>Piruvato → acetaldeído → etanol\u003c/td>\u003ctd>Leveduras e alguns microrganismos; não é via humana.\u003c/td>\u003ctd>Regenera NAD⁺; acetaldeído é o intermediário.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003carticle class=\"reaction-card\">\u003cspan>Fermentação lática\u003c/span>\u003cdiv class=\"reaction-formula\">C₆H₁₂O₆ (glicose) + 2 ADP + 2 Pᵢ → 2 C₃H₆O₃ (lactato) + 2 ATP + 2 H₂O\u003c/div>\u003cp>O NADH formado na glicólise é consumido ao reduzir piruvato; por isso o saldo líquido de NADH é zero.\u003c/p>\u003c/article>\u003carticle class=\"reaction-card\">\u003cspan>Fermentação alcoólica\u003c/span>\u003cdiv class=\"reaction-formula\">C₆H₁₂O₆ (glicose) → 2 C₂H₅OH (etanol) + 2 CO₂ (dióxido de carbono) + 2 ATP\u003c/div>\u003cp>Piruvato-descarboxilase forma acetaldeído; álcool-desidrogenase forma etanol e regenera NAD⁺.\u003c/p>\u003c/article>\u003carticle class=\"info-block danger\">\u003cdiv class=\"label\">Correção importante\u003c/div>\u003ch4>Lactato não é simplesmente “o ácido da fadiga”\u003c/h4>\u003cp>A acidose do exercício decorre principalmente da elevada hidrólise de ATP e do balanço de H⁺; a formação de lactato consome H⁺ e ajuda a manter a glicólise. Lactato é combustível e sinal metabólico, podendo ser oxidado por coração e músculo ou reciclado pelo fígado.\u003c/p>\u003c/article>\u003carticle class=\"info-block purple\">\u003cdiv class=\"label\">Acetil-CoA\u003c/div>\u003ch4>Do que é feita a coenzima A?\u003c/h4>\u003cp>A coenzima A deriva de \u003cstrong>adenosina-3′,5′-difosfato\u003c/strong>, \u003cstrong>ácido pantotênico (vitamina B5)\u003c/strong> e \u003cstrong>β-mercaptoetilamina\u003c/strong>. Seu grupo sulfídrila forma tioésteres de alta energia, como a acetil-CoA.\u003c/p>\u003c/article>\u003c/div>\u003c/section>\u003csection id=\"glicogenio\" class=\"section\" data-group=\"carboidratos\">\u003cdiv class=\"container\">\u003cdiv class=\"unit-banner part-two\">\u003cspan>PARTE 2\u003c/span>\u003cstrong>Armazenamento, mobilização e produção de glicose\u003c/strong>\u003cp>Glicogênio, glicogênese, glicogenólise, gliconeogênese e integração clínica.\u003c/p>\u003c/div>\u003cdiv class=\"chapter-title\">\u003cspan class=\"chap-icon\">🌳\u003c/span>Glicogênio: a reserva ramificada de glicose\u003c/div>\u003cp class=\"section-lead\">Glicogênio é um polímero citosólico de glicose muito ramificado. As ramificações aumentam a solubilidade e criam muitas extremidades não redutoras, permitindo síntese e degradação rápidas.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable class=\"compare-table\">\u003cthead>\u003ctr>\u003cth>Elemento estrutural\u003c/th>\u003cth>Ligação/função\u003c/th>\u003cth>Por que importa\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Cadeia linear\u003c/td>\u003ctd>Resíduos de glicose unidos por ligações glicosídicas α-1,4.\u003c/td>\u003ctd>Glicogênio-sintase alonga; glicogênio-fosforilase degrada.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ramificação\u003c/td>\u003ctd>Ligação α-1,6 aproximadamente a cada 8–12 resíduos.\u003c/td>\u003ctd>Múltiplas extremidades aceleram mobilização e armazenamento.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Centro\u003c/td>\u003ctd>Glicogenina ligada à extremidade redutora.\u003c/td>\u003ctd>Autoglicosila-se e cria o primer inicial.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Grânulo\u003c/td>\u003ctd>Glicogênio + enzimas reguladoras no citosol.\u003c/td>\u003ctd>Organiza síntese, degradação e sinalização.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"table-wrap\">\u003ctable class=\"compare-table\">\u003cthead>\u003ctr>\u003cth>Reserva\u003c/th>\u003cth>Objetivo\u003c/th>\u003cth>Pode elevar a glicemia?\u003c/th>\u003cth>Regulação principal\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Hepática\u003c/td>\u003ctd>Manter glicemia entre refeições e no início do jejum.\u003c/td>\u003ctd>Sim: possui glicose-6-fosfatase.\u003c/td>\u003ctd>Insulina, glucagon e adrenalina.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Muscular\u003c/td>\u003ctd>Produzir ATP para a própria contração.\u003c/td>\u003ctd>Não: falta glicose-6-fosfatase.\u003c/td>\u003ctd>Adrenalina, Ca²⁺, AMP e estado energético.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003carticle class=\"info-block success\">\u003cdiv class=\"label\">Números úteis\u003c/div>\u003ch4>Quantidade varia com alimentação e treino\u003c/h4>\u003cp>Um adulto pode armazenar aproximadamente 80–120 g no fígado e 300–500 g no músculo, mas a massa muscular total faz a reserva muscular ser maior. O fígado tem maior concentração percentual; o músculo guarda combustível para uso local.\u003c/p>\u003c/article>\u003carticle class=\"info-block purple\">\u003cdiv class=\"label\">Imagem mental\u003c/div>\u003ch4>Uma árvore com muitas pontas\u003c/h4>\u003cp>A glicogenina é o tronco; as ligações α-1,4 formam os galhos; as ligações α-1,6 criam bifurcações. Glicogênio-sintase e fosforilase trabalham nas pontas, nunca no centro.\u003c/p>\u003c/article>\u003c/div>\u003c/section>\u003csection id=\"glicogenese\" class=\"section\" data-group=\"carboidratos\">\u003cdiv class=\"container\">\u003cdiv class=\"chapter-title\">\u003cspan class=\"chap-icon\">📦\u003c/span>Glicogênese passo a passo\u003c/div>\u003cp class=\"section-lead\">Glicogênese ocorre quando há glicose e energia disponíveis. O fígado armazena para o organismo; o músculo armazena para si.\u003c/p>\u003cdiv class=\"pathway\">\u003cdiv class=\"path-node\">\u003cstrong>Glicose\u003c/strong>\u003csmall>GLUT2 no fígado; GLUT4 no músculo\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>Glicose-6-fosfato\u003c/strong>\u003csmall>glicoquinase/hexoquinase + ATP\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>Glicose-1-fosfato\u003c/strong>\u003csmall>fosfoglucomutase\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>UDP-glicose\u003c/strong>\u003csmall>UDP-glicose pirofosforilase + UTP\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>Primer\u003c/strong>\u003csmall>glicogenina\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>Glicogênio\u003c/strong>\u003csmall>sintase α-1,4 + ramificadora α-1,6\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"table-wrap\">\u003ctable class=\"compare-table\">\u003cthead>\u003ctr>\u003cth>Etapa\u003c/th>\u003cth>Enzima\u003c/th>\u003cth>Reação/explicação\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1. Fosforilar\u003c/td>\u003ctd>Glicoquinase hepática ou hexoquinase muscular\u003c/td>\u003ctd>Glicose + ATP → G6P + ADP. Mg²⁺ estabiliza os fosfatos.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2. Reposicionar\u003c/td>\u003ctd>Fosfoglucomutase\u003c/td>\u003ctd>G6P ⇌ G1P por intermediário glicose-1,6-bisfosfato.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3. Ativar\u003c/td>\u003ctd>UDP-glicose pirofosforilase\u003c/td>\u003ctd>G1P + UTP → UDP-glicose + PPᵢ; hidrólise do PPᵢ impulsiona a reação.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4. Iniciar\u003c/td>\u003ctd>Glicogenina\u003c/td>\u003ctd>Autoglicosilação de tirosina; forma um primer curto.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5. Alongar\u003c/td>\u003ctd>Glicogênio-sintase\u003c/td>\u003ctd>Transfere glicose da UDP-glicose à extremidade não redutora em α-1,4.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6. Ramificar\u003c/td>\u003ctd>Enzima ramificadora\u003c/td>\u003ctd>Transfere um segmento e cria ligação α-1,6.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003carticle class=\"reaction-card\">\u003cspan>Custo de ativação\u003c/span>\u003cdiv class=\"reaction-formula\">G1P + UTP → UDP-glicose + PPᵢ\u003c/div>\u003cp>Cada glicose incorporada consome um equivalente de UTP; UDP é reconvertido em UTP à custa de ATP.\u003c/p>\u003c/article>\u003carticle class=\"info-block success\">\u003cdiv class=\"label\">Enzima reguladora\u003c/div>\u003ch4>Glicogênio-sintase é ativa desfosforilada\u003c/h4>\u003cp>A insulina ativa a proteína-fosfatase 1 e a via Akt, favorecendo desfosforilação e síntese. Glucagon no fígado e adrenalina elevam cAMP/PKA, promovendo fosforilação e inibição da sintase.\u003c/p>\u003c/article>\u003carticle class=\"info-block warn\">\u003cdiv class=\"label\">Detalhe de prova\u003c/div>\u003ch4>Glicogenina inicia; glicogênio-sintase alonga\u003c/h4>\u003cp>A sintase não começa uma molécula do zero. Sem primer, falta a extremidade aceitora para a glicose da UDP-glicose.\u003c/p>\u003c/article>\u003c/div>\u003c/section>\u003csection id=\"glicogenolise\" class=\"section\" data-group=\"carboidratos\">\u003cdiv class=\"container\">\u003cdiv class=\"chapter-title\">\u003cspan class=\"chap-icon\">✂️\u003c/span>Glicogenólise passo a passo\u003c/div>\u003cp class=\"section-lead\">A glicogenólise remove glicoses das extremidades não redutoras. A maior parte sai como glicose-1-fosfato; somente o resíduo da ligação α-1,6 sai como glicose livre.\u003c/p>\u003cdiv class=\"pathway\">\u003cdiv class=\"path-node\">\u003cstrong>Glicogênio\u003c/strong>\u003csmall>muitas extremidades\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>Glicose-1-fosfato\u003c/strong>\u003csmall>glicogênio-fosforilase; α-1,4\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>Glicose-6-fosfato\u003c/strong>\u003csmall>fosfoglucomutase\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>ATP ou glicose sanguínea\u003c/strong>\u003csmall>músculo ou fígado\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"table-wrap\">\u003ctable class=\"compare-table\">\u003cthead>\u003ctr>\u003cth>Problema\u003c/th>\u003cth>Enzima/atividade\u003c/th>\u003cth>Resultado\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Cadeia α-1,4\u003c/td>\u003ctd>Glicogênio-fosforilase + fosfato inorgânico\u003c/td>\u003ctd>G1P; para quatro resíduos antes da ramificação.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Limite de ramificação\u003c/td>\u003ctd>Atividade 4-α-glucanotransferase da enzima desramificadora\u003c/td>\u003ctd>Move três resíduos para outra cadeia.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ligação α-1,6\u003c/td>\u003ctd>Atividade α-1,6-glicosidase da enzima desramificadora\u003c/td>\u003ctd>Libera uma glicose livre por hidrólise.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>G1P formada\u003c/td>\u003ctd>Fosfoglucomutase\u003c/td>\u003ctd>G1P ⇌ G6P.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>G6P hepática\u003c/td>\u003ctd>Glicose-6-fosfatase no retículo endoplasmático\u003c/td>\u003ctd>Glicose livre + Pᵢ, permitindo exportação.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>G6P muscular\u003c/td>\u003ctd>Glicólise\u003c/td>\u003ctd>Produz ATP local; músculo não exporta glicose.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003carticle class=\"info-block purple\">\u003cdiv class=\"label\">Regulação\u003c/div>\u003ch4>Fosforilase é ativa fosforilada\u003c/h4>\u003cul>\u003cli>Glucagon no fígado: receptor Gs → adenilato-ciclase → cAMP → PKA → fosforilase-quinase → glicogênio-fosforilase a.\u003c/li>\u003cli>Adrenalina: ativa a cascata no fígado e músculo.\u003c/li>\u003cli>Contração muscular: Ca²⁺ liga-se à calmodulina da fosforilase-quinase; AMP ativa alostericamente a fosforilase muscular.\u003c/li>\u003cli>Insulina ativa fosfatases e favorece o sentido oposto.\u003c/li>\u003c/ul>\u003c/article>\u003carticle class=\"info-block success\">\u003cdiv class=\"label\">Economia muscular\u003c/div>\u003ch4>Glicogênio rende um ATP a mais\u003c/h4>\u003cp>A glicose do glicogênio entra como G6P sem consumir ATP na hexoquinase. Na glicólise anaeróbica muscular, o saldo por resíduo de glicogênio é 3 ATP, contra 2 ATP por glicose livre.\u003c/p>\u003c/article>\u003c/div>\u003c/section>\u003csection id=\"g6p\" class=\"section\" data-group=\"carboidratos\">\u003cdiv class=\"container\">\u003cdiv class=\"chapter-title\">\u003cspan class=\"chap-icon\">🛣️\u003c/span>Destinos da G6P e gliconeogênese\u003c/div>\u003cp class=\"section-lead\">Glicose-6-fosfato (G6P) é uma encruzilhada. O destino depende do tecido, estado hormonal, energia e necessidade de poder redutor ou ribose.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable class=\"compare-table\">\u003cthead>\u003ctr>\u003cth>Destino da G6P\u003c/th>\u003cth>Quando predomina\u003c/th>\u003cth>Produto/função\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Glicólise\u003c/td>\u003ctd>Demanda de ATP ou intermediários\u003c/td>\u003ctd>Piruvato, ATP e NADH.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Glicogênese\u003c/td>\u003ctd>Estado alimentado e reserva disponível\u003c/td>\u003ctd>Glicogênio.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Via das pentoses-fosfato\u003c/td>\u003ctd>Necessidade de NADPH/ribose\u003c/td>\u003ctd>NADPH, ribose-5-fosfato e CO₂.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Glicose livre\u003c/td>\u003ctd>Fígado, rim e intestino com glicose-6-fosfatase\u003c/td>\u003ctd>Manutenção da glicemia.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003carticle class=\"info-block purple\">\u003cdiv class=\"label\">Conceito\u003c/div>\u003ch4>Gliconeogênese não é o reverso simples da glicólise\u003c/h4>\u003cp>Sete reações reversíveis podem ser compartilhadas, mas as três irreversíveis precisam de desvios próprios. O processo ocorre principalmente no fígado e, no jejum prolongado, também no córtex renal.\u003c/p>\u003c/article>\u003cdiv class=\"table-wrap\">\u003ctable class=\"compare-table\">\u003cthead>\u003ctr>\u003cth>Desvio\u003c/th>\u003cth>Enzimas gliconeogênicas\u003c/th>\u003cth>Substitui\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Piruvato → oxaloacetato → PEP\u003c/td>\u003ctd>Piruvato-carboxilase + PEP-carboxiquinase (PEPCK)\u003c/td>\u003ctd>Piruvato-quinase.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>F1,6BP → F6P\u003c/td>\u003ctd>Frutose-1,6-bisfosfatase\u003c/td>\u003ctd>PFK-1.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>G6P → glicose\u003c/td>\u003ctd>Glicose-6-fosfatase\u003c/td>\u003ctd>Hexoquinase/glicoquinase.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"table-wrap\">\u003ctable class=\"compare-table\">\u003cthead>\u003ctr>\u003cth>Precursor\u003c/th>\u003cth>Origem\u003c/th>\u003cth>Entrada na via\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Lactato\u003c/td>\u003ctd>Hemácias e músculo em glicólise acelerada\u003c/td>\u003ctd>Lactato → piruvato por LDH; Ciclo de Cori.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Alanina e outros aminoácidos glicogênicos\u003c/td>\u003ctd>Proteína muscular/dieta\u003c/td>\u003ctd>Alanina → piruvato; outros formam intermediários do ciclo de Krebs.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Glicerol\u003c/td>\u003ctd>Lipólise de triacilgliceróis\u003c/td>\u003ctd>Glicerol → glicerol-3-P → DHAP.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Propionato\u003c/td>\u003ctd>Oxidação de ácidos graxos de cadeia ímpar\u003c/td>\u003ctd>Propionil-CoA → succinil-CoA.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003carticle class=\"reaction-card\">\u003cspan>Custo da gliconeogênese\u003c/span>\u003cdiv class=\"reaction-formula\">2 piruvatos + 4 ATP + 2 GTP + 2 NADH → 1 glicose\u003c/div>\u003cp>São consumidos seis equivalentes de fosfato de alta energia por glicose.\u003c/p>\u003c/article>\u003carticle class=\"info-block danger\">\u003cdiv class=\"label\">Armadilha\u003c/div>\u003ch4>Ácidos graxos de cadeia par não geram glicose líquida\u003c/h4>\u003cp>Acetil-CoA não retorna a piruvato e seus carbonos são perdidos como CO₂ no ciclo de Krebs. O \u003cstrong>glicerol\u003c/strong> do triacilglicerol é glicogênico; ácidos graxos de cadeia ímpar também podem contribuir via propionil-CoA.\u003c/p>\u003c/article>\u003c/div>\u003c/section>\u003csection id=\"vongierke\" class=\"section\" data-group=\"carboidratos\">\u003cdiv class=\"container\">\u003cdiv class=\"chapter-title\">\u003cspan class=\"chap-icon\">🩺\u003c/span>Doença de Von Gierke (glicogenose tipo I)\u003c/div>\u003cp class=\"section-lead\">A deficiência do sistema glicose-6-fosfatase impede que o fígado libere glicose produzida por glicogenólise e gliconeogênese. O problema final é “G6P não consegue virar glicose livre”.\u003c/p>\u003cdiv class=\"pathway\">\u003cdiv class=\"path-node\">\u003cstrong>Glicogênio/lactato/alanina\u003c/strong>\u003csmall>fontes de carbono\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>Glicose-6-fosfato\u003c/strong>\u003csmall>fica presa na célula\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>Sem glicose livre\u003c/strong>\u003csmall>hipoglicemia de jejum\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>Desvios metabólicos\u003c/strong>\u003csmall>lactato, lipídios e ácido úrico ↑\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"table-wrap\">\u003ctable class=\"compare-table\">\u003cthead>\u003ctr>\u003cth>Achado\u003c/th>\u003cth>Mecanismo\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Hipoglicemia grave no jejum\u003c/td>\u003ctd>Fígado não completa glicogenólise nem gliconeogênese.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hepatomegalia/renomegalia\u003c/td>\u003ctd>Acúmulo de glicogênio e gordura.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Acidose láctica\u003c/td>\u003ctd>G6P é desviada para glicólise; lactato não é convertido efetivamente em glicose.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hiperuricemia\u003c/td>\u003ctd>Lactato compete pela excreção renal e o metabolismo de purinas aumenta.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hipertrigliceridemia\u003c/td>\u003ctd>Excesso de carbono e insulina favorecem lipogênese/VLDL.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fácies arredondada e abdome protuberante\u003c/td>\u003ctd>Hepatomegalia com membros relativamente delgados.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003carticle class=\"info-block purple\">\u003cdiv class=\"label\">Subtipos\u003c/div>\u003ch4>Ia versus Ib\u003c/h4>\u003cp>\u003cstrong>Tipo Ia:\u003c/strong> deficiência catalítica da glicose-6-fosfatase (G6PC). \u003cstrong>Tipo Ib:\u003c/strong> defeito do transportador de G6P do retículo endoplasmático (SLC37A4), frequentemente com neutropenia e infecções recorrentes.\u003c/p>\u003c/article>\u003carticle class=\"info-block warn\">\u003cdiv class=\"label\">Tratamento conceitual\u003c/div>\u003ch4>Evitar o jejum\u003c/h4>\u003cp>O manejo nutricional busca fornecimento frequente e lento de glicose, por exemplo com amido de milho cru conforme protocolo especializado. Frutose e galactose podem agravar acúmulo de G6P e precisam de orientação específica.\u003c/p>\u003c/article>\u003c/div>\u003c/section>\u003csection id=\"pentoses\" class=\"section\" data-group=\"pentoses\">\u003cdiv class=\"container\">\u003cdiv class=\"chapter-title\">\u003cspan class=\"chap-icon\">🛡️\u003c/span>Via das pentoses-fosfato\u003c/div>\u003cp class=\"section-lead\">Também chamada via da hexose-monofosfato ou shunt das pentoses, ocorre no citosol. Não produz nem consome ATP diretamente: produz NADPH, ribose-5-fosfato e intermediários que conversam com a glicólise.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable class=\"compare-table\">\u003cthead>\u003ctr>\u003cth>Necessidade celular\u003c/th>\u003cth>Estratégia da via\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Mais ribose-5-P que NADPH\u003c/td>\u003ctd>Reações não oxidativas funcionam “ao contrário”, usando F6P e G3P para formar ribose.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ribose-5-P e NADPH equilibrados\u003c/td>\u003ctd>Fase oxidativa fornece ambos.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Mais NADPH que ribose\u003c/td>\u003ctd>Pentoses retornam a F6P/G3P, regeneram G6P e repetem a fase oxidativa.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>NADPH e ATP\u003c/td>\u003ctd>Fase oxidativa gera NADPH; carbonos retornam à glicólise para gerar ATP.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003carticle class=\"info-block success\">\u003cdiv class=\"label\">Fase oxidativa\u003c/div>\u003ch4>Irreversível: 3 reações\u003c/h4>\u003cdiv class=\"pathway\">\u003cdiv class=\"path-node\">\u003cstrong>G6P\u003c/strong>\u003csmall>6 carbonos\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>6-fosfogluconolactona\u003c/strong>\u003csmall>G6PD; NADPH 1\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>6-fosfogluconato\u003c/strong>\u003csmall>lactonase + H₂O\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>Ribulose-5-P\u003c/strong>\u003csmall>6-P-gluconato-DH; NADPH 2 + CO₂\u003c/small>\u003c/div>\u003c/div>\u003carticle class=\"reaction-card\">\u003cspan>Saldo por G6P\u003c/span>\u003cdiv class=\"reaction-formula\">G6P + 2 NADP⁺ + H₂O → ribulose-5-P + 2 NADPH + 2 H⁺ + CO₂\u003c/div>\u003cp>A G6PD é a etapa limitante e responde à relação NADP⁺/NADPH.\u003c/p>\u003c/article>\u003c/article>\u003carticle class=\"info-block purple\">\u003cdiv class=\"label\">Fase não oxidativa\u003c/div>\u003ch4>Reversível: reorganiza carbonos\u003c/h4>\u003cul>\u003cli>Ribulose-5-P → ribose-5-P por fosfopentose-isomerase; ribose entra em nucleotídeos.\u003c/li>\u003cli>Ribulose-5-P → xilulose-5-P por fosfopentose-epimerase.\u003c/li>\u003cli>\u003cstrong>Transcetolase\u003c/strong> transfere 2 carbonos e requer TPP (pirofosfato de tiamina, vitamina B1) e Mg²⁺.\u003c/li>\u003cli>\u003cstrong>Transaldolase\u003c/strong> transfere 3 carbonos.\u003c/li>\u003cli>Produtos finais podem incluir frutose-6-P e gliceraldeído-3-P, que entram na glicólise/gliconeogênese.\u003c/li>\u003c/ul>\u003c/article>\u003cdiv class=\"table-wrap\">\u003ctable class=\"compare-table\">\u003cthead>\u003ctr>\u003cth>Onde é muito ativa?\u003c/th>\u003cth>Por quê?\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Fígado, tecido adiposo e glândula mamária em lactação\u003c/td>\u003ctd>NADPH para síntese de ácidos graxos.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Córtex adrenal, gônadas e placenta\u003c/td>\u003ctd>NADPH para síntese de esteroides.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hemácias\u003c/td>\u003ctd>NADPH para manter glutationa reduzida.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Células em proliferação\u003c/td>\u003ctd>Ribose-5-P para nucleotídeos e NADPH para biossíntese.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fagócitos\u003c/td>\u003ctd>NADPH oxidase para explosão respiratória microbicida.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\u003c/section>\u003csection id=\"g6pd\" class=\"section\" data-group=\"pentoses\">\u003cdiv class=\"container\">\u003cdiv class=\"chapter-title\">\u003cspan class=\"chap-icon\">🩸\u003c/span>Deficiência de G6PD e anemia hemolítica\u003c/div>\u003cp class=\"section-lead\">A hemácia não possui mitocôndria; sua principal fonte de NADPH é a via das pentoses. Sem NADPH suficiente, a glutationa não neutraliza peróxidos e proteínas da hemoglobina oxidam.\u003c/p>\u003cdiv class=\"pathway\">\u003cdiv class=\"path-node\">\u003cstrong>G6PD\u003c/strong>\u003csmall>produz NADPH\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>Glutationa redutase\u003c/strong>\u003csmall>GSSG → 2 GSH\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>Glutationa peroxidase\u003c/strong>\u003csmall>H₂O₂ → H₂O\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>Membrana/Hb protegidas\u003c/strong>\u003csmall>evita hemólise\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"table-wrap\">\u003ctable class=\"compare-table\">\u003cthead>\u003ctr>\u003cth>Conceito\u003c/th>\u003cth>Explicação\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Herança\u003c/td>\u003ctd>Ligada ao X; homens hemizigotos tendem a manifestar, mulheres variam pela inativação do X.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Gatilhos\u003c/td>\u003ctd>Infecções, fava, naftalina e fármacos oxidantes como primaquina, dapsona e algumas sulfonamidas.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Clínica\u003c/td>\u003ctd>Icterícia, palidez, fadiga, urina escura e queda de hemoglobina após estresse oxidativo.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Esfregaço\u003c/td>\u003ctd>Corpúsculos de Heinz representam Hb desnaturada; “bite cells” surgem quando o baço remove esses corpúsculos.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Diagnóstico\u003c/td>\u003ctd>Atividade enzimática quantitativa; durante crise, reticulócitos jovens podem produzir falso-normal.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tratamento\u003c/td>\u003ctd>Suspender gatilho, tratar infecção e oferecer suporte; casos graves podem exigir transfusão.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003carticle class=\"info-block danger\">\u003cdiv class=\"label\">Ponto essencial\u003c/div>\u003ch4>Hemólise é de glóbulos vermelhos, não brancos\u003c/h4>\u003cp>A deficiência de G6PD provoca lesão oxidativa principalmente em \u003cstrong>eritrócitos/hemácias\u003c/strong>. Leucócitos têm mitocôndrias e outras fontes de NADPH.\u003c/p>\u003c/article>\u003carticle class=\"info-block warn\">\u003cdiv class=\"label\">Medicamentos\u003c/div>\u003ch4>Não transforme listas em proibição universal\u003c/h4>\u003cp>O risco depende da variante, dose e estado clínico. Primaquina e dapsona são gatilhos clássicos; para outros fármacos, consulte lista farmacogenética atual e avalie risco individual.\u003c/p>\u003c/article>\u003c/div>\u003c/section>\u003csection id=\"cori\" class=\"section\" data-group=\"cori\">\u003cdiv class=\"container\">\u003cdiv class=\"chapter-title\">\u003cspan class=\"chap-icon\">🔄\u003c/span>Ciclo de Cori: reciclagem de lactato\u003c/div>\u003cp class=\"section-lead\">O Ciclo de Cori transfere a carga metabólica da glicólise anaeróbica para o fígado. Músculo/hemácia ganham ATP rápido; fígado gasta energia para refazer glicose.\u003c/p>\u003cdiv class=\"pathway\">\u003cdiv class=\"path-node\">\u003cstrong>Músculo/hemácia\u003c/strong>\u003csmall>glicose → 2 lactatos; +2 ATP\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>Sangue\u003c/strong>\u003csmall>transporta lactato\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>Fígado\u003c/strong>\u003csmall>2 lactatos → 2 piruvatos → glicose; −6 ATP/GTP\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>Sangue\u003c/strong>\u003csmall>devolve glicose\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"table-wrap\">\u003ctable class=\"compare-table\">\u003cthead>\u003ctr>\u003cth>Local\u003c/th>\u003cth>Reação-chave\u003c/th>\u003cth>Cofator correto\u003c/th>\u003cth>Objetivo\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Músculo/hemácia\u003c/td>\u003ctd>Piruvato + NADH + H⁺ → lactato + NAD⁺\u003c/td>\u003ctd>NADH/NAD⁺, não NADPH\u003c/td>\u003ctd>Regenerar NAD⁺ e sustentar glicólise.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fígado\u003c/td>\u003ctd>Lactato + NAD⁺ → piruvato + NADH + H⁺\u003c/td>\u003ctd>NAD⁺/NADH\u003c/td>\u003ctd>Fornecer piruvato e NADH à gliconeogênese.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fígado\u003c/td>\u003ctd>2 piruvatos → glicose\u003c/td>\u003ctd>4 ATP + 2 GTP + 2 NADH\u003c/td>\u003ctd>Reciclar carbono e manter glicemia.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003carticle class=\"reaction-card\">\u003cspan>Balanço do organismo\u003c/span>\u003cdiv class=\"reaction-formula\">Músculo: +2 ATP; fígado: −6 equivalentes de ATP; custo líquido = 4\u003c/div>\u003cp>O ciclo desloca energia do fígado para tecidos que precisam de ATP rápido; não cria energia líquida.\u003c/p>\u003c/article>\u003carticle class=\"info-block purple\">\u003cdiv class=\"label\">Outros destinos\u003c/div>\u003ch4>Nem todo lactato vai ao fígado\u003c/h4>\u003cp>Coração e fibras musculares oxidativas podem captar lactato, convertê-lo em piruvato e oxidá-lo. O rim também participa da gliconeogênese, especialmente no jejum prolongado e na acidose.\u003c/p>\u003c/article>\u003carticle class=\"info-block danger\">\u003cdiv class=\"label\">Armadilha\u003c/div>\u003ch4>O lactato usa NADH, não NADPH\u003c/h4>\u003cp>\u003cstrong>LDH = lactato-desidrogenase\u003c/strong> trabalha com NADH/NAD⁺. NADPH pertence principalmente à biossíntese e defesa antioxidante da via das pentoses.\u003c/p>\u003c/article>\u003c/div>\u003c/section>\u003csection id=\"insulina\" class=\"section\" data-group=\"insulina\">\u003cdiv class=\"container\">\u003cdiv class=\"chapter-title\">\u003cspan class=\"chap-icon\">🔑\u003c/span>Insulina: estrutura, secreção e sinalização\u003c/div>\u003cp class=\"section-lead\">Insulina é a principal hormona anabólica do estado alimentado. Ela sinaliza abundância de combustível e direciona glicose, aminoácidos e ácidos graxos para uso e armazenamento.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable class=\"compare-table\">\u003cthead>\u003ctr>\u003cth>Estrutura/processamento\u003c/th>\u003cth>Detalhe\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Pré-pró-insulina\u003c/td>\u003ctd>Peptídeo sinal direciona a síntese ao retículo endoplasmático.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pró-insulina\u003c/td>\u003ctd>Cadeias A e B ainda unidas pelo peptídeo C; pontes dissulfeto são formadas.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Insulina madura\u003c/td>\u003ctd>51 aminoácidos: cadeia A com 21 e cadeia B com 30; duas pontes dissulfeto entre cadeias e uma na cadeia A.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Peptídeo C\u003c/td>\u003ctd>Liberado em quantidade equimolar à insulina endógena; ajuda a avaliar secreção própria.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"pathway\">\u003cdiv class=\"path-node\">\u003cstrong>Glicose na célula β\u003c/strong>\u003csmall>GLUT + glicoquinase\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>ATP/ADP ↑\u003c/strong>\u003csmall>metabolismo da glicose\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>Canal KATP fecha\u003c/strong>\u003csmall>despolarização\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>Canal Ca²⁺ abre\u003c/strong>\u003csmall>influxo de cálcio\u003c/small>\u003c/div>\u003cspan class=\"path-arrow\">→\u003c/span>\u003cdiv class=\"path-node\">\u003cstrong>Exocitose\u003c/strong>\u003csmall>insulina + peptídeo C\u003c/small>\u003c/div>\u003c/div>\u003cp class=\"path-caption\">Sulfonilureias fecham KATP farmacologicamente; incretinas amplificam secreção dependente de glicose.\u003c/p>\u003carticle class=\"info-block purple\">\u003cdiv class=\"label\">Receptor\u003c/div>\u003ch4>Uma tirosina-quinase\u003c/h4>\u003cp>Insulina liga-se ao receptor α₂β₂, ativa autofosforilação e proteínas IRS. A via PI3K–Akt promove translocação de GLUT4, síntese de glicogênio, lipogênese e síntese proteica. A via Ras–MAPK participa de crescimento e expressão gênica.\u003c/p>\u003c/article>\u003cdiv class=\"table-wrap\">\u003ctable class=\"compare-table\">\u003cthead>\u003ctr>\u003cth>Tecido\u003c/th>\u003cth>Efeito sobre carboidratos\u003c/th>\u003cth>Outros efeitos\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Fígado\u003c/td>\u003ctd>↑ glicoquinase, glicólise e glicogênese; ↓ glicogenólise e gliconeogênese\u003c/td>\u003ctd>↑ síntese de ácidos graxos/TAG; ↓ cetogênese. Captação hepática por GLUT2 não depende de GLUT4.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Músculo\u003c/td>\u003ctd>↑ GLUT4, glicólise e glicogênio\u003c/td>\u003ctd>↑ captação de aminoácidos e síntese proteica; ↓ proteólise.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tecido adiposo\u003c/td>\u003ctd>↑ GLUT4; fornece glicerol-3-P para TAG\u003c/td>\u003ctd>↑ lipoproteína-lipase adiposa e esterificação; ↓ lipase hormônio-sensível/lipólise.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003carticle class=\"info-block success\">\u003cdiv class=\"label\">Frase-chave\u003c/div>\u003ch4>Insulina é hipoglicemiante e anticatabólica\u003c/h4>\u003cp>Ela não apenas coloca glicose nas células: impede que fígado libere glicose, reduz lipólise/cetogênese e reduz proteólise. Sua ausência absoluta transforma o metabolismo em estado catabólico intenso.\u003c/p>\u003c/article>\u003c/div>\u003c/section>\u003csection id=\"diabetes\" class=\"section\" data-group=\"insulina\">\u003cdiv class=\"container\">\u003cdiv class=\"chapter-title\">\u003cspan class=\"chap-icon\">🧪\u003c/span>Diabetes mellitus: integração bioquímica e diagnóstico\u003c/div>\u003cp class=\"section-lead\">Diabetes é hiperglicemia crônica por deficiência de secreção de insulina, resistência à sua ação ou ambas. O tipo define o mecanismo e o tratamento; o diagnóstico usa critérios laboratoriais padronizados.\u003c/p>\u003cdiv class=\"table-wrap
