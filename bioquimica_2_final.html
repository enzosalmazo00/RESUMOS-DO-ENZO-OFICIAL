ge.setItem(STORAGE_KEY,JSON.stringify(records))}catch(_){showToast('Não foi possível salvar os grifos neste navegador.')}\n  }\n  function snapshot(){return records.map(r=>({...r}))}\n  function pushHistory(state=snapshot()){\n    history.push(state);\n    if(history.length>40)history.shift();\n    updateToolbar();\n  }\n  function makeId(){return `${Date.now().toString(36)}${Math.random().toString(36).slice(2,9)}`}\n  function hashText(text){\n    let h=2166136261;\n    for(let i=0;i\u003ctext.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619)}\n    return (h>>>0).toString(36);\n  }\n  function normalizedText(el){return (el.textContent||'').replace(/\\s+/g,' ').trim()}\n  function isAllowedTarget(el){\n    return !!(el&&normalizedText(el)&&!el.closest('#enzo-highlighter,.study-tools,.q-stats,nav,footer')&&!el.matches('button,input,select,textarea'));\n  }\n  function assignKeys(){\n    const occurrences=new Map();\n    document.querySelectorAll(TARGET_SELECTOR).forEach(el=>{\n      if(!isAllowedTarget(el)||el.dataset.enzoHlKey)return;\n      const section=el.closest('.section')?.id||'page';\n      const base=`${section}:${hashText(normalizedText(el))}`;\n      const occurrence=occurrences.get(base)||0;\n      occurrences.set(base,occurrence+1);\n      el.dataset.enzoHlKey=`${base}:${occurrence}`;\n    });\n  }\n  function textNodes(root){\n    const nodes=[];\n    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(node){\n      return node.nodeValue&&node.nodeValue.length?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;\n    }});\n    while(walker.nextNode())nodes.push(walker.currentNode);\n    return nodes;\n  }\n  function boundaryOffset(root,node,offset){\n    let total=0;\n    for(const text of textNodes(root)){\n      if(text===node)return total+Math.max(0,Math.min(offset,text.nodeValue.length));\n      total+=text.nodeValue.length;\n    }\n    try{\n      const probe=document.createRange();\n      probe.selectNodeContents(root);probe.setEnd(node,offset);\n      return probe.toString().length;\n    }catch(_){return total}\n  }\n  function withObserverPaused(fn){\n    if(observer)observer.disconnect();\n    try{return fn()}finally{if(observer)observeDynamicAreas()}\n  }\n  function wrapRecord(rec){\n    const root=document.querySelector(`[data-enzo-hl-key=\"${rec.key}\"]`);\n    if(!root)return false;\n    const full=root.textContent||'';\n    if(rec.start\u003c0||rec.end>full.length||rec.start>=rec.end)return false;\n    if(rec.text&&full.slice(rec.start,rec.end)!==rec.text)return false;\n    const nodes=textNodes(root);\n    const segments=[];\n    let cursor=0;\n    for(const node of nodes){\n      const next=cursor+node.nodeValue.length;\n      const start=Math.max(rec.start,cursor),end=Math.min(rec.end,next);\n      if(start\u003cend)segments.push({node,start:start-cursor,end:end-cursor});\n      cursor=next;\n    }\n    for(let i=segments.length-1;i>=0;i--){\n      const seg=segments[i];\n      const range=document.createRange();\n      range.setStart(seg.node,seg.start);range.setEnd(seg.node,seg.end);\n      const mark=document.createElement('mark');\n      mark.className='enzo-highlight';mark.dataset.color=rec.color;mark.dataset.highlightId=rec.id;\n      mark.appendChild(range.extractContents());range.insertNode(mark);\n    }\n    return segments.length>0;\n  }\n  function clearRenderedMarks(){\n    document.querySelectorAll('mark.enzo-highlight').forEach(mark=>{\n      const parent=mark.parentNode;if(!parent)return;\n      parent.replaceChild(document.createTextNode(mark.textContent||''),mark);parent.normalize();\n    });\n  }\n  function renderAll(){\n    withObserverPaused(()=>{\n      clearRenderedMarks();assignKeys();records.forEach(wrapRecord);\n    });\n    updateToolbar();\n  }\n  function renderMissing(){\n    withObserverPaused(()=>{\n      assignKeys();\n      const rendered=new Set([...document.querySelectorAll('mark.enzo-highlight')].map(m=>m.dataset.highlightId));\n      records.forEach(rec=>{if(!rendered.has(rec.id))wrapRecord(rec)});\n    });\n    updateToolbar();\n  }\n  function selectionParts(range){\n    assignKeys();\n    const parts=[];\n    document.querySelectorAll('[data-enzo-hl-key]').forEach(root=>{\n      if(!isAllowedTarget(root))return;\n      let intersects=false;try{intersects=range.intersectsNode(root)}catch(_){return}\n      if(!intersects)return;\n      const full=root.textContent||'';\n      let start=root.contains(range.startContainer)?boundaryOffset(root,range.startContainer,range.startOffset):0;\n      let end=root.contains(range.endContainer)?boundaryOffset(root,range.endContainer,range.endOffset):full.length;\n      start=Math.max(0,Math.min(start,full.length));end=Math.max(start,Math.min(end,full.length));\n      if(full.slice(start,end).trim())parts.push({root,key:root.dataset.enzoHlKey,full,start,end});\n    });\n    return parts;\n  }\n  function applySelection(){\n    if(mode!=='highlight')return;\n    const selection=window.getSelection();\n    if(!selection||selection.isCollapsed||!selection.rangeCount)return;\n    if(toolbar.contains(selection.anchorNode)||toolbar.contains(selection.focusNode))return;\n    const parts=selectionParts(selection.getRangeAt(0));\n    if(!parts.length)return;\n    const before=snapshot();\n    const additions=[];\n    const removeIds=new Set();\n    parts.forEach(part=>{\n      records.forEach(rec=>{if(rec.key===part.key&&rec.start\u003cpart.end&&rec.end>part.start)removeIds.add(rec.id)});\n      const selected=part.full.slice(part.start,part.end);\n      const token=/\\S+\\s*/g;let match;\n      while((match=token.exec(selected))){\n        const start=part.start+match.index,end=start+match[0].length;\n        additions.push({id:makeId(),key:part.key,start,end,color,text:part.full.slice(start,end)});\n      }\n    });\n    if(!additions.length)return;\n    pushHistory(before);\n    records=records.filter(rec=>!removeIds.has(rec.id));\n    records.push(...additions);\n    saveRecords();renderAll();selection.removeAllRanges();\n    showToast(`${additions.length} ${additions.length===1?'palavra grifada':'palavras grifadas'} em ${colorLabel(color)}.`);\n  }\n  function removeRecordMarks(id){\n    document.querySelectorAll(`mark.enzo-highlight[data-highlight-id=\"${id}\"]`).forEach(mark=>{\n      const parent=mark.parentNode;if(!parent)return;\n      parent.replaceChild(document.createTextNode(mark.textContent||''),mark);parent.normalize();\n    });\n  }\n  function eraseAtPoint(x,y){\n    const mark=document.elementFromPoint(x,y)?.closest?.('mark.enzo-highlight');\n    if(!mark)return;\n    const id=mark.dataset.highlightId;\n    if(!id||!records.some(r=>r.id===id))return;\n    if(!eraseChanged){pushHistory(eraseSnapshot||snapshot());eraseChanged=true}\n    records=records.filter(r=>r.id!==id);\n    withObserverPaused(()=>removeRecordMarks(id));\n    saveRecords();updateToolbar();\n  }\n  function undo(){\n    if(!history.length)return;\n    records=history.pop();saveRecords();renderAll();showToast('Última ação desfeita.');\n  }\n  function setMode(next){\n    mode=next;\n    document.body.classList.toggle('enzo-highlight-mode',mode==='highlight');\n    document.body.classList.toggle('enzo-eraser-mode',mode==='erase');\n    eraserButton.classList.toggle('active',mode==='erase');\n    colorButtons.forEach(btn=>btn.classList.toggle('active',mode==='highlight'&&btn.dataset.color===color));\n  }\n  function colorLabel(value){return value==='yellow'?'amarelo':value==='green'?'verde':'vermelho'}\n  function updateToolbar(){\n    countBadge.textContent=records.length;countBadge.classList.toggle('visible',records.length>0);\n    undoButton.disabled=history.length===0;\n  }\n  function showToast(message){\n    toast.textContent=message;toast.classList.add('visible');clearTimeout(toastTimer);\n    toastTimer=setTimeout(()=>toast.classList.remove('visible'),2300);\n  }\n  function observeDynamicAreas(){\n    const targets=[document.getElementById('quizContainer'),document.getElementById('flashcard-grid')].filter(Boolean);\n    targets.forEach(target=>observer.observe(target,{childList:true,subtree:true}));\n  }\n\n  toggle.addEventListener('click',()=>{\n    const willOpen=!toolbar.classList.contains('open');\n    toolbar.classList.toggle('open',willOpen);toggle.setAttribute('aria-expanded',String(willOpen));\n    setMode(willOpen?'highlight':null);\n    if(willOpen)showToast('Escolha a cor e selecione o texto.');\n  });\n  colorButtons.forEach(btn=>btn.addEventListener('click',()=>{\n    color=btn.dataset.color;setMode('highlight');showToast(`Marca-texto ${colorLabel(color)} ativado.`);\n  }));\n  eraserButton.addEventListener('click',()=>{\n    setMode('erase');showToast('Borracha ativa: clique ou arraste sobre as palavras grifadas.');\n  });\n  undoButton.addEventListener('click',undo);\n  toolbar.addEventListener('pointerdown',event=>event.stopPropagation());\n\n  document.addEventListener('pointerdown',event=>{\n    if(mode!=='erase'||toolbar.contains(event.target))return;\n    erasing=true;eraseSnapshot=snapshot();eraseChanged=false;eraseAtPoint(event.clientX,event.clientY);\n  });\n  document.addEventListener('pointermove',event=>{\n    if(!erasing||mode!=='erase')return;\n    event.preventDefault();eraseAtPoint(event.clientX,event.clientY);\n  },{passive:false});\n  document.addEventListener('pointerup',event=>{\n    if(erasing){erasing=false;if(eraseChanged)showToast('Trecho apagado.');eraseSnapshot=null;return}\n    if(mode==='highlight'&&!toolbar.contains(event.target))setTimeout(applySelection,0);\n  });\n  document.addEventListener('keydown',event=>{\n    if(event.key==='Escape'&&toolbar.classList.contains('open')){toolbar.classList.remove('open');toggle.setAttribute('aria-expanded','false');setMode(null)}\n    if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='z'&&!/INPUT|TEXTAREA/.test(document.activeElement?.tagName||'')){\n      if(history.length){event.preventDefault();undo()}\n    }\n  });\n\n  observer=new MutationObserver(()=>{clearTimeout(observer._timer);observer._timer=setTimeout(renderMissing,40)});\n  assignKeys();renderAll();observeDynamicAreas();updateToolbar();\n})();\n\u003c/script>\n\u003cscript>\n/* Post-its privados por aluno — persistência no Supabase com RLS. */\n(()=>{\n  'use strict';\n  const TABLE='resumo_anotacoes';\n  const PAGE=\"bioquimica_2_final_p2\";\n  const LABELS={\n    nota:{name:'Nota',icon:'📝'},\n    importante:{name:'Importante',icon:'⭐'},\n    prova:{name:'Prova',icon:'🎯'},\n    atencao:{name:'Atenção',icon:'⚠️'}\n  };\n  const ANCHOR_SELECTOR=[\n    'p','li','td','th','h1','h2','h3','h4','h5','h6',\n    'blockquote','.fc-q','.fc-back-text'\n  ].join(',');\n  let client=null,user=null,notes=[],initialized=false,editingId=null,topZ=70;\n\n  const toggle=document.createElement('button');\n  toggle.id='enzo-notes-toggle';toggle.type='button';toggle.title='Criar uma anotação';\n  toggle.setAttribute('aria-label','Criar uma anotação');\n  toggle.innerHTML='\u003cspan aria-hidden=\"true\">🗒️\u003c/span>\u003cspan class=\"note-count\" aria-label=\"Quantidade de anotações\">0\u003c/span>';\n\n  const composer=document.createElement('form');\n  composer.id='enzo-note-composer';\n  composer.innerHTML=`\n    \u003cdiv class=\"enzo-note-form-title\">\u003cspan>🗒️ \u003cb class=\"enzo-note-title-text\">Nova anotação\u003c/b>\u003c/span>\u003cbutton class=\"enzo-note-close\" type=\"button\" aria-label=\"Fechar\">×\u003c/button>\u003c/div>\n    \u003cp class=\"enzo-note-drag-hint\">↕ Arraste esta caixa pelo cabeçalho até o ponto onde deseja deixar o post-it.\u003c/p>\n    \u003cdiv class=\"enzo-note-fields\">\n      \u003clabel for=\"enzo-note-label\">Marcação\u003c/label>\n      \u003cselect id=\"enzo-note-label\">\n        \u003coption value=\"nota\">📝 Nota\u003c/option>\n        \u003coption value=\"importante\">⭐ Importante\u003c/option>\n        \u003coption value=\"prova\">🎯 Prova\u003c/option>\n        \u003coption value=\"atencao\">⚠️ Atenção\u003c/option>\n      \u003c/select>\n      \u003clabel for=\"enzo-note-text\">Anotação\u003c/label>\n      \u003ctextarea id=\"enzo-note-text\" maxlength=\"3000\" required placeholder=\"Escreva o que você compreendeu, uma observação ou algo que pode cair na prova...\">\u003c/textarea>\n    \u003c/div>\n    \u003cdiv class=\"enzo-note-actions\">\u003cbutton class=\"enzo-note-cancel\" type=\"button\">Cancelar\u003c/button>\u003cbutton class=\"enzo-note-save\" type=\"submit\">Salvar anotação\u003c/button>\u003c/div>\n    \u003cdiv class=\"enzo-note-status\" role=\"status\" aria-live=\"polite\">\u003c/div>`;\n  document.body.append(toggle,composer);\n\n  const count=toggle.querySelector('.note-count');\n  const titleText=composer.querySelector('.enzo-note-title-text');\n  const labelField=composer.querySelector('#enzo-note-label');\n  const textField=composer.querySelector('#enzo-note-text');\n  const saveButton=composer.querySelector('.enzo-note-save');\n  const status=composer.querySelector('.enzo-note-status');\n\n  function getClient(){return window.authClient||window.supabaseClient||window._sb||null}\n  function cleanText(value){return String(value||'').replace(/\\s+/g,' ').trim()}\n  function hashText(text){\n    let h=2166136261;\n    for(let i=0;i\u003ctext.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619)}\n    return (h>>>0).toString(36);\n  }\n  function setStatus(message,error=false){status.textContent=message||'';status.classList.toggle('error',error)}\n  function updateCount(){count.textContent=notes.length;count.classList.toggle('visible',notes.length>0)}\n  function currentSection(){return document.querySelector('.section.active')||document.querySelector('.section')}\n  function sectionContainer(section){return section?.querySelector('.container')||null}\n  function anchorElements(section){\n    if(!section)return[];\n    assignAnchors(section);\n    return [...section.querySelectorAll('[data-enzo-note-anchor]')].filter(el=>cleanText(el.textContent)&&!el.closest('.enzo-study-note,#enzo-note-composer,.study-tools,.q-stats'));\n  }\n  function assignAnchors(section=document){\n    const seen=new Map();\n    section.querySelectorAll(ANCHOR_SELECTOR).forEach(el=>{\n      if(!el.closest('.section'))return;\n      if(el.closest('.enzo-study-note,#enzo-note-composer,.study-tools,.q-stats,nav,footer'))return;\n      const text=cleanText(el.textContent);if(!text)return;\n      const sectionId=el.closest('.section')?.id||'page';\n      const base=`${sectionId}:${hashText(text)}`;\n      const occurrence=seen.get(base)||0;seen.set(base,occurrence+1);\n      el.dataset.enzoNoteAnchor=el.dataset.enzoHlKey||`${base}:${occurrence}`;\n    });\n  }\n  function findAnchor(note,section){\n    const anchors=anchorElements(section);\n    let found=anchors.find(el=>el.dataset.enzoNoteAnchor===note.anchor_key);\n    if(!found&&note.anchor_excerpt){\n      const needle=cleanText(note.anchor_excerpt).slice(0,100);\n      found=anchors.find(el=>cleanText(el.textContent).includes(needle));\n    }\n    return found||null;\n  }\n  function relativeTop(el,container){\n    const er=el.getBoundingClientRect(),cr=container.getBoundingClientRect();\n    return er.top-cr.top+container.scrollTop;\n  }\n  function clamp(value,min,max){return Math.max(min,Math.min(max,value))}\n  const SIZE_META=/^\\[\\[enzo-size:(\\d+)x(\\d+)\\]\\]\\s*/;\n  function unpackExcerpt(value){\n    const raw=String(value||''),match=raw.match(SIZE_META);\n    return {text:raw.replace(SIZE_META,''),width:match?Number(match[1]):232,height:match?Number(match[2]):132};\n  }\n  function packExcerpt(text,width=232,height=132){\n    const safeWidth=clamp(Math.round(Number(width)||232),160,600);\n    const safeHeight=clamp(Math.round(Number(height)||132),110,700);\n    return `[[enzo-size:${safeWidth}x${safeHeight}]] ${cleanText(text).slice(0,240)}`.trim();\n  }\n  function normalizeNote(note){\n    const packed=unpackExcerpt(note.anchor_excerpt);\n    return {...note,anchor_excerpt:packed.text,x_pct:Number(note.x_pct)||0,y_offset:Number(note.y_offset)||0,width_px:packed.width,height_px:packed.height};\n  }\n  function noteElement(id){return document.querySelector(`.enzo-study-note[data-note-id=\"${id}\"]`)}\n  function setSync(el,message,error=false){\n    const sync=el?.querySelector('.enzo-note-sync');if(!sync)return;\n    sync.textContent=message;sync.classList.toggle('error',error);\n  }\n  function positionNote(el,note){\n    const section=document.getElementById(note.section_id),container=sectionContainer(section);\n    if(!section||!container||!el||container.clientWidth===0)return;\n    const maxWidth=Math.max(150,Math.min(600,container.clientWidth-8));\n    el.style.width=`${clamp(Number(note.width_px)||232,Math.min(160,maxWidth),maxWidth)}px`;\n    el.style.height=`${clamp(Number(note.height_px)||132,110,700)}px`;\n    const maxLeft=Math.max(0,container.clientWidth-el.offsetWidth);\n    const left=clamp((Number(note.x_pct)||0)*maxLeft,0,maxLeft);\n    const anchor=findAnchor(note,section);\n    const baseTop=anchor?relativeTop(anchor,container):0;\n    const maxTop=Math.max(8,container.scrollHeight-el.offsetHeight-8);\n    const top=clamp(baseTop+(Number(note.y_offset)||0),8,maxTop);\n    el.style.left=`${left}px`;el.style.top=`${top}px`;el.style.visibility='visible';\n  }\n  function layoutNotes(){notes.forEach(note=>positionNote(noteElement(note.id),note))}\n  function createNoteElement(note){\n    const meta=LABELS[note.label]||LABELS.nota;\n    const el=document.createElement('article');\n    el.className='enzo-study-note';el.dataset.noteId=note.id;el.dataset.label=note.label;el.style.visibility='hidden';\n    const head=document.createElement('div');head.className='enzo-note-head';\n    const tag=document.createElement('span');tag.className='enzo-note-tag';tag.textContent=`${meta.icon} ${meta.name}`;\n    const edit=document.createElement('button');edit.className='enzo-note-mini';edit.type='button';edit.title='Editar';edit.setAttribute('aria-label','Editar anotação');edit.textContent='✎';\n    const remove=document.createElement('button');remove.className='enzo-note-mini';remove.type='button';remove.title='Excluir';remove.setAttribute('aria-label','Excluir anotação');remove.textContent='×';\n    head.append(tag,edit,remove);\n    const body=document.createElement('div');body.className='enzo-note-body';body.textContent=note.content;\n    const sync=document.createElement('span');sync.className='enzo-note-sync';sync.textContent='salva';\n    const resize=document.createElement('button');resize.className='enzo-note-resize';resize.type='button';resize.title='Arraste para ajustar o tamanho';resize.setAttribute('aria-label','Ajustar tamanho da anotação');resize.textContent='⌟';\n    el.append(head,body,sync,resize);\n    edit.addEventListener('pointerdown',event=>event.stopPropagation());\n    remove.addEventListener('pointerdown',event=>event.stopPropagation());\n    edit.addEventListener('click',()=>openComposer(note));\n    remove.addEventListener('click',()=>deleteNote(note));\n    el.addEventListener('pointerdown',()=>{el.style.zIndex=String(++topZ)});\n    enableDrag(el,head,note);\n    enableResize(el,resize,note);\n    return el;\n  }\n  function renderNotes(){\n    document.querySelectorAll('.enzo-study-note').forEach(el=>el.remove());\n    notes.forEach(note=>{\n      const section=document.getElementById(note.section_id),container=sectionContainer(section);\n      if(!container)return;\n      const el=createNoteElement(note);container.appendChild(el);positionNote(el,note);\n    });\n    updateCount();requestAnimationFrame(layoutNotes);\n  }\n  function defaultPlacement(){\n    const section=currentSection(),container=sectionContainer(section);\n    if(!section||!container)return null;\n    const anchors=anchorElements(section);\n    const containerRect=container.getBoundingClientRect();\n    const desiredViewportY=clamp(window.innerHeight*.44,150,window.innerHeight-180);\n    let anchor=anchors.filter(el=>{\n      const r=el.getBoundingClientRect();return r.bottom>100&&r.top\u003cwindow.innerHeight-70;\n    }).sort((a,b)=>Math.abs(a.getBoundingClientRect().top-desiredViewportY)-Math.abs(b.getBoundingClientRect().top-desiredViewportY))[0]||anchors[0]||null;\n    const desiredTop=clamp(desiredViewportY-containerRect.top,8,Math.max(8,container.scrollHeight-150));\n    const baseTop=anchor?relativeTop(anchor,container):0;\n    return {\n      section_id:section.id||'intro',\n      anchor_key:anchor?.dataset.enzoNoteAnchor||null,\n      anchor_excerpt:anchor?cleanText(anchor.textContent).slice(0,240):null,\n      x_pct:.78,\n      y_offset:Math.round(desiredTop-baseTop)\n    };\n  }\n  function composerPlacement(){\n    const section=currentSection(),container=sectionContainer(section);\n    if(!section||!container||!composer.classList.contains('open'))return defaultPlacement();\n    const rect=composer.getBoundingClientRect(),containerRect=container.getBoundingClientRect();\n    const noteWidth=232,noteHeight=132;\n    const maxLeft=Math.max(1,container.clientWidth-noteWidth);\n    const left=clamp(rect.left-containerRect.left,0,maxLeft);\n    const top=clamp(rect.top-containerRect.top+container.scrollTop,8,Math.max(8,container.scrollHeight-noteHeight-8));\n    const anchor=nearestAnchorForPosition(section,container,top+20);\n    return {\n      section_id:section.id||'intro',\n      anchor_key:anchor?.dataset.enzoNoteAnchor||null,\n      anchor_excerpt:anchor?cleanText(anchor.textContent).slice(0,240):null,\n      x_pct:clamp(left/maxLeft,0,1),\n      y_offset:Math.round(top-(anchor?relativeTop(anchor,container):0)),\n      width_px:noteWidth,\n      height_px:noteHeight\n    };\n  }\n  function nearestAnchorForPosition(section,container,top){\n    const anchors=anchorElements(section);if(!anchors.length)return null;\n    return anchors.sort((a,b)=>Math.abs(relativeTop(a,container)-top)-Math.abs(relativeTop(b,container)-top))[0];\n  }\n  function enableDrag(el,handle,note){\n    let drag=null;\n    handle.addEventListener('pointerdown',event=>{\n      if(event.target.closest('button'))return;\n      event.preventDefault();handle.setPointerCapture?.(event.pointerId);\n      drag={id:event.pointerId,x:event.clientX,y:event.clientY,left:el.offsetLeft,top:el.offsetTop};\n      el.classList.add('dragging');el.style.zIndex=String(++topZ);\n    });\n    handle.addEventListener('pointermove',event=>{\n      if(!drag||event.pointerId!==drag.id)return;\n      event.preventDefault();\n      const section=document.getElementById(note.section_id),container=sectionContainer(section);if(!container)return;\n      const maxLeft=Math.max(0,container.clientWidth-el.offsetWidth),maxTop=Math.max(8,container.scrollHeight-el.offsetHeight-8);\n      el.style.left=`${clamp(drag.left+event.clientX-drag.x,0,maxLeft)}px`;\n      el.style.top=`${clamp(drag.top+event.clientY-drag.y,8,maxTop)}px`;\n    });\n    const finish=async event=>{\n      if(!drag||event.pointerId!==drag.id)return;\n      handle.releasePointerCapture?.(event.pointerId);drag=null;el.classList.remove('dragging');\n      const section=document.getElementById(note.section_id),container=sectionContainer(section);if(!container)return;\n      const maxLeft=Math.max(1,container.clientWidth-el.offsetWidth);\n      const left=parseFloat(el.style.left)||0,top=parseFloat(el.style.top)||0;\n      const anchor=nearestAnchorForPosition(section,container,top+20);\n      note.x_pct=clamp(left/maxLeft,0,1);\n      note.anchor_key=anchor?.dataset.enzoNoteAnchor||null;\n      note.anchor_excerpt=anchor?cleanText(anchor.textContent).slice(0,240):null;\n      note.y_offset=Math.round(top-(anchor?relativeTop(anchor,container):0));\n      setSync(el,'salvando…');\n      const {error}=await client.from(TABLE).update({\n        anchor_key:note.anchor_key,anchor_excerpt:packExcerpt(note.anchor_excerpt,note.width_px,note.height_px),x_pct:note.x_pct,\n        y_offset:note.y_offset,updated_at:new Date().toISOString()\n      }).eq('id',note.id).eq('user_id',user.id);\n      setSync(el,error?'erro ao salvar':'salva',!!error);\n      if(error)console.error('Falha ao posicionar anotação:',error.message);\n    };\n    handle.addEventListener('pointerup',finish);handle.addEventListener('pointercancel',finish);\n  }\n  function enableResize(el,handle,note){\n    let resizing=null;\n    handle.addEventListener('pointerdown',event=>{\n      event.preventDefault();event.stopPropagation();handle.setPointerCapture?.(event.pointerId);\n      resizing={id:event.pointerId,x:event.clientX,y:event.clientY,width:el.offsetWidth,height:el.offsetHeight};\n      el.classList.add('resizing');el.style.zIndex=String(++topZ);\n    });\n    handle.addEventListener('pointermove',event=>{\n      if(!resizing||event.pointerId!==resizing.id)return;\n      event.preventDefault();\n      const section=document.getElementById(note.section_id),container=sectionContainer(section);if(!container)return;\n      const maxWidth=Math.max(160,Math.min(600,container.clientWidth-el.offsetLeft-4));\n      const width=clamp(resizing.width+event.clientX-resizing.x,160,maxWidth);\n      const height=clamp(resizing.height+event.clientY-resizing.y,110,700);\n      el.style.width=`${Math.round(width)}px`;el.style.height=`${Math.round(height)}px`;\n    });\n    const finish=async event=>{\n      if(!resizing||event.pointerId!==resizing.id)return;\n      handle.releasePointerCapture?.(event.pointerId);resizing=null;el.classList.remove('resizing');\n      const section=document.getElementById(note.section_id),container=sectionContainer(section);if(!container)return;\n      note.width_px=clamp(Math.round(el.offsetWidth),160,600);\n      note.height_px=clamp(Math.round(el.offsetHeight),110,700);\n      const maxLeft=Math.max(1,container.clientWidth-el.offsetWidth),left=parseFloat(el.style.left)||0;\n      note.x_pct=clamp(left/maxLeft,0,1);\n      setSync(el,'salvando…');\n      const {error}=await client.from(TABLE).update({\n        anchor_excerpt:packExcerpt(note.anchor_excerpt,note.width_px,note.height_px),\n        x_pct:note.x_pct,updated_at:new Date().toISOString()\n      }).eq('id',note.id).eq('user_id',user.id);\n      setSync(el,error?'erro ao salvar':'salva',!!error);\n      if(error)console.error('Falha ao salvar o tamanho da anotação:',error.message);\n    };\n    handle.addEventListener('pointerup',finish);handle.addEventListener('pointercancel',finish);\n  }\n  function keepComposerOnScreen(){\n    if(!composer.classList.contains('open'))return;\n    const rect=composer.getBoundingClientRect();\n    if(!composer.style.top&&!composer.style.left)return;\n    composer.style.left=`${clamp(rect.left,8,Math.max(8,window.innerWidth-rect.width-8))}px`;\n    composer.style.top=`${clamp(rect.top,8,Math.max(8,window.innerHeight-rect.height-8))}px`;\n  }\n  function enableComposerDrag(){\n    const handle=composer.querySelector('.enzo-note-form-title');let drag=null;\n    handle.addEventListener('pointerdown',event=>{\n      if(event.target.closest('button'))return;\n      event.preventDefault();\n      const rect=composer.getBoundingClientRect();\n      composer.style.left=`${rect.left}px`;composer.style.top=`${rect.top}px`;composer.style.right='auto';composer.style.bottom='auto';\n      handle.setPointerCapture?.(event.pointerId);\n      drag={id:event.pointerId,x:event.clientX,y:event.clientY,left:rect.left,top:rect.top};\n    });\n    handle.addEventListener('pointermove',event=>{\n      if(!drag||event.pointerId!==drag.id)return;\n      event.preventDefault();\n      const left=clamp(drag.left+event.clientX-drag.x,8,Math.max(8,window.innerWidth-composer.offsetWidth-8));\n      const top=clamp(drag.top+event.clientY-drag.y,8,Math.max(8,window.innerHeight-composer.offsetHeight-8));\n      composer.style.left=`${left}px`;composer.style.top=`${top}px`;\n    });\n    const finish=event=>{\n      if(!drag||event.pointerId!==drag.id)return;\n      handle.releasePointerCapture?.(event.pointerId);drag=null;\n    };\n    handle.addEventListener('pointerup',finish);handle.addEventListener('pointercancel',finish);\n  }\n  function openComposer(note=null){\n    editingId=note?.id||null;titleText.textContent=note?'Editar anotação':'Nova anotação';\n    labelField.value=note?.label||'nota';textField.value=note?.content||'';\n    setStatus(user?'':'Conectando ao seu perfil…');composer.classList.add('open');toggle.classList.add('active');\n    setTimeout(()=>textField.focus(),40);\n  }\n  function closeComposer(){composer.classList.remove('open');toggle.classList.remove('active');editingId=null;setStatus('');textField.value=''}\n  async function saveNote(event){\n    event.preventDefault();\n    if(!client||!user){setStatus('Não foi possível identificar o aluno conectado.',true);return}\n    const content=textField.value.trim(),label=labelField.value;\n    if(!content){setStatus('Digite sua anotação.',true);return}\n    saveButton.disabled=true;setStatus('Salvando no seu perfil…');\n    if(editingId){\n      const {data,error}=await client.from(TABLE).update({label,content,updated_at:new Date().toISOString()})\n        .eq('id',editingId).eq('user_id',user.id).select().single();\n      saveButton.disabled=false;\n      if(error){setStatus(`Erro: ${error.message}`,true);return}\n      const index=notes.findIndex(n=>n.id===editingId);if(index>=0)notes[index]=normalizeNote(data);\n      renderNotes();closeComposer();return;\n    }\n    const placement=composerPlacement();\n    if(!placement){saveButton.disabled=false;setStatus('Abra uma aba do resumo para posicionar a anotação.',true);return}\n    const {width_px,height_px,...dbPlacement}=placement;\n    dbPlacement.anchor_excerpt=packExcerpt(dbPlacement.anchor_excerpt,width_px,height_px);\n    const payload={user_id:user.id,resumo_key:PAGE,label,content,...dbPlacement};\n    const {data,error}=await client.from(TABLE).insert(payload).select().single();\n    saveButton.disabled=false;\n    if(error){setStatus(`Erro: ${error.message}`,true);return}\n    notes.push(normalizeNote(data));renderNotes();closeComposer();\n  }\n  async function deleteNote(note){\n    if(!confirm('Excluir esta anotação?'))return;\n    const el=noteElement(note.id);setSync(el,'excluindo…');\n    const {error}=await client.from(TABLE).delete().eq('id',note.id).eq('user_id',user.id);\n    if(error){setSync(el,'erro ao excluir',true);alert(`Não foi possível excluir: ${error.message}`);return}\n    notes=notes.filter(item=>item.id!==note.id);el?.remove();updateCount();\n  }\n  async function initialize(){\n    if(initialized)return;\n    client=getClient();if(!client){setStatus('Aguardando conexão com o perfil…');return}\n    user=window.authSession?.user||null;\n    if(!user){\n      const {data,error}=await client.auth.getUser();\n      if(error||!data?.user){setStatus('Entre na sua conta para usar anotações.',true);return}\n      user=data.user;\n    }\n    initialized=true;assignAnchors(document);\n    const {data,error}=await client.from(TABLE)\n      .select('id,user_id,resumo_key,section_id,anchor_key,anchor_excerpt,x_pct,y_offset,label,content,created_at,updated_at')\n      .eq('user_id',user.id).eq('resumo_key',PAGE).order('created_at',{ascending:true});\n    if(error){setStatus(`Anotações indisponíveis: ${error.message}`,true);console.error(error);return}\n    notes=(data||[]).map(normalizeNote);renderNotes();setStatus('');\n  }\n\n  toggle.addEventListener('click',()=>composer.classList.contains('open')?closeComposer():openComposer());\n  enableComposerDrag();\n  composer.querySelector('.enzo-note-close').addEventListener('click',closeComposer);\n  composer.querySelector('.enzo-note-cancel').addEventListener('click',closeComposer);\n  composer.addEventListener('submit',saveNote);\n  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&composer.classList.contains('open'))closeComposer()});\n  window.addEventListener('resize',()=>requestAnimationFrame(()=>{layoutNotes();keepComposerOnScreen()}));\n  const sectionObserver=new MutationObserver(mutations=>{\n    if(mutations.some(m=>m.target.classList?.contains('active')))requestAnimationFrame(layoutNotes);\n  });\n  document.querySelectorAll('.section').forEach(section=>sectionObserver.observe(section,{attributes:true,attributeFilter:['class']}));\n  document.addEventListener('authReady',initialize,{once:true});\n  if(window.authSession?.user)setTimeout(initialize,0);else setTimeout(initialize,1200);\n})();\n\u003c/script>\n\u003cscript>\n/* Central de anotações — índice navegável de post-its e grifos. */\n(()=>{\n  'use strict';\n  const PAGE=\"bioquimica_2_final_p2\";\n  const STORAGE_KEY=`enzo-highlights:v1:${PAGE}`;\n  let filter='all',refreshTimer=null;\n\n  const toggle=document.createElement('button');\n  toggle.id='enzo-annotations-index-toggle';toggle.type='button';toggle.title='Abrir minhas anotações';\n  toggle.innerHTML='\u003cspan aria-hidden=\"true\">📚\u003c/span>\u003cspan>Minhas anotações\u003c/span>\u003cspan class=\"enzo-index-count\">0\u003c/span>';\n  const panel=document.createElement('aside');panel.id='enzo-annotations-index';panel.setAttribute('aria-label','Minhas anotações');\n  panel.innerHTML=`\n    \u003cdiv class=\"enzo-index-head\">\u003cdiv>\u003cdiv class=\"enzo-index-title\">📚 Minhas anotações\u003c/div>\u003cdiv class=\"enzo-index-sub\">Clique em um item para voltar ao ponto salvo\u003c/div>\u003c/div>\u003cbutton class=\"enzo-index-close\" type=\"button\" aria-label=\"Fechar\">×\u003c/button>\u003c/div>\n    \u003cdiv class=\"enzo-index-tabs\">\u003cbutton class=\"enzo-index-filter active\" type=\"button\" data-filter=\"all\">Tudo\u003c/button>\u003cbutton class=\"enzo-index-filter\" type=\"button\" data-filter=\"note\">Post-its\u003c/button>\u003cbutton class=\"enzo-index-filter\" type=\"button\" data-filter=\"highlight\">Grifos\u003c/button>\u003c/div>\n    \u003cdiv class=\"enzo-index-list\">\u003c/div>`;\n  document.body.append(toggle,panel);\n  const count=toggle.querySelector('.enzo-index-count'),list=panel.querySelector('.enzo-index-list');\n\n  function sectionName(id){\n    const btn=document.querySelector(`nav.tabs button[data-section=\"${CSS.escape(id||'')}\"]`);\n    return (btn?.textContent||id||'Página').replace(/\\s+/g,' ').trim();\n  }\n  function loadHighlightRecords(){\n    try{const r=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');return Array.isArray(r)?r:[]}catch(_){return[]}\n  }\n  function groupedHighlights(){\n    const records=loadHighlightRecords().filter(r=>r&&r.id&&r.key&&Number.isFinite(r.start)&&Number.isFinite(r.end));\n    records.sort((a,b)=>String(a.key).localeCompare(String(b.key))||a.start-b.start||a.end-b.end);\n    const groups=[];\n    for(const rec of records){\n      const section=(String(rec.key).split(':')[0]||'page');\n      const prev=groups[groups.length-1];\n      if(prev&&prev.key===rec.key&&prev.color===rec.color&&rec.start\u003c=prev.end+1){\n        prev.ids.push(rec.id);prev.end=Math.max(prev.end,rec.end);prev.text=(prev.text+(rec.text||'')).replace(/\\s+/g,' ').trim();\n      }else groups.push({kind:'highlight',key:rec.key,section,color:rec.color||'yellow',ids:[rec.id],start:rec.start,end:rec.end,text:String(rec.text||'').replace(/\\s+/g,' ').trim()});\n    }\n    return groups;\n  }\n  function noteItems(){\n    return [...document.querySelectorAll('.enzo-study-note')].map(el=>({\n      kind:'note',id:el.dataset.noteId,section:el.closest('.section')?.id||'page',label:el.dataset.label||'nota',text:(el.querySelector('.enzo-note-body')?.textContent||'').trim(),el\n    }));\n  }\n  function items(){return [...noteItems(),...groupedHighlights()]}\n  function refresh(){\n    const all=items(),shown=filter==='all'?all:all.filter(x=>x.kind===filter);\n    count.textContent=all.length;count.classList.toggle('visible',all.length>0);\n    list.innerHTML='';\n    if(!shown.length){list.innerHTML='\u003cdiv class=\"enzo-index-empty\">Nenhuma anotação nesta categoria ainda.\u003cbr>Crie um post-it ou grife um trecho do resumo.\u003c/div>';return}\n    shown.forEach(item=>{\n      const b=document.createElement('button');b.type='button';b.className='enzo-index-item';b.dataset.kind=item.kind;\n      if(item.color)b.dataset.color=item.color;\n      const label=item.kind==='note'?({nota:'📝 Nota',importante:'⭐ Importante',prova:'🎯 Prova',atencao:'⚠️ Atenção'}[item.label]||'📝 Nota'):`🖍️ Grifo ${item.color==='green'?'verde':item.color==='red'?'vermelho':'amarelo'}`;\n      b.innerHTML=`\u003cdiv class=\"enzo-index-meta\">\u003cspan>${label}\u003c/span>\u003cspan>${sectionName(item.section)}\u003c/span>\u003c/div>\u003cdiv class=\"enzo-index-text\">\u003c/div>`;\n      b.querySelector('.enzo-index-text').textContent=item.text||'(sem texto)';\n      b.addEventListener('click',()=>goTo(item));list.appendChild(b);\n    });\n  }\n  function activateSection(section){\n    if(!section||section==='page')return;\n    const btn=document.querySelector(`nav.tabs button[data-section=\"${CSS.escape(section)}\"]`);\n    if(typeof window.showSectionByName==='function')window.showSectionByName(section);\n    else if(typeof window.showSection==='function')window.showSection(section,btn);\n    else{\n      document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===section));\n      document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.section===section));\n    }\n  }\n  function flash(el){if(!el)return;el.classList.remove('enzo-index-flash');void el.offsetWidth;el.classList.add('enzo-index-flash');setTimeout(()=>el.classList.remove('enzo-index-flash'),1400)}\n  function goTo(item){\n    activateSection(item.section);panel.classList.remove('open');toggle.classList.remove('active');\n    setTimeout(()=>{\n      let target=null;\n      if(item.kind==='note')target=document.querySelector(`.enzo-study-note[data-note-id=\"${CSS.escape(String(item.id))}\"]`);\n      else{\n        for(const id of item.ids||[]){target=document.querySelector(`mark.enzo-highlight[data-highlight-id=\"${CSS.escape(String(id))}\"]`);if(target)break}\n        if(!target&&item.key)target=document.querySelector(`[data-enzo-hl-key=\"${CSS.escape(String(item.key))}\"]`);\n      }\n      if(!target)return;\n      target.scrollIntoView({behavior:'smooth',block:'center',inline:'nearest'});flash(target);\n    },180);\n  }\n  function scheduleRefresh(){clearTimeout(refreshTimer);refreshTimer=setTimeout(refresh,80)}\n  toggle.addEventListener('click',()=>{const open=!panel.classList.contains('open');panel.classList.toggle('open',open);toggle.classList.toggle('active',open);if(open)refresh()});\n  panel.querySelector('.enzo-index-close').addEventListener('click',()=>{panel.classList.remove('open');toggle.classList.remove('active')});\n  panel.querySelectorAll('.enzo-index-filter').forEach(btn=>btn.addEventListener('click',()=>{filter=btn.dataset.filter;panel.querySelectorAll('.enzo-index-filter').forEach(x=>x.classList.toggle('active',x===btn));refresh()}));\n  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&panel.classList.contains('open')){panel.classList.remove('open');toggle.classList.remove('active')}});\n  window.addEventListener('storage',e=>{if(e.key===STORAGE_KEY)scheduleRefresh()});\n  new MutationObserver(m=>{if(m.some(x=>[...x.addedNodes,...x.removedNodes].some(n=>n.nodeType===1&&(n.matches?.('.enzo-study-note,mark.enzo-highlight')||n.querySelector?.('.enzo-study-note,mark.enzo-highlight')))))scheduleRefresh()}).observe(document.body,{childList:true,subtree:true});\n  setTimeout(refresh,1200);\n})();\n\u003c/script>\n\u003cscript>\n/* Controle mestre: recolhe as utilidades para liberar a área de leitura. */\n(()=>{\n  'use strict';\n  const PAGE=\"bioquimica_2_final_p2\";\n  const KEY=`enzo-tools-collapsed:v1:${PAGE}`;\n  const btn=document.createElement('button');\n  btn.id='enzo-tools-retractor';\n  btn.type='button';\n  btn.innerHTML='\u003cspan class=\"enzo-tools-arrow\" aria-hidden=\"true\">‹\u003c/span>';\n  document.body.appendChild(btn);\n\n  function closeChildren(){\n    const highlighter=document.getElementById('enzo-highlighter');\n    if(highlighter){\n      highlighter.classList.remove('open');\n      highlighter.querySelector('.enzo-hl-toggle')?.setAttribute('aria-expanded','false');\n    }\n    document.body.classList.remove('enzo-highlight-mode','enzo-eraser-mode');\n    document.querySelector('.enzo-hl-eraser')?.classList.remove('active');\n    document.querySelectorAll('.enzo-hl-color.active').forEach(el=>el.classList.remove('active'));\n\n    const noteComposer=document.getElementById('enzo-note-composer');\n    noteComposer?.classList.remove('open');\n    document.getElementById('enzo-notes-toggle')?.classList.remove('active');\n\n    const index=document.getElementById('enzo-annotations-index');\n    index?.classList.remove('open');\n    document.getElementById('enzo-annotations-index-toggle')?.classList.remove('active');\n  }\n  function apply(collapsed,persist=true){\n    if(collapsed)closeChildren();\n    document.body.classList.toggle('enzo-tools-collapsed',collapsed);\n    btn.setAttribute('aria-expanded',String(!collapsed));\n    btn.setAttribute('aria-label',collapsed?'Abrir painel de utilidades':'Recolher painel de utilidades');\n    btn.title=collapsed?'Abrir utilidades de estudo':'Recolher utilidades de estudo';\n    if(persist){try{localStorage.setItem(KEY,collapsed?'1':'0')}catch(_){}}\n  }\n  let initial=false;\n  try{initial=localStorage.getItem(KEY)==='1'}catch(_){}\n  apply(initial,false);\n  btn.addEventListener('click',()=>apply(!document.body.classList.contains('enzo-tools-collapsed')));\n  window.addEventListener('storage',e=>{if(e.key===KEY)apply(e.newValue==='1',false)});\n})();\n\u003c/script>\n\n\u003cscript>const enzosteps=[[\"Oxaloacetato + acetil-CoA\",\"Oxaloacetato + acetil-CoA\",\"Citrato\",\"Citrato\",\"Citrato sintase: condensação de acetil-CoA (2C) com oxaloacetato (4C); libera CoA-SH e forma citrato (6C).\",\"Citrato sintasa: condensación de acetil-CoA (2C) con oxaloacetato (4C); libera CoA-SH y forma citrato (6C).\"],[\"Citrato\",\"Citrato\",\"Isocitrato\",\"Isocitrato\",\"Aconitase: isomerização por desidratação e reidratação via cis-aconitato; reposiciona OH.\",\"Aconitasa: isomerización mediante deshidratación e hidratación vía cis-aconitato; cambia posición del OH.\"],[\"Isocitrato\",\"Isocitrato\",\"α-Cetoglutarato\",\"α-Cetoglutarato\",\"Isocitrato desidrogenase: oxidação e descarboxilação; produz NADH + CO₂ (6C → 5C).\",\"Isocitrato deshidrogenasa: oxidación y descarboxilación; produce NADH + CO₂ (6C → 5C).\"],[\"α-Cetoglutarato\",\"α-Cetoglutarato\",\"Succinil-CoA\",\"Succinil-CoA\",\"Complexo α-cetoglutarato desidrogenase: descarboxilação oxidativa; gera NADH + CO₂ e succinil-CoA (5C → 4C).\",\"Complejo α-cetoglutarato deshidrogenasa: descarboxilación oxidativa; forma NADH + CO₂ y succinil-CoA (5C → 4C).\"],[\"Succinil-CoA\",\"Succinil-CoA\",\"Succinato\",\"Succinato\",\"Succinil-CoA sintetase: fosforilação em nível de substrato; forma GTP (ou ATP dependendo da isoforma) e libera CoA-SH.\",\"Succinil-CoA sintetasa: fosforilación a nivel de sustrato; forma GTP (o ATP según isoforma) y libera CoA-SH.\"],[\"Succinato\",\"Succinato\",\"Fumarato\",\"Fumarato\",\"Succinato desidrogenase (complexo II): oxidação de succinato a fumarato, formando FADH₂ associado à enzima; elétrons seguem para ubiquinona.\",\"Succinato deshidrogenasa (complejo II): oxida succinato a fumarato, forma FADH₂ enzimático; electrones pasan a ubiquinona.\"],[\"Fumarato\",\"Fumarato\",\"Malato\",\"Malato\",\"Fumarase: hidratação da dupla ligação do fumarato, formando L-malato.\",\"Fumarasa: hidrata el doble enlace de fumarato y forma L-malato.\"],[\"Malato\",\"Malato\",\"Oxaloacetato\",\"Oxaloacetato\",\"Malato desidrogenase: oxida malato a oxaloacetato e produz NADH; fecha o ciclo.\",\"Malato deshidrogenasa: oxida malato a oxaloacetato y produce NADH; cierra el ciclo.\"]];function enzoLang(es){document.documentElement.lang=es?'es-PY':'pt-BR';document.querySelectorAll('.enzo-langbar button').forEach((b,i)=>b.classList.toggle('active',i===(es?1:0)));document.querySelectorAll('.pttext').forEach(n=>n.style.display=es?'none':'');document.querySelectorAll('.estext').forEach(n=>n.style.display=es?'':'none');}function enzoKrebs(i){document.querySelectorAll('.krebs-steps button').forEach((b,j)=>b.classList.toggle('active',j===i));let r=enzosteps[i],es=document.documentElement.lang==='es-PY';document.getElementById('enzoKrebsInfo').innerHTML='\u003ch4>'+r[es?1:0]+' → '+r[es?3:2]+'\u003c/h4>\u003cp>'+r[es?5:4]+'\u003c/p>';}enzoKrebs(0);\u003c/script>\u003cscript>\n/* Bioquímica II — P2: bioquimica_2_p2_banco.js incorporado */\nconst BIO2P2_FACTS=[{\"c\":\"Lipídios\",\"pt\":\"A emulsificação das gorduras no duodeno depende de ___.\",\"es\":\"La emulsificación de grasas en duodeno depende de ___.\",\"a\":\"sais biliares\",\"ae\":\"sales biliares\",\"why\":\"Os sais anfipáticos dispersam a gordura em gotículas, permitindo ação das lipases.\",\"whye\":\"Las sales anfipáticas dispersan la grasa en gotitas para la acción de lipasas.\"},{\"c\":\"Lipídios\",\"pt\":\"A lipase pancreática libera predominantemente ___ e dois ácidos graxos do TAG.\",\"es\":\"La lipasa pancreática libera predominantemente ___ y dos ácidos grasos del TAG.\",\"a\":\"2-monoacilglicerol\",\"ae\":\"2-monoacilglicerol\",\"why\":\"A enzima hidrolisa as ligações nas posições sn-1 e sn-3 dos triacilgliceróis.\",\"whye\":\"La enzima hidroliza enlaces de las posiciones sn-1 y sn-3.\"},{\"c\":\"Lipídios\",\"pt\":\"A proteína que permite a lipase pancreática atuar na presença de sais biliares é a ___.\",\"es\":\"La proteína que permite actuar a lipasa pancreática ante sales biliares es ___.\",\"a\":\"colipase\",\"ae\":\"colipasa\",\"why\":\"A colipase ancora a lipase à interface lipídio-água e contraria a inibiç  antimicina A inibe o ___.\",\"es\":\"La antimicina A inhibe el ___.\",\"a\":\"complexo III\",\"ae\":\"complejo III\",\"why\":\"Bloqueia transferência de elétrons no citocromo bc₁.\",\"whye\":\"Bloquea transporte electrónico en citocromo bc₁.\"},{\"c\":\"Fosforilação oxidativa\",\"pt\":\"O cianeto impede a redução de oxigênio ao bloquear o ___.\",\"es\":\"El cianuro impide reducir oxígeno al bloquear el ___.\",\"a\":\"complexo IV\",\"ae\":\"complejo IV\",\"why\":\"Inibe citocromo c oxidase, interrompendo a respiração celular.\",\"whye\":\"Inhibe citocromo c oxidasa y detiene la respiración celular.\"},{\"c\":\"Fosforilação oxidativa\",\"pt\":\"A oligomicina inibe a via de prótons pelo complexo ___.\",\"es\":\"La oligomicina inhibe el paso de protones por el complejo ___.\",\"a\":\"V\",\"ae\":\"V\",\"why\":\"Liga-se à ATP sintase Fo, bloqueando síntese de ATP e desacelerando a cadeia acoplada.\",\"whye\":\"Se une a ATP sintasa Fo, bloquea síntesis de ATP y desacelera cadena acoplada.\"},{\"c\":\"Fosforilação oxidativa\",\"pt\":\"Desacopladores fazem o gradiente de prótons se dissipar como ___.\",\"es\":\"Los desacoplantes hacen que el gradiente de protones se disipe como ___.\",\"a\":\"calor\",\"ae\":\"calor\",\"why\":\"Reduzem geração de ATP e dissipam energia química em calor, elevando demanda por oxigênio.\",\"whye\":\"Disminuyen síntesis de ATP y liberan energía en calor, elevando demanda de oxígeno.\"},{\"c\":\"Fosforilação oxidativa\",\"pt\":\"Sem oxigênio, a cadeia respiratória deixa de reoxidar eficientemente ___.\",\"es\":\"Sin oxígeno, la cadena respiratoria deja de reoxidar adecuadamente ___.\",\"a\":\"NADH\",\"ae\":\"NADH\",\"why\":\"O acúmulo de NADH reduz NAD⁺ disponível para ciclo de Krebs e piruvato desidrogenase.\",\"whye\":\"La acumulación de NADH reduce NAD⁺ disponible para Krebs y piruvato deshidrogenasa.\"}];\n(()=>{\"use strict\";window.BIO2P2_FACTS=BIO2P2_FACTS;})();\n\n\u003c/script>\u003cscript>\n(function(){\n\"use strict\";\nconst old=document.querySelector(\"#krebs .krebs-steps\");if(!old)return;\nconst entries=[\n[\"Citrato\",\"Citrato\",\"6C\",\"Citrato sintase\",\"Citrato sintasa\",\"Oxaloacetato (4C) + acetil-CoA (2C)\",\"Oxaloacetato (4C) + acetil-CoA (2C)\",\"CoA-SH\",\"O grupo acetila de dois carbonos entra no ciclo e se condensa com o oxaloacetato de quatro carbonos, originando citrato de seis carbonos. A energia da ligação tioéster impulsiona a formação do produto.\",\"El grupo acetilo de dos carbonos se condensa con oxaloacetato de cuatro carbonos y forma citrato de seis carbonos. La energía del enlace tioéster impulsa la reacción.\",\"Etapa essencialmente irreversível; não gera NADH.\",\"Etapa esencialmente irreversible; no genera NADH.\"],\n[\"Isocitrato\",\"Isocitrato\",\"6C\",\"Aconitase\",\"Aconitasa\",\"Citrato (6C)\",\"Citrato (6C)\",\"−H₂O / +H₂O\",\"A aconitase elimina água do citrato, formando cis-aconitato, e depois a adiciona em outra posição. Isso desloca o grupo hidroxila e prepara o composto para oxidação.\",\"La aconitasa elimina agua del citrato para formar cis-aconitato y después la agrega en otra posición. Así prepara el compuesto para oxidación.\",\"Isomerização: não gera ATP, NADH ou FADH₂.\",\"Isomerización: no genera ATP, NADH ni FADH₂.\"],\n[\"α-Cetoglutarato\",\"α-Cetoglutarato\",\"5C\",\"Isocitrato desidrogenase\",\"Isocitrato deshidrogenasa\",\"Isocitrato (6C) + NAD⁺\",\"Isocitrato (6C) + NAD⁺\",\"+ NADH + CO₂\",\"Primeira descarboxilação oxidativa: isocitrato é oxidado, NAD⁺ aceita elétrons e um carbono sai como CO₂. Resta α-cetoglutarato de cinco carbonos.\",\"Primera descarboxilación oxidativa: isocitrato se oxida, NAD⁺ acepta electrones y un carbono sale como CO₂. Queda α-cetoglutarato de cinco carbonos.\",\"ADP e Ca²⁺ ativam; ATP e NADH inibem. 1º NADH e 1º CO₂.\",\"ADP y Ca²⁺ activan; ATP y NADH inhiben. 1er NADH y 1er CO₂.\"],\n[\"Succinil-CoA\",\"Succinil-CoA\",\"4C\",\"α-Cetoglutarato desidrogenase\",\"α-Cetoglutarato deshidrogenasa\",\"α-Cetoglutarato (5C) + CoA-SH + NAD⁺\",\"α-Cetoglutarato (5C) + CoA-SH + NAD⁺\",\"+ NADH + CO₂\",\"Segunda descarboxilação oxidativa: perde-se mais um CO₂, produz-se NADH e a coenzima A se liga formando succinil-CoA. O complexo requer TPP/B1, lipoato, CoA/B5, FAD/B2 e NAD⁺/B3.\",\"Segunda descarboxilación oxidativa: se libera otro CO₂ y NADH, y CoA forma succinil-CoA. El complejo necesita TPP/B1, lipoato, CoA/B5, FAD/B2 y NAD⁺/B3.\",\"O NADH e succinil-CoA inibem; Ca²⁺ estimula.\",\"NADH y succinil-CoA inhiben; Ca²⁺ estimula.\"],\n[\"Succinato\",\"Succinato\",\"4C\",\"Succinil-CoA sintetase\",\"Succinil-CoA sintetasa\",\"Succinil-CoA (4C) + GDP + Pi\",\"Succinil-CoA (4C) + GDP + Pi\",\"+ GTP (ou ATP)\",\"A ligação tioéster energética do succinil-CoA permite formar GTP (ou ATP em algumas isoformas), liberando CoA-SH. Esta reação representa fosforilação em nível de substrato.\",\"El enlace tioéster del succinil-CoA permite formar GTP (o ATP según isoforma), liberando CoA-SH. Es fosforilación a nivel de sustrato.\",\"Única etapa com produção direta de nucleotídeo trifosfato no ciclo.\",\"Única etapa que forma directamente un nucleótido trifosfato en el ciclo.\"],\n[\"Fumarato\",\"Fumarato\",\"4C\",\"Succinato desidrogenase\",\"Succinato deshidrogenasa\",\"Succinato (4C) + FAD\",\"Succinato (4C) + FAD\",\"+ FADH₂ → QH₂\",\"O succinato perde dois hidrogênios e forma uma dupla ligação, originando fumarato. FAD ligado à enzima é reduzido e entrega seus elétrons à ubiquinona. Essa enzima também é o complexo II respiratório.\",\"Succinato pierde dos hidrógenos y forma doble enlace para generar fumarato. FAD unido a la enzima se reduce y entrega electrones a ubiquinona. Esta enzima constituye el complejo II.\",\"Única enzima do ciclo situada na membrana mitocondrial interna; complexo II não bombeia H⁺.\",\"Única enzima del ciclo en membrana mitocondrial interna; complejo II no bombea H⁺.\"],\n[\"L-Malato\",\"L-Malato\",\"4C\",\"Fumarase\",\"Fumarasa\",\"Fumarato (4C) + H₂O\",\"Fumarato (4C) + H₂O\",\"+ H₂O\",\"A fumarase incorpora água de modo estereoespecífico à dupla ligação do fumarato e forma L-malato. É hidratação, e não uma etapa de oxidação.\",\"La fumarasa incorpora agua estereoespecíficamente al doble enlace de fumarato y forma L-malato. Es hidratación, no oxidación.\",\"Não produz coenzimas reduzidas.\",\"No produce coenzimas reducidas.\"],\n[\"Oxaloacetato\",\"Oxaloacetato\",\"4C\",\"Malato desidrogenase\",\"Malato deshidrogenasa\",\"L-Malato (4C) + NAD⁺\",\"L-Malato (4C) + NAD⁺\",\"+ NADH + H⁺\",\"O malato é oxidado a oxaloacetato; NAD⁺ recebe elétrons e forma o terceiro NADH. A citrato sintase consome o oxaloacetato recém-formado, favorecendo a continuidade da via.\",\"El malato se oxida a oxaloacetato; NAD⁺ acepta electrones y forma el tercer NADH. La citrato sintasa consume oxaloacetato y favorece la continuidad de la vía.\",\"Oxaloacetato se regenera; não é consumido no balanço líquido.\",\"Oxaloacetato se regenera; no se consume en el balance neto.\"]\n];\nwindow.BIO2P2_KREBS_STEPS=entries;\n\nconst es=()=>document.documentElement.lang===\"es-PY\",tr=(p,e)=>es()?e:p;\nconst escapeHtml=s=>String(s).replace(/[&\u003c>\"]/g,c=>({\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]));\nconst N=8,CX=550,CY=500,R=270,RN=40,R_ENZ=190,R_CHIP=372;\nconst GAP=Math.asin((RN+9)/R)*180/Math.PI;\nconst P=(a,r)=>{const t=a*Math.PI/180;return [CX+r*Math.sin(t),CY-r*Math.cos(t)]};\nconst f1=n=>n.toFixed(1);\nconst CC={6:\"#38e8c0\",5:\"#4f9cf9\",4:\"#f9c94f\"};\nconst KIND={c:\"#f9c94f\",o:\"#9fb0d6\",n:\"#38e8c0\",f:\"#c47bff\",g:\"#f9c94f\",x:\"#f9784f\"};\nconst REGULATED=[0,2,3];\nconst TYPE=[[\"Condensação\",\"Condensación\"],[\"Isomerização\",\"Isomerización\"],[\"Oxidação + descarboxilação\",\"Oxidación + descarboxilación\"],[\"Oxidação + descarboxilação\",\"Oxidación + descarboxilación\"],[\"Fosforilação em nível de substrato\",\"Fosforilación a nivel de sustrato\"],[\"Oxidação (desidrogenação)\",\"Oxidación (deshidrogenación)\"],[\"Hidratação\",\"Hidratación\"],[\"Oxidação (desidrogenação)\",\"Oxidación (deshidrogenación)\"]];\nconst CARB=[[\"4C + 2C → 6C\",\"entram 2 carbonos novos\",\"entran 2 carbonos nuevos\"],[\"6C → 6C\",\"só muda o OH de lugar\",\"solo cambia el OH de lugar\"],[\"6C → 5C\",\"perde 1 carbono (CO₂)\",\"pierde 1 carbono (CO₂)\"],[\"5C → 4C\",\"perde 1 carbono (CO₂)\",\"pierde 1 carbono (CO₂)\"],[\"4C → 4C\",\"sem perda de carbono\",\"sin pérdida de carbono\"],[\"4C → 4C\",\"sem perda de carbono\",\"sin pérdida de carbono\"],[\"4C → 4C\",\"sem perda de carbono\",\"sin pérdida de carbono\"],[\"4C → 4C\",\"sem perda de carbono\",\"sin pérdida de carbono\"]];\nconst RENDE=[\"—\",\"—\",\"1 NADH + 1 CO₂\",\"1 NADH + 1 CO₂\",\"1 GTP\",\"1 FADH₂\",\"—\",\"1 NADH\"];\nconst GAIN=[{},{},{n:1,x:1},{n:1,x:1},{g:1},{f:1},{},{n:1}];\nconst FRASE=[\n[\"O acetil (2C) entra e se junta ao oxaloacetato (4C): nasce o citrato (6C). É a «porta de entrada» do ciclo.\",\"El acetilo (2C) entra y se une al oxaloacetato (4C): nace el citrato (6C). Es la «puerta de entrada» del ciclo.\"],\n[\"O citrato troca o OH de lugar (passando pelo cis-aconitato) e vira isocitrato, pronto para ser oxidado. Nada é ganho nem perdido.\",\"El citrato cambia el OH de lugar (pasando por cis-aconitato) y se vuelve isocitrato, listo para oxidarse. No se gana ni se pierde nada.\"],\n[\"Primeira «colheita»: o isocitrato é oxidado, rende 1 NADH e solta o 1º CO₂. A molécula passa de 6C para 5C.\",\"Primera «cosecha»: el isocitrato se oxida, rinde 1 NADH y libera el 1.er CO₂. La molécula pasa de 6C a 5C.\"],\n[\"Segunda colheita: o α-cetoglutarato rende 1 NADH, solta o 2º CO₂ e recebe a CoA. Passa de 5C para 4C.\",\"Segunda cosecha: el α-cetoglutarato rinde 1 NADH, libera el 2.º CO₂ y recibe la CoA. Pasa de 5C a 4C.\"],\n[\"A energia da ligação tioéster do succinil-CoA é usada para formar GTP (ou ATP): a única etapa com nucleotídeo trifosfato direto.\",\"La energía del enlace tioéster del succinil-CoA se usa para formar GTP (o ATP): única etapa con nucleótido trifosfato directo.\"],\n[\"O succinato perde 2 H e vira fumarato. O FAD (preso à enzima) vira FADH₂ e entrega elétrons à cadeia respiratória (complexo II).\",\"El succinato pierde 2 H y se vuelve fumarato. El FAD (unido a la enzima) pasa a FADH₂ y cede electrones a la cadena respiratoria (complejo II).\"],\n[\"Entra uma molécula de água na dupla ligação: fumarato vira L-malato. É só hidratação, sem oxidação.\",\"Entra una molécula de agua en el doble enlace: fumarato pasa a L-malato. Es solo hidratación, sin oxidación.\"],\n[\"Última oxidação: o malato rende o 3º NADH e o oxaloacetato é regenerado. O ciclo está pronto para outra volta.\",\"Última oxidación: el malato rinde el 3.er NADH y se regenera el oxaloacetato. El ciclo queda listo para otra vuelta.\"]\n];\nconst dots=(c,col)=>Array.from({length:c},()=>'\u003ci style=\"background:'+col+'\">\u003c/i>').join(\"\");\nconst mol=(name,c)=>{const col=CC[c]||\"#ff8fb1\";return '\u003cdiv class=\"kx-mol\" style=\"--c:'+col+'\">\u003cb>'+escapeHtml(name)+'\u003c/b>\u003cspan class=\"kx-cn\" style=\"color:'+col+'\">'+c+'C\u003c/span>\u003cspan class=\"kx-dots\">'+dots(c,col)+'\u003c/span>\u003c/div>'};\nfunction flowHTML(i){\n const d=entries[i],pv=entries[(i+N-1)%N];\n const subs=mol(tr(pv[0],pv[1]),parseInt(pv[2],10))+(i===0?'\u003cspan class=\"kx-plus\">+\u003c/span>'+mol(\"Acetil-CoA\",2):\"\");\n const chips=CHIPS[i].map(l=>'\u003cspan style=\"color:'+KIND[l[0]]+'\">'+escapeHtml(l[1])+'\u003c/span>').join(\"\");\n return '\u003cdiv class=\"kx-fstrip\">'+subs+'\u003cdiv class=\"kx-fmid\">\u003cspan class=\"kx-fenz\">'+escapeHtml(tr(d[3],d[4]))+'\u003c/span>\u003cspan class=\"kx-farrow\">⟶\u003c/span>\u003cspan class=\"kx-ftype\">'+escapeHtml(tr(TYPE[i][0],TYPE[i][1]))+'\u003c/span>\u003cdiv class=\"kx-fchips\">'+chips+'\u003c/div>\u003c/div>'+mol(tr(d[0],d[1]),parseInt(d[2],10))+'\u003c/div>';\n}\nfunction trackHTML(i){\n const tot={n:0,f:0,g:0,x:0},now={n:0,f:0,g:0,x:0};\n GAIN.forEach((g,k)=>{if(k\u003c=i)for(const key in g)tot[key]+=g[key];if(k===i)for(const key in g)now[key]=g[key]});\n const defs=[[\"n\",\"NADH\",3],[\"f\",\"FADH₂\",1],[\"g\",\"GTP\",1],[\"x\",\"CO₂\",2]];\n return '\u003cdiv class=\"kx-track\">\u003cspan class=\"kx-trk-t\">'+tr(\"Saldo acumulado até esta etapa (1 volta)\",\"Saldo acumulado hasta esta etapa (1 vuelta)\")+'\u003c/span>'+defs.map(([k,nm,max])=>{let p=\"\";for(let j=0;j\u003cmax;j++)p+='\u003ci class=\"'+(j\u003ctot[k]?\"on\":\"\")+(j>=tot[k]-now[k]&&j\u003ctot[k]?\" new\":\"\")+'\" style=\"--c:'+KIND[k]+'\">\u003c/i>';return '\u003cspan class=\"kx-trk\" style=\"color:'+KIND[k]+'\">\u003cb>'+nm+'\u003c/b>'+p+'\u003cem>'+tot[k]+'/'+max+'\u003c/em>\u003c/span>'}).join(\"\")+'\u003c/div>';\n}\n/* [tipo, texto]: ↓ entra · ↑ sai. n=NADH, f=FADH₂, g=GTP, x=CO₂, c=carbono, o=outros */\nconst CHIPS=[\n [[\"c\",\"↓ Acetil-CoA (2C)\"],[\"o\",\"↑ CoA-SH\"]],\n [[\"o\",\"↑↓ H₂O\"]],\n [[\"n\",\"NAD⁺ → NADH\"],[\"x\",\"↑ CO₂\"]],\n [[\"n\",\"NAD⁺ → NADH\"],[\"x\",\"↑ CO₂\"],[\"o\",\"↓ CoA-SH\"]],\n [[\"g\",\"GDP + Pi → GTP\"],[\"o\",\"↑ CoA-SH\"]],\n [[\"f\",\"FAD → FADH₂\"]],\n [[\"o\",\"↓ H₂O\"]],\n [[\"n\",\"NAD⁺ → NADH\"]]\n];\nfunction splitName(s){\n if(s.length\u003c=14||s.indexOf(\" \")\u003c0)return [s];\n let best=-1,bd=1e9;\n for(let i=0;i\u003cs.length;i++)if(s[i]===\" \"){const d=Math.abs(i-s.length/2);if(d\u003cbd){bd=d;best=i}}\n return [s.slice(0,best),s.slice(best+1)];\n}\nlet playTimer=null;\nconst stopPlay=()=>{if(playTimer){clearInterval(playTimer);playTimer=null}};\nconst circle=document.createElement(\"div\");circle.className=\"enzo-krebs-figure kx\";\nconst layout=document.createElement(\"div\");layout.className=\"kx-layout\";const side=document.createElement(\"div\");side.className=\"kx-side\";const extra=document.createElement(\"div\");extra.className=\"kx-extra\";old.replaceWith(layout);layout.append(circle,side);layout.after(extra);\nconst panel=document.getElementById(\"enzoKrebsInfo\");panel.classList.add(\"enzo-krebs-panel\");\nconst foot=document.createElement(\"div\");foot.className=\"enzo-krebs-control\";side.append(foot,panel);\n\nfunction buildSVG(){\n let s='\u003csvg class=\"kx-svg\" viewBox=\"0 0 1100 1000\" role=\"group\" aria-label=\"'+escapeHtml(tr(\"Ciclo de Krebs: oito reações na matriz mitocondrial\",\"Ciclo de Krebs: ocho reacciones en la matriz mitocondrial\"))+'\">';\n s+='\u003cdefs>\u003cradialGradient id=\"kxMatrix\" cx=\"50%\" cy=\"48%\" r=\"60%\">\u003cstop offset=\"0\" stop-color=\"#1c2b4a\"/>\u003cstop offset=\".7\" stop-color=\"#101a31\"/>\u003cstop offset=\"1\" stop-color=\"#0a1121\"/>\u003c/radialGradient>'\n  +'\u003cradialGradient id=\"kxHub\" cx=\"45%\" cy=\"30%\" r=\"80%\">\u003cstop offset=\"0\" stop-color=\"#2a3d63\"/>\u003cstop offset=\"1\" stop-color=\"#0a1424\"/>\u003c/radialGradient>'\n  +'\u003cmarker id=\"kxArr\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"3.4\" markerHeight=\"3.4\" orient=\"auto\">\u003cpath d=\"M0 0L10 5L0 10z\" fill=\"#6a8fd0\"/>\u003c/marker>'\n  +'\u003cmarker id=\"kxArrOn\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"3.4\" markerHeight=\"3.4\" orient=\"auto\">\u003cpath d=\"M0 0L10 5L0 10z\" fill=\"#38e8c0\"/>\u003c/marker>\u003c/defs>';\n /* mitocôndria: membrana externa, membrana interna, cristas */\n s+='\u003cellipse cx=\"550\" cy=\"500\" rx=\"540\" ry=\"486\" fill=\"#0b1426\" stroke=\"#3a5f96\" stroke-width=\"3\"/>';\n s+='\u003cellipse cx=\"550\" cy=\"500\" rx=\"518\" ry=\"464\" fill=\"url(#kxMatrix)\" stroke=\"#4f86d6\" stroke-opacity=\".75\" stroke-width=\"2.5\"/>';\n for(const y of [300,380,460,540,620,700]){\n  const k=Math.sqrt(1-Math.pow((y-500)/464,2)),ex=518*k;\n  const lx=550-ex,rx=550+ex;\n  const fold=(x,d)=>'M'+f1(x)+' '+y+' C'+f1(x+d*92)+' '+(y-8)+' '+f1(x+d*92)+' '+(y+44)+' '+f1(x)+' '+(y+52);\n  s+='\u003cpath d=\"'+fold(lx,1)+'\" fill=\"none\" stroke=\"#4f86d6\" stroke-opacity=\".16\" stroke-width=\"16\" stroke-linecap=\"round\"/>\u003 ground: linear-gradient(135deg, var(--accent), var(--accent2));\n  color: var(--bg);\n  font-family: var(--font-mono);\n  font-size: 11px; font-weight:600;\n  letter-spacing:2px; text-transform:uppercase;\n  padding: 4px 14px; border-radius:20px; margin-bottom:16px;\n}\nheader h1 {\n  font-family: var(--font-display);\n  font-size: clamp(24px, 4vw, 44px);\n  font-weight: 800; letter-spacing:-1px;\n  background: linear-gradient(135deg, #fff 0%, var(--accent) 50%, var(--accent2) 100%);\n  -webkit-background-clip:text; -webkit-text-fill-color:transparent;\n  background-clip: text; margin-bottom:8px;\n}\nheader .sub { color: var(--muted); font-size:13px; letter-spacing:1px; }\nheader .by { margin-top:12px; color: var(--accent2); font-family:var(--font-mono); font-size:12px; }\nheader .psalm { margin-top:8px; color:var(--gold); font-size:12px; font-style:italic; opacity:0.8; }\n\n/* ── TABS ── */\nnav.tabs {\n  position:sticky; top:0; z-index:100;\n  display:flex; gap:4px; flex-wrap:wrap;\n  background: rgba(10,13,20,0.97);\n  backdrop-filter: blur(20px);\n  border-bottom: 1px solid var(--border);\n  padding: 10px 16px;\n  justify-content: center;\n}\nnav.tabs button {\n  background: var(--card);\n  border: 1px solid var(--border);\n  color: var(--muted);\n  font-family: var(--font-body); font-size:12px; font-weight:600;\n  padding: 6px 14px; border-radius: 8px; cursor:pointer;\n  transition: all 0.2s; letter-spacing: 0.3px;\n}\nnav.tabs button:hover { color: var(--accent); border-color: var(--accent); }\nnav.tabs button.active {\n  background: var(--accent); color: var(--bg);\n  border-color: var(--accent);\n  box-shadow: 0 0 20px rgba(79,156,249,0.4);\n}\nnav.tabs button.fc-tab.active { background: var(--gold); color: var(--bg); border-color: var(--gold); box-shadow: 0 0 20px rgba(249,201,79,0.4); }\nnav.tabs button.qz-tab.active { background: var(--accent4); color: #fff; border-color: var(--accent4); box-shadow: 0 0 20px rgba(184,79,249,0.4); }\n\n/* ── SECTIONS ── */\n.section { display:none; animation: fadeIn 0.4s ease; }\n.section.active { display:block; }\n@keyframes fadeIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }\n\n.container { max-width:1100px; margin:0 auto; padding: 32px 20px; position:relative; z-index:1; }\n\n/* ── CHAPTER TITLE ── */\n.chapter-title {\n  font-family: var(--font-display); font-size:22px; font-weight:700;\n  color: var(--accent); margin-bottom:24px;\n  display:flex; align-items:center; gap:12px;\n}\n.chapter-title::after {\n  content:''; flex:1; height:1px;\n  background: linear-gradient(90deg, var(--border), transparent);\n}\n.chap-icon { font-size:24px; }\n\n/* ── GLOSSARY GRID ── */\n.glossary-grid {\n  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));\n  gap: 14px; margin-bottom:32px;\n}\n.gloss-card {\n  background: var(--card); border:1px solid var(--border);\n  border-radius:var(--radius); padding:18px 20px;\n  cursor:pointer; transition: all 0.25s;\n  position:relative; overflow:hidden;\n}\n.gloss-card::before {\n  content:''; position:absolute; top:0; left:0; right:0; height:3px;\n  background: linear-gradient(90deg, var(--accent), var(--accent2));\n  border-radius:3px 3px 0 0;\n}\n.gloss-card:hover {\n  transform:translateY(-2px); border-color: var(--accent);\n  box-shadow: 0 8px 30px rgba(79,156,249,0.2);\n}\n.gloss-card .term {\n  font-family:var(--font-mono); font-size:13px; color:var(--accent2);\n  font-weight:600; margin-bottom:6px;\n}\n.gloss-card .def { color:var(--text); font-size:13px; line-height:1.6; }\n\n/* ── INFO BLOCKS ── */\n.info-block {\n  background: var(--card2); border-left: 3px solid var(--accent);\n  border-radius: 0 12px 12px 0;\n  padding: 16px 20px; margin-bottom:20px;\n}\n.info-block.warn { border-color: var(--gold); }\n.info-block.danger { border-color: var(--red); }\n.info-block.success { border-color: var(--green); }\n.info-block.purple { border-color: var(--accent4); }\n.info-block .label {\n  font-family:var(--font-mono); font-size:10px; letter-spacing:2px;\n  text-transform:uppercase; color:var(--muted); margin-bottom:8px;\n}\n.info-block h4 { font-family:var(--font-display); font-weight:700; margin-bottom:8px; font-size:15px; color:#fff; }\n.info-block p { color: var(--text); }\n.info-block ul, .info-block ol { padding-left:20px; margin-top:8px; color:var(--text); }\n.info-block li { margin:4px 0; }\n\n/* ── COMPARE TABLE ── */\n.compare-table {\n  width:100%; border-collapse:separate; border-spacing:0;\n  border-radius:var(--radius); overflow:hidden; margin-bottom:28px;\n}\n.compare-table th {\n  background: var(--card2); color:var(--accent);\n  font-family:var(--font-display); font-size:13px; font-weight:700;\n  padding:12px 16px; text-align:left;\n  border-bottom:1px solid var(--border);\n}\n.compare-table td {\n  background: var(--card); padding:10px 16px; font-size:13px;\n  border-bottom:1px solid rgba(255,255,255,0.04); color:var(--text);\n}\n.compare-table tr:last-child td { border-bottom:none; }\n.compare-table tr:hover td { background: var(--card2); }\n\n/* ── SECTION DIVIDER ── */\n.sec-divider {\n  display:flex; align-items:center; gap:12px;\n  margin: 32px 0 20px;\n}\n.sec-divider h3 {\n  font-family:var(--font-display); font-weight:700; font-size:17px;\n  color:var(--accent3); white-space:nowrap;\n}\n.sec-divider::before, .sec-divider::after {\n  content:''; flex:1; height:1px;\n  background: linear-gradient(90deg, transparent, var(--border), transparent);\n}\n\n/* ── FORMULA BOX ── */\n.formula-box {\n  background: rgba(56,232,192,0.06);\n  border: 1px solid rgba(56,232,192,0.25);\n  border-left: 4px solid var(--accent2);\n  border-radius: 0 12px 12px 0;\n  padding:14px 20px; margin-bottom:20px;\n  font-family: var(--font-mono); font-size:15px;\n  color: var(--accent2); font-weight:700;\n}\n.formula-box .formula-label {\n  font-size:10px; letter-spacing:2px; text-transform:uppercase;\n  color:var(--muted); margin-bottom:6px; font-family:var(--font-body);\n}\n\n/* ── EXAMPLE BOX ── */\n.example-box {\n  background:rgba(249,120,79,0.06);\n  border:1px solid rgba(249,120,79,0.2);\n  border-left:4px solid var(--accent3);\n  border-radius:0 12px 12px 0;\n  padding:12px 18px; margin:12px 0 20px;\n}\n.example-box .ex-label {\n  font-size:10px; letter-spacing:2px; text-transform:uppercase;\n  color:var(--accent3); font-weight:700; margin-bottom:6px;\n}\n.example-box p { color:var(--text); font-size:13px; }\n\n/* ── FLASHCARD GRID ── */\n.flashcard-grid {\n  display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));\n  gap:20px; margin-bottom:32px;\n}\n.flashcard { perspective:1000px; height:235px; cursor:pointer; }\n.flashcard-inner {\n  position:relative; width:100%; height:100%;\n  transition: transform 0.6s cubic-bezier(0.4,0,0.2,1);\n  transform-style: preserve-3d;\n}\n.flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }\n.flashcard-front, .flashcard-back {\n  position:absolute; inset:0; border-radius:var(--radius);\n  backface-visibility:hidden; padding:22px;\n  display:flex; flex-direction:column; justify-content:space-between;\n}\n.flashcard-front {\n  background: linear-gradient(135deg, var(--card) 0%, var(--card2) 100%);\n  border: 1px solid var(--border);\n}\n.flashcard-back {\n  transform: rotateY(180deg);\n  background: linear-gradient(135deg, #1a1a3a 0%, #1a2a3e 100%);\n  border: 1px solid rgba(79,156,249,0.3);\n  overflow-y:auto; font-size:12.5px; line-height:1.7;\n}\n.fc-tag {\n  font-family:var(--font-mono); font-size:11px;\n  color:var(--accent2); letter-spacing:1px; text-transform:uppercase;\n}\n.fc-q {\n  font-family:var(--font-display); font-size:16px; font-weight:700;\n  color:#fff; line-height:1.3; margin:8px 0;\n}\n.fc-hint { font-size:11px; color:var(--accent); text-align:right; opacity:0.7; }\n.fc-back-text { color:var(--text); white-space:pre-line; }\n\n/* ── QUIZ ── */\n.q-stats { display:flex; gap:1rem; justify-content:center; margin-bottom:2rem; min-width:680px;width:680px}\n .enzo-krebs-node{width:15.5%;height:13%;min-height:80px;font-size:12px}\n .enzo-krebs-node .enzo-krebs-num{font-size:12px}\n .enzo-krebs-node small{font-size:10px}\n .enzo-krebs-core{width:35%;height:35%;font-size:13px}\n .enzo-krebs-core b,.enzo-krebs-core small{font-size:10px}\n #flashcards .flashcard{height:310px}\n}\n\n\u003c/style>\u003cstyle>\n/* Bioquímica II — P2: bioquimica_2_p2_estudo.css incorporado */\n\n.enzo-deep-intro{padding:26px 22px 12px;margin-top:30px;border-top:1px solid var(--border)}\n.enzo-deep-intro>span,.enzo-path-title{font:700 11px var(--font-mono);color:var(--accent2);letter-spacing:.06em}\n.enzo-deep-intro h2{font:800 clamp(19px,3vw,27px) var(--font-display);color:var(--text);margin:12px 0}\n.enzo-deep-intro p{color:var(--muted);font-size:14px;line-height:1.7}\n.enzo-pathway{border:1px solid var(--border);border-radius:18px;background:linear-gradient(125deg,var(--card),var(--bg2));padding:22px 18px;margin:14px 0 28px;overflow:hidden}\n.enzo-path-title{margin-bottom:18px}\n.enzo-path-flow{display:flex;flex-wrap:wrap;align-items:stretch;justify-content:center;gap:8px}\n.enzo-path-step{min-width:115px;max-width:148px;flex:1 1 100px;padding:12px 9px;text-align:center;border-radius:12px;border:1px solid rgba(56,232,192,.3);background:rgba(56,232,192,.06);display:flex;flex-direction:column;gap:8px;justify-content:center}\n.enzo-path-step b{font:700 12px var(--font-body);color:var(--text);line-height:1.25}\n.enzo-path-index{font:700 10px var(--font-mono);color:var(--accent2)}\n.enzo-path-arrow{align-self:center;font-size:20px;color:var(--gold)}\n.enzo-concept-list{counter-reset:enzo;list-style:none;margin:8px 0;padding:0}\n.enzo-concept-list li{display:grid;grid-template-columns:24px 1fr;gap:0 10px;margin:0;padding:13px 4px;border-bottom:1px solid rgba(79,156,249,.13)}\n.enzo-concept-list li:before{counter-increment:enzo;content:counter(enzo,decimal-leading-zero);grid-row:span 2;font:700 11px var(--font-mono);color:var(--accent2);padding-top:6px}\n.enzo-concept-list li p{grid-column:2;font-size:14px;line-height:1.7;margin:0 0 5px}\n.enzo-concept-list li span{grid-column:2;color:var(--muted);font-size:13px;line-height:1.6}\n.enzo-term{color:var(--gold);font-weight:800}\n.enzo-membrane-wrap{border-radius:13px;border:1px solid rgba(79,156,249,.2);background:#0b1221;margin:15px 0 20px;overflow:hidden}\n.enzo-h-space{color:var(--accent2);font:600 11px var(--font-mono);padding:13px;text-align:center;letter-spacing:.02em}\n.enzo-h-space strong{color:var(--gold)}\n.enzo-membrane{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:repeating-linear-gradient(90deg,#37507b 0,#37507b 13px,#25395c 13px,#25395c 25px);padding:12px}\n.enzo-complex{border:2px solid var(--accent2);border-radius:12px;background:#18283e;padding:16px 8px;text-align:center;font:800 22px var(--font-display);color:var(--text)}\n.enzo-complex small{display:block;color:var(--gold);font:600 11px var(--font-mono)}\n.enzo-atp{border-color:var(--gold)}\n.enzo-matrix{padding:15px;color:var(--muted);font-size:12px;line-height:1.8;text-align:center}\n.enzo-krebs-integracao{padding:20px;border:1px solid rgba(249,201,79,.3);background:rgba(249,201,79,.06);border-radius:14px;margin:20px 0}\n.enzo-krebs-integracao strong{color:var(--gold)}\n.enzo-krebs-integracao div{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}\n.enzo-krebs-integracao div span{background:#1f2845;border:1px solid rgba(249,201,79,.3);border-radius:10px;padding:10px;font:700 13px var(--font-mono)}\n.enzo-krebs-integracao p{font-size:13px;line-height:1.7}\n@media(max-width:650px){.enzo-path-step{min-width:80px;flex-basis:85px}.enzo-path-arrow{font-size:14px}.enzo-complex{font-size:14px;padding:9px 2px}.enzo-deep-intro{padding:16px 4px 8px}}\n\nnav.tabs button .enzo-vector-icon{width:17px;height:17px;display:inline-block;vertical-align:-4px;margin-right:6px;flex:0 0 auto;color:currentColor}\n#topicCards .intro-card .ic-icon{display:flex;justify-content:flex-start;align-items:center;height:34px;margin-bottom:12px}\n#topicCards .intro-card .enzo-vector-icon{width:31px;height:31px;color:var(--accent2);filter:drop-shadow(0 0 6px rgba(56,232,192,.18))}\nnav.tabs button:hover .enzo-vector-icon,nav.tabs button.active .enzo-vector-icon{color:inherit}\n\n.enzo-gap-choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}\n.enzo-gap-choices .opt-btn{border:1px solid rgba(56,232,192,.22);background:rgba(56,232,192,.055);text-align:center;justify-content:center;border-radius:12px;font-weight:700}\n.enzo-gap-filled{display:inline-block;padding:3px 9px;border-radius:8px;font-weight:800}\n.enzo-gap-filled.correct{background:rgba(74,222,128,.16);color:var(--green);border:1px solid rgba(74,222,128,.4)}\n.enzo-gap-filled.incorrect{background:rgba(249,95,95,.15);color:var(--red);border:1px solid rgba(249,95,95,.4)}\n\n\u003c/style>\u003cstyle>/* Diagrama do ciclo de Krebs (SVG) — usa os tokens da página */\n.enzo-krebs-figure.kx{padding:14px 14px 10px;overflow-x:auto}\n.kx-svg{display:block;width:100%;height:auto;max-width:980px;margin:0 auto;overflow:visible;user-select:none;-webkit-tap-highlight-color:transparent}\n.kx-svg text{font-family:var(--font-body)}\n.kx-matrix-label{font:700 15px var(--font-mono);letter-spacing:.28em;fill:#4f86d6;opacity:.7}\n.kx-link{stroke:#4f6ea3;stroke-width:1.5;stroke-dasharray:2 5;opacity:.7}\n/* setas */\n.kx-arc{cursor:pointer}\n.kx-hit{fill:none;stroke:transparent;stroke-width:34}\n.kx-arc-line{fill:none;stroke:#6a8fd0;stroke-width:6;stroke-linecap:butt;opacity:.8;transition:stroke .2s,stroke-width .2s}\n.kx-flow{fill:none;stroke:#fff;stroke-width:3;stroke-dasharray:2 16;opacity:0;stroke-linecap:round}\n.kx-arc.active .kx-arc-line{stroke:var(--accent2);stroke-width:9;opacity:1;filter:drop-shadow(0 0 7px rgba(56,232,192,.55))}\n.kx-arc.active .kx-flow{opacity:.85;animation:kxflow 1s linear infinite}\n@keyframes kxflow{to{stroke-dashoffset:-18}}\n.kx-arc:hover 0 12px var(--c)}.kx-trk em{font-style:normal;color:var(--muted);font-size:11px}\n@media(max-width:650px){.kx-fstrip{flex-direction:column}.kx-farrow{transform:rotate(90deg)}.kx-table th:nth-child(3),.kx-table td:nth-child(3){display:none}}\n/* painel lateral fixo no computador: o aluno clica no ciclo e lê/avança sem rolar */\n.kx-extra{margin-top:18px}\n.kx-extra .kx-table,.kx-extra .kx-guide,.kx-extra .kx-gloss{max-width:1100px}\n.enzo-krebs-control{position:sticky;bottom:10px;z-index:5}\n@media(min-width:1100px){\n #krebs .container{max-width:min(1600px,97vw)}\n #krebs .container>.chapter-title,#krebs .container>.info-block,#krebs .container>.unit-banner{max-width:1060px;margin-left:auto;margin-right:auto}\n .kx-layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(400px,.85fr);gap:20px;align-items:start}\n .enzo-krebs-figure.kx{margin:0;padding:10px 14px 8px}\n .kx-svg{max-height:calc(100vh - 205px)}\n .kx-side{position:sticky;top:70px;max-height:calc(100vh - 86px);display:flex;flex-direction:column;gap:10px}\n .kx-side .enzo-krebs-control{position:static;margin:0;flex:0 0 auto}\n .kx-side .enzo-krebs-panel{margin:0;min-height:0;flex:1 1 auto;overflow-y:auto;padding:18px!important}\n .kx-side .kx-fstrip{flex-direction:column;gap:6px}.kx-side .kx-farrow{transform:rotate(90deg);font-size:24px}\n .kx-side .kx-fmid{max-width:none}\n .kx-now{display:none}\n .kx-caption{display:none}\n}\n@media(max-width:1099px){\n .enzo-krebs-control{background:rgba(10,13,20,.92);backdrop-filter:blur(8px);padding:8px;border-radius:12px;border:1px solid var(--border)}\n}\n.kx-caption{margin:8px auto 4px;text-align:center}\n.enzo-krebs-control{flex-wrap:wrap}\n@media(max-width:650px){.kx-svg{min-width:760px}.enzo-krebs-figure.kx{padding:8px}}\n@media(prefers-reduced-motion:reduce){.kx-arc.active .kx-flow{animation:none}}\n\u003c/style>\u003cstyle>.info-block p{font-size:15px;line-height:1.8;margin-top:8px}.info-block h4{font-size:17px;line-height:1.4;margin:6px 0}.flashcard{min-height:190px}.intro-card{cursor:pointer}\u003c/style>\u003cstyle>.periodos-bio{position:relative;display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin:1.2rem auto;max-width:58rem}.periodos-bio a{flex:1 1 12rem;padding:.55rem .75rem;color:#e8eaf6;background:#151e34;border:1px solid #506389;border-radius:.65rem;text-decoration:none}.periodos-bio b,.periodos-bio span{display:block}.periodos-bio span{font-size:.82rem}.periodos-bio [aria-current]{border:2px solid #38e8c0}.periodos-bio [aria-current] b{text-decoration:underline}\u003c/style>\u003c/head>\u003cbody>\u003ccanvas id=\"particles\">\u003c/canvas>\n\u003cheader>\u003cdiv class=\"badge\">🧪 Bioquímica II · Final · 2026\u003c/div>\u003ch1>Bioquímica II — Revisão para a Final\u003c/h1>\u003cdiv class=\"periodos-bio\" role=\"navigation\" aria-label=\"Conteúdo do semestre\">\u003ca href=\"?etapa=p1\">\u003cb>P1\u003c/b>\u003cspan>Carboidratos, hormônios e antibióticos\u003c/span>\u003c/a>\u003ca href=\"?etapa=p2\">\u003cb>P2\u003c/b>\u003cspan>Lipídios, aminoácidos e bioenergética\u003c/span>\u003c/a>\u003ca href=\"?etapa=final\" aria-current=\"page\">\u003cb>Final\u003c/b>\u003cspan>Proteassoma, nucleotídeos e heme\u003c/span>\u003c/a>\u003c/div>\u003cp class=\"sub\">\u003cspan class=\"pttext\">Ubiquitina · Purinas · Pirimidinas · Porfirinas e heme\u003c/span>\u003cspan class=\"estext\" style=\"display:none\">Ubiquitina · Purinas · Pirimidinas · Porfirinas y hemo\u003c/span>\u003c/p>\u003cp class=\"by\">Resumos do Enzo · Revisão ativa e bioquímica clínica\u003c/p>\u003c/header>\n\u003cdiv class=\"enzo-langbar\">\u003cbutton class=\"active\" onclick=\"enzoLang(false)\" type=\"button\">🇧🇷 Português\u003c/button>\u003cbutton onclick=\"enzoLang(true)\" type=\"button\">🇵🇾 Español Paraguay\u003c/button>\u003c/div>\u003cnav class=\"tabs\">\u003cbutton class=\"active\" data-section=\"intro\" onclick=\"showSection('intro',this)\">\u003cspan class=\"emoji-icon\">📖\u003c/span> Início\u003c/button>\u003cbutton d
