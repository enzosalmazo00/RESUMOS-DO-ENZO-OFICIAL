c\": \"Sistema ubiquitina-proteassoma\", \"ce\": \"Sistema ubiquitina-proteasoma\", \"q\": \"Como se forma a ligação isopeptídica?\", \"qe\": \"¿Cómo se forma el enlace isopeptídico?\", \"a\": \"Gly76 da ubiquitina + grupo ε-amino da lisina do alvo.\", \"ae\": \"Gly76 de ubiquitina + grupo ε-amino de lisina del blanco.\"}, {\"c\": \"Sistema ubiquitina-proteassoma\", \"ce\": \"Sistema ubiquitina-proteasoma\", \"q\": \"Qual ligação entre ubiquitinas é um sinal clássico de degradação?\", \"qe\": \"¿Qué enlace entre ubiquitinas es señal clásica de degradación?\", \"a\": \"Lys48.\", \"ae\": \"Lys48.\"}, {\"c\": \"Sistema ubiquitina-proteassoma\", \"ce\": \"Sistema ubiquitina-proteasoma\", \"q\": \"Quais marcadores moleculares são destacados no Alzheimer?\", \"qe\": \"¿Qué marcadores moleculares destacan en Alzheimer?\", \"a\": \"Beta-amiloide e tau hiperfosforilada.\", \"ae\": \"Beta-amiloide y tau hiperfosforilada.\"}, {\"c\": \"Sistema ubiquitina-proteassoma\", \"ce\": \"Sistema ubiquitina-proteasoma\", \"q\": \"Qual proteína predomina nos corpos de Lewy?\", \"qe\": \"¿Qué proteína predomina en los cuerpos de Lewy?\", \"a\": \"Alfa-sinucleína.\", \"ae\": \"Alfa-sinucleína.\"}, {\"c\": \"Metabolismo das purinas\", \"ce\": \"Metabolismo de las purinas\", \"q\": \"Quais são as duas bases púricas dos ácidos nucleicos?\", \"qe\": \"¿Cuáles son las dos bases púricas de los ácidos nucleicos?\", \"a\": \"Adenina e guanina.\", \"ae\": \"Adenina y guanina.\"}, {\"c\": \"Metabolismo das purinas\", \"ce\": \"Metabolismo de las purinas\", \"q\": \"Quais posições recebem nitrogênio da glutamina?\", \"qe\": \"¿Qué posiciones reciben nitrógeno de glutamina?\", \"a\": \"N3 e N9.\", \"ae\": \"N3 y N9.\"}, {\"c\": \"Metabolismo das purinas\", \"ce\": \"Metabolismo de las purinas\", \"q\": \"Qual nucleotídeo atua como segundo mensageiro?\", \"qe\": \"¿Qué nucleótido actúa como segundo mensajero?\", \"a\": \"AMPc.\", \"ae\": \"AMPc.\"}, {\"c\": \"Metabolismo das purinas\", \"ce\": \"Metabo [{\"c\": \"Sistema ubiquitina-proteassoma\", \"ce\": \"Sistema ubiquitina-proteasoma\", \"t\": \"mc\", \"q\": \"Quem recebeu o Nobel de 2004 por esse mecanismo?\", \"qe\": \"¿Quién recibió el Nobel de 2004 por este mecanismo?\", \"ex\": \"Alternativa B. Ciechanover, Hershko e Rose. — A analogia do beijo da morte representa uma etiqueta molecular que direciona certas proteínas à destruição. Aaron Ciechanover, Avram Hershko e Irwin Rose receberam o Nobel de Química em 2004 pela descoberta da degradação proteica mediada por ubiquitina. A célula não destrói proteínas indiscriminadamente: seleciona alvos para manter a homeostase.\", \"exe\": \"Opción B. Ciechanover, Hershko y Rose. — La analogía del beso de la muerte representa una etiqueta molecular que dirige ciertas proteínas a su destrucción. Aaron Ciechanover, Avram Hershko e Irwin Rose recibieron el Nobel de Química en 2004 por descubrir la degradación proteica mediada por ubiquitina. La célula selecciona sus blancos para mantener la homeostasis.\", \"n\": 1, \"cr\": \"B\", \"o\": [{\"l\": \"A\", \"v\": \"Krebs, Lipmann e Sanger\", \"ve\": \"Krebs, Lipmann y Sanger\"}, {\"l\": \"B\", \"v\": \"Ciechanover, Hershko e Rose.\", \"ve\": \"Ciechanover, Hershko y Rose.\"}, {\"l\": \"C\", \"v\": \"Banting, Best e Macleod\", \"ve\": \"Banting, Best y Macleod\"}, {\"l\": \"D\", \"v\": \"Watson, Crick e Wilkins\", \"ve\": \"Watson, Crick y Wilkins\"}]}, {\"c\": \"Sistema ubiquitina-proteassoma\", \"ce\": \"Sistema ubiquitina-proteasoma\", \"t\": \"mc\", \"q\": \"Quantos resíduos possui a ubiquitina e qual sua função?\", \"qe\": \"¿Cuántos residuos tiene la ubiquitina y cuál es su función?\", \"ex\": \"Alternativa B. 76; sinaliza proteínas-alvo. — É uma pequena proteína de 76 aminoácidos, altamente conservada. Atua como sinal covalente ligado a uma proteína-alvo. A ubiquitina não corta a proteína; informa ao sistema qual substrato deve ser processado. Nem toda ubiquitinação leva à degradação: o tipo de cadeia importa.\", \"exe\": \"Opción B. 76; señaliza proteínas blanco. — Es una proteína pequeña de 76 aminoácidos, altamente conservada. Actúa como señal covalente unida a una proteína blanco. No corta la proteína: indica qué sustrato debe procesarse. No toda ubiquitinación conduce a degradación; importa el tipo de cadena.\", \"n\": 2, \"cr\": \"B\", \"o\": [{\"l\": \"A\", \"v\": \"26; hidrolisa proteínas\", \"ve\": \"26; hidroliza proteínas\"}, {\"l\": \"B\", \"v\": \"76; sinaliza proteínas-alvo.\", \"ve\": \"76; señaliza proteínas blanco.\"}, {\"l\": \"C\", \"v\": \"120; transporta oxigênio\", \"ve\": \"120; transporta oxígeno\"}, {\"l\": \"D\", \"v\": \"19; sintetiza ATP\", \"ve\": \"19; sintetiza ATP\"}]}, {\"c\": \"Sistema ubiquitina-proteassoma\", \"ce\": \"Sistema ubiquitina-proteasoma\", \"t\": \"mc\", \"q\": \"Qual é a função do núcleo 20S?\", \"qe\": \"¿Cuál es la función del núcleo 20S?\", \"ex\": \"Alternativa B. Hidrolisar ligações peptídicas. — É um complexo proteolítico multimérico. O proteassoma 26S contém um núcleo catalítico 20S e reguladores 19S. O 19S reconhece o substrato marcado, remove ubiquitina, desenrola a proteína e usa ATP para introduzi-la no 20S, onde proteases hidrolisam ligações peptídicas. O produto inicial são peptídeos, posteriormente reduzidos a aminoácidos por outras peptidases.\", \"exe\": \"Opción B. Hidrolizar enlaces peptídicos. — Es un complejo proteolítico multimérico. El proteasoma 26S contiene un núcleo catalítico 20S y reguladores 19S. El 19S reconoce el sustrato marcado, retira ubiquitina, despliega la proteína y usa ATP para introducirla en el 20S, donde se hidrolizan enlaces peptídicos. Los péptidos resultantes pueden convertirse en aminoácidos por otras peptidasas.\", \"n\": 3, \"cr\": \"B\", \"o\": [{\"l\": \"A\", \"v\": \"Reconhecer degrons\", \"ve\": \"Reconocer degrones\"}, {\"l\": \"B\", \"v\": \"Hidrolisar ligações peptídicas.\", \"ve\": \"Hidrolizar enlaces peptídicos.\"}, {\"l\": \"C\", \"v\": \"Sintetizar ligações peptídicas\", \"ve\": \"Sintetizar enlaces peptídicos\"}, {\"l\": \"D\", \"v\": \"Ativar ubiquitina com ATP\", \"ve\": \"Activar ubiquitina con ATP\"}]}, {\"c\": \"Sistema ubiquitina-proteassoma\", \"ce\": \"Sistema ubiquitina-proteasoma\", \"t\": \"mc\", \"q\": \"Onde ocorre a degradação e quais proteínas são removidas?\", \"qe\": \"¿Dónde ocurre la degradación y qué proteínas se eliminan?\", \"ex\": \"Alternativa A. Citosol e núcleo; proteínas defeituosas ou regulatórias de vida curta. — A degradação ocorre principalmente no citosol e no núcleo. Remove proteínas mal dobradas, mutadas ou estruturalmente alteradas e também proteínas normais de vida curta, como reguladores do ciclo celular. Exemplo: eliminar uma proteína defeituosa evita agregados; eliminar uma ciclina na hora certa permite avançar no ciclo celular.\", \"exe\": \"Opción A. Citosol y núcleo; proteínas defectuosas o reguladoras de vida corta. — La degradación ocurre principalmente en citosol y núcleo. Elimina proteínas mal plegadas, mutadas o alteradas y proteínas normales de vida corta, como reguladores del ciclo celular. Ejemplo: eliminar una proteína defectuosa evita agregados; eliminar una ciclina en el momento adecuado permite avanzar en el ciclo celular.\", \"n\": 4, \"cr\": \"A\", \"o\": [{\"l\": \"A\", \"v\": \"Citosol e núcleo; proteínas defeituosas ou regulatórias de vida curta.\", \"ve\": \"Citosol y núcleo; proteínas defectuosas o reguladoras de vida corta.\"}, {\"l\": \"B\", \"v\": \"Plasma; exclusivamente anticorpos\", \"ve\": \"Plasma; exclusivamente anticuerpos\"}, {\"l\": \"C\", \"v\": \"Matriz mitocondrial; somente colágeno\", \"ve\": \"Matriz mitocondrial; solo colágeno\"}, {\"l\": \"D\", \"v\": \"Lúmen intestinal; proteínas alimentares\", \"ve\": \"Luz intestinal; proteínas alimentarias\"}]}, {\"c\": \"Sistema ubiquitina-proteassoma\", \"ce\": \"Sistema ubiquitina-proteasoma\", \"t\": \"mc\", \"q\": \"Qual enzima ativa ubiquitina com ATP?\", \"qe\": \"¿Qué enzima activa ubiquitina con ATP?\", \"ex\": \"Alternativa A. E1. — A enzima ativadora E1 consome ATP para adenilar a extremidade carboxila da ubiquitina e formar uma ligação tioéster entre a ubiquitina e uma cisteína da E1. É a etapa que fornece energia para a transferência posterior.\", \"exe\": \"Opción A. E1. — La enzima activadora E1 consume ATP para adenilar el extremo carboxilo de la ubiquitina y formar un enlace tioéster con una cisteína de E1. Esta etapa aporta energía para la transferencia posterior.\", \"n\": 5, \"cr\": \"A\", \"o\": [{\"l\": \"A\", \"v\": \"E1.\", \"ve\": \"E1.\"}, {\"l\": \"B\", \"v\": \"20S\", \"ve\": \"20S\"}, {\"l\": \"C\", \"v\": \"E3\", \"ve\": \"E3\"}, {\"l\": \"D\", \"v\": \"E2\", \"ve\": \"E2\"}]}, {\"c\": \"Sistema ubiquitina-proteassoma\", \"ce\": \"Sistema ubiquitina-proteasoma\", \"t\": \"mc\", \"q\": \"Qual enzima recebe a ubiquitina de E1?\", \"qe\": \"¿Qué enzima recibe ubiquitina de E1?\", \"ex\": \"Alternativa B. E2. — A enzima conjugadora E2 recebe a ubiquitina ativada de E1 por transferência entre cisteínas. Funciona como transportadora da etiqueta até o complexo que selecionará o alvo.\", \"exe\": \"Opción B. E2. — La enzima conjugadora E2 recibe ubiquitina activada de E1 por transferencia entre cisteínas. Transporta la etiqueta hasta el complejo que seleccionará el blanco.\", \"n\": 6, \"cr\": \"B\", \"o\": [{\"l\": \"A\", \"v\": \"UGT1A1\", \"ve\": \"UGT1A1\"}, {\"l\": \"B\", \"v\": \"E2.\", \"ve\": \"E2.\"}, {\"l\": \"C\", \"v\": \"20S\", \"ve\": \"20S\"}, {\"l\": \"D\", \"v\": \"E3\", \"ve\": \"E3\"}]}, {\"c\": \"Sistema ubiquitina-proteassoma\", \"ce\": \"Sistema ubiquitina-proteasoma\", \"t\": \"mc\", \"q\": \"Qual enzima confere especificidade ao alvo?\", \"qe\": \"¿Qué enzima confiere especificidad al blanco?\", \"ex\": \"Alternativa C. E3. — A ligase E3 reconhece o substrato por sinais de degradação (degrons) e promove a transferência da ubiquitina. É a principal responsável pela especificidade. Algumas E3 transferem diretamente a partir da E2; outr duzidos a aminoácidos por outras peptidases.\", \"exe\": \"Verdadero. Es un complejo proteolítico multimérico. El proteasoma 26S contiene un núcleo catalítico 20S y reguladores 19S. El 19S reconoce el sustrato marcado, retira ubiquitina, despliega la proteína y usa ATP para introducirla en el 20S, donde se hidrolizan enlaces peptídicos. Los péptidos resultantes pueden convertirse en aminoácidos por otras peptidasas.\", \"n\": 19}, {\"c\": \"Sistema ubiquitina-proteassoma\", \"ce\": \"Sistema ubiquitina-proteasoma\", \"t\": \"tf\", \"q\": \"Somente proteínas anormais são degradadas pelo proteassoma; reguladores normais nunca são eliminados.\", \"qe\": \"Solo las proteínas anormales son degradadas por el proteasoma; los reguladores normales nunca se eliminan.\", \"cr\": \"F\", \"ex\": \"Falso. A degradação ocorre principalmente no citosol e no núcleo. Remove proteínas mal dobradas, mutadas ou estruturalmente alteradas e também proteínas normais de vida curta, como reguladores do ciclo celular. Exemplo: eliminar uma proteína defeituosa evita agregados; eliminar uma ciclina na hora certa permite avançar no ciclo celular.\", \"exe\": \"Falso. La degradación ocurre principalmente en citosol y núcleo. Elimina proteínas mal plegadas, mutadas o alteradas y proteínas normales de vida corta, como reguladores del ciclo celular. Ejemplo: eliminar una proteína defectuosa evita agregados; eliminar una ciclina en el momento adecuado permite avanzar en el ciclo celular.\", \"n\": 20}, {\"c\": \"Sistema ubiquitina-proteassoma\", \"ce\": \"Sistema ubiquitina-proteasoma\", \"t\": \"tf\", \"q\": \"A eliminação de ciclinas pode contribuir para a progressão do ciclo celular.\", \"qe\": \"La eliminación de ciclinas puede contribuir a la progresión del ciclo celular.\", \"cr\": \"V\", \"ex\": \"Verdadeiro. A degradação ocorre principalmente no citosol e no núcleo. Remove proteínas mal dobradas, mutadas ou estruturalmente alteradas e também proteínas normais de vida curta, como reguladores do ciclo celular. Exemplo: eliminar uma proteína defeituosa evita agregados; eliminar uma ciclina na hora certa permite avançar no ciclo celular.\", \"exe\": \"Verdadero. La degradación ocurre principalmente en citosol y núcleo. Elimina proteínas mal plegadas, mutadas o alteradas y proteínas normales de vida corta, como reguladores del ciclo celular. Ejemplo: eliminar una proteína defectuosa evita agregados; eliminar una ciclina en el momento adecuado permite avanzar en el ciclo celular.\", \"n\": 21}, {\"c\": \"Sistema ubiquitina-proteassoma\", \"ce\": \"Sistema ubiquitina-proteasoma\", \"t\": \"tf\", \"q\": \"A ativação da ubiquitina pela E1 envolve formação de um intermediário tioéster.\", \"qe\": \"La activación de ubiquitina por E1 implica formar un intermediario tioéster.\", \"cr\": \"V\", \"ex\": \"Verdadeiro. A enzima ativadora E1 consome ATP para adenilar a extremidade carboxila da ubiquitina e formar uma ligação tioéster entre a ubiquitina e uma cisteína da E1. É a etapa que fornece energia para a transferência posterior.\", \"exe\": \"Verdadero. La enzima activadora E1 consume ATP para adenilar el extremo carboxilo de la ubiquitina y formar un enlace tioéster con una cisteína de E1. Esta etapa aporta energía para la transferencia posterior.\", \"n\": 22}, {\"c\": \"Sistema ubiquitina-proteassoma\", \"ce\": \"Sistema ubiquitina-proteasoma\", \"t\": \"tf\", \"q\": \"A E2 recebe a ubiquitina exclusivamente do núcleo 20S.\", \"qe\": \"E2 recibe ubiquitina exclusivamente del núcleo 20S.\", \"cr\": \"F\", \"ex\": \"Falso. A enzima conjugadora E2 recebe a ubiquitina ativada de E1 por transferência entre cisteínas. Funciona como transportadora da etiqueta até o complexo que selecionará o alvo.\", \"exe\": \"Falso. La enzima conjugadora E2 recibe ubiquitina activada de E1 por transferencia entre cisteínas. Transporta la etiqueta hasta el complejo que seleccionará el blanco.\", \"n\": 23}, {\"c\": \"Sistema ubiquitina-proteassoma\", \"ce\": \"Sistema ubiquitina-proteasoma\", \"t\": \"tf\", \"q\": \"Degrons são sinais do substrato reconhecidos por ligases E3.\", \"qe\": \"Los degrones son señales del sustrato reconocidas por ligasas E3.\", \"cr\": \"V\", \"ex\": \"Verdadeiro. A ligase E3 reconhece o substrato por sinais de degradação (degrons) e promove a transferência da ubiquitina. É a principal responsável pela especificidade. Algumas E3 transferem diretamente a partir da E2; outras formam um intermediário próprio.\", \"exe\": \"Verdadero. La ligasa E3 reconoce el sustrato por señales de degradación (degrones) y promueve la transferencia de ubiquitina. Es la principal responsable de la especificidad. Algunas E3 transfieren directamente desde E2 y otras forman un intermediario propio.\", \"n\": 24}, {\"c\": \"Sistema ubiquitina-proteassoma\", \"ce\": \"Sistema ubiquitina-proteasoma\", \"t\": \"tf\", \"q\": \"A ligação clássica entre ubiquitina e substrato envolve a cadeia lateral de uma ribose.\", \"qe\": \"El enlace clásico entre ubiquitina y sustrato implica la cadena lateral de una ribosa.\", \"cr\": \"F\", \"ex\": \"Falso. O grupo carboxila da glicina terminal (Gly76) da ubiquitina liga-se ao grupo ε-amino de uma lisina do substrato. É uma ligação covalente chamada isopeptídica porque envolve a cadeia lateral da lisina, e não a ligação peptídica usual do esqueleto proteico.\", \"exe\": \"Falso. El grupo carboxilo de la glicina terminal (Gly76) de ubiquitina se une al grupo ε-amino de una lisina del sustrato. Es un enlace covalente isopeptídico porque involucra la cadena lateral de lisina, no el enlace peptídico habitual del esqueleto proteico.\", \"n\": 25}, {\"c\": \"Sistema ubiquitina-proteassoma\", \"ce\": \"Sistema ubiquitina-proteasoma\", \"t\": \"tf\", \"q\": \"Desubiquitinases permitem a recuperação de ubiquitina antes da degradação do substrato.\", \"qe\": \"Las desubiquitinasas permiten recuperar ubiquitina antes de degradar el sustrato.\", \"cr\": \"V\", \"ex\": \"Verdadeiro. Novas ubiquitinas podem ser adicionadas à primeira, formando uma cadeia. Cadeias ligadas por Lys48 são um sinal clássico de degradação proteassomal. Desubiquitinases retiram e reciclam a ubiquitina, enquanto o substrato é desenrolado e degradado. Sequência: E1 → E2 → E3 → cadeia → 26S → peptídeos.\", \"exe\": \"Verdadero. Se pueden añadir nuevas ubiquitinas formando una cadena. Las cadenas unidas por Lys48 son una señal clásica de degradación proteasomal. Las desubiquitinasas retiran y reciclan ubiquitina, mientras el sustrato se despliega y degrada. Secuencia: E1 → E2 → E3 → cadena → 26S → péptidos.\", \"n\": 26}, {\"c\": \"Sistema ubiquitina-proteassoma\", \"ce\": \"Sistema ubiquitina-proteasoma\", \"t\": \"tf\", \"q\": \"A alteração da proteostase é comprovadamente a única causa da doença de Alzheimer.\", \"qe\": \"La alteración de proteostasis es comprobadamente la única causa del Alzheimer.\", \"cr\": \"F\", \"ex\": \"Falso. Os slides relacionam o sistema a câncer cervical e colorretal, HPV, esclerose lateral amiotrófica (ELA), Huntington, Alzheimer e Parkinson. No Alzheimer, os marcadores são agregados de beta-amiloide e tau hiperfosforilada, com perda de memória e capacidades cognitivas e morte neuronal. A disfunção da proteostase contribui, mas não é a causa única dessas doenças.\", \"exe\": \"Falso. Las diapositivas relacionan el sistema con cáncer cervical y colorrectal, VPH, esclerosis lateral amiotrófica (ELA), Huntington, Alzheimer y Parkinson. En Alzheimer destacan agregados de beta-amiloide y tau hiperfosforilada, pérdida de memoria y capacidades cognitivas y muerte neuronal. La alteración de proteostasis contribuye, pero no es la única causa.\", \"n\": 27}, {\"c\": \"Sistema ubiquitina-proteassoma\", \"ce\": \"Sistema ubiquitina-proteasoma\", \"t\": \"tf\", \"q\": \"Parkin, codificada por PARK2, é uma ligase E3.\", \"qe\": \"Parkin, codificada por PARK2, es una ligasa E3.\", \"cr\": \"V\", \"ex\": \"Verdadeiro. Rigidez, tremor e dificuldade de locomoção são manifestações motoras; bradicinesia é característica central. Alterações em genes como PARK2 (parkin, uma E3) e UCHL1 (desubiquitinase) podem afetar a homeostase proteica. Corpos de Lewy contêm predominantemente alfa-sinucleína agregada. Nem todo Parkinson é causado por essas mutações.\", \"exe\": \"Verdadero. Rigidez, temblor y dificultad de locomoción son manifestaciones motoras; la bradicinesia es central. Alteraciones de genes como PARK2 (parkin, una E3) y UCHL1 (desubiquitinasa) pueden afectar la homeostasis proteica. Los cuerpos de Lewy contienen principalmente alfa-sinucleína agregada. No todo Parkinson se debe a estas mutaciones.\", \"n\": 28}, {\"c\": \"Sistema ubiquitina-proteassoma\", \"ce\": \"Sistema ubiquitina-proteasoma\", \"t\": \"tf\", \"q\": \"Todos os casos de Parkinson decorrem de mutações em PARK2.\", \"qe\": \"Todos los casos de Parkinson se deben a mutaciones en PARK2.\", \"cr\": \"F\", \"ex\": \"Falso. Rigidez, tremor e dificuldade de locomoção são manifestações motoras; bradicinesia é característica central. Alterações em genes como PARK2 (parkin, uma E3) e UCHL1 (desubiquitinase) podem afetar a homeostase proteica. Corpos de Lewy contêm predominantemente alfa-sinucleína agregada. Nem todo Parkinson é causado por essas mutações.\", \"exe\": \"Falso. Rigidez, temblor y dificultad de locomoción son manifestaciones motoras; la bradicinesia es central. Alteraciones de genes como PARK2 (parkin, una E3) y UCHL1 (desubiquitinasa) pueden afectar la homeostasis proteica. Los cuerpos de Lewy contienen principalmente alfa-sinucleína agregada. No todo Parkinson se debe a estas mutaciones.\", \"n\": 29}, {\"c\": \"Metabolismo das purinas\", \"ce\": \"Metabolismo de las purinas\", \"t\": \"mc\", \"q\": \"Quais são as duas bases púricas dos ácidos nucleicos?\", \"qe\": \"¿Cuáles son las dos bases púricas de los ácidos nucleicos?\", \"ex\": \"Alternativa D. Adenina e guanina. — Purinas são bases nitrogenadas heterocíclicas de dois anéis fundidos: um de seis membros (pirimidina) e outro de cinco (imidazol). Adenina e guanina integram DNA e RNA. Base + açúcar = nucleosídeo; nucleosídeo + fosfato = nucleotídeo. Exemplo: adenina + ribose = adenosina; adenosina + três fosfatos = ATP.\", \"exe\": \"Opción D. Adenina y guanina. — Las purinas son bases nitrogenadas heterocíclicas de dos anillos fusionados: uno de seis miembros (pirimidina) y otro de cinco (imidazol). Adenina y guanina integran ADN y ARN. Base + azúcar = nucleósido; nucleósido + fosfato = nucleótido. Ejemplo: adenina + ribosa = adenosina; adenosina + tres fosfatos = ATP.\", \"n\": 30, \"cr\": \"D\", \"o\": [{\"l\": \"A\", \"v\": \"Guanina e citosina\", \"ve\": \"Guanina y citosina\"}, {\"l\": \"B\", \"v\": \"Uracila e adenina\", \"ve\": \"Uracilo y adenina\"}, {\"l\": \"C\", \"v\": \"Citosina e timina\", \"ve\": \"Citosina y timina\"}, {\"l\": \"D\", \"v\": \"Adenina e guanina.\", \"ve\": \"Adenina y guanina.\"}]}, {\"c\": \"Metabolismo das purinas\", \"ce\": \"Metabolismo de las purinas\", \"t\": \"mc\", \"q\": \"Quais posições recebem nitrogênio da glutamina?\", \"qe\": \"¿Qué posiciones reciben nitrógeno de glutamina?\", \"ex\": \"Alternativa A. N3 e N9. — Aspartato fornece N1; glicina fornece C4, C5 e N7; glutamina fornece N3 e N9; CO₂/bicarbonato fornece C6; N10-formil-tetraidrofolato fornece C2 e C8. Derivados do folato transportam unidades de um carbono. O slide representa diferentes formas de folato; o doador imediato nas duas transformilases é N10-formil-THF.\", \"exe\": \"Opción A. N3 y N9. — Aspartato aporta N1; glicina C4, C5 y N7; glutamina N3 y N9; CO₂/bicarbonato C6; N10-formil-tetrahidrofolato C2 y C8. Los derivados del folato transportan unidades de un carbono. El donante inmediato en ambas transformilasas es N10-formil-THF.\", \"n\": 31, \"cr\": \"A\", \"o\": [{\"l\": \"A\", \"v\": \"N3 e N9.\", \"ve\": \"N3 y N9.\"}, {\"l\": \"B\", \"v\": \"N1 e N7\", \"ve\": \"N1 y N7\"}, {\"l\": \"C\", \"v\": \"C4 e C5\", \"ve\": \"C4 y C5\"}, {\"l\": \"D\", \"v\": \"C2 e C8\", \"ve\": \"C2 y C8\"}]}, {\"c\": \"Metabolismo das purinas\", \"ce\": \"Metabolismo de las purinas\", \"t\": \"mc\", \"q\": \"Qual nucleotídeo atua como segundo mensageiro?\", \"qe\": \"¿Qué nucleótido actúa como segundo mensajero?\", \"ex\": \"Alternativa B. AMPc. — DNA/RNA armazenam e expressam informação genética; ATP transfere energia; GTP participa de síntese proteica e sinalização; NADH transporta elétrons; AMPc é segundo mensageiro; coenzima A carrega grupos acila na síntese de lipídios e ciclo de Krebs. Adenosina participa de vasodilatação e controle cardíaco. A excreção de urato elimina produtos nitrogenados; a cor amarela normal da urina deriva sobretudo de pigmentos como urobilina, não do ácido úrico.\", \"exe\": \"Opción B. AMPc. — ADN/ARN almacenan y expresan información; ATP transfiere energía; GTP participa en síntesis proteica y señalización; NADH transporta electrones; AMPc es segundo mensajero; coenzima A transporta grupos acilo. Adenosina participa en vasodilatación y control cardíaco. El urato elimina productos nitrogenados; el color amarillo normal de la orina deriva principalmente de pigmentos como urobilina, no del ácido úrico.\", \"n\": 32, \"cr\": \"B\", \"o\": [{\"l\": \"A\", \"v\": \"IMP\", \"ve\": \"IMP\"}, {\"l\": \"B\", \"v\": \"AMPc.\", \"ve\": \"AMPc.\"}, {\"l\": \"C\", \"v\": \"XMP\", \"ve\": \"XMP\"}, {\"l\": \"D\", \"v\": \"dTMP\", \"ve\": \"dTMP\"}]}, {\"c\": \"Metabolismo das purinas\", \"ce\": \"Metabolismo de las purinas\", \"t\": \"mc\", \"q\": \"Qual enzima produz PRPP a partir de ribose-5-P?\", \"qe\": \"¿Qué enzima produce PRPP a partir de ribosa-5-P?\", \"ex\": \"Alternativa D. PRPP sintetase. — Ocorre no citosol, especialmente no fígado, e é endergônica (requer energia). A ribose-5-fosfato da via das pentoses recebe pirofosfato do ATP pela PRPP sintetase: ribose-5-P + ATP → PRPP + AMP. PRPP significa 5-fosforribosil-1-pirofosfato. A glutamina-PRPP amidotransferase catalisa a primeira etapa comprometida com a síntese de purinas e é inibida por nucleotídeos púricos.\", \"exe\": \"Opción D. PRPP sintetasa. — Ocurre en citosol, especialmente hígado, y es endergónica (requiere energía). La ribosa-5-fosfato de la vía de pentosas recibe pirofosfato del ATP por PRPP sintetasa: ribosa-5-P + ATP → PRPP + AMP. PRPP es 5-fosforribosil-1-pirofosfato. La glutamina-PRPP amidotransferasa cataliza el primer paso comprometido y es inhibida por nucleótidos púricos.\", \"n\": 33, \"cr\": \"D\", \"o\": [{\"l\": \"A\", \"v\": \"GMP sintetase\", \"ve\": \"GMP sintetasa\"}, {\"l\": \"B\", \"v\": \"Xantina oxidase\", \"ve\": \"Xantina oxidasa\"}, {\"l\": \"C\", \"v\": \"HGPRT\", \"ve\": \"HGPRT\"}, {\"l\": \"D\", \"v\": \"PRPP sintetase.\", \"ve\": \"PRPP sintetasa.\"}]}, {\"c\": \"Metabolismo das purinas\", \"ce\": \"Metabolismo de las purinas\", \"t\": \"mc\", \"q\": \"Qual é o precursor comum de AMP e GMP?\", \"qe\": \"¿Cuál es el precursor común de AMP y GMP?\", \"ex\": \"Alternativa B. IMP. — O anel é construído sobre a ribose em dez etapas: PRPP → fosforribosilamina → GAR → FGAR → FGAM → AIR → CAIR → SAICAR → AICAR → FAICAR → IMP (inosina monofosfato). Glicina, folato, glutamina, bicarbonato e aspartato entram sucessivamente; ocorre liberação de fumarato do esqueleto do aspartato. IMP é o primeiro nucleotídeo púrico completo comum às duas ramificações.\", \"exe\": \"Opción B. IMP. — El anillo se construye sobre la ribosa en diez pasos: PRPP → fosforribosilamina → GAR → FGAR → FGAM → AIR → CAIR → SAICAR → AICAR → FAICAR → IMP (inosina monofosfato). Entran glicina, folato, glutamina, bicarbonato y aspartato; se libera fumarato del esqueleto de aspartato. IMP es el primer nucleótido púrico completo común a ambas ramas.\", \"n\": 34, \"cr\": \"B\", \"o\": [{\"l\": \"A\", \"v\": \"OMP\", \"ve\": \"OMP\"}, {\"l\": \"B\", \"v\": \"IMP.\", \"ve\": \"IMP.\"}, {\"l\": \"C\", \"v\": \"UMP\", \"ve\": \"UMP\"}, {\"l\": \"D\", \"v\": \"CTP\", \"ve\": \"CTP\"}]}, {\"c\": \"Metabolismo das purinas\", \"ce\": \"Metabolismo de las purinas\", \"t\": \"mc\", \"q\": \"Qual intermediário liga IMP à formação de GMP?\", \"qe\": \"¿Qué intermediario conecta IMP con la formación de GMP?\", \"ex\": \"Alternativa D. XMP. — IMP + aspartato + GTP → adenilossuccinato → AMP + fumarato. Na outra via, IMP desidrogenase oxida IMP a XMP (xantosina monofosfato), e GMP sintetase usa glutamina e ATP para formar GMP. AMP consome GTP e GMP consome ATP, favorecendo equilíbrio das reservas. AMP e GMP inibem suas respectivas ramificações.\", \"exe\": \"Opción D. XMP. — IMP + aspartato + GTP → adenilosuccinato → AMP + fumarato. En la otra vía, IMP deshidrogenasa oxida IMP a XMP (xantosina monofosfato), y GMP sintetasa utiliza glutamina y ATP para formar GMP. AMP consume GTP y GMP consume ATP, favoreciendo el equilibrio. AMP y GMP inhiben sus propias ramas.\", \"n\": 35, \"cr\": \"D\", \"o\": [{\"l\": \"A\", \"v\": \"OMP\", \"ve\": \"OMP\"}, {\"l\": \"B\", \"v\": \"Adenilossuccinato\", \"ve\": \"Adenilosuccinato\"}, {\"l\": \"C\", \"v\": \"Uracila\", \"ve\": \"Uracilo\"}, {\"l\": \"D\", \"v\": \"XMP.\", \"ve\": \"XMP.\"}]}, {\"c\": \"Metabolismo das purinas\", \"ce\": \"Metabolismo de las purinas\", \"t\": \"mc\", \"q\": \"Quais bases são recuperadas pela HGPRT?\", \"qe\": \"¿Qué bases rescata HGPRT?\", \"ex\": \"Alternativa B. Hipoxantina e guanina. — Recicla bases livres, economizando energia: HGPRT (hipoxantina-guanina fosforribosiltransferase) usa PRPP para converter hipoxantina em IMP e guanina em GMP. APRT converte adenina em AMP. Quando HGPRT falta, aumentam PRPP disponível e síntese de novo, além de diminuir a recuperação de bases.\", \"exe\": \"Opción B. Hipoxantina y guanina. — Recicla bases libres y ahorra energía: HGPRT (hipoxantina-guanina fosforribosiltransferasa) usa PRPP para convertir hipoxantina en IMP y guanina en GMP. APRT convierte adenina en AMP. Si falta HGPRT, aumentan PRPP y síntesis de novo, y disminuye el rescate.\", \"n\": 36, \"cr\": \"B\", \"o\": [{\"l\": \"A\", \"v\": \"Adenina e citosina\", \"ve\": \"Adenina y citosina\"}, {\"l\": \"B\", \"v\": \"Hipoxantina e guanina.\", \"ve\": \"Hipoxantina y guanina.\"}, {\"l\": \"C\", \"v\": \"Citosina e uracila\", \"ve\": \"Citosina y uracilo\"}, {\"l\": \"D\", \"v\": \"Adenina e timina\", \"ve\": \"Adenina y timina\"}]}, {\"c\": \"Metabolismo das purinas\", \"ce\": \"Metabolismo de las purinas\", \"t\": \"mc\", \"q\": \"Qual é o produto final do catabolismo de purinas em humanos?\", \"qe\": \"¿Cuál es el producto final del catabolismo de purinas en humanos?\", \"ex\": \"Alternativa D. Ácido úrico (urato). — AMP pode virar adenosina → inosina → hipoxantina, ou IMP → inosina. GMP → guanosina → guanina → xantina. A xantina oxidoredutase catalisa hipoxantina → xantina → ácido úrico. Humanos não têm uricase funcional, então o urato é o produto final usual. Alopurinol reduz sua formação ao inibir a xantina oxidoredutase.\", \"exe\": \"Opción D. Ácido úrico (urato). — AMP puede convertirse en adenosina → inosina → hipoxantina, o IMP → inosina. GMP → guanosina → guanina → xantina. La xantina oxidorreductasa cataliza hipoxantina → xantina → ácido úrico. Los humanos no poseen uricasa funcional, por lo que el urato es el producto final habitual. Alopurinol reduce su formación al inhibir la xantina oxidorreductasa.\", \"n\": 37, \"cr\": \"D\", \"o\": [{\"l\": \"A\", \"v\": \"Ureia\", \"ve\": \"Urea\"}, {\"l\": \"B\", \"v\": \"β-alanina\", \"ve\": \"β-alanina\"}, {\"l\": \"C\", \"v\": \"Alantoína\", \"ve\": \"Alantoína\"}, {\"l\": \"D\", \"v\": \"Ácido úrico (urato).\", \"ve\": \"Ácido úrico (urato).\"}]}, {\"c\": \"Metabolismo das purinas\", \"ce\": \"Metabolismo de las purinas\", \"t\": \"mc\", \"q\": \"Qual valor de hiperuricemia é indicado nos slides?\", \"qe\": \"¿Qué valor de hiperuricemia indican las diapositivas?\", \"ex\": \"Alternativa B. Acima de 7 mg/dL. — Os slides indicam produção aproximada de 500 mg/dia, urato sérico masculino 2,5–7,0 mg/dL e feminino 1,5–6,0 mg/dL, excreção urinária 250–750 mg/24 h e hiperuricemia acima de 7 mg/dL. Os intervalos variam conforme laboratório e dieta; a saturação do urato ocorre aproximadamente a 6,8 mg/dL. Hiperuricemia não é sinônimo de gota.\", \"exe\": \"Opción B. Superior a 7 mg/dL. — Las diapositivas indican producción aproximada de 500 mg/día, urato sérico masculino 2,5–7,0 mg/dL y femenino 1,5–6,0 mg/dL, excreción urinaria 250–750 mg/24 h e hiperuricemia superior a 7 mg/dL. Los intervalos varían según laboratorio y dieta; la saturación ocurre aproximadamente a 6,8 mg/dL. Hiperuricemia no equivale a gota.\", \"n\": 38, \"cr\": \"B\", \"o\": [{\"l\": \"A\", \"v\": \"Acima de 1 mg/dL\", \"ve\": \"Superior a 1 mg/dL\"}, {\"l\": \"B\", \"v\": \"Acima de 7 mg/dL.\", \"ve\": \"Superior a 7 mg/dL.\"}, {\"l\": \"C\", \"v\": \"Abaixo de 2 mg/dL\", \"ve\": \"Inferior a 2 mg/dL\"}, {\"l\": \"D\", \"v\": \"Acima de 20 mg/dL\", \"ve\": \"Superior a 20 mg/dL\"}]}, {\"c\": \"Metabolismo das purinas\", \"ce\": \"Metabolismo de las purinas\", \"t\": \"mc\", \"q\": \"Que cristais causam a gota?\", \"qe\": \"¿Qué cristales causan la gota?\", \"ex\": \"Alternativa C. Urato monossódico. — Cristais de urato monossódico se depositam nas articulações e desencadeiam inflamação intensa. Fases: hiperuricemia assintomática (nem todos evoluem), crise aguda com dor, calor, edema e eventualmente febre, e artrite gotosa crônica com tofos (depósitos macroscópicos). Exemplo clássico: podagra, inflamação da primeira articulação metatarsofalângica.\", \"exe\": \"Opción C. Urato monosódico. — Los cristales de urato monosódico se depositan en articulaciones y desencadenan inflamación intensa. Fases: hiperuricemia asintomática (no todos progresan), ataque agudo con dolor, calor, edema y a veces fiebre, y artritis gotosa crónica con tofos (depósitos macroscópicos). Ejemplo: podagra, inflamación de la primera articulación metatarsofalángica.\", \"n\": 39, \"cr\": \"C\", \"o\": [{\"l\": \"A\", \"v\": \"Colesterol\", \"ve\": \"Colesterol\"}, {\"l\": \"B\", \"v\": \"Pirofosfato de cálcio\", \"ve\": \"Pirofosfato de calcio\"}, {\"l\": \"C\", \"v\": \"Urato monossódico.\", \"ve\": \"Urato monosódico.\"}, {\"l\": \"D\", \"v\": \"Oxalato de cálcio\", \"ve\": \"Oxalato de calcio\"}]}, {\"c\": \"Metabolismo das purinas\", \"ce\": \"Metabolismo de las purinas\", \"t\": \"mc\", \"q\": \"Por que a lise tumoral pode elevar o urato?\", \"qe\": \"¿Por qué la lisis tumoral puede elevar urato?\", \"ex\": \"Alternativa D. Libera ácidos nucleicos que são catabolizados a urato. — Predisposição genética, idade, obesidade, álcool (especialmente cerveja), excesso de carnes e vísceras, alguns frutos do mar, tiazídicos, quimioterapia com lise celular e exposição ao chumbo favorecem hiperuricemia. Hidratação auxilia a excreção renal. O slide inclui leguminosas e verduras entre fontes de purinas, mas purinas vegetais não justificam a mesma restrição que vísceras e carnes. Abóbora, alcachofra e aipo são exemplos ilustrados, não tratamentos específicos.\", \"exe\": \"Opción D. Libera ácidos nucleicos que se catabolizan a urato. — Predisposición genética, edad, obesidad, alcohol (sobre todo cerveza), exceso de carnes y vísceras, algunos mariscos, tiazidas, quimioterapia con lisis celular y plomo favorecen hiperuricemia. La hidratación ayuda a la excreción renal. Las purinas vegetales no justifican la misma restricción que vísceras y carnes. Calabaza, alcachofa y apio son ejemplos ilustrados, no tratamientos específicos.\", \"n\": 40, \"cr\": \"D\", \"o\": [{\"l\": \"A\", \"v\": \"Elimina completamente o PRPP\", \"ve\": \"Elimina completamente el PRPP\"}, {\"l\": \"B\", \"v\": \"Converte urato em glicose\", \"ve\": \"Convierte urato en glucosa\"}, {\"l\": \"C\", \"v\": \"Inibe toda degradação de nucleotídeos\", \"ve\": \"Inhibe toda degradación de nucleótidos\"}, {\"l\": \"D\", \"v\": \"Libera ácidos nucleicos que são catabolizados a urato.\", \"ve\": \"Libera ácidos nucleicos que se catabolizan a urato.\"}]}, {\"c\": \"Metabolismo das purinas\", \"ce\": \"Metabolismo de las purinas\", \"t\": \"mc\", \"q\": \"Qual enzima está deficiente em Lesch-Nyhan?\", \"qe\": \"¿Qué enzima falta en Lesch-Nyhan?\", \"ex\": \"Alternativa D. HGPRT. — Doença hereditária descrita em 1964, ligada ao X, causada por deficiência grave de HGPRT. A via de salvamento falha, PRPP aumenta, há hiperprodução de purinas e hiperuricemia grave. Manifestações incluem litíase urinária, distonia, comprometimento neurológico e automutilação característica; frequentemente reconhecida nos primeiros anos em meninos. A mãe pode ser portadora. O controle do urato não corrige necessariamente a síndrome neurológica.\", \"exe\": \"Opción D. HGPRT. — Enfermedad hereditaria descrita en 1964, ligada al X, causada por deficiencia grave de HGPRT. Falla el rescate, aumenta PRPP, hay sobreproducción de purinas e hiperuricemia grave. Manifestaciones: litiasis urinaria, distonía, compromiso neurológico y automutilación característica; suele reconocerse en los primeros años en varones. La madre puede ser portadora. Controlar urato no necesariamente corrige el síndrome neurológico.\", \"n\": 41, \"cr\": \"D\", \"o\": [{\"l\": \"A\", \"v\": \"CPS II\", \"ve\": \"CPS II\"}, {\"l\": \"B\", \"v\": \"APRT\", \"ve\": \"APRT\"}, {\"l\": \"C\", \"v\": \"UGT1A1\", \"ve\": \"UGT1A1\"}, {\"l\": \"D\", \"v\": \"HGPRT.\", \"ve\": \"HGPRT.\"}]}, {\"c\": \"Metabolismo das purinas\", \"ce\": \"Metabolismo de las purinas\", \"t\": \"mc\", \"q\": \"Qual alteração causa hipouricemia com cálculos de xantina?\", \"qe\": \"¿Qué alteración causa hipouricemia con cálculos de xantina?\", \"ex\": \"Alternativa D. Deficiência de xantina oxidoredutase. — A hiperatividade de PRPP sintetase pode causar gota primária por produção excessiva. Na doença de Von Gierke (deficiência de glicose-6-fosfatase), excesso de G6P favorece a via das pentoses e produção de purinas; lactato também reduz excreção renal de urato. Na xantinúria hereditária, deficiência de xantina oxidoredutase causa hipouricemia e cálculos de xantina. Nem toda gota primária decorre de PRPP sintetase.\", \"exe\": \"Opción D. Deficiencia de xantina oxidorreductasa. — La hiperactividad de PRPP sintetasa puede causar gota por sobreproducción. En Von Gierke (deficiencia de glucosa-6-fosfatasa), el exceso de G6P favorece la vía de pentosas y síntesis de purinas; el lactato reduce la excreción renal de urato. En xantinuria hereditaria, la deficiencia de xantina oxidorreductasa causa hipouricemia y cálculos de xantina. No toda gota primaria se debe a PRPP sintetasa.\", \"n\": 42, \"cr\": \"D\", \"o\": [{\"l\": \"A\", \"v\": \"Excesso de xantina oxidoredutase\", \"ve\": \"Exceso de xantina oxidorreductasa\"}, {\"l\": \"B\", \"v\": \"Excesso de ferroquelatase\", \"ve\": \"Exceso de ferroquelatasa\"}, {\"l\": \"C\", \"v\": \"Deficiência de UGT1A1\", \"ve\": \"Deficiencia de UGT1A1\"}, {\"l\": \"D\", \"v\": \"Deficiência de xantina oxidoredutase.\", \"ve\": \"Deficiencia de xantina oxidorreductasa.\"}]}, {\"c\": \"Metabolismo das purinas\", \"ce\": \"Metabolismo de las purinas\", \"t\": \"mc\", \"q\": \"A colchicina diminui diretamente a produção de urato?\", \"qe\": \"¿La colchicina reduce directamente la producción de urato?\", \"ex\": \"Alternativa D. Não; reduz a inflamação. — Uricostáticos: alopurinol e febuxostate inibem xantina oxidoredutase e reduzem síntese de urato. Uricosúricos: probenecida e sulfinpirazona aumentam excreção renal. Uricolíticos: rasburicase e pegloticase convertem urato em alantoína, mais solúvel, em indicações distintas. Correção importante do slide: colchicina é anti-inflamatória, inibe microtúbulos e reduz a resposta dos neutrófilos; não inibe xantina oxidase nem reduz diretamente o urato.\", \"exe\": \"Opción D. No; reduce la inflamación. — Uricostáticos: alopurinol y febuxostat inhiben xantina oxidorreductasa y reducen síntesis de urato. Uricosúricos: probenecid y sulfinpirazona aumentan excreción renal. Uricolíticos: rasburicasa y pegloticasa convierten urato en alantoína, más soluble, con indicaciones distintas. Corrección: colchicina es antiinflamatoria, inhibe microtúbulos y reduce la respuesta de neutrófilos; no inhibe xantina oxidasa ni reduce directamente urato.\", \"n\": 43, \"cr\": \"D\", \"o\": [{\"l\": \"A\", \"v\": \"Sim; converte urato em alantoína\", \"ve\": \"Sí; convierte urato en alantoína\"}, {\"l\": \"B\", \"v\": \"Sim; inibe xantina oxidase\", \"ve\": \"Sí; inhibe xantina oxidasa\"}, {\"l\": \"C\", \"v\": \"Sim; bloqueia a síntese de PRPP\", \"ve\": \"Sí; bloquea síntesis de PRPP\"}, {\"l\": \"D\", \"v\": \"Não; reduz a inflamação.\", \"ve\": \"No; reduce la inflamación.\"}]}, {\"c\": \"Metabolismo das purinas\", \"ce\": \"Metabolismo de las purinas\", \"t\": \"mc\", \"q\": \"Qual molécula da via das pentoses inicia a produção de PRPP?\", \"qe\": \"¿Qué molécula de la vía de pentosas inicia producción de PRPP?\", \"o\": [{\"l\": \"A\", \"v\": \"Glicogênio\", \"ve\": \"Glucógeno\"}, {\"l\": \"B\", \"v\": \"Acetil-CoA\", \"ve\": \"Acetil-CoA\"}, {\"l\": \"C\", \"v\": \"Ribose-5-fosfato\", \"ve\": \"Ribosa-5-fosfato\"}, {\"l\": \"D\", \"v\": \"Lactato\", \"ve\": \"Lactato\"}], \"cr\": \"C\", \"ex\": \"Alternativa C. PRPP sintetase transfere pirofosfato de ATP à ribose-5-fosfato.\", \"exe\": \"Opción C. PRPP sintetasa transfiere pirofosfato de ATP a ribosa-5-fosfato.\", \"n\": 44}, {\"c\": \"Metabolismo das purinas\", \"ce\": \"Metabolismo de las purinas\", \"t\": \"mc\", \"q\": \"Qual fármaco reduz produção de urato inibindo xantina oxidoredutase?\", \"qe\": \"¿Qué fármaco reduce producción de urato inhibiendo xantina oxidorreductasa?\", \"o\": [{\"l\": \"A\", \"v\": \"Colchicina\", \"ve\": \"Colchicina\"}, {\"l\": \"B\", \"v\": \"Probenecida\", \"ve\": \"Probenecid\"}, {\"l\": \"C\", \"v\": \"Rasburicase\", \"ve\": \"Rasburicasa\"}, {\"l\": \"D\", \"v\": \"Alopurinol\", \"ve\": \"Alopurinol\"}], \"cr\": \"D\", \"ex\": \"Alternativa D. Colchicina é anti-inflamatória, probenecida é uricosúrica e rasburicase degrada urato.\", \"exe\": \"Opción D. Colchicina es antiinflamatoria, probenecid es uricosúrico y rasburicasa degrada urato.\", \"n\": 45}, {\"c\": \"Metabolismo das purinas\", \"ce\": \"Metabolismo de las purinas\", \"t\": \"mc\", \"q\": \"Menino com automutilação, distonia e hiperuricemia grave: qual via está comprometida?\", \"qe\": \"Niño con automutilación, distonía e hiperuricemia grave: ¿qué vía está alterada?\", \"o\": [{\"l\": \"A\", \"v\": \"Síntese de heme por FECH\", \"ve\": \"Síntesis de hemo por FECH\"}, {\"l\": \"B\", \"v\": \"Síntese de pirimidinas por CPS II\", \"ve\": \"Síntesis de pirimidinas por CPS II\"}, {\"l\": \"C\", \"v\": \"Conjugação por UGT1A1\", \"ve\": \"Conjugación por UGT1A1\"}, {\"l\": \"D\", \"v\": \"Salvamento de purinas por HGPRT\", \"ve\": \"Rescate de purinas por HGPRT\"}], \"cr\": \"D\", \"ex\": \"Alternativa D. O quadro sugere Lesch-Nyhan, doença ligada ao X com deficiência grave de HGPRT.\", \"exe\": \"Opción D. Sugiere Lesch-Nyhan, enfermedad ligada al X con déficit grave de HGPRT.\", \"n\": 46}, {\"c\": \"Metabolismo das purinas\", \"ce\": \"Metabolismo de las purinas\", \"t\": \"mc\", \"q\": \"Qual fármaco é uricosúrico?\", \"qe\": \"¿Qué fármaco es uricosúrico?\", \"o\": [{\"l\": \"A\", \"v\": \"Alopurinol\", \"ve\": \"Alopurinol\"}, {\"l\": \"B\", \"v\": \"Febuxostate\", \"ve\": \"Febuxostat\"}, {\"l\": \"C\", \"v\": \"Probenecida\", \"ve\": \"Probenecid\"}, {\"l\": \"D\", \"v\": \"Colchicina\", \"ve\": \"Colchicina\"}], \"cr\": \"C\", \"ex\": \"Alternativa C. A probenecida aumenta a excreção renal de urato.\", \"exe\": \"Opción C. Probenecid aumenta excreción renal de urato.\", \"n\": 47}, {\"c\": \"Metabolismo das purinas\", \"ce\": \"Metabolismo de las purinas\", \"t\": \"tf\", \"q\": \"A síntese de AMP a partir de IMP consome GTP.\", \"qe\": \"La síntesis de AMP a partir de IMP consume GTP.\", \"cr\": \"V\", \"ex\": \"Verdadeiro. A reação de adenilossuccinato sintetase utiliza GTP.\", \"exe\": \"Verdadero. La adenilosuccinato sintetasa utiliza GTP.\", \"n\": 48}, {\"c\": \"Metabolismo das purinas\", \"ce\": \"Metabolismo de las purinas\", \"t\": \"tf\", \"q\": \"Hiperuricemia isolada comprova artrite gotosa.\", \"qe\": \"Hiperuricemia aislada confirma artritis gotosa.\", \"cr\": \"F\", \"ex\": \"Falso. Pode haver hiperuricemia assintomática.\", \"exe\": \"Falso. Puede haber hiperuricemia asintomática.\", \"n\": 49}, {\"c\": \"Metabolismo das purinas\", \"ce\": \"Metabolismo de las purinas\", \"t\": \"tf\", \"q\": \"A adenosina é um nucleosídeo formado por adenina e ribose.\", \"qe\": \"La adenosina es un nucleósido formado por adenina y ribosa.\", \"cr\": \"V\", \"ex\": \"Verdadeiro. Purinas são bases nitrogenadas heterocíclicas de dois anéis fundidos: um de seis membros (pirimidina) e outro de cinco (imidazol). Adenina e guanina integram DNA e RNA. Base + açúcar = nucleosídeo; nucleosídeo + fosfato = nucleotídeo. Exemplo: adenina + ribose = adenosina; adenosina + três fosfatos = ATP.\", \"exe\": \"Verdadero. Las purinas son bases nitrogenadas heterocíclicas de dos anillos fusionados: uno de seis miembros (pirimidina) y otro de cinco (imidazol). Adenina y guanina integran ADN y ARN. Base + azúcar = nucleósido; nucleósido + fosfato = nucleótido. Ejemplo: adenina + ribosa = adenosina; adenosina + tres fosfatos = ATP.\", \"n\": 50}, {\"c\": \"Metabolismo das purinas\", \"ce\": \"Metabolismo de las purinas\", \"t\": \"tf\", \"q\": \"Uma purina possui somente um anel de seis membros.\", \"qe\": \"Una purina posee solo un anillo de seis miembros.\", \"cr\": \"F\", \"ex\": \"Falso. Purinas são bases nitrogenadas heterocíclicas de dois anéis fundidos: um de seis membros (pirimidina) e outro de cinco (imidazol). Adenina e guanina integram DNA e RNA. Base + açúcar = nucleosídeo; nucleosídeo + fosfato = nucleotídeo. Exemplo: adenina + ribose = adenosina; adenosina + três fosfatos = ATP.\", \"exe\": \"Falso. Las purinas son bases nitrogenadas heterocíclicas de dos anillos fusionados: uno de seis miembros (pirimidina) y otro de cinco (imidazol). Adenina y guanina integran ADN y ARN. Base + azúcar = nucleósido; nucleósido + fosfato = nucleótido. Ejemplo: adenina + ribosa = adenosina; adenosina + tres fosfatos = ATP.\", \"n\": 51}, {\"c\": \"Metabolismo das purinas\", \"ce\": \"Metabolismo de las purinas\", \"t\": \"tf\", \"q\": \"A glicina fornece C4, C5 e N7 ao anel púrico.\", \"qe\": \"La glicina aporta C4, C5 y N7 al anillo púrico.\", \"cr\": \"V\", \"ex\": \"Verdadeiro. Aspartato fornece N1; glicina fornece C4, C5 e N7; glutamina fornece N3 e N9; CO₂/bicarbonato fornece C6; N10-formil-tetraidrofolato fornece C2 e C8. Derivados do folato transportam unidades de um carbono. O slide representa diferentes formas de folato; o doador imediato nas duas transformilases é N10-formil-THF.\", \"exe\": \"Verdadero. Aspartato aporta N1; glicina C4, C5 y N7; glutamina N3 y N9; CO₂/bicarbonato C6; N10-formil-tetrahidrofolato C2 y C8. Los derivados del folato transportan unidades de un carbono. El donante inmediato en ambas transformilasas es N10-formil-THF.\", \"n\": 52}, {\"c\": \"Metabolismo das purinas\", \"ce\": \"Metabolismo de las purinas\", \"t\": \"tf\", \"q\": \"O aspartato fornece os carbonos C2 e C8 do anel púrico.\", \"qe\": \"El aspartato aporta los carbonos C2 y C8 del anillo púrico.\", \"cr\": \"F\", \"ex\": \"Falso. Aspartato fornece N1; glicina fornece C4, C5 e N7; glutamina fornece N3 e N9; CO₂/bicarbonato fornece C6; N10-formil-tetraidrofolato fornece C2 e C8. Derivados do folato transportam unidades de um carbono. O slide representa diferentes formas de folato; o doador imediato nas duas transformilases é N10-formil-THF.\", \"exe\": \"Falso. Aspartato aporta N1; glicina C4, C5 y N7; glutamina N3 y N9; CO₂/bicarbonato C6; N10-formil-tetrahidrofolato C2 y C8. Los derivados del folato transportan unidades de un carbono. El donante inmediato en ambas transformilasas es N10-formil-THF.\", \"n\": 53}, {\"c\": \"Metabolismo das purinas\", \"ce\": \"Metabolismo e pentosas recibe pirofosfato del ATP por PRPP sintetasa: ribosa-5-P + ATP → PRPP + AMP. PRPP es 5-fosforribosil-1-pirofosfato. La glutamina-PRPP amidotransferasa cataliza el primer paso comprometido y es inhibida por nucleótidos púricos.\", \"n\": 57}, {\"c\": \"Metabolismo das purinas\", \"ce\": \"Metabolismo de las purinas\", \"t\": \"tf\", \"q\": \"A PRPP sintetase gera PRPP sem consumir ATP.\", \"qe\": \"La PRPP sintetasa genera PRPP sin consumir ATP.\", \"cr\": \"F\", \"ex\": \"Falso. Ocorre no citosol, especialmente no fígado, e é endergônica (requer energia). A ribose-5-fosfato da via das pentoses recebe pirofosfato do ATP pela PRPP sintetase: ribose-5-P + ATP → PRPP + AMP. PRPP significa 5-fosforribosil-1-pirofosfato. A glutamina-PRPP amidotransferase catalisa a primeira etapa comprometida com a síntese de purinas e é inibida por nucleotídeos púricos.\", \"exe\": \"Falso. Ocurre en citosol, especialmente hígado, y es endergónica (requiere energía). La ribosa-5-fosfato de la vía de pentosas recibe pirofosfato del ATP por PRPP sintetasa: ribosa-5-P + ATP → PRPP + AMP. PRPP es 5-fosforribosil-1-pirofosfato. La glutamina-PRPP amidotransferasa cataliza el primer paso comprometido y es inhibida por nucleótidos púricos.\", \"n\": 58}, {\"c\": \"Metabolismo das purinas\", \"ce\": \"Metabolismo de las purinas\", \"t\": \"tf\", \"q\": \"Na síntese de novo de purinas, o anel é construído sobre a ribose.\", \"qe\": \"En la síntesis de novo de purinas, el anillo se construye sobre la ribosa.\", \"cr\": \"V\", \"ex\": \"Verdadeiro. O anel é construído sobre a ribose em dez etapas: PRPP → fosforribosilamina → GAR → FGAR → FGAM → AIR → CAIR → SAICAR → AICAR → FAICAR → IMP (inosina monofosfato). Glicina, folato, glutamina, bicarbonato e aspartato entram sucessivamente; ocorre liberação de fumarato do esqueleto do aspartato. IMP é o primeiro nucleotídeo púrico completo comum às duas ramificações.\", \"exe\": \"Verdadero. El anillo se construye sobre la ribosa en diez pasos: PRPP → fosforribosilamina → GAR → FGAR → FGAM → AIR → CAIR → SAICAR → AICAR → FAICAR → IMP (inosina monofosfato). Entran glicina, folato, glutamina, bicarbonato y aspartato; se libera fumarato del esqueleto de aspartato. IMP es el primer nucleótido púrico completo común a ambas ramas.\", \"n\": 59}, {\"c\": \"Metabolismo das purinas\", \"ce\": \"Metabolismo de las purinas\", \"t\": \"tf\", \"q\": \"O IMP é formado antes de todos os intermediários GAR e AIR.\", \"qe\": \"El IMP se forma antes de todos los intermediarios GAR y AIR.\", \"cr\": \"F\", \"ex\": \"Falso. O anel é construído sobre a ribose em dez etapas: PRPP → fosforribosilamina → GAR → FGAR → FGAM → AIR → CAIR → SAICAR → AICAR → FAICAR → IMP (inosina monofosfato). Glicina, folato, glutamina, bicarbonato e aspartato entram sucessivamente; ocorre liberação de fumarato do esqueleto do aspartato. IMP é o primeiro nucleotídeo púrico completo comum às duas ramificações.\", \"exe\": \"Falso. El anillo se construye sobre la ribosa en diez pasos: PRPP → fosforribosilamina → GAR → FGAR → FGAM → AIR → CAIR → SAICAR → AICAR → FAICAR → IMP (inosina monofosfato). Entran glicina, folato, glutamina, bicarbonato y aspartato; se libera fumarato del esqueleto de aspartato. IMP es el primer nucleótido púrico completo común a ambas ramas.\", \"n\": 60}, {\"c\": \"Metabolismo das purinas\", \"ce\": \"Metabolismo de las purinas\", \"t\": \"tf\", \"q\": \"A formação de AMP a partir de IMP utiliza GTP.\", \"qe\": \"La formación de AMP desde IMP utiliza GTP.\", \"cr\": \"V\", \"ex\": \"Verdadeiro. IMP + aspartato + GTP → adenilossuccinato → AMP + fumarato. Na outra via, IMP desidrogenase oxida IMP a XMP (xantosina monofosfato), e GMP sintetase usa glutamina e ATP para formar GMP. AMP consome GTP e GMP consome ATP, favorecendo equilíbrio das reservas. AMP e GMP inibem suas respectivas ramificações.\", \"exe\": \"Verdadero. IMP + aspartato + GTP → adenilosuccinato → AMP + fumarato. En la otra vía, IMP deshidrogenasa oxida IMP a XMP \", \"t\": \"tf\", \"q\": \"A deficiência de HGPRT reduz necessariamente a disponibilidade de PRPP.\", \"qe\": \"La deficiencia de HGPRT reduce necesariamente la disponibilidad de PRPP.\", \"cr\": \"F\", \"ex\": \"Falso. Recicla bases livres, economizando energia: HGPRT (hipoxantina-guanina fosforribosiltransferase) usa PRPP para converter hipoxantina em IMP e guanina em GMP. APRT converte adenina em AMP. Quando HGPRT falta, aumentam PRPP disponível e síntese de novo, além de diminuir a recuperação de bases.\", \"exe\": \"Falso. Recicla bases libres y ahorra energía: HGPRT (hipoxantina-guanina fosforribosiltransferasa) usa PRPP para convertir hipoxantina en IMP y guanina en GMP. APRT convierte adenina en AMP. Si falta HGPRT, aumentan PRPP y síntesis de novo, y disminuye el rescate.\", \"n\": 64}, {\"c\": \"Metabolismo das purinas\", \"ce\": \"Metabolismo de las purinas\", \"t\": \"tf\", \"q\": \"A degradação de ácidos nucleicos após lise tumoral pode elevar a produção de urato.\", \"qe\": \"La degradación de ácidos nucleicos tras lisis tumoral puede elevar la producción de urato.\", \"cr\": \"V\", \"ex\": \"Verdadeiro. Predisposição genética, idade, obesidade, álcool (especialmente cerveja), excesso de carnes e vísceras, alguns frutos do mar, tiazídicos, quimioterapia com lise celular e exposição ao chumbo favorecem hiperuricemia. Hidratação auxilia a excreção renal. O slide inclui leguminosas e verduras entre fontes de purinas, mas purinas vegetais não justificam a mesma restrição que vísceras e carnes. Abóbora, alcachofra e aipo são exemplos ilustrados, não tratamentos específicos.\", \"exe\": \"Verdadero. Predisposición genética, edad, obesidad, alcohol (sobre todo cerveza), exceso de carnes y vísceras, algunos mariscos, tiazidas, quimioterapia con lisis celular y plomo favorecen hiperuricemia. La hidratación ayuda a la excreción renal. Las purinas vegetales no justifican la misma restricción que vísceras y carnes. Calabaza, alcachofa y apio son ejemplos ilustrados, no tratamientos específicos.\", \"n\": 65}, {\"c\": \"Metabolismo das purinas\", \"ce\": \"Metabolismo de las purinas\", \"t\": \"tf\", \"q\": \"Na deficiência de xantina oxidoredutase, a produção de urato aumenta.\", \"qe\": \"En la deficiencia de xantina oxidorreductasa, aumenta la producción de urato.\", \"cr\": \"F\", \"ex\": \"Falso. A hiperatividade de PRPP sintetase pode causar gota primária por produção excessiva. Na doença de Von Gierke (deficiência de glicose-6-fosfatase), excesso de G6P favorece a via das pentoses e produção de purinas; lactato também reduz excreção renal de urato. Na xantinúria hereditária, deficiência de xantina oxidoredutase causa hipouricemia e cálculos de xantina. Nem toda gota primária decorre de PRPP sintetase.\", \"exe\": \"Falso. La hiperactividad de PRPP sintetasa puede causar gota por sobreproducción. En Von Gierke (deficiencia de glucosa-6-fosfatasa), el exceso de G6P favorece la vía de pentosas y síntesis de purinas; el lactato reduce la excreción renal de urato. En xantinuria hereditaria, la deficiencia de xantina oxidorreductasa causa hipouricemia y cálculos de xantina. No toda gota primaria se debe a PRPP sintetasa.\", \"n\": 66}, {\"c\": \"Metabolismo das purinas\", \"ce\": \"Metabolismo de las purinas\", \"t\": \"tf\", \"q\": \"A glutamina-PRPP amidotransferase é inibida por nucleotídeos púricos.\", \"qe\": \"La glutamina-PRPP amidotransferasa es inhibida por nucleótidos púricos.\", \"cr\": \"V\", \"ex\": \"Verdadeiro. Ocorre no citosol, especialmente no fígado, e é endergônica (requer energia). A ribose-5-fosfato da via das pentoses recebe pirofosfato do ATP pela PRPP sintetase: ribose-5-P + ATP → PRPP + AMP. PRPP significa 5-fosforribosil-1-pirofosfato. A glutamina-PRPP amidotransferase catalisa a primeira etapa comprometida com a síntese de purinas e é inibida por nucleotídeos púricos.\", \"exe\": \"Verdadero. Ocurre en citosol, especialmente hígado, y es endergónica (requiere energía). La ribosa-5-fosfato de la vía de pentosas recibe pirofosfato del ATP por PRPP sintetasa: ribosa-5-P + ATP → PRPP + AMP. PRPP es 5-fosforribosil-1-pirofosfato. La glutamina-PRPP amidotransferasa cataliza el primer paso comprometido y es inhibida por nucleótidos púricos.\", \"n\": 67}, {\"c\": \"Metabolismo das purinas\", \"ce\": \"Metabolismo de las purinas\", \"t\": \"tf\", \"q\": \"O adenilossuccinato é o intermediário imediato da ramificação para GMP.\", \"qe\": \"El adenilosuccinato es el intermediario inmediato de la rama hacia GMP.\", \"cr\": \"F\", \"ex\": \"Falso. IMP + aspartato + GTP → adenilossuccinato → AMP + fumarato. Na outra via, IMP desidrogenase oxida IMP a XMP (xantosina monofosfato), e GMP sintetase usa glutamina e ATP para formar GMP. AMP consome GTP e GMP consome ATP, favorecendo equilíbrio das reservas. AMP e GMP inibem suas respectivas ramificações.\", \"exe\": \"Falso. IMP + aspartato + GTP → adenilosuccinato → AMP + fumarato. En la otra vía, IMP deshidrogenasa oxida IMP a XMP (xantosina monofosfato), y GMP sintetasa utiliza glutamina y ATP para formar GMP. AMP consume GTP y GMP consume ATP, favoreciendo el equilibrio. AMP y GMP inhiben sus propias ramas.\", \"n\": 68}, {\"c\": \"Metabolismo das pirimidinas\", \"ce\": \"Metabolismo de las pirimidinas\", \"t\": \"mc\", \"q\": \"Quais bases pirimídicas aparecem no DNA e RNA?\", \"qe\": \"¿Qué bases pirimidínicas aparecen en ADN y ARN?\", \"ex\": \"Alternativa A. DNA: citosina e timina; RNA: citosina e uracila. — Pirimidina é um heterociclo aromático de seis membros, com quatro carbonos e dois nitrogênios nas posições 1 e 3. Citosina (C4H5N3O) integra DNA e RNA, timina (C5H6N2O2) integra DNA e uracila (C4H4N2O2) integra RNA. Timina é 5-metiluracila. A uracila e a timina pareiam com adenina; citosina pareia com guanina.\", \"exe\": \"Opción A. ADN: citosina y timina; ARN: citosina y uracilo. — La pirimidina es un heterociclo aromático de seis miembros, cuatro carbonos y dos nitrógenos en posiciones 1 y 3. Citosina (C4H5N3O) integra ADN y ARN, timina (C5H6N2O2) integra ADN y uracilo (C4H4N2O2) integra ARN. Timina es 5-metiluracilo. Uracilo y timina aparean con adenina; citosina con guanina.\", \"n\": 69, \"cr\": \"A\", \"o\": [{\"l\": \"A\", \"v\": \"DNA: citosina e timina; RNA: citosina e uracila.\", \"ve\": \"ADN: citosina y timina; ARN: citosina y uracilo.\"}, {\"l\": \"B\", \"v\": \"DNA: uracila e citosina; RNA: timina e citosina\", \"ve\": \"ADN: uracilo y citosina; ARN: timina y citosina\"}, {\"l\": \"C\", \"v\": \"DNA e RNA: somente timina\", \"ve\": \"ADN y ARN: solo timina\"}, {\"l\": \"D\", \"v\": \"DNA e RNA: adenina e guanina\", \"ve\": \"ADN y ARN: adenina y guanina\"}]}, {\"c\": \"Metabolismo das pirimidinas\", \"ce\": \"Metabolismo de las pirimidinas\", \"t\": \"mc\", \"q\": \"Quais são os três precursores que fornecem átomos ao anel?\", \"qe\": \"¿Qué tres precursores aportan átomos al anillo?\", \"ex\": \"Alternativa A. Aspartato, bicarbonato e glutamina. — Aspartato fornece N1, C4, C5 e C6; bicarbonato fornece C2; glutamina fornece N3. ATP fornece energia. Ao contrário das purinas, o anel pirimídico é construído antes de ser ligado à ribose do PRPP. O folato não fornece diretamente átomos ao anel de UMP, embora participe da síntese de timidilato.\", \"exe\": \"Opción A. Aspartato, bicarbonato y glutamina. — Aspartato aporta N1, C4, C5 y C6; bicarbonato C2; glutamina N3. ATP aporta energía. A diferencia de purinas, el anillo pirimidínico se construye antes de unirse a ribosa del PRPP. El folato no aporta átomos directamente al anillo de UMP, aunque participa en síntesis de timidilato.\", \"n\": 70, \"cr\": \"A\", \"o\": [{\"l\": \"A\", \"v\": \"Aspartato, bicarbonato e glutamina.\", \"ve\": \"Aspartato, bicarbonato y glutamina.\"}, {\"l\": \"B\", \"v\": \"Glicina, ferro e succinil-CoA\", \"ve\": \"Glicina, hierro y succinil-CoA\"}, {\"l\": \"C\", \"v\": \"Metionina, colesterol e glicose\", \"ve\": \"Metionina, colesterol y glucosa\"}, {\"l\": \"D\", \"v\": \"Ribose, heme e urato\", \"ve\": \"Ribosa, hemo y urato\"}]}, {\"c\": \"Metabolismo das pirimidinas\", \"ce\": \"Metabolismo de las pirimidinas\", \"t\": \"mc\", \"q\": \"Qual enzima inicia a síntese de pirimidinas?\", \"qe\": \"¿Qué enzima inicia síntesis de pirimidinas?\", \"ex\": \"Alternativa B. CPS II. — Carbamoil-fosfato sintetase II (CPS II) usa glutamina, bicarbonato e 2 ATP para gerar carbamoil-fosfato no citosol. Em mamíferos, integra a proteína multifuncional CAD junto com aspartato transcarbamoilase e di-hidroorotase; a proximidade dos sítios catalíticos favorece a transferência de intermediários. PRPP ativa CPS II e UTP exerce retroinibição.\", \"exe\": \"Opción B. CPS II. — Carbamoil-fosfato sintetasa II (CPS II) utiliza glutamina, bicarbonato y 2 ATP para formar carbamoil-fosfato en citosol. En mamíferos integra CAD con aspartato transcarbamoilasa y dihidroorotasa; la proximidad de los sitios favorece la transferencia de intermediarios. PRPP activa CPS II y UTP ejerce retroinhibición.\", \"n\": 71, \"cr\": \"B\", \"o\": [{\"l\": \"A\", \"v\": \"CPS I\", \"ve\": \"CPS I\"}, {\"l\": \"B\", \"v\": \"CPS II.\", \"ve\": \"CPS II.\"}, {\"l\": \"C\", \"v\": \"HGPRT\", \"ve\": \"HGPRT\"}, {\"l\": \"D\", \"v\": \"APRT\", \"ve\": \"APRT\"}]}, {\"c\": \"Metabolismo das pirimidinas\", \"ce\": \"Metabolismo de las pirimidinas\", \"t\": \"mc\", \"q\": \"Qual enzima oxida di-hidroorotato?\", \"qe\": \"¿Qué enzima oxida dihidroorotato?\", \"ex\": \"Alternativa D. DHODH. — Carbamoil-fosfato + aspartato → carbamoil-aspartato pela aspartato transcarbamoilase. A di-hidroorotase promove fechamento do anel formando di-hidroorotato. A di-hidroorotato desidrogenase (DHODH), associada à membrana mitocondrial interna, oxida o intermediário a orotato. Portanto, a via não é exclusivamente citosólica.\", \"exe\": \"Opción D. DHODH. — Carbamoil-fosfato + aspartato → carbamoil-aspartato por aspartato transcarbamoilasa. La dihidroorotasa cierra el anillo formando dihidroorotato. La dihidroorotato deshidrogenasa (DHODH), asociada a membrana mitocondrial interna, lo oxida a orotato. Por tanto, la vía no es exclusivamente citosólica.\", \"n\": 72, \"cr\": \"D\", \"o\": [{\"l\": \"A\", \"v\": \"CPS II\", \"ve\": \"CPS II\"}, {\"l\": \"B\", \"v\": \"CTP sintetase\", \"ve\": \"CTP sintetasa\"}, {\"l\": \"C\", \"v\": \"UMP quinase\", \"ve\": \"UMP quinasa\"}, {\"l\": \"D\", \"v\": \"DHODH.\", \"ve\": \"DHODH.\"}]}, {\"c\": \"Metabolismo das pirimidinas\", \"ce\": \"Metabolismo de las pirimidinas\", \"t\": \"mc\", \"q\": \"Quando o PRPP entra na via pirimídica?\", \"qe\": \"¿Cuándo entra PRPP en la vía pirimidínica?\", \"ex\": \"Alternativa D. Depois da formação de orotato, para formar OMP. — Orotato + PRPP → OMP (orotidina monofosfato) + PPi pela orotato fosforribosiltransferase. OMP descarboxilase retira CO₂ e forma UMP (uridina monofosfato). As duas atividades pertencem à UMP sintase. OMP é o primeiro nucleotídeo intermediário; UMP é o primeiro nucleotídeo pirimídico canônico da via, como indicado nos slides.\", \"exe\": \"Opción D. Después de formar orotato, para formar OMP. — Orotato + PRPP → OMP (orotidina monofosfato) + PPi por orotato fosforribosiltransferasa. OMP descarboxilasa retira CO₂ y forma UMP (uridina monofosfato). Ambas actividades pertenecen a UMP sintasa. OMP es el primer nucleótido intermediario; UMP es el primer nucleótido pirimidínico canónico de la vía.\", \"n\": 73, \"cr\": \"D\", \"o\": [{\"l\": \"A\", \"v\": \"Somente após formar CTP\", \"ve\": \"Solo después de formar CTP\"}, {\"l\": \"B\", \"v\": \"Antes de formar carbamoil-fosfato\", \"ve\": \"Antes de formar carbamoil-fosfato\"}, {\"l\": \"C\", \"v\": \"Durante a síntese de ALA\", \"ve\": \"Durante la síntesis de ALA\"}, {\"l\": \"D\", \"v\": \"Depois da formação de orotato, para formar OMP.\", \"ve\": \"Después de formar orotato, para formar OMP.\"}]}, {\"c\": \"Metabolismo das pirimidinas\", \"ce\": \"Metabolismo de las pirimidinas\", \"t\": \"mc\", \"q\": \"Qual enzima forma CTP a partir de UTP?\", \"qe\": \"¿Qué enzima forma CTP a partir de UTP?\", \"ex\": \"Alternativa D. CTP sintetase. — UMP recebe fosfato por quinases e vira UDP, depois UTP. CTP sintetase usa glutamina e ATP para converter UTP em CTP. Complemento: ribonucleotídeo redutase produz desoxirribonucleotídeos; timidilato sintase converte dUMP em dTMP usando N5,N10-metileno-THF. Isso permite produzir DNA, não apenas RNA. O 5-fluorouracil interfere na timidilato sintase por seu metabólito FdUMP.\", \"exe\": \"Opción D. CTP sintetasa. — UMP recibe fosfato por cinasas y pasa a UDP, luego UTP. CTP sintetasa utiliza glutamina y ATP para convertir UTP en CTP. Complemento: ribonucleótido reductasa produce desoxirribonucleótidos; timidilato sintasa convierte dUMP en dTMP usando N5,N10-metileno-THF. Esto permite producir ADN. El 5-fluorouracilo interfiere con timidilato sintasa mediante FdUMP.\", \"n\": 74, \"cr\": \"D\", \"o\": [{\"l\": \"A\", \"v\": \"DHODH\", \"ve\": \"DHODH\"}, {\"l\": \"B\", \"v\": \"PRPP sintetase\", \"ve\": \"PRPP sintetasa\"}, {\"l\": \"C\", \"v\": \"CPS I\", \"ve\": \"CPS I\"}, {\"l\": \"D\", \"v\": \"CTP sintetase.\", \"ve\": \"CTP sintetasa.\"}]}, {\"c\": \"Metabolismo das pirimidinas\", \"ce\": \"Metabolismo de las pirimidinas\", \"t\": \"mc\", \"q\": \"Qual ativador obrigatório da CPS I?\", \"qe\": \"¿Cuál es el activador obligatorio de CPS I?\", \"ex\": \"Alternativa D. N-acetilglutamato. — CPS I: mitocondrial, ciclo da ureia, usa amônia livre, ativação obrigatória por N-acetilglutamato, predominante em hepatócitos periportais; também existe no intestino. CPS II: citosólica, síntese de pirimidinas, usa nitrogênio amídico da glutamina, ativada por PRPP, presente em muitos tecidos. Ambas consomem 2 ATP, mas possuem funções e compartimentos diferentes. A expressão «somente hepatócitos» do slide é uma simplificação.\", \"exe\": \"Opción D. N-acetilglutamato. — CPS I: mitocondrial, ciclo de urea, usa amoníaco libre, activación obligatoria por N-acetilglutamato, predomina en hepatocitos periportales y también existe en intestino. CPS II: citosólica, síntesis de pirimidinas, usa nitrógeno amídico de glutamina, activada por PRPP, presente en muchos tejidos. Ambas consumen 2 ATP pero tienen funciones y compartimentos distintos.\", \"n\": 75, \"cr\": \"D\", \"o\": [{\"l\": \"A\", \"v\": \"UTP\", \"ve\": \"UTP\"}, {\"l\": \"B\", \"v\": \"Urato\", \"ve\": \"Urato\"}, {\"l\": \"C\", \"v\": \"Bilirrubina\", \"ve\": \"Bilirrubina\"}, {\"l\": \"D\", \"v\": \"N-acetilglutamato.\", \"ve\": \"N-acetilglutamato.\"}]}, {\"c\": \"Metabolismo das pirimidinas\", \"ce\": \"Metabolismo de las pirimidinas\", \"t\": \"mc\", \"q\": \"Qual classe forma o anel antes de receber PRPP?\", \"qe\": \"¿Qué clase forma el anillo antes de recibir PRPP?\", \"ex\": \"Alternativa C. Pirimidinas. — Purinas: dois anéis; montagem sobre PRPP desde o início, glicina contribui para o esqueleto, IMP é precursor de AMP/GMP, síntese citosólica. Pirimidinas: um anel; montagem antes de PRPP, aspartato é precursor estrutural principal, UMP é precursor de outros nucleotídeos, síntese citosólica com etapa mitocondrial da DHODH. Não confunda o anel pronto com o nucleotídeo pronto.\", \"exe\": \"Opción C. Pirimidinas. — Purinas: dos anillos; montaje sobre PRPP desde el inicio, glicina contribuye al esqueleto, IMP es precursor de AMP/GMP, síntesis citosólica. Pirimidinas: un anillo; montaje antes de PRPP, aspartato es precursor estructural principal, UMP es precursor de otros nucleótidos, síntesis citosólica con etapa mitocondrial de DHODH.\", \"n\": 76, \"cr\": \"C\", \"o\": [{\"l\": \"A\", \"v\": \"Porfirinas\", \"ve\": \"Porfirinas\"}, {\"l\": \"B\", \"v\": \"Purinas\", \"ve\": \"Purinas\"}, {\"l\": \"C\", \"v\": \"Pirimidinas.\", \"ve\": \"Pirimidinas.\"}, {\"l\": \"D\", \"v\": \"Aminoácidos\", \"ve\": \"Aminoácidos\"}]}, {\"c\": \"Metabolismo das pirimidinas\", \"ce\": \"Metabolismo de las pirimidinas\", \"t\": \"mc\", \"q\": \"Qual produto característico resulta da degradação de timina?\", \"qe\": \"¿Qué producto característico resulta de degradar timina?\", \"ex\": \"Alternativa C. β-aminoisobutirato. — dTMP → timidina pela nucleotidase → timina pela timidina fosforilase. A di-hidropirimidina desidrogenase (DPD) reduz timina a di-hidrotimina; di-hidropirimidinase abre o anel formando N-carbamoil-β-aminoisobutirato (β-ureidoisobutirato); β-ureidopropionase libera β-aminoisobutirato. Sua transaminação pode formar metilmalonato semialdeído, cujo metabolismo pode gerar propionil-CoA e, por metilmalonil-CoA, succinil-CoA. A mutase atua sobre metilmalonil-CoA, não diretamente sobre o semialdeído.\", \"exe\": \"Opción C. β-aminoisobutirato. — dTMP → timidina por nucleotidasa → timina por timidina fosforilasa. DPD reduce timina a dihidrotimina; dihidropirimidinasa abre el anillo formando N-carbamoil-β-aminoisobutirato; β-ureidopropionasa libera β-aminoisobutirato. Su transaminación puede formar metilmalonato semialdehído y luego propionil-CoA, metilmalonil-CoA y succinil-CoA. La mutasa actúa sobre metilmalonil-CoA, no sobre el semialdehído.\", \"n\": 77, \"cr\": \"C\", \"o\": [{\"l\": \"A\", \"v\": \"β-alanina\", \"ve\": \"β-alanina\"}, {\"l\": \"B\", \"v\": \"Ácido úrico\", \"ve\": \"Ácido úrico\"}, {\"l\": \"C\", \"v\": \"β-aminoisobutirato.\", \"ve\": \"β-aminoisobutirato.\"}, {\"l\": \"D\", \"v\": \"Biliverdina\", \"ve\": \"Biliverdina\"}]}, {\"c\": \"Metabolismo das pirimidinas\", \"ce\": \"Metabolismo de las pirimidinas\", \"t\": \"mc\", \"q\": \"Qual produto caracteriza a degradação da uracila?\", \"qe\": \"¿Qué producto caracteriza la degradación de uracilo?\", \"ex\": \"Alternativa C. β-alanina. — CMP → citidina; em humanos, citidina desaminase converte citidina em uridina, que pode liberar uracila pela uridina fosforilase. Uracila → di-hidrouracila (DPD) → N-carbamoil-β-alanina (di-hidropirimidinase) → β-alanina + CO₂ + NH₃ (β-ureidopropionase). Correção: o esquema dos slides mostra citosina livre desaminada e «alanina»; o produto humano característico é β-alanina, diferente de α-alanina. DPD também metaboliza 5-fluorouracil, e sua deficiência pode causar toxicidade grave.\", \"exe\": \"Opción C. β-alanina. — CMP → citidina; en humanos, citidina desaminasa convierte citidina en uridina, que puede liberar uracilo por uridina fosforilasa. Uracilo → dihidrouracilo (DPD) → N-carbamoil-β-alanina (dihidropirimidinasa) → β-alanina + CO₂ + NH₃ (β-ureidopropionasa). Corrección: el esquema muestra citosina libre desaminada y «alanina»; el producto humano característico es β-alanina, distinta de α-alanina. DPD también metaboliza 5-fluorouracilo.\", \"n\": 78, \"cr\": \"C\", \"o\": [{\"l\": \"A\", \"v\": \"β-aminoisobutirato\", \"ve\": \"β-aminoisobutirato\"}, {\"l\": \"B\", \"v\": \"Bilirrubina\", \"ve\": \"Bilirrubina\"}, {\"l\": \"C\", \"v\": \"β-alanina.\", \"ve\": \"β-alanina.\"}, {\"l\": \"D\", \"v\": \"Xantina\", \"ve\": \"Xantina\"}]}, {\"c\": \"Metabolismo das pirimidinas\", \"ce\": \"Metabolismo de las pirimidinas\", \"t\": \"mc\", \"q\": \"Qual enzima está deficiente na acidúria orótica hereditária clássica?\", \"qe\": \"¿Qué enzima falta en aciduria orótica hereditaria clásica?\", \"ex\": \"Alternativa D. UMP sintase. — Deficiência autossômica recessiva da UMP sintase, que reúne orotato fosforribosiltransferase e OMP descarboxilase. O bloqueio orotato → OMP → UMP acumula ácido orótico no sangue e urina e reduz nucleotídeos necessários à síntese de DNA. Causa anemia megaloblástica, atraso de crescimento e possível leucopenia. A anemia não é causada por deficiência primária de B12 ou folato e não responde adequadamente a essas vitaminas. Uridina contorna o bloqueio pela via de salvamento.\", \"exe\": \"Opción D. UMP sintasa. — Deficiencia autosómica recesiva de UMP sintasa, que reúne orotato fosforribosiltransferasa y OMP descarboxilasa. El bloqueo orotato → OMP → UMP acumula ácido orótico en sangre y orina y reduce nucleótidos para síntesis de ADN. Causa anemia megaloblástica, retraso de crecimiento y posible leucopenia. La anemia no se debe a deficiencia primaria de B12 o folato y no responde adecuadamente a esas vitaminas. Uridina evita el bloqueo por rescate.\", \"n\": 79, \"cr\": \"D\", \"o\": [{\"l\": \"A\", \"v\": \"HGPRT\", \"ve\": \"HGPRT\"}, {\"l\": \"B\", \"v\": \"Xantina oxidase\", \"ve\": \"Xantina oxidasa\"}, {\"l\": \"C\", \"v\": \"Ferroquelatase\", \"ve\": \"Ferroquelatasa\"}, {\"l\": \"D\", \"v\": \"UMP sintase.\", \"ve\": \"UMP sintasa.\"}]}, {\"c\": \"Metabolismo das pirimidinas\", \"ce\": \"Metabolismo de las pirimidinas\", \"t\": \"mc\", \"q\": \"Qual achado favorece deficiência de OTC em vez de UMP sintase?\", \"qe\": \"¿Qué hallazgo favorece deficiencia de OTC frente a UMP sintasa?\", \"ex\": \"Alternativa D. Hiperamonemia. — Os slides listam atraso do desenvolvimento, malformações cardíacas, estrabismo bilateral, incapacidade de sentar sem ajuda e macrocristalúria com obstrução ureteral. São manifestações possíveis ou descritas, não critérios universais. Diferenciar de deficiência de ornitina transcarbamilase (OTC): nela, o carbamoil-fosfato mitocondrial em excesso alimenta a via pirimídica e aumenta orotato, com hiperamonemia; na deficiência de UMP sintase, a hiperamonemia não é característica.\", \"exe\": \"Opción D. Hiperamonemia. — Las diapositivas enumeran retraso del desarrollo, malformaciones cardíacas, estrabismo bilateral, incapacidad de sentarse sin ayuda y macrocristaluria con obstrucción ureteral. Son manifestaciones posibles o descritas, no criterios universales. Diferenciar de deficiencia de ornitina transcarbamilasa (OTC): el exceso de carbamoil-fosfato mitocondrial alimenta la vía pirimidínica y aumenta orotato con hiperamonemia; en déficit de UMP sintasa, hiperamonemia no es característica.\", \"n\": 80, \"cr\": \"D\", \"o\": [{\"l\": \"A\", \"v\": \"Cristais de xantina\", \"ve\": \"Cristales de xantina\"}, {\"l\": \"B\", \"v\": \"Urato elevado isolado\", \"ve\": \"Urato elevado aislado\"}, {\"l\": \"C\", \"v\": \"Bilirrubina direta elevada\", \"ve\": \"Bilirrubina directa elevada\"}, {\"l\": \"D\", \"v\": \"Hiperamonemia.\", \"ve\": \"Hiperamonemia.\"}]}, {\"c\": \"Metabolismo das pirimidinas\", \"ce\": \"Metabolismo de las pirimidinas\", \"t\": \"mc\", \"q\": \"Qual combinação corresponde à CPS II?\", \"qe\": \"¿Qué combinación corresponde a CPS II?\", \"o\": [{\"l\": \"A\", \"v\": \"Mitocôndria, amônia livre, ureia\", \"ve\": \"Mitocondria, amoníaco libre, urea\"}, {\"l\": \"B\", \"v\": \"Lisossomo, aspartato, purinas\", \"ve\": \"Lisosoma, aspartato, purinas\"}, {\"l\": \"C\", \"v\": \"Citosol, glutamina, síntese de pirimidinas\", \"ve\": \"Citosol, glutamina, síntesis de pirimidinas\"}, {\"l\": \"D\", \"v\": \"Núcleo, glicina, heme\", \"ve\": \"Núcleo, glicina, hemo\"}], \"cr\": \"C\", \"ex\": \"Alternativa C. CPS II usa glutamina e bicarbonato com ATP; CPS I atua no ciclo da ureia.\", \"exe\": \"Opción C. CPS II usa glutamina y bicarbonato con ATP; CPS I actúa en ciclo de urea.\", \"n\": 81}, {\"c\": \"Metabolismo das pirimidinas\", \"ce\": \"Metabolismo de las pirimidinas\", \"t\": \"mc\", \"q\": \"Qual é o primeiro nucleotídeo pirimídico canônico da síntese de novo?\", \"qe\": \"¿Cuál es el primer nucleótido pirimidínico canónico de síntesis de novo?\", \"o\": [{\"l\": \"A\", \"v\": \"UMP\", \"ve\": \"UMP\"}, {\"l\": \"B\", \"v\": \"ATP\", \"ve\": \"ATP\"}, {\"l\": \"C\", \"v\": \"IMP\", \"ve\": \"IMP\"}, {\"l\": \"D\", \"v\": \"GMP\", \"ve\": \"GMP\"}], \"cr\": \"A\", \"ex\": \"Alternativa A. OMP é intermediário que perde CO₂ para originar UMP.\", \"exe\": \"Opción A. OMP es intermediario que pierde CO₂ para originar UMP.\", \"n\": 82}, {\"c\": \"Metabolismo das pirimidinas\", \"ce\": \"Metabolismo de las pirimidinas\", \"t\": \"mc\", \"q\": \"Criança com anemia megaloblástica resistente a B12/folato, orotato urinário alto e amônia normal: qual defeito?\", \"qe\": \"Niño con anemia megaloblástica resistente a B12/folato, orotato urinario alto y amoníaco normal: ¿qué defecto?\", \"o\": [{\"l\": \"A\", \"v\": \"Ferroquelatase\", \"ve\": \"Ferroquelatasa\"}, {\"l\": \"B\", \"v\": \"Xantina oxidoredutase\", \"ve\": \"Xantina oxidorreductasa\"}, {\"l\": \"C\", \"v\": \"UMP sintase\", \"ve\": \"UMP sintasa\"}, {\"l\": \"D\", \"v\": \"HGPRT\", \"ve\": \"HGPRT\"}], \"cr\": \"C\", \"ex\": \"Alternativa C. A deficiência de UMP sintase impede converter orotato em UMP.\", \"exe\": \"Opción C. El déficit de UMP sintasa impide convertir orotato en UMP.\", \"n\": 83}, {\"c\": \"Metabolismo das pirimidinas\", \"ce\": \"Metabolismo de las pirimidinas\", \"t\": \"tf\", \"q\": \"O anel pirimídico é montado diretamente sobre PRPP.\", \"qe\": \"El anillo pirimidínico se monta directamente sobre PRPP.\", \"cr\": \"F\", \"ex\": \"Falso. O anel é formado primeiro como orotato.\", \"exe\": \"Falso. El anillo se forma primero como orotato.\", \"n\": 84}, {\"c\": \"Metabolismo das pirimidinas\", \"ce\": \"Metabolismo de las pirimidinas\", \"t\": \"tf\", \"q\": \"CPS I é ativada por N-acetilglutamato.\", \"qe\": \"CPS I es activada por N-acetilglutamato.\", \"cr\": \"V\", \"ex\": \"Verdadeiro. Esse ativador é essencial ao ciclo da ureia.\", \"exe\": \"Verdadero. Este activador es esencial para el ciclo de urea.\", \"n\": 85}, {\"c\": \"Metabolismo das pirimidinas\", \"ce\": \"Metabolismo de las pirimidinas\", \"t\": \"tf\", \"q\": \"A uracila é a pirimidina característica do DNA em lugar da timina.\", \"qe\": \"El uracilo es la pirimidina característica del ADN en lugar de la timina.\", \"cr\": \"F\", \"ex\": \"Falso. Pirimidina é um heterociclo aromático de seis membros, com quatro carbonos e dois nitrogênios nas posições 1 e 3. Citosina (C4H5N3O) integra DNA e RNA, timina (C5H6N2O2) integra DNA e uracila (C4H4N2O2) integra RNA. Timina é 5-metiluracila. A uracila e a timina pareiam com adenina; citosina pareia com guanina.\", \"exe\": \"Falso. La pirimidina es un heterociclo aromático de seis miembros, cuatro carbonos y dos nitrógenos en posiciones 1 y 3. Citosina (C4H5N3O) integra ADN y ARN, timina (C5H6N2O2) integra ADN y uracilo (C4H4N2O2) integra ARN. Timina es 5-metiluracilo. Uracilo y timina aparean con adenina; citosina con guanina.\", \"n\": 86}, {\"c\": \"Metabolismo das pirimidinas\", \"ce\": \"Metabolismo de las pirimidinas\", \"t\": \"tf\", \"q\": \"O bicarbonato participa da formação do anel pirimídico.\", \"qe\": \"El bicarbonato participa en la formación del anillo pirimidínico.\", \"cr\": \"V\", \"ex\": \"Verdadeiro. Aspartato fornece N1, C4, C5 e C6; bicarbonato fornece C2; glutamina fornece N3. ATP fornece energia. Ao contrário das purinas, o anel pirimídico é construído antes de ser ligado à ribose do PRPP. O folato não fornece diretamente átomos ao anel de UMP, embora participe da síntese de timidilato.\", \"exe\": \"Verdadero. Aspartato aporta N1, C4, C5 y C6; bicarbonato C2; glutamina N3. ATP aporta energía. A diferencia de purinas, el anillo pirimidínico se construye antes de unirse a ribosa del PRPP. El folato no aporta átomos directamente al anillo de UMP, aunque participa en síntesis de timidilato.\", \"n\": 87}, {\"c\": \"Metabolismo das pirimidinas\", \"ce\": \"Metabolismo de las pirimidinas\", \"t\": \"tf\", \"q\": \"A CPS I e a CPS II são a mesma enzima, com a mesma localização e função.\", \"qe\": \"CPS I y CPS II son la misma enzima, con idéntica localización y función.\", \"cr\": \"F\", \"ex\": \"Falso. Carbamoil-fosfato sintetase II (CPS II) usa glutamina, bicarbonato e 2 ATP para gerar carbamoil-fosfato no citosol. Em mamíferos, integra a proteína multifuncional CAD junto com aspartato transcarbamoilase e di-hidroorotase; a proximidade dos sítios catalíticos favorece a transferência de intermediários. PRPP ativa CPS II e UTP exerce retroinibição.\", \"exe\": \"Falso. Carbamoil-fosfato sintetasa II (CPS II) utiliza glutamina, bicarbonato y 2 ATP para formar carbamoil-fosfato en citosol. En mamíferos integra CAD con aspartato transcarbamoilasa y dihidroorotasa; la proximidad de los sitios favorece la transferencia de intermediarios. PRPP activa CPS II y UTP ejerce retroinhibición.\", \"n\": 88}, {\"c\": \"Metabolismo das pirimidinas\", \"ce\": \"Metabolismo de las pirimidinas\", \"t\": \"tf\", \"q\": \"A DHODH participa da conversão de di-hidroorotato em orotato.\", \"qe\": \"La DHODH participa en la conversión de dihidroorotato en orotato.\", \"cr\": \"V\", \"ex\": \"Verdadeiro. Carbamoil-fosfato + aspartato → carbamoil-aspartato pela aspartato transcarbamoilase. A di-hidroorotase promove fechamento do anel formando di-hidroorotato. A di-hidroorotato desidrogenase (DHODH), associada à membrana mitocondrial interna, oxida o intermediário a orotato. Portanto, a via não é exclusivamente citosólica.\", \"exe\": \"Verdadero. Carbamoil-fosfato + aspartato → carbamoil-aspartato por aspartato transcarbamoilasa. La dihidroorotasa cierra el anillo formando dihidroorotato. La dihidroorotato deshidrogenasa (DHODH), asociada a membrana mitocondrial interna, lo oxida a orotato. Por tanto, la vía no es exclusivamente citosólica.\", \"n\": 89}, {\"c\": \"Metabolismo das pirimidinas\", \"ce\": \"Metabolismo de las pirimidinas\", \"t\": \"tf\", \"q\": \"O PRPP é incorporado antes de o anel pirimídico ser formado.\", \"qe\": \"El PRPP se incorpora antes de formar el anillo pirimidínico.\", \"cr\": \"F\", \"ex\": \"Falso. Orotato + PRPP → OMP (orotidina monofosfato) + PPi pela orotato fosforribosiltransferase. OMP descarboxilase retira CO₂ e forma UMP (uridina monofosfato). As duas atividades pertencem à UMP sintase. OMP é o primeiro nucleotídeo intermediário; UMP é o primeiro nucleotídeo pirimídico canônico da via, como indicado nos slides.\", \"exe\": \"Falso. Orotato + PRPP → OMP (orotidina monofosfato) + PPi por orotato fosforribosiltransferasa. OMP descarboxilasa retira CO₂ y forma UMP (uridina monofosfato). Ambas actividades pertenecen a UMP sintasa. OMP es el primer nucleótido intermediario; UMP es el primer nucleótido pirimidínico canónico de la ví
