-align:center;font-size:clamp(22px,3vw,30px);font-weight:700;cursor:pointer}.controls{text-align:center}.controls button{margin:5px}.qopt{width:100%;display:block;text-align:left;margin:9px 0}.qopt.correct{background:#174b3e}.qopt.wrong{background:#592d37}.note{position:fixed;right:18px;bottom:17px;z-index:20;background:#f9dc84;color:#1b1a13;padding:12px;width:260px;border-radius:10px;box-shadow:0 10px 28px #0008}.note textarea{width:100%;min-height:120px;border:none;background:transparent;font:14px Arial;resize:vertical}.note button{color:#1a1a1a}.notes-panel{display:none;position:fixed;inset:10% 10%;z-index:22;overflow:auto;background:#141e2e;border:1px solid var(--accent);border-radius:14px;padding:20px}.cycle{position:relative;width:min(760px,100%);height:540px;margin:15px auto;background:radial-gradient(ellipse,#142b38 0%,#0d1423 70%);border:1px solid var(--border);border-radius:22px}.node{position:absolute;transform:translate(-50%,-50%);padding:10px 8px;max-width:135px;min-width:105px;border-radius:12px;color:white;background:#233d60;border:2px solid #4f9cf9;text-align:center;font-size:12px;cursor:pointer;z-index:2}.node.selected{background:#276c66;border-color:#38e8c0;box-shadow:0 0 16px #38e8c077}.arrow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.detail{border-left:4px solid var(--accent2);min-height:125px}.mini{font-size:12px;color:var(--muted)}@media(max-width:620px){.cycle{height:430px}.node{min-width:78px;max-width:97px;padding:7px 4px;font-size:10px}.notes-panel{inset:4%}.toolbar input{width:90%}}</style></head><body><header><span class="badge">RESUMOS DO ENZO · P2</span><h1 id="main-title"></h1><p class="sub" id="sub"></p><p class="mini">2026 • 4º semestre</p><div class="toolbar"><select id="lang" aria-label="Idioma" onchange="setLang(this.value)"><option value="pt">🇧🇷 Português (Brasil)</option><option value="es">🇵🇾 Español (Paraguay)</option></select><input id="search" oninput="filterSearch()" aria-label="Buscar"></div><div class="toolbar"><button onclick="doHighlight('yellow')">🟨 Grifar</button><button onclick="doHighlight('green')">🟩</button><button onclick="doHighlight('pink')">🩷</button><button onclick="clearHighlights()">⌫ Limpar grifos</button><button onclick="document.getElementById('sticky').hidden=false">🗒 Post-it</button><button onclick="showNotes()">📋 Anotações</button></div></header><nav id="tabs"></nav><main class="wrap" id="content"></main><aside class="note" id="sticky" hidden><b>🗒 Post-it</b><textarea id="noteText" placeholder="Sua anotação / Su nota"></textarea><button onclick="makeNote()">Salvar / Guardar</button><button onclick="document.getElementById('sticky').hidden=true">✕</button></aside><aside class="notes-panel" id="notes"></aside><script>
const DATA={"sections":[["lip","🫒","Lipídios","Lípidos",[["Visão geral","Panorama general","Lipídios fornecem cerca de 9 kcal/g, formam membranas e participam da sinalização hormonal. O caminho pós-refeição é: emulsificação → hidrólise → micelas → enterócitos → quilomícrons → tecidos.","Los lípidos aportan aproximadamente 9 kcal/g, forman membranas y participan en señales hormonales. Ruta posprandial: emulsificación → hidrólisis → micelas → enterocitos → quilomicrones → tejidos."],["1. Digestão no duodeno","1. Digestión en duodeno","Os sais biliares EMULSIFICAM a gordura, aumentando a superfície de contato; a lipase pancreática, com auxílio da colipase, quebra triacilgliceróis sobretudo em 2-monoacilglicerol e dois ácidos graxos. Fosfolipase A₂ e colesterol esterase atuam em outros lipídios.","Las sales biliares EMULSIONAN las grasas; la lipasa pancreática, ayudada por la colipasa, rompe triacilglicéridos principalmente en 2-monoacilglicerol y dos ácidos grasos. Fosfolipasa A₂ y colesterol esterasa actúan sobre otros lípidos."],["2. Micelas e absorção","2. Micelas y absorción","Micelas mistas carregam produtos lipídicos até a borda em escova. Os lipídios entram no enterócito; os sais biliares permanecem no lúmen e são reabsorvidos principalmente no íleo terminal (circulação entero-hepática). A absorção do colesterol envolve NPC1L1.","Las micelas mixtas acercan lípidos al borde en cepillo. Los lípidos ingresan al enterocito; las sales biliares quedan en la luz y se reabsorben sobre todo en íleon terminal (circulación enterohepática). NPC1L1 participa en la absorción del colesterol."],["3. Transporte de lipídios","3. Transporte de lípidos","No enterócito, ácidos graxos de cadeia longa são reesterificados em TAG e montados em quilomícrons contendo apoB-48; seguem pela linfa até o sangue. LPL, ativada por apoC-II, libera ácidos graxos nos capilares; remanescentes ricos em colesterol são captados pelo fígado. Ácidos graxos livres circulam associados à albumina.","En el enterocito, los ácidos grasos de cadena larga forman TAG y quilomicrones con apoB-48; pasan por linfa a sangre. La LPL, activada por apoC-II, libera ácidos grasos; los remanentes son captados por el hígado. Los ácidos grasos no esterificados viajan con albúmina."],["4. Lipólise × lipogênese","4. Lipólisis × lipogénesis","Lipólise é quebra de TAG armazenados por ATGL, HSL e MGL, favorecida pelas catecolaminas no jejum/exercício; a insulina a reduz. Lipogênese sintetiza ácidos graxos a partir de acetil-CoA: ACC gera malonil-CoA e ácido graxo sintase alonga a cadeia usando NADPH; insulina a favorece. Malonil-CoA inibe CPT-I.","La lipólisis degrada TAG almacenados mediante ATGL, HSL y MGL; catecolaminas la favorecen e insulina la inhibe. La lipogénesis forma ácidos grasos: ACC genera malonil-CoA y ácido graso sintasa alarga cadenas utilizando NADPH. Malonil-CoA inhibe CPT-I."],["5. Beta-oxidação em quatro passos","5. Beta-oxidación en cuatro pasos","1) Ativação: ácido graxo + CoA + ATP → acil-CoA + AMP + PPi (custo 2 equivalentes ATP). 2) Cadeias longas entram na matriz mitocondrial pela naveta de carnitina (CPT-I, translocase, CPT-II). Cada volta: oxidação com FAD → hidratação → oxidação com NAD⁺ → tiólise; gera FADH₂, NADH e acetil-CoA, removendo 2 carbonos.","1) Activación: ácido graso + CoA + ATP → acil-CoA + AMP + PPi (costo de 2 equivalentes de ATP). 2) Ácidos grasos largos ingresan a matriz mediante carnitina. Cada vuelta: oxidación con FAD → hidratación → oxidación con NAD⁺ → tiólisis. Forma FADH₂, NADH y acetil-CoA, acortando 2 carbonos."],["Exemplo: palmitato (C16:0)","Ejemplo: palmitato (C16:0)","7 voltas → 8 acetil-CoA + 7 NADH + 7 FADH₂. Com rendimento moderno de 2,5 ATP/NADH e 1,5 ATP/FADH₂: 80 + 17,5 + 10,5 − 2 = 106 ATP líquidos.","7 vueltas → 8 acetil-CoA + 7 NADH + 7 FADH₂. Con 2,5 ATP/NADH y 1,5 ATP/FADH₂: 80 + 17,5 + 10,5 − 2 = 106 ATP netos."]]],["aa","🧬","Metabolismo dos aminoácidos","Metabolismo de aminoácidos",[["Ideia central","Idea central","Aminoácidos não têm reserva especializada. Seu grupo amino deve ser processado com segurança; o esqueleto carbônico entra em vias energéticas, gliconeogênese ou cetogênese.","Los aminoácidos no tienen reserva especializada. El grupo amino debe procesarse de forma segura; el esqueleto carbonado va a energía, gluconeogénesis o cetogénesis."],["1. Transaminação","1. Transaminación","Aminotransferases ALT e AST transferem o grupo amino para α-cetoglutarato, formando glutamato. Requerem piridoxal-fosfato (vitamina B6). Na maioria dos casos, não liberam amônia livre nesta etapa.","ALT y AST transfieren el grupo amino al α-cetoglutarato y forman glutamato. Requieren fosfato de piridoxal (vitamina B6). Generalmente no liberan amoníaco libre aquí."],["2. Desaminação oxidativa","2. Desaminación oxidativa","No fígado, glutamato desidrogenase mitocondrial converte glutamato em α-cetoglutarato e NH₄⁺, usando NAD⁺ ou NADP⁺. O amônio é tóxico, especialmente ao SNC, e precisa ser eliminado.","En hígado, glutamato deshidrogenasa mitocondrial convierte glutamato en α-cetoglutarato y NH₄⁺ usando NAD⁺ o NADP⁺. El amonio es neurotóxico y debe eliminarse."],["3. Transporte de nitrogênio","3. Transporte de nitrógeno","Glutamina transporta nitrogênio de muitos tecidos ao fígado/rins. No músculo, a alanina transporta nitrogênio ao fígado pelo ciclo glicose-alanina. Glutaminase libera NH₄⁺ a partir de glutamina.","Glutamina transporta nitrógeno de tejidos a hígado/riñón. En músculo, alanina transporta nitrógeno al hígado por el ciclo glucosa-alanina. Glutaminasa libera NH₄⁺."],["4. Ciclo da ureia","4. Ciclo de la urea","No fígado: (mitocôndria) NH₄⁺ + HCO₃⁻ —CPS-I→ carbamoil-fosfato; este + ornitina —OTC→ citrulina. (Citosol) citrulina + aspartato —argininossuccinato sintetase→ argininossuccinato → arginina + fumarato → ureia + ornitina (arginase). CPS-I necessita N-acetilglutamato. Consome 3 ATP, equivalentes a 4 ligações de alta energia.","En hígado: (mitocondria) NH₄⁺ + HCO₃⁻ —CPS-I→ carbamoil-fosfato; con ornitina —OTC→ citrulina. (Citosol) citrulina + aspartato → argininosuccinato → arginina + fumarato → urea + ornitina. CPS-I necesita N-acetilglutamato. Consume 3 ATP equivalentes a 4 enlaces de alta energía."],["5. Destino do carbono","5. Destino del carbono","Glicogênicos produzem piruvato/intermediários do Krebs e podem gerar glicose. Cetogênicos originam acetil-CoA/acetoacetato. Leucina e lisina são exclusivamente cetogênicas; isoleucina, fenilalanina, tirosina, triptofano e treonina são mistas.","Glucogénicos generan piruvato/intermediarios del Krebs y pueden formar glucosa. Cetogénicos originan acetil-CoA/acetoacetato. Leucina y lisina son exclusivamente cetogénicos; isoleucina, fenilalanina, tirosina, triptófano y treonina son mixtos."],["Relação clínica","Relación clínica","Defeitos do ciclo da ureia causam hiperamonemia, com vômitos, alteração neurológica e encefalopatia. ALT/AST elevadas indicam lesão hepatocelular em muitos contextos, mas não medem isoladamente a função hepática.","Defectos del ciclo de urea causan hiperamonemia, vómitos y encefalopatía. ALT/AST elevadas sugieren daño hepatocelular, pero por sí solas no miden función hepática."]]],["krebs","🔄","Ciclo de Krebs","Ciclo de Krebs",[["O que entra e o que sai","Qué entra y qué sale","Na matriz mitocondrial (exceto succinato desidrogenase, na membrana interna), acetil-CoA de 2 carbonos se condensa ao oxaloacetato de 4 carbonos. Uma volta regenera oxaloacetato e produz 3 NADH, 1 FADH₂, 1 GTP e 2 CO₂.","En matriz mitocondrial (salvo succinato deshidrogenasa en membrana interna), acetil-CoA de 2 carbonos se une a oxaloacetato de 4. Cada vuelta regenera oxaloacetato y produce 3 NADH, 1 FADH₂, 1 GTP y 2 CO₂."],["Regulação","Regulación","As principais etapas regulatórias são citrato sintase, isocitrato desidrogenase e α-cetoglutarato desidrogenase. ATP e NADH elevados tendem a reduzir o fluxo; ADP e Ca²⁺ o estimulam em tecidos relevantes.","Las etapas reguladoras principales son citrato sintasa, isocitrato deshidrogenasa y α-cetoglutarato deshidrogenasa. ATP y NADH altos reducen flujo; ADP y Ca²⁺ lo aumentan en tejidos relevantes."]]],["ox","⚡","Fosforilação oxidativa","Fosforilación oxidativa",[["Conceito e localização","Concepto y localización","Na membrana mitocondrial interna, NADH e FADH₂ doam elétrons à cadeia respiratória. O fluxo de elétrons até O₂ bombeia prótons ao espaço intermembrana; o retorno de H⁺ pela ATP sintase sintetiza ATP.","En membrana mitocondrial interna, NADH y FADH₂ ceden electrones a la cadena respiratoria. El flujo hasta O₂ bombea protones al espacio intermembrana; el retorno de H⁺ por ATP sintasa produce ATP."],["Complexos e transportadores","Complejos y transportadores","Complexo I recebe NADH e bombeia 4 H⁺; complexo II (succinato desidrogenase) recebe elétrons de FADH₂, mas não bombeia H⁺. Coenzima Q leva elétrons a III (4 H⁺), citocromo c leva a IV (2 H⁺ por par de elétrons), que reduz O₂ a H₂O.","Complejo I recibe NADH y bombea 4 H⁺; complejo II recibe electrones de FADH₂ pero no bombea H⁺. Coenzima Q lleva electrones a III (4 H⁺); citocromo c a IV (2 H⁺ por par), donde O₂ se reduce a H₂O."],["Quimiosmose e ATP","Quimiosmosis y ATP","A energia da força próton-motriz atravessa o complexo V (ATP sintase). Estimativa integrada: cerca de 2,5 ATP por NADH e 1,5 por FADH₂, dependendo das condições e do transporte de metabólitos. Não se forma ATP diretamente nos complexos I–IV.","La fuerza protón-motriz impulsa el complejo V (ATP sintasa). Rendimiento aproximado: 2,5 ATP/NADH y 1,5 ATP/FADH₂, según condiciones y transporte. Los complejos I–IV no forman ATP directamente."],["Inibidores e desacopladores","Inhibidores y desacoplantes","Rotenona inibe I; antimicina A inibe III; cianeto e monóxido de carbono inibem IV; oligomicina bloqueia ATP sintase. Desacopladores dissipam gradiente de H⁺, aumentam produção de calor e reduzem síntese de ATP.","Rotenona inhibe I; antimicina A inhibe III; cianuro y monóxido de carbono inhiben IV; oligomicina bloquea ATP sintasa. Desacoplantes disipan gradiente de H⁺, aumentan calor y reducen ATP."],["Integração com o Krebs","Integración con Krebs","Cada acetil-CoA que completa o Krebs produz 3 NADH (≈7,5 ATP), 1 FADH₂ (≈1,5 ATP), 1 GTP (≈1 ATP), total aproximado de 10 ATP equivalentes por volta. O ciclo depende indiretamente de O₂ para reoxidar NADH/FADH₂.","Cada acetil-CoA en Krebs produce 3 NADH (≈7,5 ATP), 1 FADH₂ (≈1,5 ATP) y 1 GTP (≈1 ATP): total ≈10 ATP equivalentes. El ciclo depende indirectamente de O₂ para reoxidar NADH/FADH₂."]]]],"steps":[["Oxaloacetato + acetil-CoA","Oxaloacetato + acetil-CoA","Citrato","Citrato","Citrato sintase: condensação de acetil-CoA (2C) com oxaloacetato (4C); libera CoA-SH e forma citrato (6C).","Citrato sintasa: condensación de acetil-CoA (2C) con oxaloacetato (4C); libera CoA-SH y forma citrato (6C)."],["Citrato","Citrato","Isocitrato","Isocitrato","Aconitase: isomerização por desidratação e reidratação via cis-aconitato; reposiciona OH.","Aconitasa: isomerización mediante deshidratación e hidratación vía cis-aconitato; cambia posición del OH."],["Isocitrato","Isocitrato","α-Cetoglutarato","α-Cetoglutarato","Isocitrato desidrogenase: oxidação e descarboxilação; produz NADH + CO₂ (6C → 5C).","Isocitrato deshidrogenasa: oxidación y descarboxilación; produce NADH + CO₂ (6C → 5C)."],["α-Cetoglutarato","α-Cetoglutarato","Succinil-CoA","Succinil-CoA","Complexo α-cetoglutarato desidrogenase: descarboxilação oxidativa; gera NADH + CO₂ e succinil-CoA (5C → 4C).","Complejo α-cetoglutarato deshidrogenasa: descarboxilación oxidativa; forma NADH + CO₂ y succinil-CoA (5C → 4C)."],["Succinil-CoA","Succinil-CoA","Succinato","Succinato","Succinil-CoA sintetase: fosforilação em nível de substrato; forma GTP (ou ATP dependendo da isoforma) e libera CoA-SH.","Succinil-CoA sintetasa: fosforilación a nivel de sustrato; forma GTP (o ATP según isoforma) y libera CoA-SH."],["Succinato","Succinato","Fumarato","Fumarato","Succinato desidrogenase (complexo II): oxidação de succinato a fumarato, formando FADH₂ associado à enzima; elétrons seguem para ubiquinona.","Succinato deshidrogenasa (complejo II): oxida succinato a fumarato, forma FADH₂ enzimático; electrones pasan a ubiquinona."],["Fumarato","Fumarato","Malato","Malato","Fumarase: hidratação da dupla ligação do fumarato, formando L-malato.","Fumarasa: hidrata el doble enlace de fumarato y forma L-malato."],["Malato","Malato","Oxaloacetato","Oxaloacetato","Malato desidrogenase: oxida malato a oxaloacetato e produz NADH; fecha o ciclo.","Malato deshidrogenasa: oxida malato a oxaloacetato y produce NADH; cierra el ciclo."]],"questions":[["lip","Qual é a função principal dos sais biliares?","¿Cuál es la función principal de las sales biliares?",["Emulsificar gorduras","Produzir ATP","Sintetizar ureia","Hidrolisar proteínas"],["Emulsionar grasas","Producir ATP","Sintetizar urea","Hidrolizar proteínas"],0],["lip","Qual apolipoproteína estrutural dos quilomícrons?","¿Qué apolipoproteína estructural tienen los quilomicrones?",["ApoB-48","ApoB-100","ApoA-I","ApoE isoladamente"],["ApoB-48","ApoB-100","ApoA-I","Solo ApoE"],0],["lip","Qual enzima hidrolisa TAG nos capilares?","¿Qué enzima hidroliza TAG en capilares?",["Lipoproteína lipase","Amilase","Pepsina","Hexoquinase"],["Lipoproteína lipasa","Amilasa","Pepsina","Hexoquinasa"],0],["lip","Quantos ATP líquidos rende a oxidação completa do palmitato (valores modernos)?","¿Cuánto ATP neto rinde palmitato (valores modernos)?",["106","129","32","8"],["106","129","32","8"],0],["aa","Qual cofator é essencial para ALT e AST?","¿Qué cofactor necesitan ALT y AST?",["Vitamina B6 (PLP)","Vitamina B12","Biotina","FAD"],["Vitamina B6 (PLP)","Vitamina B12","Biotina","FAD"],0],["aa","Em qual órgão ocorre principalmente o ciclo da ureia?","¿Dónde ocurre principalmente el ciclo de la urea?",["Fígado","Pulmão","Coração","Baço"],["Hígado","Pulmón","Corazón","Bazo"],0],["aa","Quais aminoácidos são exclusivamente cetogênicos?","¿Qué aminoácidos son exclusivamente cetogénicos?",["Leucina e lisina","Alanina e glicina","Aspartato e asparagina","Valina e metionina"],["Leucina y lisina","Alanina y glicina","Aspartato y asparagina","Valina y metionina"],0],["aa","Qual molécula ativa obrigatoriamente a CPS-I?","¿Qué molécula activa obligatoriamente CPS-I?",["N-acetilglutamato","Glutamina","Citrato","Lactato"],["N-acetilglutamato","Glutamina","Citrato","Lactato"],0],["krebs","Qual o rendimento por volta do Krebs?","¿Cuál es el rendimiento por vuelta de Krebs?",["3 NADH, 1 FADH₂, 1 GTP, 2 CO₂","2 NADH e 4 ATP","1 NADH e 2 GTP","4 FADH₂"],["3 NADH, 1 FADH₂, 1 GTP, 2 CO₂","2 NADH y 4 ATP","1 NADH y 2 GTP","4 FADH₂"],0],["krebs","Qual enzima produz FADH₂ no Krebs?","¿Qué enzima genera FADH₂ en Krebs?",["Succinato desidrogenase","Aconitase","Fumarase","Citrato sintase"],["Succinato deshidrogenasa","Aconitasa","Fumarasa","Citrato sintasa"],0],["krebs","Qual molécula se regenera ao final do ciclo?","¿Qué molécula se regenera al terminar el ciclo?",["Oxaloacetato","Acetil-CoA","Piruvato","Lactato"],["Oxaloacetato","Acetil-CoA","Piruvato","Lactato"],0],["krebs","Qual etapa produz GTP?","¿Qué etapa genera GTP?",["Succinil-CoA → succinato","Malato → oxaloacetato","Citrato → isocitrato","Succinato → fumarato"],["Succinil-CoA → succinato","Malato → oxaloacetato","Citrato → isocitrato","Succinato → fumarato"],0],["ox","Qual complexo NÃO bombeia prótons?","¿Qué complejo NO bombea protones?",["II","I","III","IV"],["II","I","III","IV"],0],["ox","Qual o aceptor final de elétrons?","¿Cuál es el aceptor final de electrones?",["O₂","CO₂","NAD⁺","ATP"],["O₂","CO₂","NAD⁺","ATP"],0],["ox","Qual a função do complexo V?","¿Qué función tiene el complejo V?",["Sintetizar ATP com retorno de H⁺","Oxidar diretamente glicose","Gerar ureia","Transportar acetil-CoA"],["Sintetizar ATP por retorno de H⁺","Oxidar glucosa directamente","Generar urea","Transportar acetil-CoA"],0],["ox","Qual substância inibe complexo IV?","¿Qué sustancia inhibe complejo IV?",["Cianeto","Rotenona","Antimicina A","Oligomicina"],["Cianuro","Rotenona","Antimicina A","Oligomicina"],0]]};const S=DATA.sections;const ST=DATA.steps;const QQ=DATA.questions;const $=s=>document.querySelector(s);let lang=localStorage.getItem('bio2_lang')||'pt',tab='lip',fc=0,flip=false,qidx=0,score=0,answered=false,marked=null;
const T=(pt,es)=>lang==='pt'?pt:es;function tx(){return lang==='pt'?2:3}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setLang(l){lang=l;localStorage.setItem('bio2_lang',l);render();}function setTab(t){tab=t;render();scrollTo(0,0)}
function render(){document.documentElement.lang=lang==='pt'?'pt-BR':'es-PY';$('#main-title').textContent=T('Bioquímica II — P2','Bioquímica II — P2');$('#sub').textContent=T('Resumo interativo • Harper & Lehninger','Resumen interactivo • Harper y Lehninger');$('#search').placeholder=T('Buscar no resumo...','Buscar en el resumen...');$('#lang').value=lang;let nav=S.map(x=>`<button class="${tab===x[0]?'active':''}" onclick="setTab('${x[0]}')">${x[1]} ${esc(x[lang==='pt'?2:3])}</button>`).join('');nav+=`<button class="${tab==='fc'?'active':''}" onclick="setTab('fc')">🧠 Flashcards</button><button class="${tab==='quiz'?'active':''}" onclick="setTab('quiz')">📝 ${T('Questões','Preguntas')}</button>`;$('#tabs').innerHTML=nav;let sect=S.find(s=>s[0]===tab);if(sect){$('#content').innerHTML=`<h2 class="chapter">${sect[1]} ${esc(sect[lang==='pt'?2:3])}</h2><div class="cards">`+sect[4].map(a=>`<article class="card"><h3>${esc(a[lang==='pt'?0:1])}</h3><p>${esc(a[lang==='pt'?2:3])}</p></article>`).join('')+'</div>'+(tab==='krebs'?cycleMarkup():'')+`<div class="info mini">${T('Material didático: seção de lipídios baseada nos slides fornecidos e complementada por Harper/Lehninger; demais seções são sínteses originais de estudo.','Material didáctico: lípidos basados en diapositivas aportadas y complementados con Harper/Lehninger; demás secciones son síntesis originales de estudio.')}</div>`;}else if(tab==='fc'){renderFC();}else{renderQ();}filterSearch();}
function cycleMarkup(){let angles=ST.map((_,i)=>(-90+i*45)*Math.PI/180);let positions=angles.map(a=>[50+36*Math.cos(a),50+36*Math.sin(a)]);let arrows=positions.map((p,i)=>{let n=positions[(i+1)%8];let x1=p[0]+(n[0]-p[0])*.29,y1=p[1]+(n[1]-p[1])*.29,x2=p[0]+(n[0]-p[0])*.71,y2=p[1]+(n[1]-p[1])*.71;return `<line x1="${x1}%" y1="${y1}%" x2="${x2}%" y2="${y2}%" stroke="#38e8c0" stroke-width="2" marker-end="url(#a)"/>`}).join('');return `<h2 class="chapter">${T('Ciclo de Krebs — clique em cada reação','Ciclo de Krebs — seleccione cada reacción')}</h2><div class="cycle"><svg class="arrow"><defs><marker id="a" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0 L5 2.5 L0 5" fill="none" stroke="#38e8c0" stroke-width="1"/></marker></defs>${arrows}</svg><div style="position:absolute;top:47%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#f9c94f;font-size:14px">${T('Acetil-CoA entra','Entra acetil-CoA')}<br><b>3 NADH · 1 FADH₂<br>1 GTP · 2 CO₂</b></div>${positions.map((p,i)=>`<button class="node ${i===0?'selected':''}" id="node${i}" style="left:${p[0]}%;top:${p[1]}%" onclick="selectReaction(${i})">${esc(ST[i][lang==='pt'?2:3])}<br><small>${i+1}</small></button>`).join('')}</div><article class="info detail" id="reactiondetail"></article><div class="controls"><button onclick="selectReaction((window.ri+7)%8)">◀ ${T('Anterior','Anterior')}</button><button onclick="selectReaction((window.ri+1)%8)">${T('Próxima reação','Siguiente reacción')} ▶</button></div>`;}
function selectReaction(i){window.ri=i;document.querySelectorAll('.node').forEach((n,j)=>n.classList.toggle('selected',j===i));let s=ST[i];$('#reactiondetail').innerHTML=`<h3>${i+1}. ${esc(s[lang==='pt'?0:1])} → ${esc(s[lang==='pt'?2:3])}</h3><p>${esc(s[lang==='pt'?4:5])}</p>`;}
let origRender=render;render=function(){origRender();if(tab==='krebs')selectReaction(window.ri??0);};
function cards(){return S.flatMap(s=>s[4].map(x=>[x[lang==='pt'?0:1],x[lang==='pt'?2:3],s[0]]))}
function renderFC(){let C=cards();fc=(fc+C.length)%C.length;$('#content').innerHTML=`<h2 class="chapter">🧠 Flashcards — ${fc+1}/${C.length}</h2><div class="info fcbox" onclick="flip=!flip;renderFC()">${esc(C[fc][flip?1:0])}</div><div class="controls"><span class="mini">${T('Clique no cartão para virar','Pulse la tarjeta para girarla')}</span><p><button onclick="fc--;flip=false;renderFC()">◀</button><button onclick="flip=!flip;renderFC()">${T('Virar cartão','Girar tarjeta')}</button><button onclick="fc++;flip=false;renderFC()">▶</button></p></div>`}
function renderQ(){qidx=Math.max(0,Math.min(qidx,QQ.length-1));let q=QQ[qidx],i=lang==='pt'?1:2,opts=q[lang==='pt'?3:4];$('#content').innerHTML=`<h2 class="chapter">📝 ${T('Questões de múltipla escolha','Preguntas de opción múltiple')}</h2><div class="info"><p class="mini">${qidx+1}/${QQ.length} · ${T('Acertos','Aciertos')}: ${score}</p><h3>${esc(q[i])}</h3>${opts.map((op,j)=>`<button class="qopt ${answered?(j===q[5]?'correct':j===marked?'wrong':''):''}" onclick="answer(${j})">${'ABCD'[j]}. ${esc(op)}</button>`).join('')}<p>${answered?T('Resposta correta: ','Respuesta correcta: ')+esc(opts[q[5]]):''}</p><button onclick="nextQ()">${T('Próxima questão','Siguiente pregunta')} →</button><button onclick="qidx=0;score=0;answered=false;renderQ()">${T('Reiniciar','Reiniciar')}</button></div>`}
function answer(i){if(answered)return;answered=true;marked=i;if(i===QQ[qidx][5])score++;renderQ()};function nextQ(){qidx=(qidx+1)%QQ.length;answered=false;renderQ()}
function filterSearch(){let v=$('#search').value.trim().toLocaleLowerCase();document.querySelectorAll('#content .card').forEach(x=>x.style.display=x.textContent.toLocaleLowerCase().includes(v)?'':'none')}
function makeNote(){let id='n'+Date.now();let n={id,tab,pt:$('#noteText').value,created:new Date().toLocaleString()};if(!n.pt.trim())return;let list=JSON.parse(localStorage.getItem('bio2_notes')||'[]');list.push(n);localStorage.setItem('bio2_notes',JSON.stringify(list));$('#noteText').value='';$('#sticky').hidden=true;showNotes()}
function showNotes(){let list=JSON.parse(localStorage.getItem('bio2_notes')||'[]');$('#notes').style.display='block';$('#notes').innerHTML=`<button onclick="$('#notes').style.display='none'">✕</button><h2>${T('Minhas anotações','Mis notas')}</h2>`+list.map(n=>`<article class="info"><small>${esc(n.created)} · ${esc(n.tab)}</small><p>${esc(n.pt)}</p><button onclick="removeNote('${n.id}')">${T('Excluir','Eliminar')}</button></article>`).join('')}
function removeNote(id){let a=JSON.parse(localStorage.getItem('bio2_notes')||'[]').filter(x=>x.id!==id);localStorage.setItem('bio2_notes',JSON.stringify(a));showNotes()}
function doHighlight(color){let sel=window.getSelection();if(!sel||sel.isCollapsed)return;let range=sel.getRangeAt(0);if(!$('#content').contains(range.commonAncestorContainer))return;let span=document.createElement('mark');span.className='mark-'+color;try{range.surroundContents(span);let saved=JSON.parse(localStorage.getItem('bio2_marks')||'{}');(saved[tab]??=[]).push({text:span.textContent,color});localStorage.setItem('bio2_marks',JSON.stringify(saved));sel.removeAllRanges()}catch(e){alert(T('Selecione um trecho dentro de um único parágrafo.','Seleccione texto dentro de un solo párrafo.'))}}
function clearHighlights(){document.querySelectorAll('#content mark').forEach(el=>el.replaceWith(...el.childNodes));let marks=JSON.parse(localStorage.getItem('bio2_marks')||'{}');delete marks[tab];localStorage.setItem('bio2_marks',JSON.stringify(marks))}
function restoreHighlights(){let saved=JSON.parse(localStorage.getItem('bio2_marks')||'{}')[tab]||[];for(let item of saved){let nodes=document.querySelectorAll('#content .card p');for(let el of nodes){if(el.querySelector('mark'))continue;let t=el.textContent,k=t.indexOf(item.text);if(k<0||!item.text)continue;let r=document.createRange();let node=el.firstChild;if(!node||node.nodeType!==3)continue;r.setStart(node,k);r.setEnd(node,k+item.text.length);let mark=document.createElement('mark');mark.className='mark-'+item.color;try{r.surroundContents(mark)}catch(e){}break}}}
window.addEventListener('beforeunload',()=>{});let renderWithoutMarks=render;render=function(){renderWithoutMarks();restoreHighlights()};render();
</script></body></html>
