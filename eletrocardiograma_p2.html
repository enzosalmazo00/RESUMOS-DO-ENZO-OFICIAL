<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Eletrocardiograma P2 • Resumos do Enzo</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a0d14;color:#e5edf7;font:500 15px system-ui,-apple-system,Arial,sans-serif}
main{padding:30px;max-width:490px;text-align:center}
h1{font-size:23px;margin:12px 0}p{line-height:1.6;color:#9aa9bb}
.spin{margin:0 auto;width:42px;height:42px;border:3px solid rgba(100,210,240,.18);border-top-color:#38bdf8;border-radius:50%;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
a{color:#67e8f9}
#detail{font-size:13px}
</style>
<script>window.PAGE_KEY="eletrocardiograma_p2";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-guard.js"></script>
</head>
<body>
<main role="status" aria-live="polite">
<div class="spin" id="spin"></div>
<h1>🫀 Eletrocardiograma — P2</h1>
<p id="status">Validando sua compra e carregando o conteúdo protegido…</p>
<p id="detail">Acesso exclusivo para alunos autorizados.</p>
</main>
<script>
(function(){
"use strict";
var started=false;
var minExpectedLength=3500000; // Verifica arquivo completo, incluindo revisões didáticas
var statusEl=document.getElementById("status");
var detail=document.getElementById("detail");
var spinner=document.getElementById("spin");
function error(message){
 spinner.style.display="none";
 statusEl.textContent=message;
 detail.innerHTML='Se sua compra já foi aprovada, tente recarregar a página ou <a href="dashboard.html">voltar ao painel</a>.';
}
async function loadPremium(){
 if(started)return;
 started=true;
 try{
   var client=window.authClient;
   var session=window.authSession;
   if(!client||!session||!session.user)throw new Error("Sessão não confirmada");
   statusEl.textContent="Buscando as aulas e atividades da P2…";
   var result=await client.from("premium_content_chunks")
     .select("part,content")
     .eq("slug","eletrocardiograma_p2")
     .order("part",{ascending:true});
   if(result.error)throw result.error;
   var chunks=result.data||[];
   if(chunks.length!==12 || chunks.some(function(p,i){return p.part!==i || typeof p.content!=="string"}))
      throw new Error("Conteúdo indisponível ou acesso ainda não liberado");
   var page=chunks.map(function(p){return p.content}).join("");
   if(page.length<minExpectedLength || !page.startsWith("<!DOCTYPE html>") || !page.trimEnd().endsWith("</html>"))
      throw new Error("Material incompleto");
   statusEl.textContent="Conteúdo autorizado. Abrindo resumo…";
   document.open();
   document.write(page);
   document.close();
 }catch(err){
   console.error("[ECG P2] Erro ao carregar material protegido:",err);
   error("Não foi possível abrir o ECG P2 com seu acesso atual.");
 }
}
document.addEventListener("authReady",loadPremium,{once:true});
if(window.authSession&&window.authClient)loadPremium();
})();
</script>
</body>
</html>
