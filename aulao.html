<style>
:root{--cyan:#22d3ee;--violet:#a855f7;--bg:#020810}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 10%,rgba(168,85,247,.10),transparent 35%),linear-gradient(160deg,#020d1a,#010812);color:#fff;font-family:Poppins,sans-serif}
.wrap{max-width:1100px;margin:auto;padding:26px 18px 60px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:24px}.brand{font-weight:800}.brand span{color:#22d3ee}.back{color:#c4b5fd;text-decoration:none;border:1px solid rgba(168,85,247,.2);padding:9px 12px;border-radius:10px;font-size:11px}
.hero{padding:25px;border:1px solid rgba(168,85,247,.2);border-radius:20px;background:linear-gradient(135deg,rgba(168,85,247,.11),rgba(34,211,238,.03));margin-bottom:18px;overflow:hidden;position:relative}.hero-cover{display:block;width:100%;height:auto;object-fit:contain;object-position:center;border-radius:15px;margin-bottom:17px;background:#020810;border:1px solid rgba(255,255,255,.06)}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:#c4b5fd;font-weight:700}h1{font-size:clamp(24px,5vw,38px);margin:6px 0 8px}.desc{font-size:12px;line-height:1.7;color:rgba(221,214,254,.62)}.access{display:inline-flex;margin-top:12px;font-size:10px;color:#86efac;border:1px solid rgba(74,222,128,.22);background:rgba(74,222,128,.06);padding:5px 10px;border-radius:999px}
.selector{padding:16px;border:1px solid rgba(168,85,247,.16);border-radius:15px;margin-bottom:18px;background:rgba(168,85,247,.03)}.selector label{display:block;font-size:10px;color:#c4b5fd;font-weight:700;margin-bottom:7px;text-transform:uppercase;letter-spacing:.08em}.selector select{width:100%;padding:11px;border-radius:10px;border:1px solid rgba(168,85,247,.22);background:#07101d;color:#fff;font-family:Poppins}
.lessons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.lesson{padding:17px;border:1px solid rgba(168,85,247,.14);border-radius:16px;background:rgba(255,255,255,.022)}.lnum{font-size:9px;color:rgba(196,181,253,.5);text-transform:uppercase;letter-spacing:.1em}.ltitle{font-size:14px;font-weight:700;margin:4px 0 10px}
.secure-video-shell{position:relative;aspect-ratio:16/9;border-radius:13px;overflow:hidden;background:#000;isolation:isolate;user-select:none;-webkit-user-select:none}.yt-stage{position:absolute;inset:0 0 48px 0;background:#000;overflow:hidden}.secure-video-shell iframe{position:absolute!important;inset:0 0 48px 0!important;width:100%!important;height:calc(100% - 48px)!important;border:0!important;pointer-events:none!important;background:#000}.video-shield{position:absolute;inset:0 0 48px 0;z-index:5;cursor:pointer;background:transparent}.video-shield:focus-visible{outline:2px solid #22d3ee;outline-offset:-3px}.video-watermark{position:absolute;z-index:6;top:10px;right:10px;max-width:72%;padding:5px 8px;border-radius:999px;background:rgba(2,8,16,.56);border:1px solid rgba(255,255,255,.10);backdrop-filter:blur(5px);font-size:8px;color:rgba(255,255,255,.72);pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.video-center-icon{position:absolute;z-index:6;left:50%;top:calc(50% - 24px);transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(2,8,16,.70);border:1px solid rgba(255,255,255,.15);font-size:23px;pointer-events:none;transition:.18s opacity,.18s transform}.video-center-icon.playing{opacity:0;transform:translate(-50%,-50%) scale(.82)}
.custom-controls{position:absolute;z-index:8;left:0;right:0;bottom:0;height:48px;display:flex;align-items:center;gap:8px;padding:0 10px;background:linear-gradient(180deg,rgba(4,10,18,.94),#020810);border-top:1px solid rgba(255,255,255,.07)}.ctrl-btn{width:32px;height:32px;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:#fff;cursor:pointer;font-size:15px}.ctrl-btn:hover{background:rgba(255,255,255,.08)}.ctrl-btn:focus-visible{outline:2px solid #22d3ee}.video-progress{flex:1;min-width:50px;accent-color:#a855f7;cursor:pointer}.video-time{font-size:9px;color:rgba(255,255,255,.68);white-space:nowrap;font-variant-numeric:tabular-nums}.video-lock{font-size:8px;color:rgba(134,239,172,.72);white-space:nowrap}.volume-slider{width:76px;accent-color:#22d3ee;cursor:pointer}.cc-btn.active{background:rgba(34,211,238,.16);color:#67e8f9}.video-settings{position:relative}.settings-menu{display:none;position:absolute;right:0;bottom:40px;width:215px;padding:9px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(2,8,16,.97);box-shadow:0 12px 30px rgba(0,0,0,.45);backdrop-filter:blur(12px)}.settings-menu.open{display:block}.settings-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 7px;font-size:9px;color:rgba(255,255,255,.80)}.settings-row select{max-width:120px;background:#07101d;color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:7px;padding:5px;font:inherit}.quality-note{font-size:8px;line-height:1.4;color:rgba(255,255,255,.44);padding:4px 7px 6px}.screen-record-watermark{position:absolute;z-index:7;left:12px;top:12px;max-width:76%;padding:4px 7px;border-radius:7px;background:rgba(0,0,0,.24);font-size:7px;letter-spacing:.03em;color:rgba(255,255,255,.32);pointer-events:none;white-space:nowrap;transition:all .8s ease;text-shadow:0 1px 2px #000}.capture-warning{position:fixed;z-index:10000;left:50%;bottom:20px;transform:translateX(-50%);padding:10px 14px;border-radius:10px;background:rgba(2,8,16,.94);border:1px solid rgba(168,85,247,.25);font-size:10px;color:#ddd;display:none}.secure-video-shell:fullscreen,.secure-video-shell:-webkit-full-screen{width:100vw!important;height:100vh!important;aspect-ratio:auto!important;border-radius:0!important}.secure-video-shell:fullscreen .yt-stage,.secure-video-shell:-webkit-full-screen .yt-stage{inset:0 0 54px 0}.secure-video-shell:fullscreen iframe,.secure-video-shell:-webkit-full-screen iframe{inset:0 0 54px 0!important;height:calc(100% - 54px)!important}.secure-video-shell:fullscreen .video-shield,.secure-video-shell:-webkit-full-screen .video-shield{inset:0 0 54px 0}.secure-video-shell:fullscreen .custom-controls,.secure-video-shell:-webkit-full-screen .custom-controls{height:54px}.empty{padding:30px;text-align:center;border:1px dashed rgba(168,85,247,.2);border-radius:15px;color:rgba(196,181,253,.5)}
@media(max-width:620px){.volume-slider{width:48px}.video-time{font-size:8px}.custom-controls{gap:4px;padding:0 6px}.ctrl-btn{width:29px;height:29px}.video-lock{display:none}}
@media print{body>*{display:none!important}body:after{content:"Conteúdo protegido — impressão indisponível";display:block!important;color:#000;background:#fff;padding:40px;font-family:Poppins,sans-serif}}
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(2,8,16,.97);padding:20px}.gatebox{max-width:430px;padding:27px;border-radius:19px;border:1px solid rgba(168,85,247,.25);background:#020d1a;text-align:center}.gatebox h2{margin:8px 0}.gatebox p{font-size:11px;line-height:1.6;color:rgba(221,214,254,.55)}.gatebtn{display:inline-block;margin-top:15px;padding:10px 16px;background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff;text-decoration:none;border-radius:10px;font-size:11px;font-weight:700}
@media(max-width:1180px){.lessons{grid-template-columns:1fr}}
@media(max-width:720px){.hero{padding:14px}.hero-cover{border-radius:12px}}
</style>
</head>
<body>
<div class="gate" id="gate"><div class="gatebox"><div style="font-size:34px">🔐</div><h2>Validando acesso…</h2><p>Aguarde enquanto confirmamos sua conta e o aulão.</p></div></div>
<main class="wrap" id="content" style="display:none">
  <div class="top"><div class="brand">RESUMOS DO <span>ENZO</span></div><a class="back" href="dashboard.html">← Voltar à página inicial</a></div>
  <section class="hero" id="hero"></section>
  <div class="selector" id="turmaSelector" style="display:none"><label>Escolha sua turma / professor</label><select id="turmaSelect"></select></div>
  <section class="lessons" id="lessons"></section>
</main>
<script>
function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function deny(msg){var g=document.getElementById("gate");g.innerHTML='<div class="gatebox"><div style="font-size:34px">🔒</div><h2>Acesso não liberado</h2><p>'+esc(msg)+'</p><a class="gatebtn" href="dashboard.html">Voltar à página inicial</a></div>';document.documentElement.style.visibility="visible"}

var securePlayers={}, securePlayerQueue=[], ytApiReady=!!(window.YT&&window.YT.Player), ytApiLoading=false;
var secureTimers={}, watermarkTimers={};
function fmtTime(sec){sec=Math.max(0,Math.floor(Number(sec)||0));var h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return (h?h+":"+String(m).padStart(2,"0")+":":m+":")+String(s).padStart(2,"0")}
function safePlayerKey(v,i){return String(v.id||("video_"+i)).replace(/[^a-zA-Z0-9_-]/g,"_")}
function ensureYouTubeApi(){
  if(ytApiReady){flushSecurePlayerQueue();return}
  if(ytApiLoading)return;
  ytApiLoading=true;
  var tag=document.createElement("script");tag.src="https://www.youtube.com/iframe_api";tag.async=true;document.head.appendChild(tag);
}
window.onYouTubeIframeAPIReady=function(){ytApiReady=true;flushSecurePlayerQueue()};
function flushSecurePlayerQueue(){var q=securePlayerQueue.splice(0);q.forEach(initSecurePlayer)}
function pauseOtherPlayers(activeKey){Object.keys(securePlayers).forEach(function(k){if(k!==activeKey){try{var p=securePlayers[k];if(p&&p.getPlayerState&&p.getPlayerState()===YT.PlayerState.PLAYING)p.pauseVideo()}catch(_){}}})}
function setPlayVisual(shell,playing){
  var btn=shell.querySelector("[data-action=play]"),center=shell.querySelector(".video-center-icon");
  if(btn){btn.textContent=playing?"❚❚":"▶";btn.setAttribute("aria-label",playing?"Pausar":"Reproduzir")}
  if(center){center.textContent=playing?"❚❚":"▶";center.classList.toggle("playing",playing)}
}
function isFullscreenFor(shell){return document.fullscreenElement===shell||document.webkitFullscreenElement===shell||document.msFullscreenElement===shell}
function updateFullscreenVisual(shell){var b=shell.querySelector('[data-action=fullscreen]');if(!b)return;var on=isFullscreenFor(shell);b.textContent=on?'⛶̸':'⛶';b.setAttribute('aria-label',on?'Sair da tela cheia':'Tela cheia');b.title=on?'Sair da tela cheia':'Tela cheia'}
function toggleVideoFullscreen(shell){
  if(isFullscreenFor(shell)){
    var exit=document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen;
    if(exit){try{var r=exit.call(document);if(r&&r.catch)r.catch(function(){})}catch(_){}}
  }else{
    var fn=shell.requestFullscreen||shell.webkitRequestFullscreen||shell.msRequestFullscreen;
    if(fn){try{var r2=fn.call(shell);if(r2&&r2.catch)r2.catch(function(){})}catch(_){}}
  }
}
['fullscreenchange','webkitfullscreenchange','MSFullscreenChange'].forEach(function(evt){document.addEventListener(evt,function(){document.querySelectorAll('.secure-video-shell').forEach(updateFullscreenVisual)})});
function moveWatermark(shell,userLabel){
  var wm=shell.querySelector('.screen-record-watermark');if(!wm)return;
  var places=[['12px','12px','auto','auto'],['12px','auto','auto','12px'],['auto','12px','60px','auto'],['auto','auto','60px','12px'],['38%','auto','auto','38%']];
  var p=places[Math.floor(Math.random()*places.length)];wm.style.top=p[0];wm.style.right=p[1];wm.style.bottom=p[2];wm.style.left=p[3];
  var d=new Date();wm.textContent='USO INDIVIDUAL • '+userLabel+' • '+d.toLocaleString('pt-BR');
}
function initWatermark(shell,key,userLabel){moveWatermark(shell,userLabel);clearInterval(watermarkTimers[key]);watermarkTimers[key]=setInterval(function(){moveWatermark(shell,userLabel)},9000)}
function showCaptureWarning(){var el=document.getElementById('captureWarning');if(!el){el=document.createElement('div');el.id='captureWarning';el.className='capture-warning';el.textContent='Conteúdo protegido. O acesso é individual e identificado.';document.body.appendChild(el)}el.style.display='block';clearTimeout(showCaptureWarning.t);showCaptureWarning.t=setTimeout(function(){el.style.display='none'},2200)}
function initSecurePlayer(cfg){
  var shell=document.getElementById(cfg.shellId),stage=document.getElementById(cfg.stageId);if(!shell||!stage||securePlayers[cfg.key])return;
  var player=new YT.Player(cfg.stageId,{host:"https://www.youtube-nocookie.com",videoId:cfg.videoId,width:"100%",height:"100%",playerVars:{controls:0,rel:0,modestbranding:1,disablekb:1,fs:0,iv_load_policy:3,playsinline:1,enablejsapi:1,origin:location.origin,cc_load_policy:0,cc_lang_pref:'pt'},events:{
    onReady:function(){
      securePlayers[cfg.key]=player;initWatermark(shell,cfg.key,cfg.userLabel||'Acesso individual');
      var play=shell.querySelector("[data-action=play]"),shield=shell.querySelector(".video-shield"),seek=shell.querySelector(".video-progress"),mute=shell.querySelector("[data-action=mute]"),vol=shell.querySelector('.volume-slider'),full=shell.querySelector("[data-action=fullscreen]"),cc=shell.querySelector('[data-action=captions]'),settings=shell.querySelector('[data-action=settings]'),menu=shell.querySelector('.settings-menu'),ccSize=shell.querySelector('.cc-size');
      function toggle(){try{var st=player.getPlayerState();if(st===YT.PlayerState.PLAYING)player.pauseVideo();else player.playVideo()}catch(_){}}
      if(play)play.addEventListener("click",toggle);if(shield){shield.addEventListener("click",toggle);shield.addEventListener("dblclick",function(){toggleVideoFullscreen(shell)})}
      if(seek){seek.addEventListener("input",function(){var d=player.getDuration()||0;var t=d*(Number(seek.value)||0)/100;var lab=shell.querySelector(".video-time");if(lab)lab.textContent=fmtTime(t)+" / "+fmtTime(d)});seek.addEventListener("change",function(){var d=player.getDuration()||0;player.seekTo(d*(Number(seek.value)||0)/100,true)})}
      if(vol){try{vol.value=player.getVolume()}catch(_){vol.value=100}vol.addEventListener('input',function(){var n=Math.max(0,Math.min(100,Number(vol.value)||0));try{player.setVolume(n);if(n===0)player.mute();else player.unMute();if(mute){mute.textContent=n===0?'🔇':(n<50?'🔉':'🔊')}}catch(_){}})}
      if(mute)mute.addEventListener("click",function(){try{if(player.isMuted()||player.getVolume()===0){player.unMute();var restore=Number(vol&&vol.dataset.last)||70;player.setVolume(restore);if(vol)vol.value=restore;mute.textContent=restore<50?'🔉':'🔊';mute.setAttribute("aria-label","Silenciar")}else{if(vol){vol.dataset.last=String(player.getVolume()||70);vol.value=0}player.mute();mute.textContent="🔇";mute.setAttribute("aria-label","Ativar som")}}catch(_){}});
      if(full)full.addEventListener("click",function(){toggleVideoFullscreen(shell)});updateFullscreenVisual(shell);
      if(settings)settings.addEventListener('click',function(ev){ev.stopPropagation();if(menu)menu.classList.toggle('open')});
      if(menu)menu.addEventListener('click',function(ev){ev.stopPropagation()});
      document.addEventListener('click',function(){if(menu)menu.classList.remove('open')});
      if(cc){cc.addEventListener('click',function(){var active=cc.classList.toggle('active');cc.textContent=active?'CC✓':'CC';cc.setAttribute('aria-pressed',active?'true':'false');try{if(active){player.setOption('captions','track',{languageCode:'pt'});player.setOption('captions','reload',true)}else{player.setOption('captions','track',{})}}catch(_){}})}
      if(ccSize)ccSize.addEventListener('change',function(){try{player.setOption('captions','fontSize',Number(ccSize.value)||0)}catch(_){}});
      clearInterval(secureTimers[cfg.key]);secureTimers[cfg.key]=setInterval(function(){try{var d=player.getDuration()||0,t=player.getCurrentTime()||0,bar=shell.querySelector(".video-progress"),lab=shell.querySelector(".video-time");if(bar&&document.activeElement!==bar)bar.value=d?(t/d*100):0;if(lab)lab.textContent=fmtTime(t)+" / "+fmtTime(d)}catch(_){}},700);
    },
    onStateChange:function(ev){var playing=ev.data===YT.PlayerState.PLAYING;setPlayVisual(shell,playing);if(playing)pauseOtherPlayers(cfg.key)},
    onApiChange:function(){try{var opts=player.getOptions('captions')||[];var cc=shell.querySelector('[data-action=captions]');if(cc)cc.style.display=opts.length?'grid':'none'}catch(_){}}
  }});
}
function securePlayerMarkup(v,i,userLabel){
  var key=safePlayerKey(v,i),shellId="secure_"+key,stageId="yt_"+key;
  securePlayerQueue.push({key:key,shellId:shellId,stageId:stageId,videoId:String(v.youtube_id||""),userLabel:userLabel});
  return '<div class="secure-video-shell" id="'+shellId+'" data-player="'+key+'">'+
    '<div class="yt-stage" id="'+stageId+'"></div>'+
    '<button class="video-shield" type="button" aria-label="Reproduzir ou pausar o vídeo"></button>'+
    '<div class="video-watermark">🔒 '+esc(userLabel)+'</div>'+
    '<div class="screen-record-watermark">USO INDIVIDUAL • '+esc(userLabel)+'</div>'+
    '<div class="video-center-icon">▶</div>'+
    '<div class="custom-controls">'+
      '<button class="ctrl-btn" type="button" data-action="play" aria-label="Reproduzir">▶</button>'+
      '<input class="video-progress" type="range" min="0" max="100" step="0.1" value="0" aria-label="Progresso do vídeo">'+
      '<span class="video-time">0:00 / 0:00</span>'+
      '<button class="ctrl-btn" type="button" data-action="mute" aria-label="Silenciar">🔊</button>'+
      '<input class="volume-slider" type="range" min="0" max="100" step="1" value="100" aria-label="Volume">'+
      '<button class="ctrl-btn cc-btn" type="button" data-action="captions" aria-label="Legendas" aria-pressed="false">CC</button>'+
      '<div class="video-settings"><button class="ctrl-btn" type="button" data-action="settings" aria-label="Configurações">⚙</button>'+
        '<div class="settings-menu">'+
          '<div class="settings-row"><span>Legenda</span><select class="cc-size" aria-label="Tamanho da legenda"><option value="-1">Pequena</option><option value="0" selected>Normal</option><option value="1">Grande</option><option value="2">Muito grande</option></select></div>'+
          '<div class="settings-row"><span>Qualidade</span><select disabled aria-label="Qualidade"><option>Automática (YouTube)</option></select></div>'+
          '<div class="quality-note">O YouTube escolhe automaticamente a resolução no player incorporado.</div>'+
        '</div></div>'+
      '<button class="ctrl-btn" type="button" data-action="fullscreen" aria-label="Tela cheia">⛶</button>'+
    '</div></div>';
}
document.addEventListener("contextmenu",function(ev){if(ev.target&&ev.target.closest&&ev.target.closest(".secure-video-shell")){ev.preventDefault();ev.stopPropagation()}},true);
document.addEventListener("dragstart",function(ev){if(ev.target&&ev.target.closest&&ev.target.closest(".secure-video-shell"))ev.preventDefault()},true);
document.addEventListener('keydown',function(ev){
  var k=String(ev.key||'').toLowerCase();
  if(k==='printscreen'){showCaptureWarning();document.querySelectorAll('.secure-video-shell').forEach(function(s){s.style.filter='blur(18px)';setTimeout(function(){s.style.filter=''},900)})}
  if((ev.ctrlKey||ev.metaKey)&&['s','u','p'].includes(k)){ev.preventDefault();showCaptureWarning()}
  if(k==='f12'){ev.preventDefault();showCaptureWarning()}
},true);
document.addEventListener("authReady",async function(e){
  var key=new URLSearchParams(location.search).get("key");
  if(!key){deny("Aulão não informado.");return}
  var client=window.authClient, session=e.detail.session;
  try{
    var ar=await client.from("auloes").select("*").eq("chave",key).single();
    if(ar.error||!ar.data){deny("Este aulão não existe ou não está disponível.");return}
    var a=ar.data;
    var pr=await client.from("profiles").select("is_admin").eq("id",session.user.id).single();
    var admin=!!(pr.data&&pr.data.is_admin), ok=admin;
    if(!ok){
      var ac=await client.from("acessos").select("expira_em").eq("user_id",session.user.id).eq("resumo",key);
      ok=!!(ac.data&&ac.data.some(function(x){return !x.expira_em||new Date(x.expira_em)>new Date()}));
    }
    if(!ok){deny("Este aulão é vendido separadamente. Adquira o acesso pela loja.");return}

    document.title=a.nome+" — Resumos do Enzo";
    document.getElementById("hero").innerHTML=
      (a.capa_url?'<img class="hero-cover" src="'+esc(a.capa_url)+'" alt="">':'')+
      '<div class="eyebrow">'+a.semestre+'º semestre'+(a.avaliacao?' · '+esc(a.avaliacao):'')+'</div>'+
      '<h1>🎥 '+esc(a.nome)+'</h1><div class="desc">'+esc(a.descricao||"Aulão gravado")+'</div>'+
      '<div class="access">● Acesso autorizado</div>';

    var turmas=[];
    if(a.usar_turmas){
      var tr=await client.from("aulao_turmas").select("*").eq("aulao_id",a.id).eq("ativo",true).order("ordem");
      turmas=tr.data||[];
      var box=document.getElementById("turmaSelector"),sel=document.getElementById("turmaSelect");
      box.style.display="block";
      sel.innerHTML='<option value="">Selecione sua turma / professor</option>'+turmas.map(function(t){return '<option value="'+t.id+'">'+esc(t.turma)+' — '+esc(t.professor)+'</option>'}).join("");
      sel.addEventListener("change",function(){loadVideos(sel.value)});
    }

    async function loadVideos(turmaId){
      var q=client.from("aulao_videos").select("*").eq("aulao_id",a.id).eq("publicado",true).order("ordem");
      if(a.usar_turmas){
        if(!turmaId){document.getElementById("lessons").innerHTML='<div class="empty" style="grid-column:1/-1">Escolha sua turma/professor para ver os vídeos.</div>';return}
        q=q.eq("aulao_turma_id",turmaId);
      }else{
        q=q.is("aulao_turma_id",null);
      }
      var vr=await q;
      var vids=vr.data||[], c=document.getElementById("lessons");
      if(!vids.length){c.innerHTML='<div class="empty" style="grid-column:1/-1">Nenhum vídeo publicado para esta opção ainda.</div>';return}
      securePlayerQueue.length=0;
      var userLabel=(session.user&&session.user.email)?session.user.email:"Acesso individual";
      c.innerHTML=vids.map(function(v,i){return '<article class="lesson"><div class="lnum">Parte '+String(v.ordem||i+1).padStart(2,"0")+'</div><div class="ltitle">'+esc(v.titulo)+'</div>'+securePlayerMarkup(v,i,userLabel)+'</article>'}).join("");
      ensureYouTubeApi();if(ytApiReady)flushSecurePlayerQueue();
    }
    if(!a.usar_turmas)await loadVideos(null);else document.getElementById("lessons").innerHTML='<div class="empty" style="grid-column:1/-1">Escolha sua turma/professor acima.</div>';

    document.getElementById("gate").style.display="none";document.getElementById("content").style.display="block";document.documentElement.style.visibility="visible";
  }catch(err){console.error(err);deny("Erro ao validar o aulão. Recarregue a página.")}
});
</script>
</body></html>
